<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Générer les icônes PWA</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 32px; max-width: 720px; margin: 0 auto; background: #FDF9F2; color: #2A1F15; }
  h1 { font-family: Georgia, serif; font-size: 28px; }
  button { background: #1B3A2F; color: #FAF7F0; border: none; padding: 14px 24px; border-radius: 999px; font-size: 15px; cursor: pointer; margin: 8px 8px 8px 0; }
  button:hover { background: #122720; }
  img { display: block; margin: 16px 0; border: 1px solid #EADCC8; border-radius: 12px; }
  .info { background: #FFF; border-left: 3px solid #B08D57; padding: 16px; margin: 20px 0; font-family: Georgia, serif; font-style: italic; line-height: 1.6; }
</style>
</head>
<body>
<h1>🎨 Générer les icônes PWA</h1>
<div class="info">
  Clique sur les boutons pour télécharger les 2 icônes PNG.<br>
  Puis place-les à la <strong>racine de ton dépôt GitHub</strong>, à côté de <code>manifest.json</code>.<br>
  Une fois fait, tu pourras supprimer ce fichier.
</div>

<img id="preview192" width="192" height="192" alt="icône 192">
<img id="preview512" width="512" height="512" alt="icône 512">

<button onclick="download(192)">⬇ Télécharger icon-192.png</button>
<button onclick="download(512)">⬇ Télécharger icon-512.png</button>

<script>
  function genererIcone(taille){
    return new Promise(function(resolve){
      const c = document.createElement('canvas');
      c.width = taille;
      c.height = taille;
      const ctx = c.getContext('2d');
      const s = taille / 512;

      // Fond dégradé vert forêt
      const grad = ctx.createLinearGradient(0, 0, taille, taille);
      grad.addColorStop(0, '#1B3A2F');
      grad.addColorStop(1, '#122720');
      ctx.fillStyle = grad;

      // Coins arrondis
      const r = 112 * s;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(taille - r, 0);
      ctx.quadraticCurveTo(taille, 0, taille, r);
      ctx.lineTo(taille, taille - r);
      ctx.quadraticCurveTo(taille, taille, taille - r, taille);
      ctx.lineTo(r, taille);
      ctx.quadraticCurveTo(0, taille, 0, taille - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      // Filet doré
      ctx.strokeStyle = '#B08D57';
      ctx.lineWidth = 4 * s;
      const p = 28 * s;
      const rr = 88 * s;
      ctx.beginPath();
      ctx.moveTo(p + rr, p);
      ctx.lineTo(taille - p - rr, p);
      ctx.quadraticCurveTo(taille - p, p, taille - p, p + rr);
      ctx.lineTo(taille - p, taille - p - rr);
      ctx.quadraticCurveTo(taille - p, taille - p, taille - p - rr, taille - p);
      ctx.lineTo(p + rr, taille - p);
      ctx.quadraticCurveTo(p, taille - p, p, taille - p - rr);
      ctx.lineTo(p, p + rr);
      ctx.quadraticCurveTo(p, p, p + rr, p);
      ctx.closePath();
      ctx.stroke();

      // Petite branche dorée
      ctx.strokeStyle = '#B08D57';
      ctx.lineWidth = 4 * s;
      ctx.beginPath();
      ctx.moveTo(256 * s, 110 * s);
      ctx.lineTo(256 * s, 168 * s);
      ctx.stroke();

      ctx.fillStyle = '#B08D57';
      ctx.beginPath();
      ctx.ellipse(272 * s, 128 * s, 20 * s, 11 * s, -0.44, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(240 * s, 144 * s, 20 * s, 11 * s, 0.44, 0, Math.PI * 2);
      ctx.fill();

      // E & S
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'italic ' + (180 * s) + 'px Georgia, "Times New Roman", serif';

      ctx.fillStyle = '#FAF7F0';
      ctx.fillText('E', 185 * s, 332 * s);

      ctx.fillStyle = '#B08D57';
      ctx.fillText('&', 256 * s, 332 * s);

      ctx.fillStyle = '#FAF7F0';
      ctx.fillText('S', 327 * s, 332 * s);

      // SEASONS
      ctx.font = 'italic ' + (26 * s) + 'px Georgia, serif';
      ctx.fillStyle = '#B08D57';
      const txt = 'SEASONS';
      const totalWidth = 8 * 6 * s; // approximation lettrage
      ctx.fillText(txt, 256 * s, 412 * s);

      resolve(c.toDataURL('image/png'));
    });
  }

  genererIcone(192).then(function(url){
    document.getElementById('preview192').src = url;
  });
  genererIcone(512).then(function(url){
    document.getElementById('preview512').src = url;
  });

  function download(taille){
    genererIcone(taille).then(function(url){
      const a = document.createElement('a');
      a.href = url;
      a.download = 'icon-' + taille + '.png';
      a.click();
    });
  }
</script>
</body>
</html>
