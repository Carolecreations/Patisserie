(function(){
  var _idx = null;
  function buildIdx(){
    if(_idx) return _idx;
    _idx = allDuos().map(function(x){
      var d = x.d;
      var text = [d.plat.titre, d.boisson.titre, d.vin, d.accord]
        .concat(d.plat.ing.map(function(i){ return i[0]; }))
        .concat(d.boisson.ing.map(function(i){ return i[0]; }))
        .join(' | ');
      var allerg = norm((d.plat.allergenes||'') + ' ' + (d.plat.veg||'') + ' ' + (d.boisson.alt||''));
      var boissonAll = norm(d.boisson.titre + ' ' + d.boisson.ing.map(function(i){return i[0];}).join(' '));
      return {
        d: d, s: x.s, t: norm(text),
        veg: /vegetarien|vegan/.test(allerg),
        noalc: !/\b(vin|champagne|cremant|cidre|rhum|bourbon|whisky|gin|vodka|tequila|mezcal|sake|pastis|limoncello|grand marnier|cointreau|muscat|banyuls|maury|porto|biere)\b/.test(boissonAll),
        nogluten: !/gluten/.test(allerg),
        nofish: true,
        nolactose: !/lait|creme|beurre|fromage|mascarpone|yaourt/.test(allerg)
      };
    });
    return _idx;
  }
  window.doSearch = function(q){
    var list = buildIdx();
    var terms = norm(q).split(/\s+/).filter(Boolean).map(function(t){
      return t.length > 3 ? t.replace(/s$/, '') : t;
    });
    var activeF = Object.keys(db.filters || {}).filter(function(k){ return db.filters[k]; });
    var on = terms.length > 0 || activeF.length > 0;

    var seasonsEl = document.querySelector('#screen-home .seasons');
    var footEl = document.getElementById('home-foot');
    if(seasonsEl) seasonsEl.style.display = on ? 'none' : '';
    if(footEl) footEl.style.display = on ? 'none' : '';

    var resultsEl = document.getElementById('results');
    if(!resultsEl) return;
    if(!on){ resultsEl.innerHTML = ''; return; }

    var hits = list.filter(function(x){
      var okT = terms.every(function(t){ return x.t.indexOf(t) !== -1; });
      var okF = activeF.every(function(f){ return x[f]; });
      return okT && okF;
    });

    if(!hits.length){
      resultsEl.innerHTML = '<div class="empty"><p>Aucun dessert ne correspond.</p></div>';
      return;
    }
    var html = '<div class="duo-list">';
    hits.forEach(function(h){
      var n = String(h.d.numero).padStart(2,'0');
      html += '<button class="duo-item" data-duo="'+h.d.id+'">';
      html += '<span class="di-num">'+n+'</span>';
      html += '<span class="di-body"><span class="di-title">'+esc(h.d.plat.titre)+'</span>';
      html += '<span class="di-boisson">'+esc(h.d.boisson.titre)+' · '+esc(h.s.nom)+'</span></span>';
      html += '<span class="di-arrow">→</span></button>';
    });
    resultsEl.innerHTML = html + '</div>';
  };

  function injectFilters(){
    var home = document.getElementById('screen-home');
    if(!home) return;
    if(home.querySelector('#filters')) return;
    var search = home.querySelector('.search');
    if(!search) return;
    var div = document.createElement('div');
    div.className = 'filters'; div.id = 'filters';
    var F = db.filters || {};
    div.innerHTML =
      '<button class="filter'+(F.veg?' active':'')+'" data-filter="veg">Végétarien</button>' +
      '<button class="filter'+(F.noalc?' active':'')+'" data-filter="noalc">Sans alcool</button>' +
      '<button class="filter'+(F.nogluten?' active':'')+'" data-filter="nogluten">Sans gluten</button>' +
      '<button class="filter'+(F.nolactose?' active':'')+'" data-filter="nolactose">Sans lactose</button>';
    search.parentNode.insertBefore(div, search.nextSibling);
  }
  document.addEventListener('click', function(e){
    var f = e.target.closest('[data-filter]');
    if(!f) return;
    e.preventDefault(); e.stopPropagation();
    var k = f.dataset.filter;
    if(!db.filters) db.filters = {};
    db.filters[k] = !db.filters[k];
    f.classList.toggle('active');
    save();
    var input = document.getElementById('q');
    window.doSearch(input ? input.value : '');
  });
  document.addEventListener('input', function(e){
    if(e.target && e.target.id === 'q'){ window.doSearch(e.target.value); }
  });
  setInterval(injectFilters, 800);
  injectFilters();
})();

/* ═══════════════════════════════════════════════════════════════
   MULTI-TIMER
   ═══════════════════════════════════════════════════════════════ */
(function(){
  var bar = document.createElement('div');
  bar.id = 'multi-timer';
  document.body.appendChild(bar);

  var timers = {}; var interval = null;

  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function render(){
    var ids = Object.keys(timers);
    if(!ids.length){ bar.classList.remove('visible'); bar.innerHTML=''; if(interval){ clearInterval(interval); interval=null; } return; }
    bar.classList.add('visible');
    var html = '';
    for(var i=0;i<ids.length;i++){
      var id = ids[i], t = timers[id];
      var left = Math.max(0, Math.ceil((t.end - Date.now())/1000));
      var mm = Math.floor(left/60), ss = left%60;
      var disp = mm + ':' + (ss<10?'0':'') + ss;
      var cls = t.notified ? ' done' : '';
      var ico = t.notified ? '⏰' : '⏳';
      html += '<button type="button" class="mt-item'+cls+'" data-timer-id="'+id+'" title="Cliquer pour annuler">';
      html += '<b>'+ico+'</b><span>'+escapeHtml(t.label)+'</span><span>'+disp+'</span>';
      html += '</button>';
    }
    bar.innerHTML = html;
    if(!interval) interval = setInterval(tick, 500);
  }
  function beep(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      var a = new AC();
      for(var i=0;i<3;i++){
        var o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.25, a.currentTime + i*0.4);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + i*0.4 + 0.3);
        o.start(a.currentTime + i*0.4); o.stop(a.currentTime + i*0.4 + 0.3);
      }
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }
  function addTimer(seconds, label){
    if(!seconds || seconds <= 0) return;
    var id = 'mt' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
    timers[id] = { end: Date.now() + seconds*1000, seconds: seconds, label: label||'Minuteur', notified: false };
    if('Notification' in window && Notification.permission === 'default'){ try{ Notification.requestPermission(); }catch(e){} }
    render();
  }
  function tick(){
    var now = Date.now(); var trigger = false;
    Object.keys(timers).forEach(function(id){
      var t = timers[id];
      if(!t.notified && now >= t.end){
        t.notified = true; trigger = true;
        if('Notification' in window && Notification.permission === 'granted'){
          try{ new Notification('⏰ Minuteur terminé', { body: t.label }); }catch(e){}
        }
      }
      if(t.notified && now - t.end > 30000) delete timers[id];
    });
    if(trigger) beep();
    render();
  }
  function buildLabel(btn){
    var label = 'Minuteur';
    var duoEl = document.querySelector('#screen-duo .dh-num');
    if(duoEl) label = duoEl.textContent.replace(/\s+/g,' ').trim();
    var li = btn.closest('li'), ol = btn.closest('ol.steps');
    if(li && ol){
      var idx = Array.prototype.indexOf.call(ol.children, li) + 1;
      label = label + ' · étape ' + idx;
    }
    return label;
  }
  function getSeconds(btn){
    if(btn.dataset.timer){ var s = parseInt(btn.dataset.timer, 10); if(!isNaN(s)&&s>0) return s; }
    var oc = btn.getAttribute('onclick') || '';
    var m1 = oc.match(/startT\(([\d.]+)\)/);
    if(m1){ var min = parseFloat(m1[1]); if(!isNaN(min)&&min>0) return Math.round(min*60); }
    var txt = btn.textContent || '';
    var m2 = txt.match(/(\d+)\s*min/i); if(m2) return parseInt(m2[1],10)*60;
    var m3 = txt.match(/(\d+)\s*sec/i); if(m3) return parseInt(m3[1],10);
    return 0;
  }
  function isTimerButton(el){
    if(!el || el.tagName !== 'BUTTON') return false;
    if(el.dataset.timer) return true;
    if(el.classList && el.classList.contains('timer-inline')) return true;
    var txt = el.textContent || '';
    if(/[⏱⏰]/.test(txt)) return true;
    return false;
  }
  document.addEventListener('click', function(e){
    var el = e.target;
    while(el && el !== document.body){
      if(isTimerButton(el)){
        e.preventDefault(); e.stopPropagation();
        var secs = getSeconds(el);
        if(secs > 0) addTimer(secs, buildLabel(el));
        return;
      }
      el = el.parentNode;
    }
  }, true);
  document.addEventListener('click', function(e){
    var item = e.target.closest('[data-timer-id]');
    if(!item) return;
    e.preventDefault(); e.stopPropagation();
    var id = item.dataset.timerId;
    if(timers[id]){ delete timers[id]; render(); }
  });
  // Injecter les boutons minuteur dans les étapes
  function injectTimers(){
    var lis = document.querySelectorAll('#screen-recipe ol.steps li');
    Array.prototype.forEach.call(lis, function(li){
      if(li.dataset.timerDone) return;
      li.dataset.timerDone = '1';
      var html = li.innerHTML;
      li.innerHTML = html.replace(/\((\d+)\s*min(?:utes?)?\)/gi, function(m, num){
        return '(' + num + ' min) <button type="button" class="timer-inline" data-timer="'+(parseInt(num,10)*60)+'">⏱ '+num+' min</button>';
      }).replace(/\((\d+)\s*sec(?:ondes?)?\)/gi, function(m, num){
        return '(' + num + ' sec) <button type="button" class="timer-inline" data-timer="'+num+'">⏱ '+num+' sec</button>';
      });
    });
  }
  var _openRecipe = window.openRecipe;
  if(typeof _openRecipe === 'function'){
    window.openRecipe = function(d, s, t){
      _openRecipe(d, s, t);
      setTimeout(injectTimers, 40);
    };
  }
})();

/* ═══════════════════════════════════════════════════════════════
   TAILLE TEXTE
   ═══════════════════════════════════════════════════════════════ */
(function(){
  var SIZES = [0.88, 1, 1.12, 1.24, 1.38];
  var idx = 1;
  try{ var s = parseInt(localStorage.getItem('sw_fs') || '1', 10); if(!isNaN(s) && s >= 0 && s < SIZES.length) idx = s; }catch(e){}
  function apply(){
    var scale = SIZES[idx];
    document.documentElement.style.zoom = scale;
    try{ localStorage.setItem('sw_fs', String(idx)); }catch(e){}
    var lbl = document.getElementById('fs-label');
    if(lbl) lbl.textContent = ['A−','A','A+','A++','A+++'][idx];
  }
  function inject(){
    if(document.getElementById('fs-controls')) return;
    var head = document.querySelector('header');
    if(!head) return;
    var wrap = document.createElement('div');
    wrap.id = 'fs-controls';
    wrap.style.cssText = 'position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:4px;align-items:center;z-index:22';
    var bm = document.createElement('button'); bm.type = 'button'; bm.textContent = 'A−';
    bm.style.cssText = 'font:600 11px var(--sans);padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--brown);cursor:pointer';
    var lbl = document.createElement('span'); lbl.id = 'fs-label';
    lbl.style.cssText = 'font:600 10px var(--sans);letter-spacing:.14em;color:var(--ink-soft);min-width:34px;text-align:center';
    var bp = document.createElement('button'); bp.type = 'button'; bp.textContent = 'A+';
    bp.style.cssText = bm.style.cssText;
    bm.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); idx = Math.max(0, idx-1); apply(); });
    bp.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); idx = Math.min(SIZES.length-1, idx+1); apply(); });
    wrap.appendChild(bm); wrap.appendChild(lbl); wrap.appendChild(bp);
    head.appendChild(wrap);
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', function(){ inject(); apply(); }); }
  else { inject(); apply(); }
})();

   PARTAGE
   ═══════════════════════════════════════════════════════════════ */
(function(){
  function shareText(title, text, url){
    if(navigator.share){
      return navigator.share({ title:title, text:text, url:url }).catch(function(){});
    }
    if(navigator.clipboard){
      return navigator.clipboard.writeText(text + (url ? '\n' + url : '')).then(function(){
        if(typeof toast === 'function') toast('Copié ✓');
      }).catch(function(){ if(typeof toast === 'function') toast('Partage indisponible'); });
    }
    if(typeof toast === 'function') toast('Partage indisponible');
  }
  function injectDuoShare(){
    var scr = document.getElementById('screen-duo');
    if(!scr || !scr.classList.contains('active')) return;
    if(!scr.querySelector('.duo-hero')) return;
    if(scr.querySelector('.btn-share-duo')) return;
    var row = scr.querySelector('.btn-row'); if(!row) return;
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn btn-share-duo'; b.textContent = '↗ Partager';
    b.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      var num = scr.querySelector('.duo-hero .dh-num');

      var plat = cards[0] ? cards[0].textContent : '';
      var boisson = cards[1] ? cards[1].textContent : '';
      var t = (num ? num.textContent + ' — ' : '') + plat + ' · ' + boisson;
      shareText('Sweet & Sip', t, location.origin + location.pathname);

  }
  function injectRecipeShare(){
    var scr = document.getElementById('screen-recipe');
    if(!scr || !scr.classList.contains('active')) return;
    if(!scr.querySelector('.detail-hero')) return;
    if(scr.querySelector('.btn-share-recipe')) return;
    var row = scr.querySelector('.btn-print') ? scr.querySelector('.btn-print').parentNode : null;
    if(!row) return;
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn btn-share-recipe'; b.textContent = '↗ Partager';
    b.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      var titre = scr.querySelector('.dth-title');
      var steps = scr.querySelectorAll('ol.steps li');
      var txt = (titre ? titre.textContent : '') + '\n\n';
      Array.prototype.forEach.call(steps, function(li, i){
        txt += (i+1) + '. ' + li.textContent.replace(/\s+/g,' ').trim() + '\n';
      });
      shareText(titre ? titre.textContent : 'Sweet & Sip', txt);
    });
    row.appendChild(b);
  }
  function init(){
    ['screen-duo','screen-recipe'].forEach(function(id){
      var scr = document.getElementById(id);
      if(!scr) return;
      var obs = new MutationObserver(function(){ injectDuoShare(); injectRecipeShare(); });
      obs.observe(scr, { attributes:true, attributeFilter:['class'], childList:true, subtree:true });
    });
    injectDuoShare(); injectRecipeShare();
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();

(function(){
  function renderGastro(d, type){
    var data = (window.GASTRO && window.GASTRO[d.id]) || {};
    var g = data[type];
    if(!g) return null;
    var html = '';
    if(g.concept) html += '<div class="gastro-intro">'+esc(g.concept)+'</div>';
    if(g.touches && g.touches.length){
      html += '<div class="block"><div class="block-title">Touches du chef</div><ul class="gastro-touches">';
      g.touches.forEach(function(t){ html += '<li>'+esc(t)+'</li>'; });

  var _openRecipe = window.openRecipe;
  if(typeof _openRecipe !== 'function') return;

  window.openRecipe = function(d, saison, type){
    _openRecipe(d, saison, type);
    setTimeout(function(){
      var scr = document.getElementById('screen-recipe');
      if(!scr) return;
      var gastroHTML = renderGastro(d, type);
      if(!gastroHTML) return;
      var children = Array.prototype.slice.call(scr.children);
      var standard = document.createElement('div');
      standard.className = 'recipe-content standard active';
      children.forEach(function(c){ standard.appendChild(c); });
      scr.appendChild(standard);
      var gastro = document.createElement('div');
      gastro.className = 'recipe-content gastro';
      gastro.innerHTML = gastroHTML;
      scr.appendChild(gastro);
      var tabs = document.createElement('div');
      tabs.className = 'recipe-tabs';
      tabs.innerHTML = '<button type="button" class="tab-btn active" data-tab="standard">Recette</button><button type="button" class="tab-btn" data-tab="gastro">Gastronomique</button>';

      tabs.addEventListener('click', function(e){
        var b = e.target.closest('[data-tab]'); if(!b) return;
        e.preventDefault(); e.stopPropagation();
        var tab = b.dataset.tab;
        tabs.querySelectorAll('.tab-btn').forEach(function(x){ x.classList.toggle('active', x === b); });
        scr.querySelectorAll('.recipe-content').forEach(function(c){ c.classList.toggle('active', c.classList.contains(tab)); });
        window.scrollTo(0,0);
      });
    }, 40);
  };
})();

/* ═══════════════════════════════════════════════════════
   2. INJECTION : menu drawer + section écran
   ═══════════════════════════════════════════════════════ */

// 2a. Menu dans le drawer (après « Courses »)
var drawer = document.getElementById('drawer');
if(drawer && !drawer.querySelector('[data-menu="techniques"]')){
  var btnTech = document.createElement('button');
  btnTech.className = 'drawer-item';
  btnTech.dataset.menu = 'techniques';
  btnTech.innerHTML = '<span class="di-icon">⚙️</span><span>Techniques</span><span class="di-arrow">→</span>';
  // Insérer après le bouton "Courses"
  var btnCart = drawer.querySelector('[data-menu="cart"]');
  if(btnCart && btnCart.parentNode){ btnCart.parentNode.insertBefore(btnTech, btnCart.nextSibling); }
  else { drawer.appendChild(btnTech); }
}

// 2b. Section écran
var main = document.querySelector('main');
if(main && !document.getElementById('screen-techniques')){
  var secTech = document.createElement('section');
  secTech.id = 'screen-techniques';
  secTech.className = 'screen';
  main.appendChild(secTech);
}

/* ═══════════════════════════════════════════════════════
   3. RENDU — écran Techniques
   ═══════════════════════════════════════════════════════ */
window.renderTechniques = function(){
  var scr = document.getElementById('screen-techniques');
  if(!scr) return;

  // Calculer les totaux
  var totalItems = TECHNIQUES.reduce(function(acc, c){ return acc + c.items.length; }, 0);

  var html = '<button class="btn back" data-back="home">← Retour</button>' +
    '<div class="tech-hero">' +
      '<div class="th-eyebrow">Le carnet technique</div>' +
      '<h1 class="th-title">Les <em>gestes</em> du pâtissier</h1>' +
      '<div class="th-sub">' + totalItems + ' techniques classées en ' + TECHNIQUES.length + ' familles</div>' +
    '</div>' +
    '<div class="tech-search"><input id="tech-q" type="search" placeholder="Rechercher une technique…" autocomplete="off"></div>' +
    '<div id="tech-results"></div>' +
    '<div id="tech-cats">';

  TECHNIQUES.forEach(function(cat){
    html += '<div class="tech-cat" data-cat="' + cat.id + '">';
    html += '<button class="tech-cat-head" data-tech-cat="' + cat.id + '">';
    html += '<span class="tech-cat-ico">' + cat.icone + '</span>';
    html += '<span class="tech-cat-txt">';
    html += '<span class="tech-cat-nom">' + esc(cat.nom) + '</span>';
    html += '<span class="tech-cat-intro">' + esc(cat.intro) + '</span>';
    html += '</span>';
    html += '<span class="tech-cat-count">' + cat.items.length + '</span>';
    html += '<span class="tech-cat-arrow">›</span>';
    html += '</button>';
    html += '<div class="tech-cat-body">';
    cat.items.forEach(function(item){
      html += '<button class="tech-item" data-tech="' + item.id + '">';
      html += '<span class="ti-bullet">✦</span>';
      html += '<span class="ti-body">';
      html += '<span class="ti-titre">' + esc(item.titre) + '</span>';
      html += '<span class="ti-meta">' + esc(item.temps) + ' · ' + esc(item.diff) + '</span>';
      html += '</span>';
      html += '<span class="ti-arrow">→</span>';
      html += '</button>';
    });
    html += '</div></div>';
  });
  html += '</div>';

  scr.innerHTML = html;
};

/* ═══════════════════════════════════════════════════════
   4. RENDU — fiche technique détaillée
   ═══════════════════════════════════════════════════════ */
function findTech(id){
  for(var i=0;i<TECHNIQUES.length;i++){
    var cat = TECHNIQUES[i];
    for(var j=0;j<cat.items.length;j++){
      if(cat.items[j].id === id) return { item: cat.items[j], cat: cat };
    }
  }
  return null;
}

window.openTechnique = function(id){
  var f = findTech(id);
  if(!f) return;
  var item = f.item, cat = f.cat;
  var diffClass = item.diff === 'Facile' ? 'tf-diff-facile' : (item.diff === 'Moyen' ? 'tf-diff-moyen' : 'tf-diff-difficile');

  var html = '<button class="btn back" data-back="techniques">← Techniques</button>';
  html += '<div class="tech-fiche-hero">';
  html += '<div class="tf-cat">' + esc(cat.nom) + '</div>';
  html += '<div class="tf-titre">' + esc(item.titre) + '</div>';
  html += '<div class="tf-desc">' + esc(item.desc) + '</div>';
  html += '<div class="tf-meta"><span>⏱ ' + esc(item.temps) + '</span><span class="' + diffClass + '">' + esc(item.diff) + '</span></div>';
  html += '</div>';

  if(item.ing && item.ing.length){
    html += '<div class="block"><div class="block-title">Ingrédients / Matériel</div><ul class="ing">';
    item.ing.forEach(function(i){
      var parts = i.split(' — ');
      if(parts.length === 2){
        html += '<li><b>' + esc(parts[0]) + '</b><span class="ing-q">' + esc(parts[1]) + '</span></li>';
      } else {
        html += '<li><b>' + esc(i) + '</b><span class="ing-q"></span></li>';
      }
    });
    html += '</ul></div>';
  }

  if(item.steps && item.steps.length){
    html += '<div class="block"><div class="block-title">Étapes</div><ol class="steps">';
    item.steps.forEach(function(s){ html += '<li>' + esc(s) + '</li>'; });
    html += '</ol></div>';
  }

  if(item.astuce){
    html += '<div class="tech-note-astuce"><span class="tna-label">Secret du chef</span>' + esc(item.astuce) + '</div>';
  }

  var scr = document.getElementById('screen-techniques');
  if(scr) scr.innerHTML = html;
  window.scrollTo(0, 0);
};

/* ═══════════════════════════════════════════════════════
   5. RECHERCHE interne techniques
   ═══════════════════════════════════════════════════════ */
window.searchTechniques = function(q){
  var results = document.getElementById('tech-results');
  var cats = document.getElementById('tech-cats');
  if(!results || !cats) return;

  var nq = norm(q).trim();
  if(!nq){
    results.innerHTML = '';
    cats.style.display = '';
    return;
  }
  var terms = nq.split(/\s+/).filter(Boolean);
  var hits = [];
  TECHNIQUES.forEach(function(cat){
    cat.items.forEach(function(item){
      var txt = norm(item.titre + ' ' + item.desc + ' ' + (item.ing||[]).join(' ') + ' ' + (item.astuce||''));
      var ok = terms.every(function(t){ return txt.indexOf(t) !== -1; });
      if(ok) hits.push({ item: item, cat: cat });
    });
  });

  cats.style.display = 'none';

  if(!hits.length){
    results.innerHTML = '<div class="empty"><p>Aucune technique ne correspond.</p></div>';
    return;
  }
  var html = '<div class="duo-list">';
  hits.forEach(function(h){
    html += '<button class="tech-item" data-tech="' + h.item.id + '" style="border-bottom:1px solid var(--line)">';
    html += '<span class="ti-bullet">✦</span>';
    html += '<span class="ti-body">';
    html += '<span class="ti-titre">' + esc(h.item.titre) + '</span>';
    html += '<span class="ti-meta">' + esc(h.cat.nom) + ' · ' + esc(h.item.temps) + ' · ' + esc(h.item.diff) + '</span>';
    html += '</span>';
    html += '<span class="ti-arrow">→</span>';
    html += '</button>';
  });
  html += '</div>';
  results.innerHTML = html;
};

/* ═══════════════════════════════════════════════════════
   6. ÉCOUTEURS — menu, accordéon, fiches, recherche
   ═══════════════════════════════════════════════════════ */

// 6a. Clic sur le menu drawer « Techniques » (capture pour priorité)
document.addEventListener('click', function(e){
  var mi = e.target.closest('[data-menu="techniques"]');
  if(mi){
    e.preventDefault(); e.stopPropagation();
    if(typeof closeDrawer === 'function') closeDrawer();
    window.renderTechniques();
    if(typeof go === 'function') go('techniques');
    return;
  }
}, true);

// 6b. Accordéon des catégories
document.addEventListener('click', function(e){
  var head = e.target.closest('[data-tech-cat]');
  if(head){
    e.preventDefault(); e.stopPropagation();
    var cat = head.closest('.tech-cat');
    if(cat) cat.classList.toggle('open');
    return;
  }
}, true);

// 6c. Ouverture d'une fiche technique
document.addEventListener('click', function(e){
  var item = e.target.closest('[data-tech]');
  if(item){
    e.preventDefault(); e.stopPropagation();
    window.openTechnique(item.dataset.tech);
    return;
  }
}, true);

// 6d. Bouton retour depuis la fiche vers la liste des techniques
document.addEventListener('click', function(e){
  var bk = e.target.closest('[data-back="techniques"]');
  if(bk){
    e.preventDefault(); e.stopPropagation();
    window.renderTechniques();
    if(typeof go === 'function') go('techniques');
    return;
  }
}, true);

// 6e. Recherche dans les techniques
document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'tech-q'){
    window.searchTechniques(e.target.value);
  }
});

/* ═══════════════════════════════════════════════════════
   7. PATCH go() — s'assurer que renderTechniques est appelé
   ═══════════════════════════════════════════════════════ */
var _go = window.go;
if(typeof _go === 'function'){
  window.go = function(id){
    if(id === 'techniques'){
      var scr = document.getElementById('screen-techniques');
      if(scr && !scr.innerHTML.trim()){
        window.renderTechniques();
      }
    }
    return _go.apply(this, arguments);
  };
}

console.log('✅ Patch Techniques armé — ' + TECHNIQUES.length + ' catégories, ' + TECHNIQUES.reduce(function(a,c){return a+c.items.length;},0) + ' techniques');
})();
</script>

    transformation:"Le dôme glacé reste intact. On l'accompagne simplement d'un crumble de chapelure caramélisée, à saupoudrer sur l'assiette, et d'une quenelle de crème fouettée en plus de la mousse.",
    etapes:[
      "Chapelure : faites torréfier 80 g de chapelure dans 40 g de beurre + 40 g de sucre roux, jusqu'à coloration blonde. Laissez refroidir sur une assiette.",
      "Dressage : au moment de servir le dôme, saupoudrez généreusement la chapelure croustillante sur l'assiette, autour du dôme.",
      "Crème : ajoutez une quenelle de crème fouettée légère, légèrement sucrée, à côté du dôme.",
      "Service : le contraste entre le dôme glacé et la chapelure croustillante fait toute la magie de ce dessert nordique."
    ],
    astuce:"Torréfier la chapelure en remuant constamment : trop chaude, elle brûle ; pas assez, elle reste molle et perd son croquant."
  },
  boisson:{
    ajouts:["Jus de pomme","Clous de girofle","Bâton de cannelle","Raisins secs"],
    transformation:"Le thé blanc floral devient un gløgg sans alcool, boisson danoise d'hiver et de printemps.",
    etapes:[
      "Chauffez 20 cl de jus de pomme avec 1 bâton de cannelle et 3 clous de girofle, sans bouillir.",
      "Laissez infuser 10 min à couvert. Filtrez.",
      "Ajoutez quelques raisins secs et des amandes effilées.",
      "Servez bien chaud."
    ]
  }
},
p4:{
  pays:"Royaume-Uni", drapeau:"🇬🇧",
  intro:"En Angleterre, la tarte fine se sert volontiers avec une 'custard' : une crème anglaise épaisse, vanillée, servie en nappe tiède. La tarte garde sa structure, la custard fait tout le reste.",
  plat:{
    ajouts:["25 cl de lait entier","4 jaunes d'œufs","60 g de sucre","1 c. à s. de fécule","1 gousse de vanille"],
    transformation:"La tarte reste identique. On ajoute simplement une custard anglaise, plus épaisse que la crème anglaise française, à servir tiède sur chaque portion.",
    etapes:[
      "Custard : chauffez 25 cl de lait avec 1 gousse de vanille fendue et grattée. Laissez infuser 10 minutes, retirez la gousse.",
      "Fouettez 4 jaunes avec 60 g de sucre et 1 c. à s. de fécule. Versez le lait chaud en filet, en fouettant constamment.",
      "Reversez dans la casserole et cuisez à feu doux en remuant sans arrêt, jusqu'à épaississement (2-3 minutes après les premiers bouillons).",
      "Servez la tarte tiède, la custard versée en nappe sur chaque portion, avec une pincée de muscade râpée."
    ],
    astuce:"La fécule remplace une partie du jaune : c'est ce qui donne cette texture nappante et veloutée, typique de la custard anglaise."
  },
  boisson:{
    ajouts:["Thé Earl Grey","Citron","Glaçons"],
    transformation:"Le cidre brut devient un Earl Grey glacé, thé à la bergamote servi très frais.",
    etapes:[
      "Infusez 2 c. à c. d'Earl Grey dans 30 cl d'eau frémissante, 4 min.",
      "Filtrez, refroidissez 1 h.",
      "Servez sur glaçons avec une rondelle de citron."
    ]
  }
},
p5:{
  pays:"Suède", drapeau:"🇸🇪",
  intro:"En Suède, la rhubarbe et les fruits rouges se servent volontiers avec du skyr, yaourt épais et acidulé. La tartelette reste telle quelle, on change juste l'accompagnement.",
  plat:{
    ajouts:["200 g de skyr (ou yaourt grec)","1 c. à s. de miel"],
    transformation:"La tartelette fraise-sésame reste identique. On ajoute simplement une quenelle de skyr battu au miel, à côté, pour trancher sur l'acidité du fruit.",
    etapes:[
      "Battez 200 g de skyr avec 1 c. à s. de miel, jusqu'à obtenir une crème lisse et brillante.",
      "Au moment de servir, déposez une quenelle de skyr sur l'assiette, à côté de la tartelette.",
      "Ajoutez quelques fraises fraîches et un trait de miel si vous aimez. C'est tout."
    ],
    astuce:"Le skyr est plus épais et plus acidulé que le yaourt grec : il tranche magnifiquement avec le sucré du sésame et des fraises."
  },
  boisson:{
    ajouts:["Jus d'orange","Épices douces","Amandes effilées"],
    transformation:"Le thé vert sencha devient un glögg blanc sans alcool aux agrumes, servi chaud.",
    etapes:[
      "Chauffez 20 cl de jus d'orange avec 1 bâton de cannelle, 1 étoile de badiane et 2 clous de girofle.",
      "Infusez 10 min à couvert. Filtrez.",
      "Servez chaud avec des amandes effilées."
    ]
  }
},
p6:{
  pays:"Iran", drapeau:"🇮🇷",
  intro:"En Iran, la rose et la pistache forment un duo ancestral. On garde la panna cotta citronnelle, on ajoute simplement un décor persan et une pointe d'eau de rose.",
  plat:{
    ajouts:["1 c. à c. d'eau de rose (dans la crème)","50 g de pistaches non salées concassées","Quelques pétales de rose séchés"],
    transformation:"La panna cotta garde sa citronnelle. On ajoute juste 1 c. à c. d'eau de rose dans la crème (pas plus — c'est puissant), et on décore de pétales de rose et de pistaches concassées.",
    etapes:[
      "Crème : préparez la panna cotta comme d'habitude, mais juste avant de couler en verrines, ajoutez 1 c. à c. d'eau de rose. Mélangez délicatement.",
      "Coulage et repos : coulez en verrines, réservez 4 heures au frais comme d'habitude.",
      "Décor : au moment de servir, parsemez de pistaches concassées et de quelques pétales de rose séchés.",
      "Coulis : versez le coulis de fruits rouges par-dessus, comme d'habitude. Les pétales doivent rester visibles en surface."
    ],
    astuce:"L'eau de rose persane est plus intense que l'européenne. Commencez par 1 c. à c. dans toute la crème, puis ajustez. Trop d'eau de rose rend la panna cotta savonneuse."
  },
  boisson:{
    ajouts:["1 pincée de safran","2-3 dattes Medjool"],
    transformation:"L'infusion citronnelle-gingembre devient un thé persan au safran, servi avec des dattes.",
    etapes:[
      "Infusez 2 c. à c. de thé noir avec 1 pincée de safran dans 30 cl d'eau frémissante, 5 min.",
      "Filtrez.",
      "Servez très chaud avec 2-3 dattes Medjool à côté."
    ]
  }
},
p7:{
  pays:"Espagne", drapeau:"🇪🇸",
  intro:"En Catalogne, la 'crema catalana' est une crème prise, parfumée au citron et à la cannelle, caramélisée au sucre. On s'inspire de sa texture pour transformer le sorbet en dessert encore plus gourmand.",
  plat:{
    ajouts:["2 jaunes d'œufs","50 g de sucre","1 c. à s. de fécule","1 zeste de citron","1 bâton de cannelle"],
    transformation:"Le sorbet fraise-basilic devient le cœur d'une crema catalana : on prépare une crème catalane classique, on la laisse prendre, puis on la sert avec une quenelle de sorbet au centre. Le dessert est à la fois froid et crémeux.",
    etapes:[
      "Crème catalane : chauffez 25 cl de lait avec 1 zeste de citron et 1 bâton de cannelle. Laissez infuser 10 minutes, filtrez. Fouettez 2 jaunes avec 50 g de sucre et 1 c. à s. de fécule. Versez le lait chaud en filet. Cuisez à feu doux jusqu'à épaississement.",
      "Prise : versez la crème dans des ramequins peu profonds, laissez refroidir puis placez 2 heures au frais.",
      "Caramélisation : saupoudrez d'une fine couche de sucre roux et caramélisez au chalumeau, juste avant de servir.",
      "Service : déposez une belle quenelle de sorbet fraise-basilic au centre de la crème catalane caramélisée. Le contraste chaud-froid fait tout le dessert."
    ],
    astuce:"La crema catalana se cuit directement sur le feu, contrairement à la crème brûlée qui cuit au bain-marie. Cette différence lui donne une texture plus dense, parfaite pour accueillir le sorbet."
  },
  boisson:{
    ajouts:["10 cl de lait de tigernut (ou lait d'amande)","1 pincée de cannelle"],
    transformation:"L'eau pétillante citron vert devient une horchata, boisson espagnole ancestrale à base de tigernut.",
    etapes:[
      "Versez 15 cl de lait de tigernut (ou d'amande) bien froid dans un verre.",
      "Saupoudrez d'une pincée de cannelle.",
      "Servez avec un glaçon."
    ]
  }
},
p8:{
  pays:"Turquie", drapeau:"🇹🇷",
  intro:"À Istanbul, la pistache est reine dans les baklavas : associée au miel, à l'eau de rose et à la fleur d'oranger. On garde la verrine telle quelle, on ajoute juste un éclat croustillant inspiré du baklava et un parfum floral.",
  plat:{
    ajouts:["3 feuilles de pâte filo (ou 1 feuille de brick)","20 g de beurre fondu","1 c. à s. de miel","1 c. à c. d'eau de rose (dans le coulis)"],
    transformation:"La verrine garde sa structure : crème de pistache, coulis de framboise, framboises fraîches. On ajoute en décor un éclat de baklava maison (pâte filo croustillante, pistaches concassées, miel), et on parfume le coulis d'une pointe d'eau de rose. Un pont entre deux traditions.",
    etapes:[
      "Baklava crumble : superposez 3 feuilles de pâte filo en les badigeonnant de beurre fondu entre chaque. Découpez en petits rectangles, parsemez de pistaches concassées, arrosez d'un filet de miel. Cuisez 8 minutes à 180°C, jusqu'à dorure.",
      "Coulis : préparez le coulis de framboise comme d'habitude, mais ajoutez 1 c. à c. d'eau de rose — pas plus, c'est puissant. Mélangez bien.",
      "Verrines : montez les verrines comme d'habitude, en alternant crème de pistache et coulis parfumé.",
      "Service : au moment de servir, plantez un éclat de baklava croustillant sur le dessus de chaque verrine, à côté des framboises fraîches.",
      "Décor : ajoutez quelques pistaches concassées et un fin trait de miel au-dessus de la verrine. Le contraste croustillant-crémeux fait tout le dessert."
    ],
    astuce:"La pâte filo se dessèche très vite : gardez-la sous un torchon humide pendant que vous travaillez. Un baklava maison même simple transforme complètement la dégustation."
  },
  boisson:{
    ajouts:["1 pincée de cannelle","1 zeste d'orange","2 cl de sirop de grenadine (facultatif)"],
    transformation:"Le Champagne reste du Champagne, mais on lui ajoute une touche orientale : un zeste d'orange, une pincée de cannelle, et 2 cl de sirop de grenadine pour la couleur. Un cocktail 'Champagne à la turque', servi frais.",
    etapes:[
      "Refroidissez la flûte au réfrigérateur 30 minutes.",
      "Déposez au fond de la flûte un zeste d'orange fin et 1 pincée de cannelle.",
      "Versez 2 cl de sirop de grenadine (facultatif, pour la couleur rosée).",
      "Complétez avec le Champagne brut, versé doucement le long du verre. Ne remuez pas — les couches se mêlent naturellement.",
      "Servez aussitôt, avec une demi-rondelle d'orange sur le bord."
    ]
  }
},
p9:{
  pays:"Nouvelle-Zélande", drapeau:"🇳🇿",
  intro:"La pavlova vient de Nouvelle-Zélande. Ici, on la dédie à sa patrie d'origine : fruits rouges, mais aussi kiwi et fruit de la passion, comme dans la version classique.",
  plat:{
    ajouts:["2 kiwis","1 fruit de la passion","1 c. à c. de vinaigre blanc (déjà dans la recette) — à doubler"],
    transformation:"Le clafoutis cerises-amandes devient une pavlova, momentanément. On garde la cerise (fruit rouge) et l'amande (pistache ou amande grillée), on ajoute kiwi et fruit de la passion.",
    etapes:[
      "Meringue : montez 3 blancs en neige, ajoutez 180 g de sucre et 2 c. à c. de vinaigre blanc pour un cœur moelleux. Formez un grand disque de meringue, cuisez 1h15 à 120°C.",
      "Chantilly : fouettez 20 cl de crème bien froide en chantilly ferme.",
      "Fruits : coupez les kiwis en rondelles, ouvrez le fruit de la passion en deux, gardez quelques cerises fraîches pour rappeler la recette d'origine.",
      "Dressage : garnissez le creux de la meringue de chantilly, disposez les fruits en alternant, parsemez de quelques amandes grillées concassées."
    ],
    astuce:"Le vinaigre blanc transforme la meringue en cœur moelleux, comme une guimauve, tout en gardant la croûte croustillante. Ne le supprimez jamais."
  },
  boisson:{
    ajouts:["Citron","Eau pétillante","Sirop de gingembre"],
    transformation:"Le thé noir léger devient une L&P maison, soda néo-zélandais culte au citron et gingembre.",
    etapes:[
      "Pressez 1 citron.",
      "Mélangez 2 cl de sirop de gingembre, le jus de citron et 15 cl d'eau pétillante.",
      "Servez sur glaçons avec une rondelle de citron."
    ]
  }
},

e10:{
  pays:"États-Unis", drapeau:"🇺🇸",
  intro:"En Louisiane, le 'cobbler' est un dessert rustique : fruits cuits sous une pâte sablée, servis tièdes. On transforme le pavé melon en version 'cobbler' revisitée, avec une tuile de pâte sablée croustillante.",
  plat:{
    ajouts:["50 g de farine","30 g de beurre froid","30 g de sucre roux","1 pincée de cannelle"],
    transformation:"Le pavé de melon reste glacé et tel quel. On ajoute simplement, en décor, une tuile de cobbler croustillante — pâte sablée sucrée aux épices, cuite à plat, cassée en éclats.",
    etapes:[
      "Tuile : mélangez 50 g de farine, 30 g de beurre froid en dés, 30 g de sucre roux et 1 pincée de cannelle. Sablez du bout des doigts.",
      "Cuisson : étalez en fine couche sur une plaque, cuisez 15 minutes à 180°C, jusqu'à dorure. Laissez refroidir — la tuile durcit en refroidissant.",
      "Décor : cassez la tuile en éclats irréguliers. Posez-en un ou deux sur chaque pavé au moment de servir.",
      "Service : le contraste entre la tuile croustillante et le pavé glacé rappelle les cobblers de Louisiane, servis tièdes avec leur croûte."
    ],
    astuce:"Cassez la tuile à la main plutôt qu'au couteau : les éclats irréguliers donnent un rendu plus naturel, plus 'rustique'."
  },
  boisson:{
    ajouts:["Thé noir","Sucre","Citron","Menthe"],
    transformation:"L'eau de melon infusée devient un 'sweet tea' du Sud américain, très sucré et servi sur glace.",
    etapes:[
      "Infusez 4 sachets de thé noir dans 50 cl d'eau chaude, 5 min.",
      "Ajoutez 4 c. à s. de sucre, remuez jusqu'à dissolution.",
      "Refroidissez 1 h. Servez sur glaçons avec citron et menthe."
    ]
  }
},
e11:{
  pays:"Australie", drapeau:"🇦🇺",
  intro:"En Australie, la pavlova est un dessert national. On transforme le millefeuille patate douce en version pavlova : même idée de croustillant, même générosité, autres textures.",
  plat:{
    ajouts:["3 blancs d'œufs","180 g de sucre","1 c. à c. de vinaigre blanc","20 cl de crème","1 mangue ou 2 fruits de la passion"],
    transformation:"Le millefeuille devient une pavlova. On abandonne la pâte feuilletée, on garde la patate douce caramélisée en garniture, et on la pose sur une meringue croustillante avec de la chantilly. Dessert totalement différent, mais qui garde l'esprit 'généreux' de l'original.",
    etapes:[
      "Meringue : montez 3 blancs en neige, ajoutez 180 g de sucre et 1 c. à c. de vinaigre. Formez un grand disque sur papier cuisson, creusez légèrement le centre. Cuisez 1h15 à 120°C.",
      "Chantilly : fouettez 20 cl de crème très froide en chantilly ferme.",
      "Patate douce : reprenez la recette originale (caramélisée au beurre et sucre roux).",
      "Dressage : garnissez le creux de la meringue de chantilly, disposez la patate douce caramélisée, ajoutez quelques dés de mangue ou de fruit de la passion, et servez aussitôt."
    ],
    astuce:"Le vinaigre blanc dans la meringue est indispensable : il transforme la meringue en cœur moelleux, comme une guimauve. C'est la signature de la pavlova."
  },
  boisson:{
    ajouts:["Kombucha artisanal aux fruits rouges"],
    transformation:"Le chai latte glacé devient un kombucha aux fruits rouges, pétillant et fermenté.",
    etapes:[
      "Refroidissez 20 cl de kombucha aux fruits rouges.",
      "Versez dans une flûte bien froide.",
      "Servez aussitôt."
    ]
  }
},
e12:{
  pays:"Mexique", drapeau:"🇲🇽",
  intro:"Au Mexique, on aime les desserts qui mêlent sucré, acide et pimenté — la tarte aux pêches s'y prête parfaitement. On garde la tarte telle quelle, on ajoute juste une note de piment doux.",
  plat:{
    ajouts:["1 pincée de piment doux en poudre (chile en polvo)","Jus de citron vert","Fleur de sel"],
    transformation:"La tarte reste identique. On ajoute simplement, au moment de servir, une pointe de piment doux et de fleur de sel sur les pêches — un geste mexicain qui réveille le sucré du fruit.",
    etapes:[
      "Tarte : préparez la tarte aux pêches comme d'habitude, avec les pistaches grillées.",
      "Piment : au moment de servir, saupoudrez une légère pincée de chile en polvo sur les pêches.",
      "Fleur de sel : ajoutez 2 ou 3 grains de fleur de sel — jamais plus, c'est très puissant.",
      "Citron vert : exprimez un quartier de citron vert au-dessus de la tarte juste avant de servir."
    ],
    astuce:"Le chile en polvo mexicain est un mélange de piment doux, de sel et de citron. On en trouve en épicerie latine. Sinon, un mélange paprika + sel + zeste de citron fonctionne."
  },
  boisson:{
    ajouts:["Pastèque","Citron vert","Menthe"],
    transformation:"Le thé glacé à la pêche devient une agua fresca de pastèque, boisson de rue mexicaine.",
    etapes:[
      "Mixez 300 g de pastèque avec 10 cl d'eau, le jus d'1 citron vert et 1 c. à s. de sucre.",
      "Filtrez légèrement.",
      "Servez très frais sur glaçons avec un brin de menthe."
    ]
  }
},
e13:{
  pays:"Hongrie", drapeau:"🇭🇺",
  intro:"En Hongrie, les 'palacsinta' sont des crêpes fines roulées, garnies de confiture et nappées de chocolat. On transforme le sorbet melon-citronnelle en accompagnement de ces crêpes roulées.",
  plat:{
    ajouts:["2 œufs","100 g de farine","20 cl de lait","100 g de chocolat noir","Confiture de fruits"],
    transformation:"Le sorbet reste tel quel. On ajoute, à côté, 2 ou 3 palacsinta (crêpes roulées à la confiture, nappées de chocolat fondu), comme un dessert à deux textures : froid et fondant.",
    etapes:[
      "Palacsinta : préparez une pâte à crêpes fine (2 œufs, 100 g de farine, 20 cl de lait, 1 c. à s. de sucre). Laissez reposer 30 min, puis cuisez 8 crêpes fines.",
      "Garniture : étalez de la confiture de fruits au choix sur chaque crêpe, roulez-la serrée.",
      "Chocolat : faites fondre 100 g de chocolat noir avec 5 cl de crème. Nappez les crêpes roulées.",
      "Service : servez les palacsinta tièdes, avec une belle quenelle de sorbet melon-citronnelle à côté. Le contraste chaud-froid fait tout."
    ],
    astuce:"La pâte à crêpes doit reposer 30 min : le gluten se détend, les crêpes deviennent plus fines et plus souples, sans trous."
  },
  boisson:{
    ajouts:["Tokaji 3 puttonyos, ou jus de raisin doux pétillant"],
    transformation:"L'eau pétillante citronnelle devient un Tokaji doux, vin hongrois légendaire des rois.",
    etapes:[
      "Refroidissez 10 cl de Tokaji (ou de jus de raisin doux pétillant).",
      "Servez en verre à vin blanc, à 10°C."
    ]
  }
},
e14:{
  pays:"Japon", drapeau:"🇯🇵",
  intro:"Au Japon, la tarte au citron meringuée se décline souvent au matcha : meringue verte, moins sucrée, texture plus aérienne. On garde la tarte, on ajoute juste le matcha.",
  plat:{
    ajouts:["1 c. à s. de matcha (dans la meringue)","1 c. à c. de matcha (pour saupoudrer)"],
    transformation:"La tarte reste identique : crème au citron, pâte sablée. On ajoute simplement du matcha tamisé dans la meringue italienne et un voile de matcha sur le dessus au moment de servir.",
    etapes:[
      "Crème au citron : préparez-la comme d'habitude, garnissez le fond de tarte.",
      "Meringue italienne : préparez-la comme d'habitude, mais juste avant de pocher, incorporez 1 c. à s. de matcha tamisé. La meringue doit être vert pâle, pas vert foncé.",
      "Cuisson et caramélisation : pochez la meringue, passez brièvement au chalumeau — mais très légèrement, pour ne pas brûler le matcha.",
      "Service : saupoudrez d'un voile de matcha tamisé au moment de servir. Le contraste vert/jaune du citron est magnifique."
    ],
    astuce:"Tamisez toujours le matcha avant de l'incorporer : sinon il forme des grumeaux dans la meringue."
  },
  boisson:{
    ajouts:["Thé hōjicha (thé vert grillé)"],
    transformation:"Le limoncello devient un hōjicha glacé, thé vert grillé aux notes torréfiées.",
    etapes:[
      "Infusez 2 c. à c. de hōjicha dans 30 cl d'eau à 90°C, 3 min.",
      "Filtrez, refroidissez 1 h.",
      "Servez sur glaçons."
    ]
  }
},
e15:{
  pays:"Italie", drapeau:"🇮🇹",
  intro:"En Italie, on sert volontiers la panna cotta avec un trait d'huile d'olive fruitée et une pincée de fleur de sel. Un geste simple qui transforme le dessert.",
  plat:{
    ajouts:["Huile d'olive extra vierge fruitée (pour servir)","Fleur de sel"],
    transformation:"La panna cotta coco-mangue reste identique. On ajoute simplement, au moment de servir, un trait d'huile d'olive fruitée sur le coulis de mangue et une pincée de fleur de sel. L'accord sucré-salé est saisissant.",
    etapes:[
      "Panna cotta : préparez-la comme d'habitude, en verrines, et laissez prendre 4 heures au frais.",
      "Coulis : préparez le coulis de mangue comme d'habitude, mais ne le versez pas encore.",
      "Service : au moment de servir, versez le coulis sur la panna cotta, puis ajoutez un trait d'huile d'olive fruitée et 2 ou 3 grains de fleur de sel.",
      "Dégustation : mélangez toutes les couches à la cuillère — c'est là que l'accord fonctionne."
    ],
    astuce:"L'huile d'olive doit être fruitée (première pression à froid, goût vert). Une huile douce ou ancienne ne produit pas le même effet."
  },
  boisson:{
    ajouts:["1 boule de glace vanille","1 espresso serré"],
    transformation:"L'eau de coco fraîche devient un affogato : une boule de glace vanille noyée dans un espresso brûlant.",
    etapes:[
      "Préparez un espresso serré.",
      "Déposez une boule de glace vanille dans une tasse.",
      "Versez l'espresso brûlant sur la glace.",
      "Servez aussitôt, avec une petite cuillère."
    ]
  }
},
e16:{
  pays:"États-Unis", drapeau:"🇺🇸",
  intro:"Le 'pie' américain se sert toujours avec une boule de glace vanille — c'est le fameux 'à la mode'. On garde le clafoutis abricots-romarin, on ajoute juste cette boule de glace.",
  plat:{
    ajouts:["1 boule de glace vanille (par portion)","1 c. à s. de sucre roux (pour saupoudrer)"],
    transformation:"Le clafoutis reste identique. On ajoute, juste avant de servir, une boule de glace vanille sur chaque portion tiède, et un voile de sucre roux caramélisé au chalumeau.",
    etapes:[
      "Clafoutis : préparez-le comme d'habitude, laissez tiédir.",
      "Sucre caramélisé : saupoudrez d'un voile de sucre roux et passez brièvement au chalumeau — le sucre doit caraméliser en surface sans brûler le clafoutis.",
      "Service : posez une belle boule de glace vanille au centre de chaque portion tiède.",
      "Dégustation : le contraste entre la glace froide et le clafoutis tiède caramélisé fait tout le dessert."
    ],
    astuce:"Servez aussitôt après avoir posé la glace : elle commence à fondre et crée une sauce naturelle sur le clafoutis."
  },
  boisson:{
    ajouts:["Root beer (soda américain)","1 boule de glace vanille"],
    transformation:"Le thé vert glacé devient un root beer float, dessert-boisson culte des diners américains.",
    etapes:[
      "Déposez une boule de glace vanille dans un grand verre.",
      "Versez 20 cl de root beer (soda) très froide.",
      "Servez aussitôt avec une paille et une cuillère."
    ]
  }
},
e17:{
  pays:"Thaïlande", drapeau:"🇹🇭",
  intro:"En Thaïlande, le parfum de pandan (feuille de pandanus) est partout. On garde la glace vanille-pistaches, on y ajoute juste une note végétale de pandan.",
  plat:{
    ajouts:["2 feuilles de pandan (ou 1 c. à c. d'extrait de pandan)","1 c. à s. de sucre de palme"],
    transformation:"La glace vanille-pistaches reste identique. On infuse simplement les feuilles de pandan dans la crème anglaise, à la place d'une partie de la vanille. Le parfum est végétal, doux, vanillé — un pont entre deux traditions.",
    etapes:[
      "Crème anglaise : préparez-la comme d'habitude, mais ajoutez 2 feuilles de pandan nouées avec la gousse de vanille. Laissez infuser 10 minutes.",
      "Filtrage : retirez la vanille et le pandan avant de verser sur les jaunes.",
      "Turbinage : turbinez comme d'habitude, incorporez les pistaches grillées en fin de turbinage.",
      "Service : servez avec un petit morceau de feuille de pandan fraîche en décor, si vous en avez."
    ],
    astuce:"Le pandan frais se trouve en épicerie asiatique (rayon surgelés). L'extrait fonctionne bien, mais 2 fois moins puissant que les feuilles fraîches."
  },
  boisson:{
    ajouts:["Thé thaï (cha yen)","Lait concentré sucré","Lait évaporé"],
    transformation:"L'espresso serré devient un cha yen glacé, thé thaï sucré et crémeux.",
    etapes:[
      "Infusez 2 c. à s. de thé thaï dans 20 cl d'eau frémissante, 5 min.",
      "Filtrez. Ajoutez 2 c. à s. de lait concentré sucré.",
      "Versez sur glaçons, ajoutez un nuage de lait évaporé."
    ]
  }
},
e18:{
  pays:"États-Unis (Floride)", drapeau:"🇺🇸",
  intro:"En Floride, la 'key lime pie' est le dessert officiel de l'État : crème de citron vert sur base sablée. On transforme les tartelettes myrtilles en version Floride : citron vert et myrtille.",
  plat:{
    ajouts:["4 jaunes d'œufs","1 boîte de lait concentré sucré (400 g)","10 cl de jus de citron vert"],
    transformation:"Les tartelettes restent identiques (pâte sablée précuite). On remplace la garniture myrtille par une crème au lait concentré sucré et citron vert, sur laquelle on dispose quelques myrtilles fraîches en décor.",
    etapes:[
      "Fonds de tartelette : préparez-les comme d'habitude (pâte sablée précuite à blanc).",
      "Crème key lime : fouettez 4 jaunes d'œufs avec 1 boîte de lait concentré sucré (400 g), 10 cl de jus de citron vert et les zestes.",
      "Cuisson : versez dans les fonds précuits, cuisez 15 min à 160°C. Le centre doit rester légèrement tremblant.",
      "Décor : laissez refroidir, réservez 4 h au frais, puis disposez quelques myrtilles fraîches sur le dessus au moment de servir."
    ],
    astuce:"Le lait concentré sucré remplace totalement le sucre : c'est la signature de la key lime pie. Inutile d'ajouter quoi que ce soit d'autre."
  },
  boisson:{
    ajouts:["Menthe fraîche","Citron vert","Eau pétillante"],
    transformation:"Le thé noir glacé au citron vert devient un mojito sans alcool, très frais et herbacé.",
    etapes:[
      "Pilez 5 feuilles de menthe avec 1 c. à c. de sucre.",
      "Ajoutez le jus d'1 citron vert.",
      "Remplissez de glaçons, complétez avec 15 cl d'eau pétillante."
    ]
  }
},

/* ══════════════ AUTOMNE ══════════════ */
a19:{
  pays:"Italie", drapeau:"🇮🇹",
  intro:"En Toscane, on termine les repas par un trait d'huile d'olive fruitée et une pincée de fleur de sel sur les desserts. La Tatin reste telle quelle — on lui ajoute juste ces deux gestes, qui réveillent le caramel.",
  plat:{
    ajouts:["1 branche de romarin frais","Huile d'olive extra vierge de Toscane (pour servir)","Fleur de sel"],
    transformation:"La Tatin garde sa structure : pommes caramélisées, fenouil confit, pâte croustillante. On ajoute un brin de romarin dans le caramel à la cuisson, et au moment de servir, un trait d'huile d'olive et une pincée de fleur de sel.",
    etapes:[
      "Caramel : préparez le caramel comme d'habitude. Ajoutez 1 branche de romarin frais dans le caramel dès qu'il est prêt, laissez infuser 2 minutes hors du feu, retirez-la.",
      "Cuisson et retournement : préparez la Tatin comme d'habitude.",
      "Service : au moment de servir chaque part, ajoutez un trait d'huile d'olive fruitée sur la Tatin chaude.",
      "Finir : terminez par 2 ou 3 grains de fleur de sel — le contraste sel/caramel est saisissant.",
      "Dégustation : servez avec une boule de glace vanille ou une crème fraîche épaisse pour équilibrer."
    ],
    astuce:"L'huile d'olive doit être fruitée (première pression à froid, goût vert). Une huile douce ou ancienne ne produit pas le même effet."
  },
  boisson:{
    ajouts:["Espresso serré"],
    transformation:"Le cidre brut devient un espresso, à l'italienne, pour prolonger la Tatin.",
    etapes:[
      "Préparez un espresso serré.",
      "Versez dans une petite tasse préchauffée.",
      "Servez aussitôt, sans sucre."
    ]
  }
},
a20:{
  pays:"Mexique", drapeau:"🇲🇽",
  intro:"Au Mexique, le chocolat et le piment doux forment un duo ancestral. L'éclair garde sa structure, on pimente juste sa crème et on saupoudre d'un voile de cacao.",
  plat:{
    ajouts:["1 pincée de chile en polvo (piment doux mexicain)","1 c. à c. de cacao amer en poudre","1 pincée de cannelle"],
    transformation:"L'éclair au potimarron reste identique. On ajoute juste une pincée de chile en polvo dans la crème de potimarron, et au moment de servir, un voile de cacao amer et une pincée de cannelle.",
    etapes:[
      "Crème potimarron : préparez-la comme d'habitude, avec les épices douces. Ajoutez 1 pincée de chile en polvo — très peu, c'est puissant. Goûtez : le piment doit réveiller, pas dominer.",
      "Garnissage : garnissez les éclairs à la poche comme d'habitude.",
      "Décor : au moment de servir, saupoudrez d'un voile de cacao amer tamisé et d'une pincée de cannelle.",
      "Dégustation : les premières bouchées sont douces, la note pimentée arrive en fin de bouche. C'est ce contraste qui plaît au Mexique."
    ],
    astuce:"Le chile en polvo mexicain (mélange piment doux, sel, zeste de citron) se trouve en épicerie latine. Sinon, un mélange paprika doux + pincée de sel + zeste de citron fonctionne."
  },
  boisson:{
    ajouts:["1 carré de chocolat noir 70%","1 pincée de piment doux"],
    transformation:"Le chai latte devient un chocolat chaud épicé à la mexicaine : lait, chocolat noir, piment doux.",
    etapes:[
      "Faites chauffer 20 cl de lait (ou lait d'amande) avec 1 carré de chocolat noir 70% en morceaux.",
      "Fouettez jusqu'à ce que le chocolat soit fondu. Ajoutez 1 pincée de piment doux.",
      "Servez bien chaud en tasse, avec un bâton de cannelle en décor."
    ]
  }
},
a21:{
  pays:"Japon", drapeau:"🇯🇵",
  intro:"Au Japon, le matcha et la poudre de soja grillée (kinako) sont les partenaires naturels des gâteaux rustiques. Le moelleux garde sa mie dense, on le glace juste au matcha.",
  plat:{
    ajouts:["1 c. à s. de matcha en poudre","100 g de sucre glace","1 c. à c. de kinako (poudre de soja grillée)","Quelques gouttes d'eau"],
    transformation:"Le moelleux châtaigne-poire reste identique. On prépare juste un glaçage au matcha (mélange matcha + sucre glace + eau) à verser sur le gâteau refroidi, et on saupoudre d'un voile de kinako au moment de servir.",
    etapes:[
      "Moelleux : préparez-le comme d'habitude, laissez complètement refroidir sur une grille.",
      "Glaçage matcha : mélangez 1 c. à s. de matcha tamisé avec 100 g de sucre glace. Ajoutez quelques gouttes d'eau pour obtenir un glaçage épais, brillant, qui coule lentement.",
      "Application : versez le glaçage sur le moelleux refroidi, lissez à la spatule. Laissez prendre 30 minutes à température ambiante.",
      "Décor : au moment de servir, saupoudrez d'un voile de kinako tamisé et de quelques éclats de marrons glacés si vous en avez."
    ],
    astuce:"Le glaçage matcha doit être épais : si vous le faites trop liquide, il coule et détrempe le gâteau. Ajoutez l'eau goutte par goutte."
  },
  boisson:{
    ajouts:["1 c. à c. de matcha de qualité cérémonie"],
    transformation:"Le thé noir aux agrumes devient un matcha cérémonial, en écho au glaçage vert.",
    etapes:[
      "Tamisez 1 c. à c. de matcha dans un bol.",
      "Versez 7 cl d'eau à 80°C, fouettez au chasen en zigzag rapide, 15 secondes.",
      "Buvez aussitôt, sans sucre — le contraste végétal équilibre le sucré du glaçage."
    ]
  }
},
a22:{
  pays:"Corée du Sud", drapeau:"🇰🇷",
  intro:"En Corée, la poudre de soja grillée (injeolmi) et le yuja (cousin coréen du yuzu) parfument les desserts les plus délicats. La tartelette garde sa structure, on remplace juste le sésame noir par ces touches coréennes.",
  plat:{
    ajouts:["2 c. à s. d'injeolmi (poudre de soja grillée)","1 c. à c. de yuja confit (ou yuzu confit)","1 c. à c. de miel"],
    transformation:"La tartelette kaki-vanille reste identique. On remplace le sésame noir par de l'injeolmi (poudre de soja grillée), torréfiée à sec 2 minutes avant utilisation. On ajoute un trait de yuja confit dilué dans un peu d'eau, en glaçage très fin.",
    etapes:[
      "Tartelette : préparez-la comme d'habitude, avec la crème kakis, œufs, vanille.",
      "Injeolmi : torréfiez 2 c. à s. d'injeolmi à sec dans une poêle, 2 minutes, en remuant constamment. Elle doit embaumer la noisette grillée. Réservez.",
      "Glaçage yuja : délayez 1 c. à c. de yuja confit avec 1 c. à c. de miel et 1 c. à c. d'eau tiède. Badigeonnez la tartelette tiède au pinceau.",
      "Service : au moment de servir, saupoudrez généreusement d'injeolmi torréfié, comme une neige pâle. Le contraste entre la texture soyeuse du kaki et le croustillant de l'injeolmi est superbe."
    ],
    astuce:"L'injeolmi se trouve en épicerie coréenne. À défaut, la poudre de soja grillée japonaise (kinako) fonctionne presque aussi bien — le parfum sera légèrement moins prononcé."
  },
  boisson:{
    ajouts:["Thé vert coréen (nokcha)","1 tranche de gingembre frais"],
    transformation:"L'infusion de cannelle devient un nokcha coréen, thé vert plus végétal et plus vif.",
    etapes:[
      "Faites chauffer 30 cl d'eau à 80°C — jamais plus, le nokcha est fragile.",
      "Infusez 1 c. à c. de nokcha avec 1 tranche de gingembre frais, 3 minutes à couvert.",
      "Filtrez, servez chaud en petites tasses."
    ]
  }
},
a23:{
  pays:"Royaume-Uni", drapeau:"🇬🇧",
  intro:"En Angleterre, le crumble se sert toujours avec une custard — une crème anglaise épaisse et vanillée. Le crumble garde sa texture, on ajoute juste cette crème à la vanille, en nappe.",
  plat:{
    ajouts:["25 cl de lait entier","4 jaunes d'œufs","60 g de sucre","1 c. à s. de fécule","1 gousse de vanille"],
    transformation:"Le crumble pommes-noisettes reste identique. On ajoute une custard anglaise, plus épaisse que la crème anglaise française, à verser en nappe sur chaque portion chaude.",
    etapes:[
      "Crumble : préparez-le comme d'habitude, cuisez 30 min à 180°C.",
      "Custard : chauffez 25 cl de lait avec 1 gousse de vanille fendue et grattée. Laissez infuser 10 minutes, retirez la gousse.",
      "Fouettez 4 jaunes avec 60 g de sucre et 1 c. à s. de fécule. Versez le lait chaud en filet, en fouettant constamment. Reversez dans la casserole et cuisez à feu doux jusqu'à épaississement.",
      "Service : servez le crumble chaud, la custard versée en nappe sur chaque portion, avec une pincée de muscade râpée."
    ],
    astuce:"La fécule remplace une partie du jaune : c'est ce qui donne cette texture nappante et veloutée, typique de la custard anglaise."
  },
  boisson:{
    ajouts:["Thé Earl Grey","Lait","Sucre (facultatif)"],
    transformation:"Le cidre doux devient un Earl Grey tea, thé anglais à la bergamote, à prendre avec un nuage de lait.",
    etapes:[
      "Infusez 1 sachet d'Earl Grey dans 20 cl d'eau frémissante, 4 min.",
      "Retirez le sachet. Ajoutez un nuage de lait chaud.",
      "Servez en tasse avec un sucre (facultatif)."
    ]
  }
},
a24:{
  pays:"Japon", drapeau:"🇯🇵",
  intro:"Au Japon, le kinako (poudre de soja grillée) et le miso caramélisé transforment les desserts les plus simples. La verrine garde ses couches, on ajoute juste un trait de miso caramélisé — la signature japonaise par excellence.",
  plat:{
    ajouts:["1 c. à s. de miso blanc (shiro miso)","1 c. à s. de miel","1 c. à s. de kinako (poudre de soja grillée)","Graines de sésame noir grillées"],
    transformation:"La verrine patate douce-vanille-sarrasin reste identique dans ses couches. On remplace juste la moitié du sucre glace par 1 c. à s. de kinako (poudre de soja grillée). Au moment de servir, on ajoute un trait de miso caramélisé (miso + miel) et un peu de sésame noir grillé.",
    etapes:[
      "Kinako dans la crème : préparez la crème de patate douce comme d'habitude, mais remplacez la moitié du sucre glace par 1 c. à s. de kinako torréfié. Goûtez : la note doit être légèrement grillée.",
      "Miso caramélisé : mélangez 1 c. à s. de miso blanc avec 1 c. à s. de miel. Délayez avec 1 c. à c. d'eau tiède pour obtenir un caramel souple.",
      "Montage : montez les verrines comme d'habitude (crème, croustillant sarrasin, crème).",
      "Service : au moment de servir, ajoutez sur le dessus un fin trait de miso caramélisé et quelques graines de sésame noir grillé.",
      "Dégustation : le miso caramélisé donne une note umami-surrée qui prolonge la vanille et le sarrasin. C'est saisissant et très japonais."
    ],
    astuce:"Le miso blanc (shiro miso) est le plus doux et le plus sucré — parfait pour cet accord. Un miso rouge serait trop puissant."
  },
  boisson:{
    ajouts:["Thé vert sencha","1 c. à c. de kinako"],
    transformation:"Le chai glacé devient un sencha accompagné de kinako, dans l'esprit japonais.",
    etapes:[
      "Infusez 1 c. à c. de sencha dans 30 cl d'eau à 70°C, 2 minutes.",
      "Filtrez, refroidissez ou servez chaud selon la saison.",
      "Au moment de servir, saupoudrez d'un voile de kinako tamisé (facultatif)."
    ]
  }
},
a25:{
  pays:"Corée du Sud", drapeau:"🇰🇷",
  intro:"En Corée, on utilise le yuja (le cousin coréen du yuzu) pour des thés et des confitures, et l'injeolmi — poudre de soja grillée — saupoudre les desserts les plus délicats. On garde le cheesecake tel quel, on y ajoute juste ces deux signatures coréennes.",
  plat:{
    ajouts:["2 c. à s. d'injeolmi (poudre de soja torréfiée)","100 g de pâte de haricots rouges (anko)","1 c. à c. de yuja confit (ou yuzu confit)"],
    transformation:"Le cheesecake garde sa structure : biscuit sarrasin, appareil yuzu, coulis gingembre. On remplace la moitié de la farine de sarrasin par de l'injeolmi (poudre de soja grillée, signature coréenne). On ajoute un cordon discret de pâte de haricots rouges (pat) entre la base et l'appareil. Le coulis devient gingembre-yuja, avec un peu de yuja confit pour l'intensité.",
    etapes:[
      "Biscuit revisité : dans la base, remplacez la moitié de la farine de sarrasin torréfiée par de l'injeolmi (poudre de soja grillée, à trouver en épicerie coréenne). Torréfiez-la à sec 2 minutes dans la poêle avant de l'incorporer : elle doit embaumer la noisette grillée.",
      "Cordon de pat : avant de verser l'appareil, pochez un cordon fin de pâte de haricots rouges (anko) sur la base biscuitée, en cercle, à 2 cm du bord. Le pat va fondre légèrement au contact de la crème et créer un cœur sucré-salé caractéristique des desserts coréens.",
      "Coulis gingembre-yuja : préparez votre coulis comme d'habitude, mais remplacez le jus de citron par 1 c. à c. de yuja confit coréen (à défaut, du yuzu confit japonais). Le coulis devient plus intense et plus floral.",
      "Finition : au moment de servir, saupoudrez un voile discret d'injeolmi torréfié sur le dessus, comme une neige pâle, et ajoutez un petit morceau de yuja confit en décor.",
      "Dégustation : le contraste entre l'appareil aérien au yuzu, le cœur fondant de pat, et le croquant du biscuit à l'injeolmi évoque immédiatement les desserts de Séoul. Servez avec un thé vert glacé coréen (nokcha) pour prolonger l'accord."
    ],
    astuce:"L'injeolmi se trouve facilement en épicerie coréenne. Si vous n'en trouvez pas, de la poudre de soja grillée japonaise (kinako) fonctionne presque aussi bien — le parfum sera légèrement moins prononcé."
  },
  boisson:{
    ajouts:["Thé vert coréen (nokcha)","1 c. à c. de miel liquide","1 tranche de gingembre frais"],
    transformation:"Le hōjicha japonais devient un nokcha coréen — thé vert plus végétal et plus vif, très utilisé à Séoul. On ajoute un trait de miel et une tranche de gingembre pour prolonger le parfum du coulis.",
    etapes:[
      "Faites chauffer 30 cl d'eau à 80°C — jamais plus, le nokcha est fragile.",
      "Infusez 1 c. à c. de feuilles de nokcha avec 1 tranche de gingembre frais pendant 3 minutes à couvert.",
      "Filtrez, ajoutez 1 c. à c. de miel liquide. Mélangez bien.",
      "Servez chaud en petites tasses, ou glacé sur des glaçons pour un contraste avec le cheesecake."
    ]
  }
},
a26:{
  pays:"Italie", drapeau:"🇮🇹",
  intro:"En Italie, on sert parfois le fondant au chocolat avec un trait d'huile d'olive fruitée et une pincée de fleur de sel — un geste toscan qui révèle le cacao. Le fondant reste identique.",
  plat:{
    ajouts:["Huile d'olive extra vierge fruitée (pour servir)","Fleur de sel","1 brin de romarin frais"],
    transformation:"Le fondant chocolat-châtaigne reste identique. On ajoute juste, au moment de servir, un trait d'huile d'olive fruitée, une pincée de fleur de sel et un brin de romarin frais en décor.",
    etapes:[
      "Fondant : préparez-le comme d'habitude, avec la crème de marrons au cœur. Sortez-le du four dès que le centre tremble encore.",
      "Service : démoulez sur une assiette tiède.",
      "Finir : au moment de servir, ajoutez un trait d'huile d'olive fruitée, une pincée de fleur de sel et un brin de romarin frais.",
      "Dégustation : le contraste chaud/froid (si vous ajoutez une boule de glace vanille) et le contraste sel/cacao réveillent tout le dessert."
    ],
    astuce:"L'huile d'olive doit être fruitée (première pression à froid, goût vert). Elle doit être ajoutée au moment de servir — jamais cuite avec le fondant."
  },
  boisson:{
    ajouts:["Espresso serré"],
    transformation:"L'espresso serré devient un ristretto, encore plus concentré, en contraste avec le fondant.",
    etapes:[
      "Préparez un ristretto : extraction plus courte (20 secondes au lieu de 25).",
      "Le café est plus sirupeux, plus intense.",
      "Servez en petite tasse préchauffée."
    ]
  }
},
a27:{
  pays:"Italie", drapeau:"🇮🇹",
  intro:"Dans le Piémont, les noisettes Tonda Gentile sont une fierté régionale, et le Barolo accompagne les desserts au chocolat. La tarte garde sa structure, on remplace juste les noix par des noisettes du Piémont et on ajoute un trait de Barolo.",
  plat:{
    ajouts:["Noisettes Tonda Gentile (ou noisettes de qualité)","1 c. à s. de Barolo (facultatif)","1 c. à c. de cacao amer pour saupoudrer"],
    transformation:"La tarte cacao-poire-noix reste identique dans sa structure. On remplace juste les noix par des noisettes Tonda Gentile du Piémont, et on ajoute 1 c. à s. de Barolo dans le caramel (au moment du déglaçage à la crème).",
    etapes:[
      "Caramel noisettes : préparez le caramel comme d'habitude. Au moment du déglaçage à la crème chaude, ajoutez 1 c. à s. de Barolo. Mélangez.",
      "Noisettes : torréfiez 80 g de noisettes Tonda Gentile 10 minutes au four à 160°C. Frottez-les dans un torchon pour retirer la peau. Concassez-les au couteau et enrobez-les de caramel.",
      "Garniture : préparez la tarte comme d'habitude, en remplaçant les noix par les noisettes caramélisées.",
      "Service : au moment de servir, saupoudrez d'un voile de cacao amer tamisé.",
      "Dégustation : la noisette Tonda Gentile a une saveur plus douce et plus fine que la noix. L'accord avec la poire Williams et le cacao est classique en Italie."
    ],
    astuce:"Le Barolo est facultatif — la tarte est délicieuse sans. Mais il apporte une note vineuse qui équilibre le sucré du caramel. Vous pouvez le remplacer par un autre vin rouge corsé."
  },
  boisson:{
    ajouts:["Barolo (ou autre vin rouge corsé)","Glaçons"],
    transformation:"Le café filtre devient un Barolo servi frais, en accord avec le Piémont et le chocolat.",
    etapes:[
      "Ouvrez le Barolo et laissez-le respirer 30 minutes.",
      "Servez-le légèrement frais (16-18°C) dans un verre à vin, à côté de la tarte.",
      "Le vin doit être jeune — un Barolo trop vieux dominerait la tarte."
    ]
  }
},

/* ═══════════════════════════════════════════════════════
   RENDU DU CONTENU « MONDE »
   ═══════════════════════════════════════════════════════ */
function renderMondeHTML(monde, m, type){
  var isPlat = type === 'plat';
  var html = '';

  html += '<div class="monde-hero">';
  html += '<span class="mh-drapeau">' + monde.drapeau + '</span>';
  html += '<div class="mh-pays">' + esc(monde.pays) + '</div>';
  html += '<div class="mh-nom">' + esc(m.nom) + '</div>';
  html += '<div class="mh-intro">' + esc(monde.intro) + '</div>';
  html += '</div>';

  if(m.ajouts && m.ajouts.length){
    html += '<div class="block"><div class="block-title">Ajouts nécessaires</div><ul class="monde-ajouts">';
    m.ajouts.forEach(function(a){ html += '<li>' + esc(a) + '</li>'; });
    html += '</ul></div>';
  }

  if(m.transformation){
    html += '<div class="block"><div class="block-title">La transformation</div><div class="monde-transfo">' + esc(m.transformation) + '</div></div>';
  }

  if(m.etapes && m.etapes.length){
    html += '<div class="block"><div class="block-title">' + (isPlat ? 'Préparation à la manière de' : 'Service à la manière de') + ' ' + esc(monde.pays) + '</div><ol class="steps">';
    m.etapes.forEach(function(s){ html += '<li>' + esc(s) + '</li>'; });
    html += '</ol></div>';
  }

  if(m.astuce){
    html += '<div class="monde-astuce"><span class="ma-label">Secret du chef</span>' + esc(m.astuce) + '</div>';
  }

  return html;
}

/* ═══════════════════════════════════════════════════════
   INJECTION : patch openRecipe
   ═══════════════════════════════════════════════════════ */
(function(){
  var _openRecipe = window.openRecipe;
  if(typeof _openRecipe !== 'function'){
    console.warn('⚠️ openRecipe introuvable — patch Monde non armé');
    return;
  }

  window.openRecipe = function(d, saison, type){
    _openRecipe(d, saison, type);

    setTimeout(function(){
      var scr = document.getElementById('screen-recipe');
      if(!scr) return;

      var monde = window.MONDE[d.id];
      if(!monde) return;             // pas de transformation pour ce duo
      var m = monde[type];
      if(!m) return;                  // pas de transformation pour ce type

      var mondeHTML = renderMondeHTML(monde, m, type);

      /* Cas 1 : les onglets existent déjà (patch Gastro présent) */
      var existingTabs = scr.querySelector('.recipe-tabs');
      if(existingTabs){
        // Ajouter l'onglet s'il n'existe pas
        if(!existingTabs.querySelector('[data-tab="monde"]')){
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tab-btn';
          btn.dataset.tab = 'monde';
          btn.textContent = 'Monde';
          existingTabs.appendChild(btn);

          // Ajouter le contenu
          var content = document.createElement('div');
          content.className = 'recipe-content monde';
          content.innerHTML = mondeHTML;
          scr.appendChild(content);
        }
        return;
      }

      /* Cas 2 : pas d'onglets — on les crée (Recette + Monde) */
      var children = Array.prototype.slice.call(scr.children);
      var standard = document.createElement('div');
      standard.className = 'recipe-content standard active';
      children.forEach(function(c){ standard.appendChild(c); });
      scr.appendChild(standard);

      var content = document.createElement('div');
      content.className = 'recipe-content monde';
      content.innerHTML = mondeHTML;
      scr.appendChild(content);

      var tabs = document.createElement('div');
      tabs.className = 'recipe-tabs';
      tabs.innerHTML =
        '<button type="button" class="tab-btn active" data-tab="standard">Recette</button>' +
        '<button type="button" class="tab-btn" data-tab="monde">Monde</button>';
      scr.insertBefore(tabs, scr.firstChild);

      // Handler pour les onglets
      tabs.addEventListener('click', function(e){
        var b = e.target.closest('[data-tab]');
        if(!b) return;
        e.preventDefault();
        e.stopPropagation();
        var tab = b.dataset.tab;
        tabs.querySelectorAll('.tab-btn').forEach(function(x){
          x.classList.toggle('active', x === b);
        });
        scr.querySelectorAll('.recipe-content').forEach(function(c){
          c.classList.toggle('active', c.classList.contains(tab));
        });
        window.scrollTo(0, 0);
      });
    }, 80); // après le patch Gastro (40ms)
  };

  console.log('✅ Patch Autour du Monde armé — 36 transformations');
})();
</script>
