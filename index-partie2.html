<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C3A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sweet &amp; Sip">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<title>Sweet &amp; Sip — Les 4 Saisons Sucrées</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Karla:wght@400;500;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --brown:#5C3A1E;
  --brown-deep:#3E2612;
  --fuchsia:#C2185B;
  --fuchsia-deep:#8E0E3F;
  --fuchsia-soft:#F4D7E0;
  --matcha:#7B9B5E;
  --matcha-deep:#5A7543;
  --matcha-soft:#E2EBD3;
  --gold:#B08D57;
  --cream:#FDF9F2;
  --cream-warm:#F7EFE2;
  --ink:#2A1F15;
  --ink-soft:#6B5A4A;
  --line:#EADCC8;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Karla',-apple-system,sans-serif
}
body{font-family:var(--sans);background:#EFE6D6;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:1rem}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--cream);display:flex;flex-direction:column;box-shadow:0 0 60px rgba(92,58,30,.08);position:relative}

/* ═══ HEADER ═══ */
header{position:sticky;top:0;z-index:20;background:rgba(253,249,242,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 20px 12px;text-align:center}
.menu-btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;color:var(--brown);z-index:22;padding:0}
.menu-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round}
.brand{display:flex;align-items:baseline;justify-content:center;gap:6px;line-height:1}
.brand-v{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.16em;color:var(--brown)}
.brand-amp{font-family:var(--serif);font-style:italic;font-size:22px;font-weight:500;color:var(--fuchsia)}
.brand-p{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.16em;color:var(--brown)}
.brand-rule{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.brand-rule .rl{height:1px;width:22px;background:var(--gold);opacity:.55}
.brand-rule .rd{width:3px;height:3px;background:var(--fuchsia);border-radius:50%}
.brand-sub{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink-soft);margin-top:6px}

/* ═══ MAIN ═══ */
main{flex:1;padding:24px 20px 48px}
.screen{display:none}
.screen.active{display:block}
.eyebrow{font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--fuchsia);text-align:center;font-weight:700}
.hero{font-family:var(--serif);font-size:28px;line-height:1.22;text-align:center;margin:12px 0 26px;font-weight:500;color:var(--brown-deep)}
.hero em{color:var(--fuchsia);font-style:italic}
.search{margin:0 0 18px}
.search input{width:100%;font-family:var(--serif);font-size:17px;padding:14px 20px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink-soft);font-style:italic}

/* ═══ SEASONS ═══ */
.seasons{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.season-card{position:relative;border-radius:14px;padding:0;cursor:pointer;text-align:left;overflow:hidden;font-family:inherit;background:#fff;border:1px solid var(--line)}
.sc-inner{display:flex;align-items:stretch;min-height:112px}
.sc-stripe{width:6px;flex-shrink:0}
.sc-body{flex:1;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.sc-text{display:flex;flex-direction:column}
.sc-emoji{font-size:11px;letter-spacing:.22em;color:var(--fuchsia);text-transform:uppercase;font-weight:700}
.sc-name{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.05;color:var(--brown-deep);margin-top:6px}
.sc-tag{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-soft);margin-top:4px}
.sc-count{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sc-num{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brown);line-height:1}
.sc-lab{font-size:8.5px;letter-spacing:.28em;color:var(--ink-soft);text-transform:uppercase;font-weight:600}

/* ═══ SEASON HEADER ═══ */
.season-header{position:relative;padding:26px 22px;border-radius:14px;margin-bottom:20px;background:#fff;border:1px solid var(--line);overflow:hidden}
.season-header .sh-stripe{position:absolute;left:0;top:0;bottom:0;width:5px}
.season-header .sh-tag{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--fuchsia);margin-top:6px}
.season-header .sh-name{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.05;color:var(--brown-deep);margin-top:8px}
.season-header .sh-intro{font-size:13px;line-height:1.7;color:var(--ink-soft);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* ═══ LIST ═══ */
.duo-list{display:flex;flex-direction:column;gap:0}
.duo-item{display:flex;align-items:center;gap:16px;padding:18px 4px;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;font-family:inherit;width:100%}
.duo-item .di-num{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--fuchsia);width:36px;flex-shrink:0}
.duo-item .di-body{flex:1;display:flex;flex-direction:column;gap:3px}
.duo-item .di-title{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--brown-deep);line-height:1.25}
.duo-item .di-boisson{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink-soft);line-height:1.3}
.duo-item .di-arrow{color:var(--fuchsia);font-size:14px;flex-shrink:0}

/* ═══ DUO HERO ═══ */
.duo-hero{text-align:center;padding:14px 0 28px;border-bottom:1px solid var(--line);margin-bottom:26px}
.duo-hero .dh-num{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--fuchsia)}
.duo-hero .dh-accord{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.3;color:var(--brown-deep);margin-top:12px;font-style:italic}
.duo-hero .dh-saison{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-soft);margin-top:10px;font-weight:600}

/* ═══ RECIPE CARDS ═══ */
.recipe-card{display:block;width:100%;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px;background:#fff;cursor:pointer;text-align:left;font-family:inherit}
.recipe-card .rc-tag{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--fuchsia);font-weight:700;margin-bottom:10px}
.recipe-card .rc-title{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.22;color:var(--brown-deep);display:block}
.recipe-card .rc-meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:10px;display:block}

/* ═══ ACCORD BOX ═══ */
.vin-box{border:1px solid var(--matcha);border-radius:14px;padding:20px 22px;margin-top:22px;background:linear-gradient(135deg,var(--matcha-soft) 0%,#F0F5E4 100%);position:relative;overflow:hidden}
.vb-tag{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--matcha-deep);font-weight:700;position:relative;display:flex;align-items:center;gap:8px}
.vb-tag svg{width:14px;height:14px;stroke:var(--matcha-deep);fill:none;stroke-width:1.4}
.vb-vin{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--brown-deep);margin-top:10px;line-height:1.4;position:relative}

/* ═══ DETAIL ═══ */
.detail-hero{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.detail-hero .dth-tag{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--fuchsia);font-weight:700}
.detail-hero .dth-title{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15;margin-top:12px;color:var(--brown-deep)}
.detail-hero .dth-tagline{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);margin-top:8px}
.detail-hero .dth-meta{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap}
.detail-hero .dth-meta span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}

/* ═══ BLOCKS ═══ */
.block{margin-bottom:26px}
.block-title{font-size:9px;letter-spacing:.36em;text-transform:uppercase;color:var(--fuchsia);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.block-title::after{content:"";flex:1;height:1px;background:var(--line)}
.ing-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.serv-toggle{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.serv-btn{border:none;background:none;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;padding:6px 13px;border-radius:999px;color:var(--ink-soft);cursor:pointer}
.serv-btn.active{background:var(--brown);color:var(--cream)}
ul.ing{list-style:none}
ul.ing li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px dotted var(--line);font-size:14px;line-height:1.45}
ul.ing li:last-child{border-bottom:none}
ul.ing li b{font-weight:400;color:var(--ink)}
ul.ing li .ing-q{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--fuchsia);white-space:nowrap;text-align:right;font-weight:600}
ol.steps{list-style:none;counter-reset:step}
ol.steps li{counter-increment:step;position:relative;padding:0 0 16px 34px;font-size:14px;line-height:1.72;color:var(--ink);border-bottom:1px dotted var(--line);margin-bottom:16px}
ol.steps li:last-child{border-bottom:none;padding-bottom:0}
ol.steps li::before{content:counter(step);position:absolute;left:0;top:1px;font-family:var(--serif);font-size:15px;font-weight:700;color:var(--fuchsia);width:22px}
.callout{background:#fff;border:1px solid var(--line);border-left:2px solid var(--matcha);border-radius:0 12px 12px 0;padding:16px 18px;font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--brown-deep)}
.alc-note{background:var(--fuchsia-soft);border-left:3px solid var(--fuchsia);border-radius:0 12px 12px 0;padding:16px 18px;font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--brown-deep)}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;padding:14px 22px;border-radius:999px;border:1px solid var(--brown);background:transparent;color:var(--brown);cursor:pointer;font-weight:600}
.btn.back{margin-bottom:22px;padding:10px 18px;font-size:9.5px;letter-spacing:.24em;border-color:var(--line)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.empty{text-align:center;padding:70px 26px;color:var(--ink-soft)}
.empty p{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.55}

/* ═══ LOG ═══ */
.log-item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px}
.log-item .lg-info{flex:1}
.log-item .lg-title{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--brown-deep);display:block;line-height:1.3}
.log-item .lg-date{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;display:block;font-weight:600}
.log-item .lg-del{background:none;border:none;font-size:16px;color:var(--ink-soft);cursor:pointer;padding:6px;opacity:.6}

/* ═══ DRAWER ═══ */
.drawer-overlay{position:fixed;inset:0;background:rgba(62,38,18,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.26s;z-index:70}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:296px;max-width:86vw;background:var(--cream);transform:translateX(-102%);transition:transform .3s;z-index:71;overflow-y:auto;padding:calc(32px + env(safe-area-inset-top,0px)) 0 32px;box-shadow:12px 0 40px rgba(62,38,18,.18)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:0 26px 24px;border-bottom:1px solid var(--line);margin-bottom:14px}
.dr-brand{display:flex;align-items:baseline;gap:4px;line-height:1}
.dr-brand .v,.dr-brand .p{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.16em;color:var(--brown)}
.dr-brand .amp{font-family:var(--serif);font-style:italic;font-size:19px;font-weight:500;color:var(--fuchsia)}
.dr-sub{font-family:var(--serif);font-style:italic;font-size:11.5px;color:var(--ink-soft);margin-top:6px}
.drawer-section{font-size:8.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--fuchsia);padding:16px 26px 8px;font-weight:700}
.drawer-item{display:flex;align-items:center;gap:14px;width:100%;border:none;background:transparent;cursor:pointer;padding:13px 26px;color:var(--ink);font-family:var(--sans);font-size:14px;text-align:left}
.di-icon{font-size:13px;width:20px;text-align:center;color:var(--fuchsia)}
.di-arrow{margin-left:auto;color:var(--fuchsia);font-size:11px;opacity:.6}

/* ═══ ABOUT ═══ */
.about-text{font-family:var(--serif);font-size:15.5px;line-height:1.82;color:var(--ink)}
.about-text p{margin-bottom:18px}
.about-sign{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-soft);text-align:right;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}

/* ═══ TOAST ═══ */
#toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(16px);background:var(--brown);color:var(--cream);padding:12px 22px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.3s;z-index:80;text-align:center;font-family:var(--serif);font-style:italic}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ PHOTO ═══ */
.photo{width:100%;aspect-ratio:4/3;background:var(--cream-warm);border-radius:12px;overflow:hidden;position:relative;margin-bottom:20px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:var(--serif);font-style:italic;font-size:13px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 0}
.pgrid .photo{margin:0;aspect-ratio:1/1;font-size:11px}

/* ═══ FILTERS ═══ */
.filters{display:flex;gap:8px;margin:0 0 18px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.06em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.filter.active{background:var(--brown);color:var(--cream);border-color:var(--brown)}

/* ═══ TIMER ═══ */
#cook-timer{display:none !important}
#multi-timer{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:92vw;background:#3E2612;color:var(--cream);border-radius:14px;padding:8px 12px;font-family:var(--serif);font-size:13px;z-index:99;display:none;box-shadow:0 6px 20px rgba(0,0,0,.35);flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
#multi-timer.visible{display:flex}
#multi-timer .mt-item{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:12.5px;white-space:nowrap;border:none;color:inherit;font-family:inherit}
#multi-timer .mt-item b{color:var(--gold);font-weight:600}
#multi-timer .mt-item.done{background:rgba(194,24,91,.35);animation:mt-pulse 1s infinite}
@keyframes mt-pulse{0%,100%{opacity:1}50%{opacity:.55}}
.timer-inline{display:inline-block;margin-left:6px;background:var(--fuchsia);color:#fff;border:none;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.05em;vertical-align:middle;font-family:var(--sans)}
.timer-inline:hover{opacity:.9}
@media print{.timer-inline{display:none !important}}

/* ═══ TABLET ═══ */
@media(max-width:400px){
  .hero{font-size:25px}
  .sc-name{font-size:23px}
  .dth-title{font-size:24px}
  #fs-controls button{padding:5px 7px;font-size:10px}
  #fs-label{display:none}
}
@media (min-width:640px){
  body{background:#E7DBC5;padding:24px}
  .app{max-width:720px;min-height:calc(100dvh - 48px);border-radius:20px;overflow:hidden}
  .seasons{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .duo-list{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  #duo-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .recipe-card{margin-bottom:0}
  ul.ing{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
  .hero{font-size:32px}
}
@media (min-width:1024px){
  .app{max-width:960px}
  .seasons{grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}
  .duo-list{grid-template-columns:1fr 1fr 1fr;gap:0 22px}
  .drawer{width:340px}
  .hero{font-size:38px}
}

/* ═══ FICHE GASTRO ═══ */
.recipe-tabs{display:flex;gap:0;margin:0 0 22px;border:1px solid var(--line);border-radius:999px;padding:4px;background:#fff}
.recipe-tabs .tab-btn{flex:1;border:none;background:none;font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:12px 10px;border-radius:999px;color:var(--ink-soft);cursor:pointer;transition:.2s}
.recipe-tabs .tab-btn.active{background:var(--fuchsia);color:#fff}
.gastro-intro{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.7;color:var(--brown-deep);padding:18px 20px;background:linear-gradient(135deg,var(--fuchsia-soft) 0%,#FBEAF0 100%);border:1px solid var(--fuchsia);border-radius:12px;margin-bottom:22px}
.gastro-touches{list-style:none;margin:0 0 6px}
.gastro-touches li{padding:10px 0 10px 24px;position:relative;font-size:15.5px;line-height:1.65;border-bottom:1px dotted var(--line)}
.gastro-touches li:last-child{border-bottom:none}
.gastro-touches li::before{content:"✦";position:absolute;left:0;top:10px;color:var(--fuchsia);font-size:12px}
.gastro-dressage{font-family:var(--serif);font-size:16px;line-height:1.75;color:var(--brown-deep);padding:16px 20px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--matcha);border-radius:0 12px 12px 0}
.gastro-accord{font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--brown-deep);padding:18px 22px;background:linear-gradient(135deg,var(--matcha-soft) 0%,#F0F5E4 100%);border:1px solid var(--matcha);border-radius:14px}
.gastro-accord .gacc-label{font-family:var(--sans);font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--matcha-deep);font-weight:700;display:block;margin-bottom:8px}
.gastro-note{font-size:13.5px;line-height:1.65;color:var(--ink-soft);font-family:var(--serif);font-style:italic;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.recipe-content{display:none}
.recipe-content.active{display:block}

/* ═══ IMPRESSION ═══ */
@media print{
  body{background:#fff !important;font-size:12pt;color:#000 !important}
  .app{box-shadow:none;max-width:none;background:#fff}
  header,.drawer,.drawer-overlay,#toast,#cook-timer,
  .btn,.btn-row,.menu-btn,.filters,.pgrid,
  button{display:none !important}
  .screen{display:block !important}

            "Finaliser et servir (1 min) : au moment de servir, parsemez généreusement de sésame grillé — c'est ce qui donne le contraste chaud-froid en bouche et le croquant qui relève la fraise. Servez dans l'heure : au-delà, la pâte ramollit au contact de la crème."

          bienetre:"Le sésame est riche en calcium et en bons lipides ; un dessert frais et digeste.",secret:"Torréfier le sésame à sec juste avant de servir : c'est ce qui donne le contraste chaud-froid en bouche.",allergenes:"Gluten — Œuf — Lait — Sésame — Végétarien",

      {id:"p6",numero:6,
        plat:{titre:"Panna Cotta Citronnelle & Fruits Rouges",tagline:"Une panna cotta parfumée à la citronnelle, sur un coulis de fruits rouges.",temps:"20 min + 4h de froid",kcal:"~280 kcal",
          ing:[["Crème liquide entière","20 cl","40 cl","80 cl"],["Lait entier","10 cl","20 cl","40 cl"],["Gélatine","2 feuilles","4 feuilles","8 feuilles"],["Citronnelle fraîche","1 tige","2 tiges","4 tiges"],["Sucre","40 g","80 g","160 g"],["Fruits rouges","150 g","300 g","600 g"]],
          steps:[
            "Infuser la citronnelle (10 min) : cassez les tiges de citronnelle avec le dos d'un couteau (ou roulez-les sous la paume) pour libérer les arômes. Dans une casserole à fond épais, chauffez la crème, le lait et le sucre avec les morceaux de citronnelle, à feu doux, jusqu'aux premiers frémissements (petites bulles sur les bords). Retirez du feu, couvrez et laissez infuser 10 minutes. Filtrez au chinois en pressant légèrement sur la citronnelle pour extraire tout le parfum.",
            "Hydrater la gélatine (5 min) : pendant l'infusion, plongez les feuilles de gélatine dans un bol d'eau très froide (avec quelques glaçons si possible) pendant 5 minutes. Elles doivent devenir souples et molles, comme un mouchoir. Ne les laissez pas trop longtemps : elles se dissoudraient.",
            "Incorporer la gélatine (1 min) : réchauffez légèrement la crème infusée si elle a tiédi, puis, hors du feu, essorez les feuilles de gélatine entre vos mains pour retirer l'excès d'eau et plongez-les dans la crème chaude. Fouettez doucement 30 secondes jusqu'à dissolution complète : la crème doit redevenir parfaitement lisse, sans filament.",
            "Couler en verrines (2 min) : versez la préparation dans des verrines ou des ramequins, à mi-hauteur pour laisser de la place au coulis. Laissez refroidir 15 minutes à température ambiante — un passage direct au froid crée une condensation et une texture irrégulière.",
            "Réserver et servir (4 h + 5 min) : placez au réfrigérateur 4 heures minimum, sans y toucher. Pour vérifier la prise : la panna cotta doit être ferme sur les bords et encore légèrement tremblante au centre quand on secoue doucement. Au moment de servir, mixez les fruits rouges avec un peu de sucre (facultatif), puis versez 2 cuillères à soupe de coulis sur chaque panna cotta — ne le faites pas à l'avance, sinon il détrempe la surface."
          ],
          bienetre:"La citronnelle est traditionnellement digestive et apaisante ; la panna cotta, sans œuf, est très digeste.",secret:"Ne jamais faire bouillir la crème une fois la gélatine incorporée : elle perdrait son pouvoir gélifiant.",allergenes:"Lait — Végétarien (sans gluten)",
          veg:"Végétarien."},
        boisson:{titre:"Infusion Citronnelle-Gingembre",kcal:"~0 kcal/tasse",
          ing:[["Citronnelle","1 tige","2 tiges","4 tiges"],["Gingembre frais","petit morceau","morceau","grand morceau"],["Eau frémissante","150 ml","300 ml","600 ml"]],
          steps:[
            "Chauffer (3 min) : portez l'eau à frémissement dans une petite casserole.",
            "Infuser (6 min) : versez sur la citronnelle cassée et le gingembre râpé dans une tasse, couvrez d'une soucoupe pour préserver les arômes volatils. L'infusion doit prendre une teinte ambrée légère.",
            "Filtrer (30 sec) : passez au chinois ou retirez les morceaux à la cuillère.",
            "Servir (30 sec) : en tasse bien chaude, sans sucre — la citronnelle et le gingembre ont une douceur naturelle."
          ],
          alt:"Thé vert à la citronnelle."},
        accord:"Une infusion en écho direct au parfum de la panna cotta.",vin:"Muscat de Beaumes-de-Venise, très frais."},
      {id:"p7",numero:7,
        plat:{titre:"Sorbet Fraise-Basilic",tagline:"Un sorbet d'une fraîcheur absolue, sans lait ni œuf.",temps:"20 min + 4h",kcal:"~120 kcal",
          ing:[["Fraises bien mûres","400 g","800 g","1,6 kg"],["Sucre","80 g","160 g","320 g"],["Eau","10 cl","20 cl","40 cl"],["Basilic frais","quelques feuilles","1 poignée","2 poignées"],["Citron (jus)","1/2","1","2"]],
          steps:[
            "Préparer les fraises (5 min) : lavez rapidement les fraises sous l'eau froide, équeutez-les et épongez-les soigneusement sur du papier absorbant. L'eau résiduelle dilue le sorbet et altère sa texture. Choisissez des fraises bien mûres et parfumées — c'est elles qui font tout, il n'y a pas de cuisson pour rattraper.",
            "Mixer la base (3 min) : dans le blender, mixez les fraises avec le sucre, l'eau, le basilic frais et le jus de citron. Mixez 1 minute à vitesse maximale, jusqu'à obtenir une purée parfaitement lisse. Goûtez et ajustez : plus ou moins de sucre, plus ou moins de citron selon votre goût et la maturité des fraises.",
            "Refroidir (1 h) : versez la purée dans un récipient large, filmez au contact et placez au réfrigérateur 1 heure minimum. Le mélange doit être parfaitement froid avant de passer en sorbetière — un mélange tiède turbine mal et donne une texture granuleuse.",
            "Turbiner (30 min) : versez dans la sorbetière et turbinez 25 à 30 minutes, jusqu'à ce que le sorbet prenne une texture onctueuse et se détache des parois. Sans sorbetière : versez dans un bac large et placez au congélateur, en fouettant toutes les 30 minutes pendant 3 heures pour casser les cristaux de glace.",
            "Réserver et servir (3 h + 10 min) : transférez dans une boîte hermétique, placez au congélateur 3 heures minimum. Sortez le sorbet 10 minutes avant de servir pour qu'il ramollisse légèrement. Servez en boules dans des coupelles froides, avec un brin de basilic frais et quelques éclats de fraise."
          ],
          bienetre:"Sans lait, sans œuf, sans gluten : le sorbet est le dessert le plus digeste qui soit.",secret:"Le basilic frais, mixé à froid, garde toute sa fraîcheur — ne jamais le chauffer.",allergenes:"Aucun allergène majeur — Vegan",
          veg:"Végétarien & vegan."},
        boisson:{titre:"Eau Pétillante au Citron Vert",kcal:"~0 kcal",
          ing:[["Eau pétillante","150 ml","300 ml","600 ml"],["Citron vert","1/2","1","2"],["Menthe fraîche","quelques feuilles","1 brin","2 brins"]],
          steps:[
            "Refroidir (10 min) : placez la bouteille d'eau pétillante au réfrigérateur — plus elle est froide, plus les bulles tiennent longtemps.",
            "Presser (1 min) : pressez le citron vert au-dessus d'un verre haut, en filtrant les pépins. Ajoutez quelques feuilles de menthe légèrement froissées entre les paumes pour libérer les arômes.",
            "Servir (1 min) : versez l'eau pétillante lentement le long du verre pour préserver les bulles. Ajoutez une tranche de citron vert sur le bord."
          ],
          alt:"Eau de coco fraîche."},

            {id:"p8",numero:8,
        plat:{titre:"Verrine Pistache & Framboise",tagline:"Un dessert en couches : crème de pistache, coulis de framboise, éclats croustillants.",temps:"30 min + 4h de froid",kcal:"~340 kcal",
          ing:[["Pistaches non salées","80 g","160 g","320 g"],["Poudre d'amandes","30 g","60 g","120 g"],["Crème liquide entière","20 cl","40 cl","80 cl"],["Mascarpone","125 g","250 g","500 g"],["Framboises fraîches","200 g","400 g","800 g"],["Sucre glace","60 g","120 g","240 g"],["Gélatine","1 feuille","2 feuilles","4 feuilles"],["Citron (jus)","1/2","1","2"]],
          steps:[
            "Préparer la pâte de pistache (10 min) : faites torréfier les pistaches à sec dans une poêle, à feu moyen, en remuant constamment — elles doivent prendre une couleur dorée et embaumer la noisette grillée. Laissez-les refroidir complètement sur une assiette, puis frottez-les entre vos paumes pour retirer les peaux (facultatif mais plus fin). Mixez-les longuement au robot (3 à 5 minutes), en raclant les parois régulièrement : la poudre va d'abord rester sèche, puis devenir une pâte lisse et brillante — c'est l'huile naturelle des pistaches qui se libère. Réservez.",
            "Préparer le coulis de framboise (5 min) : mixez les framboises avec 20 g de sucre glace et le jus d'un demi-citron, jusqu'à obtenir un coulis vif et brillant. Passez-le au chinois fin pour retirer les pépins — cette étape prend 2 minutes, mais elle transforme la texture. Réservez au frais.",
            "Monter la crème de pistache (10 min) : faites ramollir la gélatine dans un bol d'eau très froide pendant 5 minutes. Fouettez le mascarpone (sorti 10 minutes avant) à la spatule pour le détendre, puis incorporez la pâte de pistache et le reste du sucre glace. Essorez la gélatine et faites-la fondre 15 secondes au micro-ondes avec 1 c. à s. d'eau. Incorporez-la à la crème. Montez la crème liquide bien froide en chantilly souple, puis incorporez-la délicatement à la crème pistache en 3 fois, à la maryse — la texture finale doit être mousseuse et souple.",
            "Monter les verrines (5 min) : dans chaque verre transparent, alternez les couches en commençant par la crème de pistache (2 cm), puis le coulis de framboise (1 cm), puis à nouveau la crème. Terminez par une couche de crème, et réservez quelques framboises et éclats de pistache pour la finition. Tapotez délicatement chaque verre sur le plan de travail pour égaliser les couches.",
            "Réserver et servir (4 h + 2 min) : filmez les verres au contact ou couvrez-les, puis placez au réfrigérateur 4 heures minimum — la crème doit prendre fermement. Au moment de servir, ajoutez sur le dessus 2 ou 3 framboises fraîches, quelques éclats de pistaches torréfiées concassées et une fine feuille de menthe. Un trait de coulis en surface pour la brillance."
          ],
          bienetre:"Les pistaches sont riches en magnésium et en bons lipides ; la framboise est l'un des fruits les plus riches en antioxydants. Un dessert léger, digeste, qui termine un repas sans l'alourdir.",secret:"La pâte de pistache maison (pistaches juste mixées longuement) a un goût incomparable. Ne remplacez jamais par de la pâte industrielle, souvent trop sucrée.",allergenes:"Lait — Fruits à coque (pistaches, amandes) — Végétarien (sans gluten)",
          veg:"Végétarien."},
        boisson:{titre:"Champagne Brut",kcal:"~80 kcal/verre",

          steps:["Refroidir (2 h) : placez la bouteille au réfrigérateur au moins 2 heures avant de servir. Idéal : 8-10°C.","Servir (1 min) : ouvrez délicatement en tournant la bouteille (pas le bouchon), puis versez dans des flûtes bien froides en inclinant le verre pour préserver la mousse."],
          alt:"Crémant brut nature."},
        accord:"Un accord festif, qui tranche sur la douceur de la pistache.",vin:"Champagne brut nature."},
      {id:"p9",numero:9,
        plat:{titre:"Clafoutis Cerises & Amandes",tagline:"Le clafoutis classique, aux premières cerises et aux amandes.",temps:"45 min",kcal:"~300 kcal",
          ing:[["Cerises","300 g","600 g","1,2 kg"],["Œufs","2","4","8"],["Lait entier","15 cl","30 cl","60 cl"],["Farine","60 g","120 g","240 g"],["Sucre","50 g","100 g","200 g"],["Amandes effilées","au goût","généreux","double"]],
          steps:[
            "Préparer les cerises (10 min) : lavez rapidement les cerises sous l'eau froide et égouttez-les soigneusement. Équeutez-les. Traditionnellement limousine, on laisse les noyaux : pendant la cuisson, ils libèrent une légère amande qui parfume tout le clafoutis. Si vous préférez dénoyauter, faites-le au-dessus d'un saladier pour récupérer le jus — il ira dans la pâte.",
            "Préparer la pâte (5 min) : dans un saladier, fouettez les œufs avec le sucre au fouet manuel pendant 2 minutes, jusqu'à ce que le mélange devienne pâle et forme un léger ruban. Ajoutez la farine tamisée en pluie et mélangez sans trop travailler. Versez ensuite le lait en trois fois, en mélangeant entre chaque ajout : la pâte doit être lisse, sans grumeaux, avec une texture de pâte à crêpes légèrement épaisse.",
            "Beurrer et garnir (1 min) : beurrez généreusement un plat en terre cuite ou en céramique (20 cm de diamètre pour 2 personnes). Versez une fine couche de pâte au fond (2 mm), puis répartissez les cerises en une seule couche régulière — elles doivent être bien serrées mais pas superposées. Versez le reste de pâte par-dessus : les cerises doivent être à peine recouvertes.",
            "Cuire au four (35 min) : préchauffez le four à 180°C (chaleur traditionnelle, pas tournante). Enfournez à mi-hauteur. Le clafoutis est prêt quand le dessus est doré, gonflé, et qu'une lame de couteau plantée au centre ressort propre. Le centre doit rester légèrement tremblant quand on secoue le plat : c'est ce qui garantit un cœur moelleux. Si le dessus brunit trop vite, couvrez d'une feuille d'aluminium.",
            "Finir aux amandes et servir (10 min) : 10 minutes avant la fin de cuisson, ouvrez le four et parsemez le clafoutis d'amandes effilées — elles vont dorer sans brûler. Refermez et laissez terminer. Sortez du four et laissez tiédir au moins 10 minutes avant de servir. Se déguste tiède ou à température ambiante."
          ],
          bienetre:"Dessert traditionnel du Limousin, peu sucré, riche en fruits. Les cerises sont reconnues pour leur action apaisante sur la digestion.",secret:"Laisser les noyaux : pendant la cuisson, ils libèrent une légère amande qui parfume tout le clafoutis.",allergenes:"Œuf — Lait — Gluten — Fruits à coque (amandes) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Thé Noir Léger",kcal:"~0 kcal/tasse",
          ing:[["Thé noir (Ceylan)","1 c. à c.","2 c. à c.","4 c. à c."],["Eau à 90°C","150 ml","300 ml","600 ml"]],
          steps:[
            "Chauffer (2 min) : à 90°C — un thé noir supporte une eau plus chaude que le thé vert, mais pas bouillante.",
            "Infuser (4 min) : versez sur les feuilles dans une petite théière, couvrez. Le thé doit prendre une teinte ambrée profonde, aux notes légèrement boisées.",
            "Filtrer (30 sec) : passez au chinois sans presser les feuilles.",
            "Servir (30 sec) : en tasse, sans sucre ni lait pour laisser parler les notes amandées du clafoutis."
          ],
          alt:"Café filtre léger, en contraste avec le fruité."},
        accord:"Un thé noir léger, pour souligner les notes amandées.",vin:"Banyuls jeune, légèrement frais."}
    ]

    ete:{
    id:"ete", nom:"Été", tagline:"Melon, Pêches & Saveurs du Soleil", stripe:"#E91E63",
    intro:"L'été est la saison des fruits gorgés de soleil : melons, pêches, abricots, myrtilles et mangues. Des desserts glacés, des tartes fruitées, des pavlovas croustillantes — tout ce qui rafraîchit et réjouit.",
    duos:[
      {id:"e10",numero:10,
        plat:{titre:"Pavé Melon, Citron Vert & Poivre Timut",tagline:"Un pavé glacé, où le poivre timut révèle le melon.",temps:"25 min + 6h de froid",kcal:"~180 kcal",
          ing:[["Melon bien mûr","1/2","1","2"],["Citron vert","1","2","4"],["Poivre timut","1 pincée","2 pincées","4 pincées"],["Sucre","60 g","120 g","240 g"],["Eau","10 cl","20 cl","40 cl"],["Gélatine","2 feuilles","4 feuilles","8 feuilles"]],
          steps:[
            "Préparer le melon (5 min) : coupez le melon en deux, retirez les graines à la cuillère, puis prélevez la chair avec une cuillère ou un couteau. Choisissez un melon bien mûr et parfumé — c'est lui qui fait tout le dessert, il n'y a pas de cuisson pour rattraper un melon fade. La chair doit être souple et juteuse. Mixez finement la chair avec le sucre, l'eau et le jus de citron vert, jusqu'à obtenir une purée parfaitement lisse.",
            "Hydrater la gélatine (5 min) : plongez les feuilles de gélatine dans un bol d'eau très froide (avec quelques glaçons) pendant 5 minutes. Elles doivent devenir souples et molles. Pendant ce temps, prélevez environ un tiers du jus de melon et faites-le chauffer à feu doux, sans jamais bouillir.",
            "Dissoudre la gélatine (2 min) : hors du feu, essorez les feuilles de gélatine entre vos mains pour retirer l'excès d'eau, puis plongez-les dans le jus chaud. Fouettez doucement 30 secondes jusqu'à dissolution complète : le jus doit redevenir parfaitement lisse, sans filament. Réunissez ensuite les deux préparations (jus chaud + jus froid) et mélangez.",
            "Parfumer au timut (1 min) : concassez les baies de poivre timut au mortier ou au dos d'une cuillère — elles doivent libérer leur parfum d'agrumes, mais sans être réduites en poudre fine. Incorporez-les au mélange. Goûtez : le timut doit être présent sans dominer.",
            "Couler et réserver (6 h) : versez la préparation dans un moule à pavé (ou un moule rectangulaire chemisé de film alimentaire) ou en verrines individuelles. Placez au réfrigérateur 6 heures minimum — la texture doit être prise mais encore légèrement tremblante au centre. Au moment de servir, démoulez délicatement (trempez rapidement le moule dans l'eau chaude si nécessaire) et coupez en tranches épaisses. Servez bien frais, avec quelques baies de timut concassées au dernier moment."
          ],
          bienetre:"Le melon est riche en eau et en potassium ; le poivre timut est traditionnellement utilisé pour sa fraîcheur en bouche.",secret:"Moudre le poivre timut au dernier moment : ses arômes d'agrumes s'évaporent vite.",allergenes:"Aucun allergène majeur — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Eau de Melon Infusée",kcal:"~0 kcal",
          ing:[["Eau fraîche","150 ml","300 ml","600 ml"],["Melon","1 tranche","2 tranches","4 tranches"],["Menthe fraîche","quelques feuilles","1 brin","2 brins"]],
          steps:[
            "Infuser (30 min) : dans une carafe d'eau fraîche, ajoutez les tranches de melon et les brins de menthe légèrement froissés entre les paumes pour libérer les arômes. Placez au réfrigérateur 30 minutes minimum — l'eau prendra naturellement le goût sucré du melon.",
            "Servir (1 min) : versez dans un grand verre avec des glaçons. Quelques feuilles de menthe fraîche sur le dessus."
          ],
          alt:"Eau de coco fraîche."},
        accord:"Une eau infusée, pour ne pas couvrir la finesse du melon.",vin:"Muscat de Beaumes-de-Venise très frais."},
      {id:"e11",numero:11,
        plat:{titre:"Millefeuille Caramélisé Patate Douce & Vanille",tagline:"Un millefeuille où la patate douce caramélisée rencontre la vanille.",temps:"1h30",kcal:"~400 kcal",
          ing:[["Pâte feuilletée","1 rouleau","1 rouleau","2 rouleaux"],["Patates douces","2","4","8"],["Gousse de vanille","1","2","4"],["Crème liquide","20 cl","40 cl","80 cl"],["Sucre roux","60 g","120 g","240 g"],["Beurre","30 g","60 g","120 g"]],
          steps:[
            "Cuire la pâte feuilletée (25 min) : préchauffez le four à 190°C. Étalez la pâte feuilletée en un rectangle régulier de 3 mm d'épaisseur. Piquez-la généreusement à la fourchette pour éviter qu'elle ne gonfle trop. Posez-la sur une plaque recouverte de papier cuisson, puis couvrez d'une seconde plaque identique (ou d'une grille lourde) — c'est ce qui va garder la pâte parfaitement plate et croustillante. Enfournez 25 minutes, jusqu'à ce que la pâte soit bien dorée. Laissez refroidir à plat, puis découpez des rectangles réguliers (4 × 10 cm).",
            "Cuire et caraméliser la patate douce (20 min) : pelez les patates douces, coupez-les en cubes réguliers de 2 cm. Cuisez-les à l'eau bouillante salée pendant 10 minutes, jusqu'à ce qu'elles soient tendres mais fermes (une lame de couteau doit s'enfoncer sans résistance). Égouttez-les et laissez-les sécher 5 minutes sur du papier absorbant. Dans une poêle, faites fondre le beurre à feu moyen, ajoutez les cubes de patate douce et le sucre roux. Faites caraméliser 5 à 8 minutes, en remuant délicatement : les cubes doivent prendre une belle couleur dorée et être enrobés de caramel.",
            "Préparer la crème vanille (10 min) : fendez la gousse de vanille en deux, grattez les graines. Versez la crème très froide dans un saladier bien glacé (passé 15 minutes au congélateur) et ajoutez les graines de vanille. Fouettez à vitesse moyenne puis rapide, jusqu'à obtenir une chantilly ferme qui forme un bec d'oiseau. Ne la montez pas trop : elle doit rester souple pour bien se marier avec la patate douce.",
            "Monter le millefeuille (5 min) : posez un premier rectangle de pâte feuilletée croustillante sur une assiette. À la poche à douille (ou à la cuillère), déposez une couche de crème vanille (1 cm environ). Répartissez quelques cubes de patate douce caramélisée. Posez un second rectangle de pâte. Répétez : crème vanille + patate douce. Terminez par un dernier rectangle de pâte.",
            "Finir et servir (1 min) : saupoudrez d'un voile de sucre glace tamisé, juste avant de servir. Ajoutez quelques cubes de patate douce sur le dessus pour la décoration. Servez aussitôt : le millefeuille perd son croustillant en 30 minutes une fois monté. Un trait de caramel au beurre salé sur l'assiette (facultatif) ajoute une note gourmande."
          ],
          bienetre:"La patate douce est riche en bêtacarotène et en fibres douces, plus digeste qu'une purée classique sucrée.",secret:"Cuire la pâte feuilletée entre deux plaques : elle reste parfaitement plate et croustillante.",allergenes:"Gluten — Lait — Végétarien",
          veg:"Végétarien."},

          steps:[

            "Filtrer (30 sec) : passez au chinois pour retirer les épices et les feuilles de thé.",

          alt:"Chai latte au lait d'avoine."},
        accord:"Un chai glacé, en écho aux épices de la patate douce.",vin:"Un verre de Muscat de Rivesaltes, très frais."},
      {id:"e12",numero:12,
        plat:{titre:"Tarte aux Pêches & Pistaches Grillées",tagline:"Des pêches rôties au miel, des pistaches grillées, une pâte sablée croustillante.",temps:"50 min",kcal:"~340 kcal",
          ing:[["Pâte sablée","1 rouleau","1 rouleau","2 rouleaux"],["Pêches","3","6","12"],["Miel","2 c. à s.","4 c. à s.","8 c. à s."],["Pistaches grillées","40 g","80 g","160 g"],["Thym frais","quelques branches","1 branche","2 branches"]],
          steps:[
            "Cuire la pâte à blanc (20 min) : préchauffez le four à 180°C. Foncez la pâte sablée dans un moule beurré en la faisant bien adhérer aux parois, sans tirer. Piquez le fond à la fourchette en quinconce, couvrez de papier cuisson et remplissez de billes de cuisson. Enfournez pour 20 minutes, jusqu'à ce que les bords soient bien dorés. Retirez les billes et le papier, laissez refroidir complètement sur une grille — une pâte chaude détremperait la garniture.",
            "Rôtir les pêches (15 min) : coupez les pêches en quartiers réguliers, sans les peler (la peau devient fondante à la cuisson). Disposez-les sur une plaque tapissée de papier cuisson, face coupée vers le haut. Arrosez généreusement de miel à la cuillère, parsemez de quelques brins de thym frais effeuillés. Enfournez 15 minutes à 200°C : les pêches doivent être fondantes mais encore tenir, et le miel légèrement caramélisé.",
            "Torréfier les pistaches (3 min) : pendant que les pêches rôtissent, faites torréfier les pistaches à sec dans une poêle, à feu moyen, en remuant constamment. Elles doivent prendre une couleur dorée et dégager un parfum de noisette grillée — ne quittez pas la poêle, elles brûlent très vite. Concassez-les au couteau, jamais au mixeur (elles deviendraient pâteuses).",
            "Refroidir et assembler (10 min) : laissez refroidir la pâte et les pêches séparément. Disposez ensuite les quartiers de pêche rôtis en rosace serrée sur le fond de tarte : commencez par l'extérieur en les chevauchant légèrement, terminez par quelques quartiers au centre. Arrosez du jus de cuisson rendu par les pêches.",
            "Finir et servir (1 min) : parsemez de pistaches grillées concassées juste avant de servir — c'est ce qui donne le croquant et le contraste. Vous pouvez ajouter un filet de miel frais si vous aimez les desserts bien sucrés. Se déguste tiède ou froid, avec une boule de glace vanille ou un peu de crème fraîche."
          ],
          bienetre:"La pêche est riche en fibres douces et en vitamines ; le thym est traditionnellement digestif.",secret:"Torréfier les pistaches juste avant de servir : elles gardent tout leur croquant.",allergenes:"Gluten — Œuf — Lait — Fruits à coque (pistaches) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Thé Glacé à la Pêche",kcal:"~40 kcal/verre",
          ing:[["Thé noir","1 sachet","2 sachets","4 sachets"],["Pêche","1","2","4"],["Eau","150 ml","300 ml","600 ml"],["Glaçons","PM","PM","PM"]],
          steps:[
            "Infuser (5 min) : faites infuser le thé noir dans 30 cl d'eau frémissante pendant 5 minutes. Retirez le sachet — au-delà, le thé devient âpre.",
            "Refroidir (1 h) : filtrez, puis placez au réfrigérateur 1 heure minimum. Le thé doit être bien froid avant de servir.",
            "Préparer la pêche (2 min) : coupez la pêche en quartiers fins, en gardant la peau pour la couleur.",
            "Servir (1 min) : remplissez un grand verre de glaçons, versez le thé glacé, ajoutez les quartiers de pêche. Un brin de menthe froissé apporte une note rafraîchissante."
          ],
          alt:"Eau infusée pêche-menthe, sans thé."},
        accord:"Un thé glacé maison, en écho au fruit du dessert.",vin:"Rosé de Provence, très frais."},
      {id:"e13",numero:13,
        plat:{titre:"Sorbet Melon & Citronnelle",tagline:"Un sorbet d'une fraîcheur absolue, subtilement parfumé à la citronnelle.",temps:"20 min + 4h",kcal:"~120 kcal",
          ing:[["Melon bien mûr","1/2","1","2"],["Sucre","60 g","120 g","240 g"],["Eau","10 cl","20 cl","40 cl"],["Citronnelle fraîche","1 tige","2 tiges","4 tiges"],["Citron vert (jus)","1/2","1","2"]],
          steps:[
            "Préparer le sirop de citronnelle (10 min) : cassez les tiges de citronnelle avec le dos d'un couteau pour libérer les arômes. Dans une petite casserole, chauffez l'eau avec le sucre et la citronnelle à feu doux, jusqu'à dissolution complète du sucre (le mélange doit frémir à peine, jamais bouillir). Retirez du feu, couvrez et laissez infuser 10 minutes. Filtrez au chinois en pressant sur la citronnelle pour extraire tout le parfum. Réservez au frais.",
            "Préparer le melon (5 min) : coupez le melon, retirez les graines, prélevez la chair avec une cuillère. Choisissez un melon bien mûr et parfumé — c'est lui qui fait tout le sorbet.",
            "Mixer la base (3 min) : dans le blender, mixez la chair de melon avec le sirop de citronnelle refroidi et le jus de citron vert. Mixez 1 minute à vitesse maximale, jusqu'à obtenir une purée parfaitement lisse. Goûtez et ajustez : plus ou moins de sucre, plus ou moins de citron selon la maturité du melon.",
            "Refroidir (1 h) : versez la purée dans un récipient large, filmez au contact et placez au réfrigérateur 1 heure minimum. Le mélange doit être parfaitement froid avant de passer en sorbetière.",
            "Turbiner et réserver (30 min + 3 h) : versez dans la sorbetière et turbinez 25 à 30 minutes, jusqu'à ce que le sorbet prenne une texture onctueuse et se détache des parois. Sans sorbetière : versez dans un bac large, placez au congélateur et fouettez toutes les 30 minutes pendant 3 heures pour casser les cristaux de glace. Réservez au congélateur au moins 3 heures. Sortez 10 minutes avant de servir."
          ],
          bienetre:"Sans lait ni œuf, le sorbet est idéal en fin de repas d'été. La citronnelle est digestive.",secret:"Choisir un melon bien mûr et parfumé : il n'y a pas de cuisson pour rattraper.",allergenes:"Aucun allergène majeur — Vegan",
          veg:"Végétarien & vegan."},
        boisson:{titre:"Eau Pétillante Citronnelle",kcal:"~0 kcal",
          ing:[["Eau pétillante","150 ml","300 ml","600 ml"],["Citronnelle","1 tige","2 tiges","4 tiges"],["Citron vert","1/2","1","2"]],
          steps:[
            "Infuser (30 min) : dans une carafe d'eau pétillante très froide, plongez la citronnelle cassée et quelques rondelles de citron vert. Placez au réfrigérateur 30 minutes — l'eau prendra progressivement les arômes.",
            "Servir (1 min) : versez dans un grand verre avec des glaçons, ajoutez une tranche de citron vert frais."
          ],
          alt:"Eau de coco fraîche."},
        accord:"Une eau pétillante, pour ne pas couvrir la finesse du sorbet.",vin:"Muscat de Beaumes-de-Venise très frais."},
      {id:"e14",numero:14,
        plat:{titre:"Tarte Citron Meringuée au Sésame Noir",tagline:"La grande classique française, twistée au sésame noir.",temps:"1h + 2h",kcal:"~380 kcal",
          ing:[["Pâte sablée","1 rouleau","1 rouleau","2 rouleaux"],["Citrons","3","6","12"],["Œufs","3","6","12"],["Sucre","150 g","300 g","600 g"],["Beurre","100 g","200 g","400 g"],["Sésame noir","20 g","40 g","80 g"]],
          steps:[
            "Cuire la pâte à blanc (20 min) : préchauffez le four à 180°C. Foncez la pâte sablée dans un moule beurré, piquez le fond à la fourchette, couvrez de papier cuisson et de billes de cuisson. Cuisez 20 minutes, jusqu'à ce que les bords soient bien dorés. Retirez les billes et laissez refroidir sur une grille.",
            "Préparer la crème au citron (10 min) : dans une casserole, mélangez le jus des citrons (environ 15 cl), les zestes finement râpés (2 citrons), le sucre et les œufs entiers. Fouettez au fouet à froid, puis cuisez à feu doux en remuant constamment à la spatule : la crème va épaissir progressivement. Comptez 8 à 10 minutes. Elle est prête quand elle nappe la spatule et qu'un doigt passé dessus laisse une trace nette. Ne la faites jamais bouillir : les œufs coaguleraient et la crème trancherait.",
            "Incorporer le beurre (2 min) : hors du feu, ajoutez le beurre coupé en morceaux. Mélangez jusqu'à incorporation complète — le beurre donne l'onctuosité et la brillance. Versez dans un récipient, filmez au contact et placez au réfrigérateur 1 heure minimum.",
            "Garnir et préparer la meringue italienne (10 min) : étalez la crème au citron refroidie sur le fond de tarte refroidi. Préparez la meringue italienne : faites cuire 150 g de sucre avec 5 cl d'eau au thermomètre jusqu'à 118°C (petit boulé). En parallèle, montez 3 blancs en neige à vitesse moyenne jusqu'à obtenir un pic souple. Versez le sucre cuit en filet sur les blancs, le long de la paroi du saladier, en fouettant constamment à vitesse moyenne. Continuez à fouetter 8 minutes, jusqu'à ce que la meringue soit tiède et forme un bec d'oiseau ferme.",
            "Dresser et caraméliser (5 min) : déposez la meringue sur la tarte à la poche à douille (douille cannelée pour un effet vagues) ou à la spatule en formant des pics irréguliers. Parsemez de sésame noir grillé (à sec dans une poêle, 2 minutes). Passez au chalumeau de cuisine en effectuant des petits cercles réguliers, jusqu'à obtenir une couleur dorée irrégulière. Servez dans l'heure : la meringue ramollit au bout de 2 heures au réfrigérateur."
          ],
          bienetre:"Le citron, riche en vitamine C, stimule la digestion. Le sésame noir apporte du calcium.",secret:"Meringue italienne (sucre cuit versé sur les blancs) : plus stable et plus soyeuse que la française.",allergenes:"Gluten — Œuf — Lait — Sésame — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Limoncello Glacé",kcal:"~90 kcal/verre",
          ing:[["Limoncello","4 cl","8 cl","16 cl"]],
          steps:[
            "Refroidir (2 h) : placez la bouteille de limoncello au congélateur — l'alcool ne gèle pas, et le limoncello glacé est bien plus agréable.",
            "Servir (30 sec) : versez dans de petits verres à liqueur, également sortis du congélateur. Servez aussitôt, en digestif après le dessert."
          ],
          alt:"Limonade artisanale au citron."},
        accord:"Un limoncello glacé, en écho au citron.",vin:"Muscat de Rivesaltes, très frais."},
            {id:"e15",numero:15,
        plat:{titre:"Mangue Rôtie, Sabayon Matcha & Sésame Caramélisé",tagline:"Une mangue rôtie au miel, un sabayon aérien au matcha, un croustillant de sésame caramélisé.",temps:"40 min + 2h de froid",kcal:"~310 kcal",
          ing:[["Mangue bien mûre","1","2","4"],["Miel","2 c. à s.","4 c. à s.","8 c. à s."],["Jaunes d'œufs","2","4","8"],["Sucre","60 g","120 g","240 g"],["Vin blanc doux (ou jus de mangue)","10 cl","20 cl","40 cl"],["Matcha en poudre","1 c. à c.","2 c. à c.","4 c. à c."],["Sésame blond","30 g","60 g","120 g"],["Citron vert","1/2","1","2"]],
          steps:[
            "Rôtir la mangue (15 min) : préchauffez le four à 200°C. Pelez la mangue bien mûre, coupez-la en deux dans l'épaisseur (deux 'escalopes' épaisses), retirez le noyau. Disposez les deux moitiés dans un plat à four, arrosez de miel et du jus d'un demi-citron vert. Enfournez 15 minutes : la mangue doit être fondante sur les bords et légèrement caramélisée. Laissez refroidir complètement, puis placez au frais 2 heures — la chair doit être bien froide pour contraster avec le sabayon tiède.",
            "Préparer le sabayon matcha (10 min) : dans un grand saladier, fouettez les jaunes d'œufs avec le sucre pendant 2 minutes, jusqu'à ce que le mélange blanchisse et double de volume. Ajoutez le vin blanc doux (ou le jus de mangue) en fouettant. Placez le saladier sur un bain-marie frémissant — l'eau ne doit jamais bouillir. Fouettez constamment 8 à 10 minutes : le sabayon doit tripler de volume, devenir mousseux, pâle, et former un ruban bien marqué quand on lève le fouet. Retirez du bain-marie, incorporez délicatement le matcha tamisé en 2 fois, à la maryse. Réservez tiède.",
            "Caraméliser le sésame (5 min) : dans une poêle sèche, faites torréfier le sésame à feu moyen en remuant constamment, jusqu'à ce qu'il soit doré et parfumé. Ajoutez 2 c. à s. de miel et laissez caraméliser 1 minute en enrobant bien les graines. Versez sur une plaque chemisée de papier cuisson, étalez en couche fine, laissez durcir complètement (10 minutes). Cassez ensuite en éclats irréguliers à la main.",
            "Dresser les assiettes (3 min) : posez une escalope de mangue rôtie bien froide au centre de chaque assiette creuse. Nappez généreusement de sabayon matcha tiède, en le versant d'un geste régulier. Parsemez d'éclats de sésame caramélisé, ajoutez quelques zestes de citron vert râpés au dernier moment.",
            "Servir (immédiat) : servez aussitôt, avec le contraste chaud-froid bien marqué. Le sabayon tiède qui coule sur la mangue froide, et le sésame caramélisé qui croustille, forment l'accord idéal."
          ],
          bienetre:"La mangue est riche en vitamines A et C ; le matcha apporte des catéchines antioxydantes. Un dessert vif et parfumé.",secret:"Le sabayon doit être tiède, pas chaud : trop chaud, il continuerait de cuire ; trop froid, il perdrait son effet mousseux.",allergenes:"Œuf — Sésame — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Matcha Usucha",kcal:"~2 kcal/tasse",
          ing:[["Matcha en poudre","1 c. à c.","2 c. à c.","4 c. à c."],["Eau à 80°C","7 cl","14 cl","28 cl"]],
          steps:[
            "Tamiser (30 sec) : versez le matcha dans un bol à travers une petite passoire fine — obligatoire pour éviter les grumeaux.",
            "Délayer (1 min) : versez 7 cl d'eau à 80°C, fouettez au chasen (fouet à matcha) en zigzag rapide, 15 secondes, jusqu'à obtenir une mousse fine et dense en surface.",
            "Servir (immédiat) : buvez aussitôt, sans sucre — le matcha se boit traditionnellement pur, en une ou deux gorgées. Le contraste végétal équilibre le sucré de la mangue."
          ],
          alt:"Hōjicha glacé (thé vert grillé), pour une version plus douce."},
        accord:"Un matcha cérémonial, en écho direct au sabayon. Une dégustation en deux temps : sucré puis végétal.",vin:"Saké junmai, très frais."},
      {id:"e16",numero:16,
        plat:{titre:"Clafoutis Abricots & Romarin",tagline:"Le clafoutis d'été, aux abricots bien mûrs et au romarin.",temps:"45 min",kcal:"~290 kcal",
          ing:[["Abricots","400 g","800 g","1,6 kg"],["Œufs","2","4","8"],["Lait entier","15 cl","30 cl","60 cl"],["Farine","60 g","120 g","240 g"],["Sucre","60 g","120 g","240 g"],["Romarin frais","1 branche","2 branches","4 branches"]],
          steps:[
            "Préparer les abricots (5 min) : lavez les abricots, coupez-les en deux dans la longueur et retirez les noyaux. Choisissez des abricots bien mûrs, souples sous le doigt : leur chair fondra dans la pâte. Inutile de les peler, la peau devient tendre à la cuisson.",
            "Préparer la pâte (5 min) : fouettez les œufs avec le sucre jusqu'à ce que le mélange blanchisse. Ajoutez la farine tamisée et mélangez sans trop travailler, puis versez le lait en 3 fois en fouettant entre chaque ajout. Ajoutez le romarin ciselé très finement (au couteau, pas au mixeur) — c'est ce qui donnera la note méditerranéenne. La pâte doit être lisse et fluide.",
            "Beurrer et garnir (2 min) : beurrez un plat à gratin (20-22 cm), versez une fine couche de pâte au fond, puis répartissez les demi-abricots face coupée vers le bas, en une seule couche serrée. Versez le reste de pâte — les abricots doivent être à peine recouverts.",
            "Cuire (35 min) : enfournez à 180°C (chaleur traditionnelle) pour 35 minutes. Le clafoutis est prêt quand le dessus est doré et gonflé, et qu'une lame de couteau plantée au centre ressort propre. Le centre doit rester légèrement tremblant. Si le dessus brunit trop vite, couvrez d'aluminium.",
            "Servir (15 min) : sortez le clafoutis du four et laissez tiédir au moins 15 minutes avant de servir. Il se déguste tiède ou froid, avec une boule de glace vanille ou une cuillère de crème fraîche épaisse."
          ],
          bienetre:"L'abricot est riche en fibres et en bêtacarotène ; le romarin est traditionnellement digestif.",secret:"Ciseler le romarin très finement : sinon il devient dur à la cuisson.",allergenes:"Œuf — Lait — Gluten — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Thé Vert Glacé",kcal:"~0 kcal",
          ing:[["Thé vert","1 c. à c.","2 c. à c.","4 c. à c."],["Eau à 80°C","150 ml","300 ml","600 ml"],["Glaçons","PM","PM","PM"]],
          steps:[
            "Infuser (3 min) : versez l'eau à 80°C sur les feuilles de thé, couvrez, laissez infuser 3 minutes. Le thé doit être vert clair, vif, jamais amer.",
            "Refroidir (1 h) : filtrez, laissez refroidir à température ambiante puis placez 1 heure au réfrigérateur.",
            "Servir (1 min) : versez sur des glaçons dans un grand verre. Un trait de citron frais réveille le thé."
          ],
          alt:"Eau pétillante citronnée."},
        accord:"Un thé vert glacé, pour une note fraîche.",vin:"Rosé sec de Provence."},
      {id:"e17",numero:17,
        plat:{titre:"Glace Vanille & Pistaches Grillées",tagline:"Une glace vanille artisanale, parsemée de pistaches grillées.",temps:"30 min + 4h",kcal:"~300 kcal",
          ing:[["Lait entier","25 cl","50 cl","1 L"],["Crème liquide","15 cl","30 cl","60 cl"],["Jaunes d'œufs","4","8","16"],["Sucre","100 g","200 g","400 g"],["Gousse de vanille","1","2","4"],["Pistaches grillées","40 g","80 g","160 g"]],
          steps:[
            "Infuser la vanille (10 min) : fendez la gousse en deux dans la longueur, grattez les graines. Mettez la gousse, les graines, le lait et la crème dans une casserole. Chauffez à feu doux jusqu'aux premiers frémissements, puis couvrez et laissez infuser 10 minutes hors du feu. Retirez la gousse avant de continuer.",
            "Blanchir les jaunes (3 min) : dans un saladier, fouettez les jaunes avec le sucre au fouet manuel pendant 2-3 minutes, jusqu'à ce que le mélange blanchisse et forme un ruban. Il ne s'agit pas de faire mousser mais de bien dissoudre le sucre.",
            "Mélanger et cuire la crème anglaise (8 min) : versez le lait chaud en filet sur les jaunes blanchis, en fouettant constamment. Reversez le tout dans la casserole et cuisez à feu doux, en remuant sans arrêt à la spatule en bois ou en silicone, jusqu'à ce que la crème nappe la spatule (82-84°C). Comptez 5 à 8 minutes. Ne dépassez jamais 85°C : au-delà, la crème tranche.",
            "Refroidir et turbiner (30 min) : versez la crème anglaise dans un récipient froid, filmez au contact et placez au réfrigérateur 2 heures minimum. Versez ensuite dans la sorbetière et turbinez 25-30 minutes, en incorporant les pistaches grillées concassées dans les 2 dernières minutes. Sans sorbetière : versez dans un bac large, placez au congélateur, et fouettez toutes les 30 minutes pendant 3 heures.",
            "Réserver et servir (3 h) : transférez dans une boîte hermétique, placez au congélateur au moins 3 heures. Sortez la glace 10 minutes avant de servir pour qu'elle ramollisse légèrement. Servez en boules dans des coupelles froides, parsemées de quelques pistaches grillées concassées au dernier moment."
          ],
          bienetre:"La glace artisanale, sans additifs ni stabilisants, se digère beaucoup mieux qu'une glace industrielle.",secret:"Ajouter les pistaches grillées dans les deux dernières minutes de turbinage : elles gardent tout leur croquant.",allergenes:"Œuf — Lait — Fruits à coque (pistaches) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Espresso Serré",kcal:"~2 kcal/tasse",
          ing:[["Café en grains","7 g","14 g","28 g"],["Eau","3 cl","6 cl","12 cl"]],
          steps:[
            "Moudre (30 sec) : moulez le café très finement, juste avant l'extraction — un café moulu à l'avance perd ses arômes.",
            "Extraire (25 sec) : extrayez un espresso serré (25 secondes environ). La crème doit être couleur noisette et dense.",
            "Servir (30 sec) : versez dans une petite tasse préchauffée à l'eau chaude puis essuyée. Se boit en une ou deux gorgées, sans sucre."
          ],
          alt:"Ristretto, encore plus concentré."},
        accord:"Un espresso serré, en contraste chaud-froid.",vin:"Un trait de Marsala, servi frais."},
            {id:"e18",numero:18,
        plat:{titre:"Granité Yuzu-Gingembre & Chantilly Sésame Blanc",tagline:"Un granité vif et glacé, une chantilly aérienne parfumée au sésame blanc grillé.",temps:"30 min + 4h de froid",kcal:"~180 kcal",
          ing:[["Yuzu (jus + zeste)","1","2","4"],["Gingembre frais","petit morceau","morceau","grand morceau"],["Sucre","80 g","160 g","320 g"],["Eau","30 cl","60 cl","1,2 L"],["Crème liquide entière","20 cl","40 cl","80 cl"],["Sucre glace","20 g","40 g","80 g"],["Sésame blanc","30 g","60 g","120 g"]],
          steps:[
            "Préparer le sirop de yuzu-gingembre (10 min) : dans une casserole, chauffez l'eau avec le sucre à feu doux, jusqu'à dissolution complète. Retirez du feu. Ajoutez le jus et le zeste de yuzu (prélevé au couteau économe, sans la partie blanche) et le gingembre frais râpé. Couvrez et laissez infuser 10 minutes. Filtrez au chinois fin en pressant bien sur les zestes et le gingembre pour extraire tous les arômes. Le sirop doit être vif, très parfumé, légèrement acidulé.",
            "Congeler le granité (3-4 h) : versez le sirop dans un grand plat peu profond (type plat à gratin), et placez au congélateur. Toutes les 30 minutes pendant 3 à 4 heures, sortez le plat et grattez la surface avec une fourchette pour casser les cristaux de glace qui se forment — c'est ce geste qui donne la texture granitée, irrégulière et scintillante. Le granité est prêt quand il forme des cristaux fins et secs, sans blocs compacts.",
            "Préparer la chantilly sésame (10 min) : dans une poêle sèche, faites torréfier le sésame blanc à feu moyen, en remuant constamment, jusqu'à ce qu'il soit bien doré et parfumé — ne quittez pas la poêle, le sésame brunit en 30 secondes. Mixez-le au robot avec 1 c. à s. de sucre glace, jusqu'à obtenir une poudre fine et humide (ne mixez pas trop, sinon vous obtiendrez du beurre de sésame). Réservez 1 c. à s. pour le décor. Montez la crème bien froide en chantilly ferme (bol et fouet glacés au préalable). Incorporez délicatement la poudre de sésame en 3 fois, à la maryse — la chantilly doit être légèrement beige, très parfumée.",
            "Dresser (5 min) : dans des verres transparents bien froids, déposez une belle couche de granité yuzu-gingembre (2 cm). Ajoutez par-dessus une quenelle généreuse de chantilly sésame, à la cuillère ou à la poche à douille.",
            "Finir et servir (1 min) : au moment de servir, saupoudrez d'un peu de sésame grillé réservé et d'un zeste de yuzu râpé finement. Servez aussitôt — le granité commence à fondre en 5 minutes. Le contraste entre le granité acidulé, froid, et la chantilly douce, beurrée, est saisissant."
          ],
          bienetre:"Le yuzu est extrêmement riche en vitamine C ; le gingembre est traditionnellement reconnu pour stimuler la digestion. Un dessert rafraîchissant, vif, idéal après un repas d'été.",secret:"Le granité doit être gratté toutes les 30 minutes : c'est ce geste qui donne la texture granitée légère, jamais compacte.",allergenes:"Lait — Sésame — Végétarien (sans gluten)",
          veg:"Végétarien."},
