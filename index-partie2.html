  automne:{
    id:"automne", nom:"Automne", tagline:"Pommes, Châtaignes & Épices Douces", stripe:"#7B9B5E",
    intro:"L'automne est la saison des vergers et des épices douces : pommes, poires, figues, kakis, châtaignes, noix de pécan et potimarron. Des desserts généreux, réconfortants, qui réchauffent les premiers froids.",
    duos:[
            {id:"a19",numero:19,
        plat:{titre:"Tatin Pomme, Fenouil & Caramel",tagline:"La tarte Tatin, revisitée : le fenouil confit révèle la pomme caramélisée.",temps:"55 min",kcal:"~390 kcal",
          ing:[["Pommes (Reinette)","4","8","16"],["Fenouil","1/2","1","2"],["Sucre","100 g","200 g","400 g"],["Beurre","50 g","100 g","200 g"],["Pâte feuilletée","1 rouleau","1 rouleau","2 rouleaux"],["Graines de fenouil","1 pincée","2 pincées","4 pincées"]],
          steps:[
            "Préparer le fenouil (8 min) : coupez le bulbe de fenouil en deux, retirez la base dure et les tiges. Émincez-le très finement à la mandoline (ou au couteau, en tranches de 2 mm). Plus le fenouil est fin, plus il va fondre dans le caramel. Réservez les pluches vertes pour le décor final.",
            "Caraméliser (8 min) : posez un moule à tarte à bords hauts (ou une poêle en fonte) sur le feu. Versez le sucre à sec et laissez-le fondre à feu moyen, sans remuer, jusqu'à obtenir un caramel ambré. Ajoutez les graines de fenouil dès que le caramel prend couleur — elles vont libérer leur parfum anisé dans la chaleur. Retirez du feu et ajoutez le beurre en morceaux, en mélangeant rapidement.",
            "Confire le fenouil et les pommes (15 min) : déposez le fenouil émincé en couche régulière sur le caramel, puis disposez les quartiers de pommes debout, serrés les uns contre les autres, en les enfonçant légèrement dans le fenouil. Le fenouil va se confire sous les pommes, absorbant le caramel et libérant son parfum anisé — vous ne le verrez presque plus, mais son goût sera partout.",
            "Cuire sur le feu (20 min) : remettez le moule sur feu doux. Laissez cuire 20 minutes : les pommes doivent devenir fondantes sur les bords, le caramel épaissir et remonter entre les fruits. Surveillez attentivement — si le caramel brunit trop vite, baissez le feu. Le fenouil, lui, doit avoir complètement fondu dans le caramel.",
            "Recouvrir et cuire au four (30 min) : préchauffez le four à 190°C. Posez la pâte feuilletée sur les pommes, en rentrant les bords à l'intérieur du moule avec le dos d'une cuillère. Piquez la pâte à la fourchette en 4 ou 5 points. Enfournez 30 minutes : la pâte doit être bien dorée, gonflée et croustillante. À la sortie du four, laissez reposer 5 minutes, puis posez un plat de service sur le moule et retournez d'un geste franc. Attention aux projections de caramel chaud. Décorez des pluches de fenouil réservées."
          ],
          bienetre:"La pomme est riche en pectine, une fibre douce qui facilite la digestion ; le fenouil est traditionnellement carminatif.",secret:"Le fenouil confit dans le caramel disparaît presque : il laisse un parfum anisé qui adoucit l'acidité de la pomme.",allergenes:"Gluten — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Cidre Brut Artisanal",kcal:"~80 kcal/verre",
          ing:[["Cidre brut","10 cl","20 cl","40 cl"]],
          steps:[
            "Refroidir (2 h) : placez la bouteille au réfrigérateur 2 heures minimum. Un cidre se sert bien frais, autour de 8-10°C.",
            "Servir (1 min) : versez dans des verres à pied ou des bolées, en inclinant doucement pour préserver les bulles. Servez aussitôt : le cidre perd son effervescence en quelques minutes."
          ],
          alt:"Jus de pomme pétillant artisanal."},
        accord:"Un cidre brut, en écho direct à la pomme caramélisée.",vin:"Pommeau de Normandie, en digestif."},
            {id:"a20",numero:20,
        plat:{titre:"Éclair Potimarron, Pécan & Épices Douces",tagline:"Un éclair d'automne : crème de potimarron, noix de pécan, épices douces.",temps:"1h15",kcal:"~400 kcal",
          ing:[["Eau","12 cl","25 cl","50 cl"],["Beurre","50 g","100 g","200 g"],["Farine","75 g","150 g","300 g"],["Œufs","2","4","8"],["Potimarron cuit","200 g","400 g","800 g"],["Noix de pécan","50 g","100 g","200 g"],["Cannelle, muscade, gingembre","1 c. à c.","2 c. à c.","4 c. à c."],["Crème liquide","15 cl","30 cl","60 cl"]],
          steps:[
            "Préparer la pâte à choux (10 min) : dans une casserole, portez à ébullition l'eau et le beurre coupé en morceaux. Hors du feu, versez la farine d'un coup et mélangez vigoureusement au fouet — la pâte va se former en boule. Remettez la casserole sur feu doux 2 minutes pour dessécher la pâte : elle doit se détacher des parois. Versez dans un saladier et incorporez les œufs un par un, en mélangeant énergiquement après chaque ajout. La pâte doit former un V quand on lève la spatule — arrêtez dès que c'est le cas, on n'utilise pas toujours tous les œufs.",
            "Pocher les éclairs (5 min) : préchauffez le four à 180°C. Versez la pâte dans une poche à douille munie d'une douille cannelée (ou lisse). Sur une plaque recouverte de papier cuisson, pochez des boudins réguliers de 12 cm de long, espacés. Utilisez un gabarit au crayon sous le papier cuisson si vous voulez des éclairs parfaitement alignés.",
            "Cuire (35 min) : enfournez pour 35 minutes, sans JAMAIS ouvrir le four pendant la cuisson — les éclairs retomberaient d'un coup. Ils doivent être bien dorés, gonflés et fermes au toucher. À la sortie, percez délicatement le dessous de chaque éclair avec la pointe d'un couteau pour laisser s'échapper la vapeur — cela évite qu'ils ne ramollissent. Laissez refroidir complètement sur une grille.",
            "Préparer la crème de potimarron (10 min) : mixez 200 g de potimarron cuit (rôti au four de préférence, plus parfumé) avec la crème liquide et les épices (cannelle, muscade, gingembre). Mixez jusqu'à obtenir une purée lisse et brillante. Goûtez et rectifiez les épices — le potimarron doit être bien présent, les épices en soutien. Réservez au frais 30 minutes : la crème doit être bien froide pour être pochée.",
            "Garnir et finir (5 min) : à l'aide d'une poche à douille munie d'une douille fine, percez le dessous de chaque éclair en 2 ou 3 points et garnissez de crème de potimarron. Torréfiez les noix de pécan à sec dans une poêle 4 minutes, en remuant constamment, puis concassez-les au couteau. Saupoudrez chaque éclair de pécan concassées, puis d'un voile de cannelle tamisé. Servez dans l'heure : au-delà, la pâte ramollit au contact de la crème."
          ],
          bienetre:"Le potimarron est riche en fibres douces et en bêtacarotène ; les épices douces facilitent la digestion.",secret:"Torréfier les noix de pécan à sec, 4 minutes à la poêle : elles deviennent croustillantes et parfument tout l'éclair.",allergenes:"Gluten — Œuf — Lait — Fruits à coque (pécan) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Chai Latte",kcal:"~90 kcal/verre",
          ing:[["Thé noir","1 sachet","2 sachets","4 sachets"],["Cardamome","1 gousse","2 gousses","4 gousses"],["Gingembre","petit morceau","morceau","grand morceau"],["Cannelle","1 pincée","2 pincées","4 pincées"],["Lait","5 cl","10 cl","20 cl"]],
          steps:[
            "Infuser (5 min) : dans une petite casserole, portez 20 cl d'eau à frémissement avec le thé noir, les gousses de cardamome écrasées, le gingembre frais râpé et la cannelle. Laissez infuser 5 minutes à couvert.",
            "Filtrer (30 sec) : passez au chinois pour retirer les épices et les feuilles.",
            "Ajouter le lait (1 min) : versez le lait (entier ou végétal) et faites chauffer sans bouillir. Fouettez ou utilisez un mousseur à lait pour créer une mousse en surface.",
            "Servir (30 sec) : versez dans une grande tasse, en gardant la mousse sur le dessus. Saupoudrez d'une pincée de cannelle."
          ],
          alt:"Chai latte au lait végétal (avoine, amande)."},
        accord:"Un chai latte, en écho direct aux épices de l'éclair.",vin:"Muscat de Beaumes-de-Venise, très frais."},
            {id:"a21",numero:21,
        plat:{titre:"Moelleux Châtaigne & Poire",tagline:"Un moelleux sans farine, où la châtaigne rencontre la poire fondante.",temps:"45 min",kcal:"~320 kcal",
          ing:[["Farine de châtaigne","120 g","240 g","480 g"],["Œufs","3","6","12"],["Sucre roux","80 g","160 g","320 g"],["Beurre fondu","80 g","160 g","320 g"],["Poires fermes","2","4","8"],["Levure chimique","1 c. à c.","2 c. à c.","4 c. à c."],["Cognac ou jus de pomme","1 c. à s.","2 c. à s.","4 c. à s."]],
          steps:[
            "Préparer les poires (5 min) : pelez les poires (choisissez une variété ferme, type Conférence ou Comice), retirez le cœur et les pépins. Coupez-les en dés réguliers de 1,5 cm. Utilisez une variété qui tient à la cuisson : elle doit rester en morceaux dans la pâte, et apporter une belle texture fondante à cœur. Réservez.",
            "Préparer la pâte (5 min) : dans un saladier, fouettez les œufs avec le sucre roux pendant 2 minutes, jusqu'à ce que le mélange blanchisse. Ajoutez la farine de châtaigne tamisée et la levure chimique. Mélangez sans trop travailler — la farine de châtaigne est fragile, elle durcit si on la travaille trop. Ajoutez le beurre fondu tiède et le cognac (ou le jus de pomme pour une version sans alcool), mélangez jusqu'à incorporation.",
            "Garnir et cuire (35 min) : préchauffez le four à 170°C (chaleur traditionnelle). Beurrez un moule à manqué (20-22 cm) ou chemisez-le de papier cuisson. Versez la moitié de la pâte, répartissez les dés de poire, puis versez le reste de pâte par-dessus. Enfournez pour 35 minutes : le moelleux doit être doré sur les bords et encore un peu tremblant au centre.",
            "Vérifier la cuisson (1 min) : plantez une lame de couteau au centre — elle doit ressortir avec quelques miettes humides, mais pas de pâte liquide. Si elle ressort propre, c'est trop cuit : la farine de châtaigne devient sèche et sableuse. Sortez dès que le centre tremble légèrement.",
            "Laisser tiédir et servir (10 min) : laissez le moelleux reposer 10 minutes dans son moule avant de démouler. La châtaigne développe son parfum en refroidissant — à la sortie du four, elle peut sembler fade. Après 10 minutes, elle prend toute son ampleur. Servez tiède, avec une cuillère de crème fraîche épaisse ou une boule de glace vanille."
          ],
          bienetre:"La farine de châtaigne est naturellement sans gluten, riche en fibres et en minéraux ; un dessert automnal très digeste.",secret:"Sortir le moelleux quand le centre tremble encore : il continue de cuire à la sortie du four et reste fondant.",allergenes:"Œuf — Lait — Végétarien (sans gluten)",
          veg:"Végétarien, sans gluten."},
        boisson:{titre:"Thé Noir aux Agrumes",kcal:"~0 kcal/tasse",
          ing:[["Thé noir","1 c. à c.","2 c. à c.","4 c. à c."],["Orange","1/2","1","2"],["Citron","1/4","1/2","1"]],
          steps:[
            "Infuser (4 min) : infusez le thé noir dans 30 cl d'eau frémissante pendant 4 minutes.",
            "Ajouter les zestes (1 min) : ajoutez quelques lanières de zeste d'orange et de citron prélevées au couteau économe. Laissez infuser 1 minute supplémentaire.",
            "Filtrer (30 sec) : passez au chinois pour retirer les feuilles et les zestes.",
            "Servir (30 sec) : versez dans une tasse bien chaude. Les agrumes apportent une fraîcheur qui équilibre la richesse du moelleux."
          ],
          alt:"Infusion d'orange et cannelle."},
        accord:"Un thé aux agrumes, en contraste avec le moelleux.",vin:"Muscat de Rivesaltes, très frais."},
      {id:"a22",numero:22,
        plat:{titre:"Tartelette Kaki, Vanille & Sésame Noir",tagline:"Une tartelette surprenante : kaki fondant, vanille, sésame noir grillé.",temps:"1h",kcal:"~310 kcal",
          ing:[["Pâte sablée","1 rouleau","1 rouleau","2 rouleaux"],["Kakis bien mûrs","2","4","8"],["Gousse de vanille","1","2","4"],["Sucre","50 g","100 g","200 g"],["Crème liquide","10 cl","20 cl","40 cl"],["Sésame noir","20 g","40 g","80 g"],["Œufs","1","2","4"]],
          steps:["Cuire la pâte (20 min) : foncer, cuire à blanc à 180°C.","Préparer l'appareil (5 min) : mixer la chair des kakis avec les œufs, la crème, le sucre et les graines de vanille.","Garnir (2 min) : verser sur le fond précuit.","Cuire (30 min) : four à 170°C, jusqu'à ce que l'appareil soit pris.","Finir (3 min) : torréfier le sésame noir à sec, en parsemer la tartelette tiède."],
          bienetre:"Le kaki est riche en fibres et en vitamine C ; le sésame noir apporte du calcium.",secret:"Choisir des kakis très mûrs, presque gélatineux : c'est ce qui fait la texture soyeuse de l'appareil.",allergenes:"Gluten — Œuf — Lait — Sésame — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Infusion de Cannelle",kcal:"~0 kcal/tasse",
          ing:[["Cannelle","1 bâton","2 bâtons","4 bâtons"],["Eau frémissante","150 ml","300 ml","600 ml"]],
          steps:["Chauffer (3 min).","Infuser (8 min).","Filtrer (30 sec).","Servir (30 sec)."],
          alt:"Infusion de vanille."},
        accord:"Une infusion de cannelle, en écho à la vanille du dessert.",vin:"Muscat de Beaumes-de-Venise, très frais."},
            {id:"a23",numero:23,
        plat:{titre:"Crumble Pommes & Noisettes",tagline:"Le crumble familial, aux pommes fondantes et aux noisettes torréfiées.",temps:"45 min",kcal:"~370 kcal",
          ing:[["Pommes","4","8","16"],["Farine","100 g","200 g","400 g"],["Beurre","80 g","160 g","320 g"],["Sucre roux","80 g","160 g","320 g"],["Noisettes","50 g","100 g","200 g"],["Cannelle","1 c. à c.","2 c. à c.","4 c. à c."]],
          steps:[
            "Préparer les pommes (10 min) : pelez les pommes, retirez le cœur et les pépins, puis coupez-les en dés de 2 cm. Dans un saladier, mélangez-les avec la cannelle et 2 cuillères à soupe de sucre roux. Choisissez des pommes qui tiennent à la cuisson (Reinette, Boskoop, Golden) : elles doivent rester fondantes sans se transformer en compote.",
            "Préparer la pâte à crumble (5 min) : dans un autre saladier, mettez la farine, le reste du sucre roux et le beurre très froid coupé en petits dés. Du bout des doigts, frottez le beurre avec la farine pour former un sable grossier : des morceaux irréguliers, avec des grumeaux de tailles différentes. C'est cette irrégularité qui donnera le croustillant. Ne formez surtout pas une boule.",
            "Concasser les noisettes (3 min) : torréfiez les noisettes à sec dans une poêle 5 minutes, en remuant constamment, jusqu'à ce qu'elles embaument. Frottez-les dans un torchon propre pour retirer les peaux (facultatif). Concassez-les au couteau, jamais au mixeur (elles deviendraient pâteuses). Incorporez-les au crumble.",
            "Assembler et cuire (30 min) : beurrez un plat à gratin (20-22 cm). Versez les pommes en une couche régulière. Effritez la pâte à crumble sur le dessus, sans tasser — laissez les grumeaux se répartir naturellement. Enfournez à 180°C (chaleur traditionnelle) pour 30 minutes. Le crumble est prêt quand le dessus est doré et croustillant, et que les pommes bouillonnent sur les bords. Si le dessus brunit trop vite, couvrez d'aluminium.",
            "Laisser tiédir et servir (10 min) : sortez le crumble du four et laissez-le reposer 10 minutes. Il se déguste tiède, avec une boule de glace vanille ou une cuillère de crème fraîche épaisse. Le contraste entre le croustillant du crumble, le fondant des pommes et le froid de la glace fait tout le charme de ce dessert."
          ],
          bienetre:"La pomme et la cannelle forment un duo traditionnel : la cannelle est reconnue pour aider à réguler la glycémie.",secret:"Concasser les noisettes au couteau, jamais au mixeur : elles gardent leur croquant.",allergenes:"Gluten — Lait — Fruits à coque (noisettes) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Cidre Doux",kcal:"~70 kcal/verre",
          ing:[["Cidre doux","10 cl","20 cl","40 cl"]],
          steps:[
            "Refroidir (2 h) : placez la bouteille au réfrigérateur 2 heures minimum. Le cidre doux se sert bien frais.",
            "Servir (1 min) : versez dans des verres à pied en inclinant doucement. Servez aussitôt, avec le crumble encore tiède."
          ],
          alt:"Jus de pomme trouble artisanal."},
        accord:"Un cidre doux, en écho aux pommes.",vin:"Pommeau, servi frais."},
            {id:"a24",numero:24,
        plat:{titre:"Patate Douce Blanche, Vanille Noire & Croustillant de Sarrasin",tagline:"Une patate douce rôtie, une crème à la vanille noire, un croustillant de sarrasin caramélisé.",temps:"50 min + 2h de froid",kcal:"~340 kcal",
          ing:[["Patates douces blanches","2","4","8"],["Gousse de vanille noire","1","2","4"],["Crème liquide entière","20 cl","40 cl","80 cl"],["Mascarpone","125 g","250 g","500 g"],["Sucre glace","60 g","120 g","240 g"],["Farine de sarrasin","40 g","80 g","160 g"],["Beurre","30 g","60 g","120 g"],["Sucre roux","30 g","60 g","120 g"]],
          steps:[
            "Rôtir les patates douces (30 min) : préchauffez le four à 200°C. Lavez les patates douces blanches (peau fine, ne pas peler). Disposez-les sur une plaque, piquez-les à la fourchette en 3 ou 4 points. Enfournez 30 minutes, jusqu'à ce qu'elles soient tendres à cœur (une lame de couteau doit s'enfoncer sans résistance). Laissez refroidir complètement, puis pelez-les et écrasez la chair à la fourchette. Réservez au frais.",
            "Préparer la crème vanille noire (10 min) : fendez la gousse de vanille noire en deux, grattez les graines. Fouettez le mascarpone (sorti 10 minutes avant) avec le sucre glace et les graines de vanille, jusqu'à obtenir une crème lisse et brillante. Incorporez la chair de patate douce refroidie, en 3 fois, en mélangeant à la spatule — la crème doit devenir onctueuse, homogène, légèrement pâle. Goûtez : si la crème est trop sucrée, réduisez le sucre glace. Réservez au frais.",
            "Préparer le croustillant de sarrasin (10 min) : dans une poêle sèche, torréfiez la farine de sarrasin à feu moyen, en remuant constamment, 3 à 4 minutes — elle doit prendre une couleur caramel clair et dégager une odeur de noisette grillée. Retirez immédiatement du feu, versez dans une assiette froide. Dans un saladier, mélangez la farine torréfiée refroidie avec le sucre roux. Ajoutez le beurre fondu tiède, mélangez jusqu'à obtenir une pâte sableuse. Étalez en fine couche sur une plaque chemisée de papier cuisson. Cuisez 12 minutes à 170°C, jusqu'à dorure. Laissez refroidir complètement, puis cassez en éclats irréguliers.",
            "Monter en verrines (5 min) : dans des verres transparents, alternez : une couche de crème de patate douce (2 cm), quelques éclats de croustillant de sarrasin, puis une nouvelle couche de crème. Terminez par une couche de crème, lissez à la spatule.",
            "Réserver et servir (2 h) : placez les verrines au réfrigérateur 2 heures minimum — la crème doit prendre fermement. Au moment de servir, ajoutez sur le dessus 2 ou 3 gros éclats de croustillant, et grattez un peu de vanille noire au-dessus pour le décor. Le contraste entre la crème douce, vanillée, et le croustillant au sarrasin torréfié est saisissant."
          ],
          bienetre:"La patate douce blanche est riche en fibres douces et en bêtacarotène ; le sarrasin est naturellement sans gluten. Un dessert d'automne chaleureux et digeste.",secret:"Torréfier la farine de sarrasin à sec est la clé : elle développe des arômes de noisette incomparables, qui subliment le dessert. Ne jamais la faire brûler : 4 minutes maximum.",allergenes:"Lait — Végétarien (sans gluten)",
          veg:"Végétarien."},

          steps:[
            "Infuser (5 min) : dans une petite casserole, portez 20 cl d'eau à frémissement avec le thé noir, les gousses de cardamome écrasées, le bâton de cannelle et le gingembre râpé. Laissez infuser 5 minutes à couvert.",

            "Servir (1 min) : remplissez un grand verre de glaçons, versez le thé concentré, ajoutez le lait froid en filet. Remuez délicatement. Un trait de miel si vous aimez."

            {id:"a25",numero:25,
        plat:{titre:"Cheesecake Yuzu, Coulis Gingembre & Biscuit Sarrasin",tagline:"Un cheesecake moderne, très vertical : appareil léger au yuzu, biscuit sarrasin torréfié, coulis de gingembre frais.",temps:"40 min + 4h de froid",kcal:"~360 kcal",
          ing:[["Biscuits sablés","100 g","200 g","400 g"],["Farine de sarrasin","20 g","40 g","80 g"],["Beurre fondu","50 g","100 g","200 g"],["Cream cheese","250 g","500 g","1 kg"],["Yuzu (jus + zestes)","1/2","1","2"],["Crème liquide entière","20 cl","40 cl","80 cl"],["Sucre glace","60 g","120 g","240 g"],["Gélatine","2 feuilles","4 feuilles","8 feuilles"],["Gingembre frais (coulis)","petit morceau","morceau moyen","grand morceau"],["Citron (coulis)","1/2","1","2"],["Sucre (coulis)","40 g","80 g","160 g"],["Zestes confits (décor)","2","4","8"]],
          steps:[
            "Torréfier la farine de sarrasin (5 min) : dans une poêle sèche, à feu moyen, faites torréfier la farine de sarrasin en remuant constamment à la spatule — elle doit prendre une couleur caramel clair et dégager une odeur de noisette grillée. Attention, la farine brunit très vite : comptez 3 à 4 minutes maximum. Retirez immédiatement du feu et versez dans une assiette froide pour stopper la cuisson. Laissez refroidir complètement — une farine chaude ramollirait le beurre de la base.",
            "Préparer la base (10 min) : mixez les biscuits sablés au robot (ou écrasez-les au rouleau dans un sac congélation) jusqu'à obtenir une poudre fine. Dans un saladier, mélangez cette poudre avec la farine de sarrasin torréfiée et le beurre fondu tiède. Mélangez à la fourchette jusqu'à obtenir une pâte sableuse qui se tient. Tassez-la au fond d'un cercle à pâtisserie ou d'un moule à charnière (18-20 cm) posé sur une assiette, en appuyant fermement avec le dos d'une cuillère. Réservez 30 minutes au réfrigérateur — la base doit être bien froide et ferme pour supporter le poids de l'appareil.",
            "Préparer l'appareil au yuzu (15 min) : faites ramollir les feuilles de gélatine dans un bol d'eau très froide (avec quelques glaçons) pendant 5 minutes. Fouettez le cream cheese (sorti 15 minutes avant) avec 2 c. à s. de sucre glace et les zestes de yuzu, jusqu'à obtenir une crème parfaitement lisse. Essorez la gélatine, faites-la fondre 15 secondes au micro-ondes avec 1 c. à s. de jus de yuzu (ou à défaut, d'eau), puis incorporez-la à la crème en fouettant vigoureusement. Montez la crème liquide bien froide avec le reste du sucre glace en chantilly souple — elle doit former un bec d'oiseau mou. Incorporez délicatement la chantilly à la crème au cream cheese en 3 fois, à la maryse, en soulevant la masse du bas vers le haut. Ajoutez enfin le reste du jus de yuzu et mélangez une dernière fois.",
            "Monter et réserver (5 min + 4 h) : versez l'appareil sur la base biscuitée bien froide, en répartissant uniformément. Lissez la surface à la spatule coudée en partant du centre vers les bords, puis tapotez légèrement le moule sur le plan de travail pour chasser les bulles d'air. Filmez au contact (le film doit toucher la surface) ou couvrez d'un couvercle. Placez au réfrigérateur 4 heures minimum — idéalement toute une nuit, pour que l'appareil prenne fermement et que le yuzu parfume toute la crème.",
            "Préparer le coulis et dresser (10 min) : pelez et râpez finement le gingembre frais — le jus doit être extrait au maximum. Dans une petite casserole, chauffez le jus d'un demi-citron avec 40 g de sucre et le gingembre râpé, à feu doux, 3 minutes, sans bouillir. Filtrez au chinois pour retirer les fibres de gingembre. Laissez refroidir. Pour démouler : passez un torchon chaud autour du cercle, puis ouvrez délicatement. Disposez quelques zestes confits sur le dessus, arrosez chaque part d'un trait de coulis de gingembre au moment de servir, et ajoutez un voile discret de sarrasin torréfié tamisé."
          ],
          bienetre:"Le yuzu est très riche en vitamine C, et sa note acidulée réveille le palais sans alourdir. Le gingembre est traditionnellement reconnu pour stimuler la digestion — un accord parfait pour terminer un repas.",secret:"Le biscuit sarrasin torréfié est la signature de cette recette : il faut vraiment torréfier la farine à sec dans la poêle avant de l'incorporer. C'est ce qui donne cette note de noisette grillée qui prolonge le yuzu.",allergenes:"Gluten — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Hōjicha Glacé",kcal:"~0 kcal/verre",
          ing:[["Thé hōjicha (thé vert grillé)","1 c. à c.","2 c. à c.","4 c. à c."],["Eau à 90°C","150 ml","300 ml","600 ml"],["Glaçons","PM","PM","PM"]],
          steps:[
            "Infuser (3 min) : portez l'eau à 90°C (un hōjicha supporte une eau presque bouillante). Versez sur les feuilles dans une petite théière, couvrez, laissez infuser 3 minutes. Le thé doit prendre une teinte ambrée claire, aux notes torréfiées prononcées.",
            "Refroidir (1 h) : filtrez au chinois et placez au réfrigérateur au moins 1 heure. Le thé glacé doit être bien froid.",
            "Servir (1 min) : versez sur des glaçons dans un grand verre. Le hōjicha glacé se boit sans sucre — ses notes grillées rappellent le sarrasin torréfié du biscuit."
          ],
          alt:"Thé vert sencha glacé (plus vif), ou un kombucha nature."},
        accord:"Un thé japonais grillé, qui prolonge les notes de sarrasin torréfié du biscuit.",vin:"Saké junmai légèrement frais, ou un Muscat de Beaumes-de-Venise très frais."},
           {id:"a26",numero:26,
        plat:{titre:"Fondant Chocolat & Châtaigne",tagline:"Un fondant au chocolat noir, avec un cœur de crème de châtaigne.",temps:"30 min",kcal:"~420 kcal",
          ing:[["Chocolat noir 70%","150 g","300 g","600 g"],["Beurre","100 g","200 g","400 g"],["Œufs","3","6","12"],["Sucre","80 g","160 g","320 g"],["Farine","40 g","80 g","160 g"],["Crème de marrons","100 g","200 g","400 g"]],
          steps:[
            "Fondre le chocolat (5 min) : cassez le chocolat en morceaux, ajoutez le beurre coupé en dés. Faites fondre au bain-marie à feu doux, en remuant à la spatule, jusqu'à obtenir un mélange lisse et brillant. Retirez du bain-marie et laissez tiédir 5 minutes — le chocolat doit être tiède au toucher, pas brûlant.",
            "Préparer les moules et le cœur châtaigne (3 min) : beurrez généreusement 6 petits moules à fondant, puis farinez-les légèrement en tapotant pour retirer l'excédent. Placez la crème de marrons au congélateur 30 minutes avant — elle doit être bien froide pour rester fondante au cœur du fondant. Déposez une cuillère de crème de marrons dans chaque moule.",
            "Blanchir les œufs (3 min) : dans un saladier, fouettez les œufs avec le sucre pendant 2 à 3 minutes, jusqu'à ce que le mélange blanchisse et double de volume. Ajoutez le chocolat fondu tiédi en 3 fois, puis la farine tamisée. Mélangez sans trop travailler.",
            "Garnir et cuire (10 min) : préchauffez le four à 200°C (chaleur traditionnelle, pas tournante). Versez la pâte sur la crème de marrons froide, en remplissant les moules aux 3/4. Enfournez pour 10 minutes précises : le dessus doit être pris et légèrement craquelé, mais le centre doit trembler quand on secoue doucement le moule.",
            "Démouler et servir (2 min) : sortez les fondants du four, laissez reposer 1 minute dans les moules, puis démoulez en retournant sur une assiette. Servez immédiatement — le cœur doit être coulant. Accompagnez d'une boule de glace vanille ou d'une cuillère de crème fraîche pour contraster avec le chocolat intense."
          ],
          bienetre:"Le chocolat noir à 70% est riche en flavonoïdes antioxydants ; la châtaigne apporte des glucides complexes.",secret:"Placer la crème de marrons au congélateur 30 minutes avant : elle reste fondante au cœur du fondant.",allergenes:"Œuf — Lait — Gluten — Soja possible — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Espresso Serré",kcal:"~2 kcal/tasse",
          ing:[["Café en grains","7 g","14 g","28 g"],["Eau","3 cl","6 cl","12 cl"]],
          steps:[
            "Moudre (30 sec) : moulez le café très finement, juste avant l'extraction — un café moulu à l'avance perd ses arômes.",
            "Extraire (25 sec) : extrayez un espresso serré (25 secondes environ). La crème doit être couleur noisette et dense.",
            "Servir (30 sec) : versez dans une petite tasse préchauffée à l'eau chaude puis essuyée. Se boit en une ou deux gorgées, sans sucre, juste après avoir cassé la coque du fondant."
          ],
          alt:"Ristretto, encore plus concentré."},
        accord:"Un espresso serré, en contraste avec le fondant.",vin:"Banyuls jeune, très légèrement frais."},
            {id:"a27",numero:27,
        plat:{titre:"Tarte Cacao, Poire Williams & Noix Caramélisées",tagline:"Une pâte sablée au cacao amer, des poires fondantes, des noix croustillantes caramélisées.",temps:"1h + 1h de froid",kcal:"~390 kcal",
          ing:[["Farine T55","150 g","300 g","600 g"],["Cacao amer en poudre","30 g","60 g","120 g"],["Beurre froid","100 g","200 g","400 g"],["Sucre glace","60 g","120 g","240 g"],["Œuf","1","2","4"],["Poires Williams","2","4","8"],["Noix","80 g","160 g","320 g"],["Sucre roux","60 g","120 g","240 g"],["Beurre demi-sel","30 g","60 g","120 g"],["Crème liquide","5 cl","10 cl","20 cl"]],
          steps:[
            "Préparer la pâte cacao (15 min) : dans un saladier, mélangez la farine tamisée et le cacao amer en poudre. Ajoutez le beurre froid coupé en petits dés, sablez du bout des doigts jusqu'à obtenir un sable grossier. Incorporez le sucre glace, puis l'œuf battu. Rassemblez la pâte en boule sans trop la travailler — elle doit être souple et homogène, sans craqueler. Aplatissez en disque, filmez, réservez 1 heure au réfrigérateur : ce passage au froid fige le beurre et évite que la pâte ne se rétracte à la cuisson.",
            "Cuire à blanc (20 min) : préchauffez le four à 180°C. Étalez la pâte sur 3 mm d'épaisseur, foncez un moule à tarte beurré en faisant bien adhérer les bords. Piquez le fond à la fourchette en quinconce. Recouvrez de papier cuisson et de billes de cuisson, cuisez 20 minutes, jusqu'à ce que les bords soient bien dorés. Retirez les billes et laissez refroidir sur une grille.",
            "Préparer le caramel noix (10 min) : dans une casserole à fond épais, faites fondre le sucre roux à sec, à feu moyen, sans remuer — laissez caraméliser sur les bords puis ramenez doucement le sucre fondu vers le centre à la spatule. Quand le caramel prend une belle couleur ambrée, hors du feu, versez la crème liquide chaude en filet (attention aux projections) et mélangez. Ajoutez le beurre demi-sel en morceaux et remuez jusqu'à incorporation complète. Hors du feu, ajoutez les noix concassées grossièrement au couteau — elles doivent être enrobées de caramel. Étalez sur une plaque chemisée, laissez refroidir et durcir complètement (15 minutes). Cassez ensuite en éclats irréguliers.",
            "Garnir la tarte (10 min) : pelez les poires Williams, coupez-les en fines lamelles régulières (2 mm) — utilisez une mandoline si vous en avez une. Disposez les lamelles en rosace serrée sur le fond de tarte refroidi, en commençant par l'extérieur et en les chevauchant légèrement. Arrosez d'un filet de caramel au beurre salé (gardez-en un peu pour le décor). Parsemez d'éclats de noix caramélisées.",
            "Finir et servir (10 min) : repassez la tarte 8 minutes au four à 180°C, juste pour fondre légèrement le caramel et tiédir les poires. Laissez tiédir 10 minutes sur une grille avant de servir. Servez chaque part avec une quenelle de crème fraîche épaisse ou une boule de glace vanille — l'accord cacao-poire-noix est un classique d'automne."
          ],
          bienetre:"Le cacao amer est riche en flavonoïdes antioxydants ; la poire apporte des fibres douces ; les noix, de bons lipides et du magnésium. Un dessert d'automne gourmand et digeste.",secret:"Éclater les noix au couteau, jamais au mixeur : les éclats irréguliers gardent leur croquant et leur mâche.",allergenes:"Gluten — Œuf — Lait — Fruits à coque (noix) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Café de Spécialité Filtre",kcal:"~2 kcal/tasse",
          ing:[["Café de spécialité (Éthiopie, Kenya)","15 g","30 g","60 g"],["Eau filtrée","25 cl","50 cl","1 L"]],
          steps:[
            "Moudre (30 sec) : moulez le café en grains, juste avant l'extraction, en mouture moyenne (comme du sable). Le café doit être frais — un café moulu à l'avance perd 60% de ses arômes en 30 minutes.",
            "Chauffer l'eau (2 min) : portez l'eau à 92-94°C. Un thermomètre est idéal.",
            "Extraire (4 min) : versez l'eau en plusieurs fois sur le café, dans un filtre en papier. Le café doit couler lentement (3 à 4 minutes au total).",
            "Servir (30 sec) : versez dans une petite tasse préchauffée. Le café filtre se boit sans sucre — ses notes fruitées prolongent la poire Williams."
          ],
          alt:"Espresso serré, si vous préférez l'intensité."},
                    accord:"Un café fruité, en écho aux poires Williams et au cacao amer.",vin:"Maury ou Banyuls, légèrement frais."}
    ]
  },
  hiver:{
    id:"hiver", nom:"Hiver", tagline:"Chocolat, Agrumes & Épices", stripe:"#5C3A1E",
    intro:"L'hiver est la saison du chocolat, des agrumes, du caramel et du matcha. Bûches, crèmes brûlées, millefeuilles, zuccotti, truffes — des desserts réconfortants, généreux, qui célèbrent la fin d'année.",
    duos:[
            {id:"h28",numero:28,
        plat:{titre:"Millefeuille Chocolat Noir & Thé Earl Grey",tagline:"Un millefeuille où le chocolat noir rencontre le bergamote du Earl Grey.",temps:"1h30 + 2h",kcal:"~440 kcal",
          ing:[["Pâte feuilletée","1 rouleau","1 rouleau","2 rouleaux"],["Chocolat noir 70%","150 g","300 g","600 g"],["Crème liquide","25 cl","50 cl","1 L"],["Thé Earl Grey","2 c. à s.","4 c. à s.","8 c. à s."],["Sucre glace","au goût","au goût","au goût"]],
          steps:[
            "Cuire la pâte feuilletée (25 min) : préchauffez le four à 190°C. Étalez la pâte en un rectangle régulier de 3 mm d'épaisseur, piquez-la généreusement à la fourchette. Posez-la sur une plaque recouverte de papier cuisson, puis couvrez d'une seconde plaque identique — c'est ce qui va la garder parfaitement plate et croustillante. Enfournez 25 minutes, jusqu'à ce que la pâte soit bien dorée. Laissez refroidir à plat, puis découpez des rectangles réguliers (4 × 10 cm).",
            "Infuser le thé (10 min) : chauffez la crème liquide à frémissement (sans bouillir). Retirez du feu, ajoutez 2 c. à s. de thé Earl Grey (en vrac, ou l'intérieur de 2 sachets). Couvrez et laissez infuser 10 minutes. Filtrez au chinois fin en pressant légèrement sur les feuilles pour extraire tout le parfum. La crème doit être parfumée mais pas amère.",
            "Préparer la ganache (5 min) : hachez finement le chocolat noir et mettez-le dans un saladier. Réchauffez la crème infusée au Earl Grey jusqu'à frémissement. Versez-la en 3 fois sur le chocolat, en mélangeant à la maryse au centre en petits cercles concentriques à chaque ajout. Quand la ganache est lisse, filmez au contact et placez au réfrigérateur 2 heures minimum.",
            "Monter la ganache (3 min) : sortez la ganache refroidie du réfrigérateur. Fouettez-la au batteur à vitesse moyenne pendant 1 à 2 minutes — elle doit s'éclaircir et devenir mousseuse. Ne la fouettez pas trop longtemps : elle deviendrait granuleuse.",
            "Monter et finir (5 min) : sur une assiette ou un plat de service, posez un premier rectangle de pâte feuilletée croustillante. À la poche à douille (ou à la cuillère), déposez une couche de ganache mousseuse (1 cm environ). Posez un second rectangle de pâte. Répétez : ganache + pâte. Terminez par un dernier rectangle de pâte. Saupoudrez d'un voile de sucre glace tamisé juste avant de servir. Servez aussitôt : le millefeuille perd son croustillant en 30 minutes une fois monté."
          ],
          bienetre:"Le chocolat noir à 70% est riche en flavonoïdes antioxydants ; le thé Earl Grey apporte de la bergamote, traditionnellement apaisante.",secret:"Infuser le thé directement dans la crème chaude, puis filtrer : c'est ce qui donne tout le parfum sans amertume.",allergenes:"Gluten — Lait — Soja possible — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Earl Grey",kcal:"~0 kcal/tasse",
          ing:[["Thé Earl Grey","1 c. à c.","2 c. à c.","4 c. à c."],["Eau à 90°C","150 ml","300 ml","600 ml"]],
          steps:[
            "Chauffer (2 min) : portez l'eau à 90°C (un Earl Grey supporte une eau presque bouillante, jamais bouillante franche).",
            "Infuser (3 min) : versez sur les feuilles dans une petite théière, couvrez. Le thé doit être ambré clair, avec une pointe de bergamote franche.",
            "Filtrer (30 sec) : passez au chinois sans presser les feuilles.",
            "Servir (30 sec) : en tasse fine préchauffée, sans sucre ni lait — le Earl Grey se boit nature pour laisser parler la bergamote."
          ],
          alt:"Earl Grey décaféiné."},
        accord:"Un Earl Grey, en écho direct au millefeuille.",vin:"Banyuls, en digestif."},
            {id:"h29",numero:29,
        plat:{titre:"Zuccotto",tagline:"Le dessert italien par excellence : chocolat, fruits secs et épices.",temps:"1h + 2h",kcal:"~380 kcal",
          ing:[["Chocolat noir","200 g","400 g","800 g"],["Crème liquide","15 cl","30 cl","60 cl"],["Amandes","60 g","120 g","240 g"],["Noisettes","60 g","120 g","240 g"],["Pistaches","60 g","120 g","240 g"],["Cédrat confit","40 g","80 g","160 g"],["Épices (cannelle, muscade)","1 pincée","2 pincées","4 pincées"]],
          steps:[
            "Torréfier les fruits secs (8 min) : faites torréfier séparément les amandes, les noisettes et les pistaches à sec dans une poêle, à feu moyen, en remuant constamment. Les amandes et noisettes demandent 5 à 6 minutes, les pistaches 3 à 4 minutes seulement — elles brûlent vite. Réservez-les sur une assiette pour refroidir complètement. L'objectif : réveiller les arômes sans colorer trop fort.",
            "Fondre le chocolat (5 min) : cassez le chocolat noir en morceaux, ajoutez la crème liquide. Faites fondre au bain-marie à feu doux, en remuant à la spatule, jusqu'à obtenir un mélange lisse et brillant. Retirez du feu et laissez tiédir 3 minutes.",
            "Mélanger la préparation (3 min) : concassez grossièrement les fruits secs torréfiés au couteau (pas au mixeur, qui les transformerait en poudre). Ajoutez-les au chocolat fondu tiédi, avec le cédrat confit coupé en petits dés, la cannelle et la muscade. Mélangez jusqu'à obtenir une pâte homogène et compacte. Si elle semble trop liquide, ajoutez 1 ou 2 c. à s. de fruits secs concassés supplémentaires.",
            "Façonner et réserver (2 h) : versez la préparation sur une feuille de film alimentaire, formez une boule compacte en serrant bien dans le film. Placez au réfrigérateur 2 heures minimum — la préparation durcit en refroidissant et devient plus facile à découper. Le froid permet aussi aux arômes de se mélanger.",
            "Découper et servir (5 min) : sortez la boule du réfrigérateur, retirez le film. Découpez en tranches fines (1 cm) ou en cubes, avec un couteau bien affûté passé sous l'eau chaude et essuyé entre chaque coupe. Disposez sur un plat, en laissant les tranches à température ambiante 10 minutes avant de servir — le chocolat s'assouplit et libère tous ses arômes. Se conserve 1 semaine au frais dans une boîte hermétique."
          ],
          bienetre:"Le chocolat noir et les fruits secs forment un duo riche en magnésium et en bons lipides — un dessert de fête à savourer avec modération.",secret:"Laisser la préparation reposer 2 heures : elle durcit et se découpe proprement en tranches fines.",allergenes:"Lait — Fruits à coque (amandes, noisettes, pistaches) — Soja possible — Végétarien (sans gluten)",
          veg:"Végétarien, sans gluten."},
        boisson:{titre:"Vin Santo",kcal:"~90 kcal/verre",
          ing:[["Vin Santo","4 cl","8 cl","16 cl"]],
          steps:[
            "Refroidir légèrement (1 h) : placez la bouteille au réfrigérateur 1 heure — un Vin Santo se sert autour de 14-16°C, jamais glacé.",
            "Servir (30 sec) : versez dans un petit verre à vin doux, à moitié rempli.",
            "Déguster (—) : humez d'abord les notes de fruits secs et de miel, puis buvez à petites gorgées. C'est le digestif toscan par excellence, en accord parfait avec les zuccotti."
          ],
          alt:"Café serré, ou un jus de raisin concentré."},
        accord:"Un Vin Santo, en écho à l'Italie et au chocolat.",vin:"Vin Santo toscan, en digestif."},
           {id:"h30",numero:30,
        plat:{titre:"Bûche Chocolat & Clémentine",tagline:"La bûche de Noël : chocolat noir intense, cœur clémentine, glaçage miroir.",temps:"1h30 + 3h",kcal:"~440 kcal",
          ing:[["Génoise chocolat","1 plaque","1 plaque","2 plaques"],["Chocolat noir 70%","200 g","400 g","800 g"],["Crème liquide","30 cl","60 cl","1,2 L"],["Clémentines","4","8","16"],["Beurre","50 g","100 g","200 g"]],
          steps:[
            "Préparer la génoise (15 min) : préchauffez le four à 200°C. Fouettez 4 œufs entiers avec 120 g de sucre au bain-marie jusqu'à ce que le mélange atteigne 40°C et blanchisse. Retirez du bain-marie et continuez à fouetter 5-8 minutes au batteur jusqu'à obtenir un ruban bien marqué. Incorporez délicatement 100 g de farine tamisée et 20 g de cacao en poudre, en 3 fois, à la maryse. Étalez sur une plaque chemisée (30×40 cm) et enfournez 10 minutes. La génoise doit être souple et se détacher facilement du papier.",
            "Préparer le crémeux clémentine (15 min) : pressez les clémentines pour obtenir environ 15 cl de jus (filtrez pour retirer les pépins). Faites chauffer la moitié du jus avec 30 g de sucre. Hors du feu, ajoutez 1,5 feuille de gélatine préalablement ramollie dans l'eau froide et essorée. Mélangez, ajoutez le reste du jus, puis réservez au réfrigérateur dans un plat peu profond : le crémeux doit prendre en 30 minutes environ, mais rester souple.",
            "Préparer la ganache (10 min) : chauffez 30 cl de crème liquide entière à frémissement. Versez-la en 3 fois sur 200 g de chocolat noir haché finement, en mélangeant à la maryse au centre, en petits cercles concentriques, à chaque ajout. Quand la ganache est lisse, ajoutez 50 g de beurre en morceaux et mélangez. Filmez au contact et placez au réfrigérateur 2 heures minimum.",
            "Monter la bûche (5 min) : étalez la génoise sur un torchon propre légèrement humide. Répartissez une couche de ganache refroidie (gardez-en la moitié pour l'extérieur), puis une couche de crémeux clémentine bien froid. Roulez la génoise en serrant bien, en vous aidant du torchon. Le roulage doit se faire quand la génoise est encore légèrement tiède : elle craquelle moins.",
            "Glacer et décorer (10 min + 1 h) : coupez les extrémités du rouleau pour avoir des bords nets. Posez la bûche sur un plat de service. Réchauffez légèrement la ganache restante au bain-marie pour la rendre nappante (elle doit être à environ 30°C). Versez-la sur la bûche en la lissant à la spatule coudée d'un geste continu. Décorez de suprêmes de clémentine fraîche et de quelques copeaux de chocolat. Placez au frais 1 heure minimum avant de servir. Découpez des tranches d'environ 2 cm à l'aide d'un couteau passé sous l'eau chaude et essuyé entre chaque coupe."
          ],
          bienetre:"Un dessert de fête, généreux — à déguster avec modération, mais avec un vrai plaisir.",secret:"Rouler la génoise encore tiède : elle se craquelle moins.",allergenes:"Gluten — Œuf — Lait — Soja possible — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Champagne Brut",kcal:"~80 kcal/verre",
          ing:[["Champagne brut","10 cl","20 cl","40 cl"]],
          steps:[
            "Refroidir (2 h) : placez la bouteille au réfrigérateur au moins 2 heures. Idéal : 8-10°C.",
            "Servir (1 min) : ouvrez la bouteille en tournant la bouteille (pas le bouchon) pour éviter les projections. Versez dans des flûtes bien froides, en inclinant le verre pour préserver la mousse."
          ],
          alt:"Crémant brut nature."},
        accord:"Un accord de fête, en contraste avec la richesse de la bûche.",vin:"Champagne brut."},
            {id:"h31",numero:31,
        plat:{titre:"Crème Brûlée Vanille & Matcha",tagline:"La crème brûlée classique, où le matcha intense répond à la vanille.",temps:"30 min + 2h",kcal:"~380 kcal",
          ing:[["Jaunes d'œufs","3","6","12"],["Crème liquide","25 cl","50 cl","1 L"],["Sucre","60 g","120 g","240 g"],["Gousse de vanille","1","2","4"],["Matcha en poudre","1 c. à c.","2 c. à c.","4 c. à c."],["Sucre roux","1 c. à s.","2 c. à s.","4 c. à s."]],
          steps:[
            "Infuser la vanille (10 min) : fendez la gousse de vanille en deux dans la longueur, grattez les graines avec la pointe d'un couteau. Mettez la gousse, les graines et la crème dans une casserole. Chauffez à feu doux jusqu'aux premiers frémissements, puis retirez du feu et couvrez. Laissez infuser 10 minutes. Retirez la gousse avant de continuer.",
            "Blanchir et incorporer le matcha (5 min) : dans un saladier, fouettez les jaunes avec le sucre pendant 2-3 minutes jusqu'à ce que le mélange blanchisse. Tamisez 1 c. à c. de matcha au-dessus et incorporez-le au fouet. Le tamisage est essentiel — le matcha non tamisé forme des grumeaux dans la crème.",
            "Mélanger délicatement (2 min) : versez la crème tiède (pas chaude) en filet sur les jaunes blanchis au matcha, en fouettant doucement et constamment. Si la crème est trop chaude, elle cuit les jaunes et crée des grumeaux. Passez le mélange au chinois fin pour retirer les éventuels filaments d'œuf.",
            "Cuire au bain-marie (35 min) : versez la préparation dans 4 à 6 ramequins à crème brûlée (à bords droits). Disposez-les dans un grand plat creux et versez de l'eau chaude (pas bouillante) à mi-hauteur. Enfournez à 100°C (chaleur traditionnelle) pour 35 minutes. La crème est prête quand elle tremble légèrement au centre quand on secoue le ramequin. Laissez refroidir à température ambiante, puis placez au réfrigérateur 2 heures minimum.",
            "Caraméliser et servir (2 min) : au moment de servir, saupoudrez chaque ramequin d'une fine couche de sucre roux (environ 1 cuillère à café), en répartissant bien jusqu'aux bords. Caramélisez au chalumeau de cuisine en effectuant des petits cercles réguliers, jusqu'à obtenir une croûte dorée brillante. Sans chalumeau : passez les ramequins 2 minutes sous le gril du four très chaud, en surveillant attentivement. Servez aussitôt : la croûte doit être craquante et la crème froide."
          ],
          bienetre:"Le matcha est riche en catéchines antioxydantes ; la vanille est traditionnellement apaisante.",secret:"Tamiser le matcha avant de l'incorporer : sinon il forme des grumeaux dans la crème.",allergenes:"Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Matcha Cérémonial",kcal:"~5 kcal/tasse",
          ing:[["Matcha en poudre","1 c. à c.","2 c. à c.","4 c. à c."],["Eau à 80°C","100 ml","200 ml","400 ml"]],
          steps:[
            "Tamiser (30 sec) : versez le matcha dans un bol à travers une petite passoire fine — obligatoire pour éviter les grumeaux.",
            "Délayer (1 min) : versez 7 cl d'eau à 80°C, fouettez au chasen (fouet à matcha) en zigzag rapide, 15 secondes, jusqu'à obtenir une mousse fine et dense en surface.",
            "Servir (immédiat) : buvez aussitôt, sans sucre — le matcha se boit traditionnellement pur, en une ou deux gorgées."
          ],
          alt:"Matcha latte (avec lait chaud mousseux)."},
        accord:"Un matcha cérémonial, en écho direct au dessert.",vin:"Un trait de Saké junmai, très frais."},
            {id:"h32",numero:32,
        plat:{titre:"Truffes Chocolat & Pistaches Grillées",tagline:"Des truffes fondantes, au chocolat noir et aux pistaches grillées.",temps:"30 min + 2h",kcal:"~190 kcal",
          ing:[["Chocolat noir 70%","200 g","400 g","800 g"],["Crème liquide","10 cl","20 cl","40 cl"],["Pistaches grillées","60 g","120 g","240 g"],["Cacao amer en poudre","au goût","au goût","au goût"]],
          steps:[
            "Préparer la ganache (5 min) : hachez finement le chocolat noir et mettez-le dans un saladier. Chauffez la crème liquide à frémissement. Versez-la en 3 fois sur le chocolat, en mélangeant à la maryse au centre en petits cercles concentriques à chaque ajout. Quand la ganache est parfaitement lisse, elle est prête. Le mélange en cercles concentriques (et non en fouettant) évite d'incorporer de l'air : la ganache restera dense et sans bulles.",
            "Torréfier les pistaches (3 min) : faites torréfier les pistaches à sec dans une poêle, à feu moyen, en remuant constamment — elles doivent prendre une couleur dorée et dégager un parfum de noisette grillée. Ne quittez pas la poêle : elles brûlent très vite. Concassez-les au couteau, jamais au mixeur (elles deviendraient pâteuses). Réservez-en la moitié pour l'enrobage final.",
            "Incorporer les pistaches (2 min) : ajoutez la moitié des pistaches concassées à la ganache encore tiède. Mélangez bien. Le contraste entre le chocolat fondant et les pistaches croustillantes fait toute la magie de ces truffes.",
            "Réserver au froid (2 h) : versez la ganache dans un plat peu profond, filmez au contact (le film doit toucher la surface) et placez au réfrigérateur 2 heures minimum. La ganache doit devenir ferme mais encore souple : elle doit se tenir à la cuillère mais pas durcir complètement. Si elle durcit trop, laissez-la 15 minutes à température ambiante avant de façonner.",
            "Façonner et enrober (10 min) : avec une petite cuillère (passée sous l'eau chaude et essuyée), prélevez des noisettes de ganache et roulez-les rapidement entre vos paumes pour former des boules irrégulières de 2 cm. Posez-les sur une plaque recouverte de papier cuisson. Si vos mains chauffent trop, plongez-les dans l'eau froide de temps en temps. Roulez chaque truffe dans le reste des pistaches concassées et, si vous aimez, dans un peu de cacao amer. Réservez au frais jusqu'au moment de servir. Se conservent 1 semaine au réfrigérateur, 3 semaines au congélateur."
          ],
          bienetre:"Le chocolat noir et les pistaches apportent magnésium et bons lipides — un plaisir de fin d'année.",secret:"Torréfier les pistaches juste avant de les concasser : elles gardent tout leur croquant.",allergenes:"Lait — Fruits à coque (pistaches) — Soja possible — Végétarien (sans gluten)",
          veg:"Végétarien, sans gluten."},
        boisson:{titre:"Rhum Ambré",kcal:"~90 kcal/verre",
          ing:[["Rhum ambré","4 cl","8 cl","16 cl"]],
          steps:[
            "Servir (30 sec) : versez le rhum ambré dans un verre tulipe, à température ambiante (18-20°C).",
            "Déguster (—) : humez les notes de vanille et de fruits secs, puis buvez à petites gorgées. Un trait de rhum ambré à côté d'une truffe au chocolat et pistaches, c'est un accord qui prolonge parfaitement le dessert."
          ],
          alt:"Café serré."},
        accord:"Un rhum ambré, en écho au chocolat et aux pistaches.",vin:"Banyuls, en digestif."},
           {id:"h33",numero:33,
        plat:{titre:"Couronne Briochée Pistache & Framboise Confite",tagline:"Une brioche roulée, une crème de pistache maison, des framboises confites, un glaçage rose.",temps:"1h30 + 2h de pousse",kcal:"~420 kcal",
          ing:[["Farine T45","300 g","600 g","1,2 kg"],["Levure de boulanger fraîche","15 g","30 g","60 g"],["Sucre","60 g","120 g","240 g"],["Œufs","3","6","12"],["Beurre pommade","120 g","240 g","480 g"],["Lait tiède","10 cl","20 cl","40 cl"],["Sel","5 g","10 g","20 g"],["Pistaches non salées","100 g","200 g","400 g"],["Framboises fraîches","150 g","300 g","600 g"],["Sucre glace","80 g","160 g","320 g"],["Sucre (pour le glaçage)","40 g","80 g","160 g"]],
          steps:[
            "Préparer la pâte briochée (20 min) : délayez la levure dans le lait tiède (jamais chaud) avec 1 c. à s. de sucre, laissez mousser 10 minutes. Dans la cuve d'un robot, mélangez la farine, le reste du sucre, le sel, les œufs et la levure diluée. Pétrissez 10 minutes à vitesse lente, jusqu'à ce que la pâte se détache des parois. Incorporez le beurre pommade en morceaux, petit à petit, en pétrissant 10 minutes à vitesse moyenne — la pâte doit devenir lisse, souple, élastique. Couvrez et laissez pousser 1 heure à température ambiante, puis 1 heure au frais (ou une nuit).",
            "Préparer la crème de pistache (10 min) : torréfiez 100 g de pistaches à sec dans une poêle, en remuant constamment, jusqu'à coloration dorée. Laissez refroidir sur une assiette. Mixez les pistaches au robot pendant 5 à 8 minutes, en raclant les parois régulièrement : la poudre va devenir une pâte lisse et brillante (l'huile naturelle des pistaches se libère). Incorporez progressivement 30 g de sucre glace et 2 c. à s. d'eau tiède pour obtenir une pâte de pistache souple, facile à étaler. Réservez.",
            "Préparer les framboises confites (15 min) : dans une casserole, chauffez 150 g de framboises avec 40 g de sucre à feu doux, 10 minutes, en écrasant les fruits à la cuillère. Le mélange doit compoter et épaissir légèrement. Passez au chinois pour retirer les pépins, réservez le coulis au frais.",
            "Façonner la couronne (15 min) : étalez la pâte briochée en un grand rectangle (40 × 30 cm). Étalez la crème de pistache en couche régulière, puis nappez d'une partie du coulis de framboise (gardez-en pour le glaçage). Roulez la pâte dans le sens de la longueur, bien serrée. Coupez le rouleau en deux dans la longueur, puis torsadez les deux brins ensemble pour former une couronne. Déposez sur une plaque chemisée, soudez les extrémités. Laissez pousser 1 heure à température ambiante.",
            "Cuire et glacer (25 min) : préchauffez le four à 170°C. Dorez la couronne au jaune d'œuf battu avec un peu d'eau. Enfournez 25 minutes — la couronne doit être bien dorée. Laissez tiédir 15 minutes sur une grille. Pendant ce temps, mélangez le reste du coulis de framboise avec 40 g de sucre glace, jusqu'à obtenir un glaçage lisse et brillant. Nappez la couronne encore tiède au pinceau, puis parsemez de quelques pistaches concassées. Servez tiède, en tranches épaisses."
          ],
          bienetre:"La pistache est riche en magnésium et en bons lipides ; la framboise, en antioxydants. Un dessert de fête qui se partage.",secret:"La pâte briochée doit reposer 2 heures (1 h ambiante + 1 h au frais) : c'est ce qui donne son moelleux incomparable. Ne raccourcissez jamais les temps de pousse.",allergenes:"Gluten — Œuf — Lait — Fruits à coque (pistaches) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Champagne Rosé",kcal:"~80 kcal/verre",
          ing:[["Champagne rosé","10 cl","20 cl","40 cl"]],
          steps:[
            "Refroidir (2 h) : placez la bouteille au réfrigérateur au moins 2 heures avant de servir. Idéal : 8-10°C.",
            "Servir (1 min) : ouvrez délicatement en tournant la bouteille (pas le bouchon), puis versez dans des flûtes bien froides, en inclinant le verre pour préserver la mousse."
          ],
          alt:"Champagne brut nature ou un Crémant rosé."},
        accord:"Un Champagne rosé festif, en écho direct aux framboises.",vin:"Champagne rosé brut."},
           {id:"h34",numero:34,
        plat:{titre:"Pain d'Épices & Citronnelle",tagline:"Un pain d'épices fondant, au miel et à la citronnelle fraîche.",temps:"1h",kcal:"~290 kcal",
          ing:[["Farine","200 g","400 g","800 g"],["Miel","150 g","300 g","600 g"],["Lait","10 cl","20 cl","40 cl"],["Œufs","2","4","8"],["Levure chimique","1 sachet","2 sachets","4 sachets"],["Citronnelle fraîche","1 tige","2 tiges","4 tiges"],["Épices (cannelle, gingembre, muscade, anis)","1 c. à c.","2 c. à c.","4 c. à c."]],
          steps:[
            "Infuser la citronnelle (10 min) : cassez les tiges de citronnelle avec le dos d'un couteau (ou roulez-les sous la paume) pour libérer les arômes. Dans une petite casserole, faites chauffer le miel avec le lait à feu doux, sans bouillir. Ajoutez la citronnelle cassée, couvrez et laissez infuser 10 minutes. Filtrez au chinois en pressant légèrement pour extraire tout le parfum.",
            "Préparer la pâte (3 min) : dans un saladier, mélangez la farine, la levure chimique et les épices. Ajoutez les œufs un à un, en mélangeant à la spatule. Versez ensuite le mélange miel-lait-citronnelle chaud et mélangez jusqu'à obtenir une pâte lisse et homogène. Le pain d'épices traditionnel se prépare avec une pâte assez liquide — c'est ce qui garantit un gâteau moelleux.",
            "Incorporer et reposer (2 min) : versez la pâte dans un moule à cake beurré et fariné (ou chemisé de papier cuisson). Laissez reposer 15 minutes à température ambiante avant d'enfourner — ce repos permet aux épices et à la citronnelle de commencer à diffuser.",
            "Cuire (45 min) : préchauffez le four à 160°C (chaleur traditionnelle). Enfournez pour 45 minutes. Le pain d'épices est cuit quand une lame de couteau plantée au centre ressort propre. Sa couleur doit être brun doré profond. Si le dessus brunit trop, couvrez d'une feuille d'aluminium.",
            "Attendre 24 h avant de déguster (24 h) : c'est la règle d'or du pain d'épices. À la sortie du four, il est encore un peu sec. Enveloppez-le dans du film alimentaire et laissez-le reposer au moins 24 heures (idéalement 2 à 3 jours) : les épices et la citronnelle vont continuer à infuser la mie, et le pain d'épices deviendra incroyablement moelleux et parfumé. Se conserve 2 semaines dans une boîte hermétique."
          ],
          bienetre:"Le pain d'épices traditionnel, riche en miel et en épices, est réputé pour son action apaisante sur la digestion.",secret:"Attendre 24 heures avant de déguster : le pain d'épices développe tous ses parfums avec le temps.",allergenes:"Gluten — Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Vin Chaud aux Épices",kcal:"~140 kcal/verre",
          ing:[["Vin rouge","10 cl","20 cl","40 cl"],["Miel","1 c. à s.","2 c. à s.","4 c. à s."],["Cannelle","1 bâton","2 bâtons","4 bâtons"],["Orange","1/2","1","2"]],
          steps:[
            "Chauffer (5 min) : dans une casserole, versez le vin rouge, le miel, les bâtons de cannelle et les rondelles d'orange. Chauffez à feu doux en remuant pour dissoudre le miel. Le vin ne doit jamais bouillir : l'alcool s'évaporerait et le vin deviendrait âpre.",
            "Ajouter l'orange (2 min) : ajoutez les zestes d'orange, laissez infuser 2 minutes à couvert.",
            "Filtrer (30 sec) : passez au chinois ou retirez les épices à l'écumoire.",
            "Servir (30 sec) : versez dans des tasses épaisses préchauffées. Un bâton de cannelle en décor. Le vin chaud se déguste brûlant, à petites gorgées."
          ],
          alt:"Jus de raisin épicé chaud (sans alcool)."},
        accord:"Un vin chaud, en écho direct aux épices du pain d'épices.",vin:"Banyuls, en digestif."},
            {id:"h35",numero:35,
        plat:{titre:"Crème Brûlée Yuzu, Sucre au Gingembre Frais & Pignons Caramélisés",tagline:"Une crème brûlée japonaise : crème infusée yuzu, sucre caramélisé au gingembre frais, éclats de pignons caramélisés.",temps:"40 min + 3h de froid",kcal:"~400 kcal",
          ing:[["Jaunes d'œufs","3","6","12"],["Crème liquide entière","25 cl","50 cl","1 L"],["Sucre","60 g","120 g","240 g"],["Yuzu (jus + zeste)","1","2","4"],["Gousse de vanille","1","2","4"],["Gingembre frais","petit morceau","morceau","grand morceau"],["Pignons de pin","40 g","80 g","160 g"],["Sucre roux","1 c. à s.","2 c. à s.","4 c. à s."]],
          steps:[
            "Infuser le yuzu et la vanille (10 min) : prélevez les zestes de yuzu au couteau économe, sans la partie blanche (amère). Fendez la gousse de vanille en deux dans la longueur, grattez les graines. Dans une casserole à fond épais, versez la crème avec les zestes de yuzu, la gousse et les graines de vanille. Chauffez à feu doux jusqu'aux premiers frémissements (petites bulles sur les bords), retirez du feu, couvrez et laissez infuser 10 minutes. Filtrez au chinois en pressant légèrement sur les zestes pour extraire tout le parfum.",
            "Préparer l'appareil (5 min) : dans un saladier, fouettez les jaunes avec le sucre, au fouet manuel, pendant 2 minutes — le mélange doit blanchir et former un léger ruban. Versez la crème infusée tiède (pas chaude) en filet sur les jaunes blanchis, en fouettant doucement et constamment. Ajoutez le jus d'un demi-yuzu. Passez le mélange au chinois fin pour retirer les éventuels filaments d'œuf.",
            "Cuire au bain-marie (35 min) : préchauffez le four à 100°C (chaleur traditionnelle). Versez la préparation dans 4 à 6 ramequins à crème brûlée, à bords droits et pas évasés. Disposez-les dans un grand plat creux, versez de l'eau chaude (pas bouillante) à mi-hauteur. Enfournez 35 minutes. La crème est prête quand elle tremble légèrement au centre quand on secoue le ramequin — elle doit être prise sur les bords mais encore tremblante au milieu. Laissez refroidir à température ambiante, puis placez au réfrigérateur 3 heures minimum.",
            "Caraméliser au gingembre (5 min) : pendant que les crèmes refroidissent, préparez le sucre au gingembre. Râpez très finement le gingembre frais (pelez-le d'abord). Mélangez le sucre roux avec le gingembre râpé dans un petit bol. Au moment de servir, saupoudrez chaque ramequin d'une fine couche de ce sucre parfumé, en répartissant bien jusqu'aux bords. Caramélisez au chalumeau de cuisine en effectuant des petits cercles réguliers, jusqu'à obtenir une croûte dorée brillante et parfumée.",
            "Préparer les pignons caramélisés et servir (5 min) : dans une poêle sèche, faites torréfier les pignons à feu moyen, en remuant constamment, jusqu'à dorure. Hors du feu, saupoudrez d'une pincée de sucre roux et remuez : le sucre doit fondre et enrober les pignons. Versez sur une plaque chemisée, laissez durcir. Au moment de servir, parsemez la crème brûlée caramélisée de quelques pignons caramélisés. Le contraste entre la croûte craquante, la crème froide et fondante, le parfum du gingembre et le croquant des pignons est saisissant."
          ],
          bienetre:"Le yuzu est très riche en vitamine C ; le gingembre est traditionnellement reconnu pour stimuler la digestion. Un dessert japonisant, raffiné, qui termine un repas sans l'alourdir.",secret:"Le sucre au gingembre frais est la signature japonaise : la chaleur du gingembre réveille le yuzu et donne une croûte caramélisée incomparable. Râpez le gingembre au dernier moment pour préserver ses arômes.",allergenes:"Œuf — Lait — Fruits à coque (pignons) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Thé Vert Genmaicha",kcal:"~0 kcal/tasse",
          ing:[["Thé vert genmaicha (thé au riz grillé)","1 c. à c.","2 c. à c.","4 c. à c."],["Eau à 80°C","150 ml","300 ml","600 ml"]],
          steps:[
            "Chauffer (2 min) : portez l'eau à 80°C — jamais au-delà, sinon le thé devient amer. Le genmaicha supporte mieux la chaleur que les autres thés verts, mais reste fragile.",
            "Infuser (3 min) : versez l'eau sur les feuilles de thé dans une petite théière, couvrez, laissez infuser 3 minutes. Le genmaicha doit prendre une teinte dorée claire, avec un parfum de riz grillé très distinctif.",
            "Filtrer (30 sec) : passez au chinois sans presser les feuilles.",
            "Servir (30 sec) : en tasse préchauffée, sans sucre ni lait. Le genmaicha se boit traditionnellement nature, en petites gorgées — ses notes grillées prolongent celles du yuzu et du gingembre."
          ],
          alt:"Hōjicha glacé, pour une version plus fraîche."},
        accord:"Un thé japonais grillé, en écho aux notes torréfiées du gingembre et des pignons.",vin:"Saké junmai, très frais."},
            {id:"h36",numero:36,
        plat:{titre:"Soufflé au Grand Marnier & Sésame Grillé",tagline:"Un soufflé aérien, parfumé au Grand Marnier, couronné de sésame grillé.",temps:"40 min",kcal:"~290 kcal",
          ing:[["Jaunes d'œufs","3","6","12"],["Blancs d'œufs","4","8","16"],["Lait","20 cl","40 cl","80 cl"],["Farine","30 g","60 g","120 g"],["Sucre","80 g","160 g","320 g"],["Grand Marnier","2 c. à s.","4 c. à s.","8 c. à s."],["Sésame blond","20 g","40 g","80 g"]],
          steps:[
            "Préparer la base (10 min) : dans une casserole, délayez la farine dans le lait froid. Ajoutez les jaunes d'œufs et le sucre. Faites chauffer à feu doux en fouettant constamment, jusqu'à ce que la crème épaississe. Retirez du feu dès les premiers bouillons : la crème doit être lisse et brillante. Ajoutez le Grand Marnier et mélangez. Versez dans un saladier, filmez au contact et laissez tiédir.",
            "Torréfier le sésame (3 min) : dans une poêle sèche, faites torréfier le sésame blond à feu moyen 2 minutes, en remuant constamment, jusqu'à ce qu'il devienne doré et parfumé. Réservez sur une assiette.",

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = d => new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const norm = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/œ/g, "oe").toLowerCase();

const store = {

  write(d){ try{ localStorage.setItem('sw_db_v2',JSON.stringify(d)); return true }catch(e){ return false } }
};
let db = store.read();
function save(){ store.write(db); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function go(id){ $$('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+id)); window.scrollTo(0,0); }
function allDuos(){ return Object.values(SEASONS).flatMap(s=>s.duos.map(d=>({d,s}))); }
function findDuo(id){ for(const s of Object.values(SEASONS)){ const d = s.duos.find(x=>x.id===id); if(d) return {duo:d,saison:s}; } return null; }

function openRecipe(d, saison, type){
  const r = type==='plat' ? d.plat : d.boisson;
  const isPlat = type==='plat';
  let html = '<button class="btn back" data-back="duo">← Dessert '+String(d.numero).padStart(2,'0')+'</button>' +
    '<div class="detail-hero"><div class="dth-tag">'+(isPlat?'Sweet · Le Dessert':'Sip · L\'Accord')+'</div><div class="dth-title">'+esc(r.titre)+'</div>' +
    (r.tagline?'<div class="dth-tagline">'+esc(r.tagline)+'</div>':'') +
    '<div class="dth-meta">'+(r.temps?'<span>⏱ '+esc(r.temps)+'</span>':'')+'<span>'+esc(r.kcal)+'</span></div></div>' +
    '<div class="block"><div class="block-title">Ingrédients</div><div class="ing-head"><span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600">Pour</span><div class="serv-toggle"><button class="serv-btn" data-serv="0">1</button><button class="serv-btn active" data-serv="1">2</button><button class="serv-btn" data-serv="2">4</button></div></div><ul class="ing" id="ing-list"></ul></div>' +
    '<div class="block"><div class="block-title">Préparation</div><ol class="steps">'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div>';
  if(isPlat){
    if(r.bienetre) html += '<div class="block"><div class="block-title">Bilan Bien-être</div><div class="callout">'+esc(r.bienetre)+'</div></div>';
    if(r.secret) html += '<div class="block"><div class="block-title">Secret du Chef</div><div class="callout">'+esc(r.secret)+'</div></div>';
    if(r.allergenes) html += '<div class="block"><div class="block-title">Allergènes</div><div class="alc-note">'+esc(r.allergenes)+'</div></div>';
  } else {
    if(r.alt) html += '<div class="block"><div class="block-title">Version sans alcool</div><div class="alc-note">'+esc(r.alt)+'</div></div>';
  }
  $('#screen-recipe').innerHTML = html;
  window.__recipeIngredients = r.ing;
  window.__recipeServ = 1;
  updateServ();
  go('recipe');
}

function updateServ(){
  const ing = window.__recipeIngredients; if(!ing) return;
  const i = window.__recipeServ || 1;
  $('#ing-list').innerHTML = ing.map(function(row){
    const q = i===0?row[1]:(i===1?row[2]:row[3]);
    return '<li><b>'+esc(row[0])+'</b><span class="ing-q">'+esc(q)+'</span></li>';
  }).join('');
  $$('.serv-btn').forEach(function(b){ b.classList.toggle('active', +b.dataset.serv===(window.__recipeServ||1)); });
}

function renderCart(){
  var col = db.cartServ === undefined ? 1 : db.cartServ;
  var total = db.cart.length;
  var screen = document.getElementById('screen-cart');
  if(!screen) return;

  if(!total){
    screen.innerHTML =
      '<button class="btn back" data-back="home">← Retour</button>' +
      '<h1 class="hero" style="margin-bottom:24px">Ma liste de <em>courses</em></h1>' +
      '<div class="empty"><p>Ta liste est vide.<br>Touche « 🛒 Aux courses » sur un dessert pour l\'ajouter.</p></div>';
    return;
  }

  function normKey(name){ return norm(name).replace(/s$/,'').replace(/\s+/g,' ').trim(); }
  var RAYONS = ['Fruits & légumes','Herbes fraîches','Crémerie & œufs','Épicerie','Boissons','Autres'];
  var RULES = [
    [4, /\b(vin|champagne|cremant|cidre|rhum|bourbon|whisky|gin|vodka|tequila|mezcal|sake|pastis|limoncello|grand marnier|cointreau|muscat|banyuls|maury|porto|biere|the|matcha|cafe|espresso|jus)\b/],
    [3, /\b(sel|poivre|sucre|farine|levure|chocolat|cacao|amandes?|noix|pecan|noisettes?|pistaches?|pignons?|miel|vanille|cannelle|muscade|gingembre|cardamome|badiane|anis|girofle|curcuma|safran|epices?|gelatine|fecule|speculoos|boudoirs?|praline|marron|puree)\b/],
    [2, /\b(lait|creme|beurre|fromage|mascarpone|ricotta|yaourt|oeufs?|blancs?|jaunes?)\b/],
    [1, /basilic|menthe|coriandre|persil|verveine|lavande|thym|romarin|sauge|estragon|fleur d'oranger|eau de rose/],
    [0, /fraise|framboise|myrtille|cerise|peche|abricot|melon|mangue|rhubarbe|pomme|poire|figue|orange|citron|banane|ananas|fruit/]
  ];
  function categorize(name){
    var t = norm(name);
    for(var i=0;i<RULES.length;i++) if(RULES[i][1].test(t)) return RULES[i][0];
    return 5;
  }

  var map = {};
  db.cart.forEach(function(id){
    var f = findDuo(id); if(!f) return;
    [f.duo.plat, f.duo.boisson].forEach(function(r){
      if(!r || !r.ing) return;
      r.ing.forEach(function(it){
        var name = it[0];
        var q = String(it[1 + col] || '').trim();
        var key = normKey(name);
        var e = map[key] = map[key] || {key:key,name:name,qs:[],cat:categorize(name)};
        if(q && q !== 'au goût' && q !== 'PM' && q !== 'allongée' && q !== 'à compléter' && q !== 'généreux' && q !== 'double') e.qs.push(q);
      });
    });
  });

  var groups = RAYONS.map(function(n, i){
    return [n, Object.values(map).filter(function(e){ return e.cat === i; }).sort(function(a,b){ return a.name.localeCompare(b.name,'fr'); })];
  }).filter(function(g){ return g[1].length > 0; });

  var label = col === 0 ? '1 personne' : (col === 1 ? '2 personnes' : '4 personnes');
  var html = '<button class="btn back" data-back="home">← Retour</button>' +
    '<h1 class="hero" style="margin-bottom:24px">Ma liste de <em>courses</em></h1>' +
    '<div class="ing-head"><span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600">Pour</span>' +
    '<div class="serv-toggle">' +
      '<button class="serv-btn' + (col===0?' active':'') + '" data-cserv="0">1</button>' +
      '<button class="serv-btn' + (col===1?' active':'') + '" data-cserv="1">2</button>' +
      '<button class="serv-btn' + (col===2?' active':'') + '" data-cserv="2">4</button>' +
    '</div></div>';

  html += '<p style="text-align:center;font-family:var(--serif);font-style:italic;color:var(--ink-soft);margin-bottom:22px">' +
    total + ' dessert' + (total>1?'s':'') + ' sélectionné' + (total>1?'s':'') + ' · ' + label + '</p>';

  html += '<div class="block"><div class="block-title">Desserts choisis</div>';
  db.cart.forEach(function(id){
    var f = findDuo(id); if(!f) return;
    var d = f.duo, s = f.saison;
    html += '<div class="log-item"><span class="lg-info"><span class="lg-title">'+esc(d.plat.titre)+'</span><span class="lg-date">Dessert '+String(d.numero).padStart(2,'0')+' · '+esc(s.nom)+'</span></span><button class="lg-del" data-rm="'+id+'" title="Retirer">✕</button></div>';
  });
  html += '</div>';

  groups.forEach(function(g){
    html += '<div class="block"><div class="block-title">'+esc(g[0])+'</div><ul class="ing">';
    g[1].forEach(function(e){
      var done = db.checked && db.checked[e.key];
      var qDisp = e.qs.length ? e.qs.join(' + ') : 'au goût';
      html += '<li data-check="'+esc(e.key)+'"'+(done?' class="done"':'')+'><b>'+esc(e.name)+'</b><span class="ing-q">'+esc(qDisp)+'</span></li>';
    });
    html += '</ul></div>';
  });

  html += '<div class="btn-row"><button class="btn" id="cart-clear">Tout vider</button></div>';
  screen.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════
   ÉVÉNEMENTS GLOBAUX
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('click', function(e){
  function el(sel){ return e.target.closest(sel); }
  if(el('#menu-btn')){ openDrawer(); return; }
  if(e.target.id === 'drawer-overlay'){ closeDrawer(); return; }
  var mi = el('[data-menu]');
  if(mi){
    var a = mi.dataset.menu; closeDrawer();
    if(a==='home'){ renderHome(); go('home'); }
    else if(a==='favorites'){ renderFavorites(); go('favorites'); }
    else if(a==='log'){ renderLog(); go('log'); }
    else if(a==='cart'){ renderCart(); go('cart'); }
    else if(a==='about'){ renderAbout(); go('about'); }
    return;
  }
  var sc = el('[data-season]');
  if(sc){ openSeason(sc.dataset.season); return; }
  var dc = el('[data-duo]');
  if(dc){ var f = findDuo(dc.dataset.duo); if(f) renderDuo(f.duo, f.saison); return; }
  var rc = el('[data-recipe]');
  if(rc && currentDuo){ openRecipe(currentDuo, currentSaison, rc.dataset.recipe); return; }
  var sv = el('[data-serv]');
  if(sv){ window.__recipeServ = +sv.dataset.serv; updateServ(); return; }
