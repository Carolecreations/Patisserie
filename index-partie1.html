<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C3A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sweet &amp; Sip">
<meta name="mobile-web-app-capable" content="yes">
<title>Sweet &amp; Sip — Les 4 Saisons Sucrées</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Karla:wght@400;500;600;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --brown:#5C3A1E;
  --brown-deep:#3E2612;
  --fuchsia:#C2185B;
  --fuchsia-deep:#8E0E3F;
  --fuchsia-soft:#F4D7E0;
  --matcha:#7B9B5E;
  --matcha-deep:#5A7543;
  --matcha-soft:#E2EBD3;
  --gold:#B08D57;
  --cream:#FDF9F2;
  --cream-warm:#F7EFE2;
  --ink:#2A1F15;
  --ink-soft:#6B5A4A;
  --line:#EADCC8;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Karla',-apple-system,sans-serif
}
body{font-family:var(--sans);background:#EFE6D6;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:1rem}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--cream);display:flex;flex-direction:column;box-shadow:0 0 60px rgba(92,58,30,.08);position:relative}

/* ═══ HEADER ═══ */
header{position:sticky;top:0;z-index:20;background:rgba(253,249,242,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 20px 12px;text-align:center}
.menu-btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;color:var(--brown);z-index:22;padding:0}
.menu-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round}
.brand{display:flex;align-items:baseline;justify-content:center;gap:6px;line-height:1}
.brand-v{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.16em;color:var(--brown)}
.brand-amp{font-family:var(--serif);font-style:italic;font-size:22px;font-weight:500;color:var(--fuchsia)}
.brand-p{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.16em;color:var(--brown)}
.brand-rule{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.brand-rule .rl{height:1px;width:22px;background:var(--gold);opacity:.55}
.brand-rule .rd{width:3px;height:3px;background:var(--fuchsia);border-radius:50%}
.brand-sub{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink-soft);margin-top:6px}

/* ═══ MAIN ═══ */
main{flex:1;padding:24px 20px 48px}
.screen{display:none}
.screen.active{display:block}
.eyebrow{font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--fuchsia);text-align:center;font-weight:700}
.hero{font-family:var(--serif);font-size:28px;line-height:1.22;text-align:center;margin:12px 0 26px;font-weight:500;color:var(--brown-deep)}
.hero em{color:var(--fuchsia);font-style:italic}
.search{margin:0 0 18px}
.search input{width:100%;font-family:var(--serif);font-size:17px;padding:14px 20px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink-soft);font-style:italic}

/* ═══ SEASONS ═══ */
.seasons{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.season-card{position:relative;border-radius:14px;padding:0;cursor:pointer;text-align:left;overflow:hidden;font-family:inherit;background:#fff;border:1px solid var(--line)}
.sc-inner{display:flex;align-items:stretch;min-height:112px}
.sc-stripe{width:6px;flex-shrink:0}
.sc-body{flex:1;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.sc-text{display:flex;flex-direction:column}
.sc-emoji{font-size:11px;letter-spacing:.22em;color:var(--fuchsia);text-transform:uppercase;font-weight:700}
.sc-name{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.05;color:var(--brown-deep);margin-top:6px}
.sc-tag{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-soft);margin-top:4px}
.sc-count{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sc-num{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brown);line-height:1}
.sc-lab{font-size:8.5px;letter-spacing:.28em;color:var(--ink-soft);text-transform:uppercase;font-weight:600}

/* ═══ SEASON HEADER ═══ */
.season-header{position:relative;padding:26px 22px;border-radius:14px;margin-bottom:20px;background:#fff;border:1px solid var(--line);overflow:hidden}
.season-header .sh-stripe{position:absolute;left:0;top:0;bottom:0;width:5px}
.season-header .sh-tag{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--fuchsia);margin-top:6px}
.season-header .sh-name{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.05;color:var(--brown-deep);margin-top:8px}
.season-header .sh-intro{font-size:13px;line-height:1.7;color:var(--ink-soft);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* ═══ LIST ═══ */
.duo-list{display:flex;flex-direction:column;gap:0}
.duo-item{display:flex;align-items:center;gap:16px;padding:18px 4px;background:none;border:none;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;font-family:inherit;width:100%}
.duo-item .di-num{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--fuchsia);width:36px;flex-shrink:0}
.duo-item .di-body{flex:1;display:flex;flex-direction:column;gap:3px}
.duo-item .di-title{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--brown-deep);line-height:1.25}
.duo-item .di-boisson{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink-soft);line-height:1.3}
.duo-item .di-arrow{color:var(--fuchsia);font-size:14px;flex-shrink:0}

/* ═══ DUO HERO ═══ */
.duo-hero{text-align:center;padding:14px 0 28px;border-bottom:1px solid var(--line);margin-bottom:26px}
.duo-hero .dh-num{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--fuchsia)}
.duo-hero .dh-accord{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.3;color:var(--brown-deep);margin-top:12px;font-style:italic}
.duo-hero .dh-saison{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-soft);margin-top:10px;font-weight:600}

/* ═══ RECIPE CARDS ═══ */
.recipe-card{display:block;width:100%;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px;background:#fff;cursor:pointer;text-align:left;font-family:inherit}
.recipe-card .rc-tag{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--fuchsia);font-weight:700;margin-bottom:10px}
.recipe-card .rc-title{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.22;color:var(--brown-deep);display:block}
.recipe-card .rc-meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:10px;display:block}

/* ═══ ACCORD BOX ═══ */
.vin-box{border:1px solid var(--matcha);border-radius:14px;padding:20px 22px;margin-top:22px;background:linear-gradient(135deg,var(--matcha-soft) 0%,#F0F5E4 100%);position:relative;overflow:hidden}
.vb-tag{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--matcha-deep);font-weight:700;position:relative;display:flex;align-items:center;gap:8px}
.vb-tag svg{width:14px;height:14px;stroke:var(--matcha-deep);fill:none;stroke-width:1.4}
.vb-vin{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--brown-deep);margin-top:10px;line-height:1.4;position:relative}

/* ═══ DETAIL ═══ */
.detail-hero{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.detail-hero .dth-tag{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--fuchsia);font-weight:700}
.detail-hero .dth-title{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15;margin-top:12px;color:var(--brown-deep)}
.detail-hero .dth-tagline{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);margin-top:8px}
.detail-hero .dth-meta{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap}
.detail-hero .dth-meta span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}

/* ═══ BLOCKS ═══ */
.block{margin-bottom:26px}
.block-title{font-size:9px;letter-spacing:.36em;text-transform:uppercase;color:var(--fuchsia);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.block-title::after{content:"";flex:1;height:1px;background:var(--line)}
.ing-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.serv-toggle{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.serv-btn{border:none;background:none;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;padding:6px 13px;border-radius:999px;color:var(--ink-soft);cursor:pointer}
.serv-btn.active{background:var(--brown);color:var(--cream)}
ul.ing{list-style:none}
ul.ing li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px dotted var(--line);font-size:14px;line-height:1.45}
ul.ing li:last-child{border-bottom:none}
ul.ing li b{font-weight:400;color:var(--ink)}
ul.ing li .ing-q{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--fuchsia);white-space:nowrap;text-align:right;font-weight:600}
ol.steps{list-style:none;counter-reset:step}
ol.steps li{counter-increment:step;position:relative;padding:0 0 16px 34px;font-size:14px;line-height:1.72;color:var(--ink);border-bottom:1px dotted var(--line);margin-bottom:16px}
ol.steps li:last-child{border-bottom:none;padding-bottom:0}
ol.steps li::before{content:counter(step);position:absolute;left:0;top:1px;font-family:var(--serif);font-size:15px;font-weight:700;color:var(--fuchsia);width:22px}
.callout{background:#fff;border:1px solid var(--line);border-left:2px solid var(--matcha);border-radius:0 12px 12px 0;padding:16px 18px;font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--brown-deep)}
.alc-note{background:var(--fuchsia-soft);border-left:3px solid var(--fuchsia);border-radius:0 12px 12px 0;padding:16px 18px;font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--brown-deep)}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;padding:14px 22px;border-radius:999px;border:1px solid var(--brown);background:transparent;color:var(--brown);cursor:pointer;font-weight:600}
.btn.back{margin-bottom:22px;padding:10px 18px;font-size:9.5px;letter-spacing:.24em;border-color:var(--line)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.empty{text-align:center;padding:70px 26px;color:var(--ink-soft)}
.empty p{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.55}

/* ═══ LOG ═══ */
.log-item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px}
.log-item .lg-info{flex:1}
.log-item .lg-title{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--brown-deep);display:block;line-height:1.3}
.log-item .lg-date{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;display:block;font-weight:600}
.log-item .lg-del{background:none;border:none;font-size:16px;color:var(--ink-soft);cursor:pointer;padding:6px;opacity:.6}

/* ═══ DRAWER ═══ */
.drawer-overlay{position:fixed;inset:0;background:rgba(62,38,18,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.26s;z-index:70}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:296px;max-width:86vw;background:var(--cream);transform:translateX(-102%);transition:transform .3s;z-index:71;overflow-y:auto;padding:calc(32px + env(safe-area-inset-top,0px)) 0 32px;box-shadow:12px 0 40px rgba(62,38,18,.18)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:0 26px 24px;border-bottom:1px solid var(--line);margin-bottom:14px}
.dr-brand{display:flex;align-items:baseline;gap:4px;line-height:1}
.dr-brand .v,.dr-brand .p{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.16em;color:var(--brown)}
.dr-brand .amp{font-family:var(--serif);font-style:italic;font-size:19px;font-weight:500;color:var(--fuchsia)}
.dr-sub{font-family:var(--serif);font-style:italic;font-size:11.5px;color:var(--ink-soft);margin-top:6px}
.drawer-section{font-size:8.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--fuchsia);padding:16px 26px 8px;font-weight:700}
.drawer-item{display:flex;align-items:center;gap:14px;width:100%;border:none;background:transparent;cursor:pointer;padding:13px 26px;color:var(--ink);font-family:var(--sans);font-size:14px;text-align:left}
.di-icon{font-size:13px;width:20px;text-align:center;color:var(--fuchsia)}
.di-arrow{margin-left:auto;color:var(--fuchsia);font-size:11px;opacity:.6}

/* ═══ ABOUT ═══ */
.about-text{font-family:var(--serif);font-size:15.5px;line-height:1.82;color:var(--ink)}
.about-text p{margin-bottom:18px}
.about-sign{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-soft);text-align:right;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}

/* ═══ TOAST ═══ */
#toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(16px);background:var(--brown);color:var(--cream);padding:12px 22px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.3s;z-index:80;text-align:center;font-family:var(--serif);font-style:italic}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ PHOTO ═══ */
.photo{width:100%;aspect-ratio:4/3;background:var(--cream-warm);border-radius:12px;overflow:hidden;position:relative;margin-bottom:20px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:var(--serif);font-style:italic;font-size:13px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 0}
.pgrid .photo{margin:0;aspect-ratio:1/1;font-size:11px}

/* ═══ FILTERS ═══ */
.filters{display:flex;gap:8px;margin:0 0 18px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.06em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.filter.active{background:var(--brown);color:var(--cream);border-color:var(--brown)}

/* ═══ TIMER ═══ */
#cook-timer{display:none !important}
#multi-timer{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:92vw;background:#3E2612;color:var(--cream);border-radius:14px;padding:8px 12px;font-family:var(--serif);font-size:13px;z-index:99;display:none;box-shadow:0 6px 20px rgba(0,0,0,.35);flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
#multi-timer.visible{display:flex}
#multi-timer .mt-item{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:12.5px;white-space:nowrap;border:none;color:inherit;font-family:inherit}
#multi-timer .mt-item b{color:var(--gold);font-weight:600}
#multi-timer .mt-item.done{background:rgba(194,24,91,.35);animation:mt-pulse 1s infinite}
@keyframes mt-pulse{0%,100%{opacity:1}50%{opacity:.55}}
.timer-inline{display:inline-block;margin-left:6px;background:var(--fuchsia);color:#fff;border:none;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.05em;vertical-align:middle;font-family:var(--sans)}
.timer-inline:hover{opacity:.9}
@media print{.timer-inline{display:none !important}}

/* ═══ TABLET ═══ */
@media(max-width:400px){
  .hero{font-size:25px}
  .sc-name{font-size:23px}
  .dth-title{font-size:24px}
  #fs-controls button{padding:5px 7px;font-size:10px}
  #fs-label{display:none}
}
@media (min-width:640px){
  body{background:#E7DBC5;padding:24px}
  .app{max-width:720px;min-height:calc(100dvh - 48px);border-radius:20px;overflow:hidden}
  .seasons{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .duo-list{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  #duo-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .recipe-card{margin-bottom:0}
  ul.ing{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
  .hero{font-size:32px}
}
@media (min-width:1024px){
  .app{max-width:960px}
  .seasons{grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}
  .duo-list{grid-template-columns:1fr 1fr 1fr;gap:0 22px}
  .drawer{width:340px}
  .hero{font-size:38px}
}

/* ═══ FICHE GASTRO ═══ */
.recipe-tabs{display:flex;gap:0;margin:0 0 22px;border:1px solid var(--line);border-radius:999px;padding:4px;background:#fff}
.recipe-tabs .tab-btn{flex:1;border:none;background:none;font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:12px 10px;border-radius:999px;color:var(--ink-soft);cursor:pointer;transition:.2s}
.recipe-tabs .tab-btn.active{background:var(--fuchsia);color:#fff}
.gastro-intro{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.7;color:var(--brown-deep);padding:18px 20px;background:linear-gradient(135deg,var(--fuchsia-soft) 0%,#FBEAF0 100%);border:1px solid var(--fuchsia);border-radius:12px;margin-bottom:22px}
.gastro-touches{list-style:none;margin:0 0 6px}
.gastro-touches li{padding:10px 0 10px 24px;position:relative;font-size:15.5px;line-height:1.65;border-bottom:1px dotted var(--line)}
.gastro-touches li:last-child{border-bottom:none}
.gastro-touches li::before{content:"✦";position:absolute;left:0;top:10px;color:var(--fuchsia);font-size:12px}
.gastro-dressage{font-family:var(--serif);font-size:16px;line-height:1.75;color:var(--brown-deep);padding:16px 20px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--matcha);border-radius:0 12px 12px 0}
.gastro-accord{font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--brown-deep);padding:18px 22px;background:linear-gradient(135deg,var(--matcha-soft) 0%,#F0F5E4 100%);border:1px solid var(--matcha);border-radius:14px}
.gastro-accord .gacc-label{font-family:var(--sans);font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--matcha-deep);font-weight:700;display:block;margin-bottom:8px}
.gastro-note{font-size:13.5px;line-height:1.65;color:var(--ink-soft);font-family:var(--serif);font-style:italic;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.recipe-content{display:none}
.recipe-content.active{display:block}

/* ═══ IMPRESSION ═══ */
@media print{
  body{background:#fff !important;font-size:12pt;color:#000 !important}
  .app{box-shadow:none;max-width:none;background:#fff}
  header,.drawer,.drawer-overlay,#toast,#cook-timer,
  .btn,.btn-row,.menu-btn,.filters,.pgrid,
  button{display:none !important}
  .screen{display:block !important}
  main{padding:0}
  .callout,.alc-note,.recipe-card,.season-header,
  .log-item,.duo-hero,.detail-hero{break-inside:avoid}
  .detail-hero .dth-title{font-size:22pt;color:#000}
  .block-title{color:#000}

            "Infuser la verveine (5 min) : effeuillez la verveine fraîche et ciselez-la finement au couteau. Incorporez-la au coulis de fraises et laissez infuser 5 minutes à température ambiante. Filtrez ensuite le coulis au chinois fin pour retirer les feuilles : on veut le parfum de la verveine, pas les morceaux verts.",
            "Monter la crème (5 min) : dans un saladier froid, détendez le mascarpone avec 2 cuillères à soupe de coulis de fraises, en fouettant énergiquement 1 minute. Le mascarpone doit devenir souple et lisse, comme une crème pâtissière épaisse. Incorporez délicatement le reste du coulis à la maryse, en 3 fois, en soulevant la masse de bas en haut — on ne veut pas casser la texture. Réservez au frais.",
            "Chemiser le moule (5 min) : préparez un sirop léger en faisant chauffer 10 cl d'eau avec 30 g de sucre, jusqu'à dissolution complète. Laissez refroidir. Trempez chaque boudoir dans le sirop très rapidement : 2 secondes par face, pas plus — au-delà, ils se délitent et rendent la charlotte molle. Tapissez le fond et les bords d'un moule à charlotte en les serrant bien, face sucrée vers l'extérieur.",
            "Monter et réfrigérer (5 min + 4 h) : versez une première couche de crème au mascarpone au fond du moule, ajoutez une couche de fraises coupées, puis une couche de crème. Répétez jusqu'à épuisement, en terminant par une dernière couche de boudoirs imbibés posés sur le dessus. Filmez au contact et placez au réfrigérateur 4 heures minimum — une nuit complète est idéale. Démoulez juste avant de servir, en passant rapidement un torchon chaud autour du moule si nécessaire."
          ],
          bienetre:"La verveine est traditionnellement utilisée pour ses vertus apaisantes et digestives. Un dessert frais, qui termine un repas sans l'alourdir.",secret:"Tremper les boudoirs très rapidement dans le sirop : 2 secondes par face, pas plus, sinon ils se délitent.",allergenes:"Gluten — Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Infusion de Verveine",kcal:"~0 kcal/tasse",
          ing:[["Verveine séchée","1 c. à c.","2 c. à c.","4 c. à c."],["Eau frémissante","150 ml","300 ml","600 ml"]],
          steps:["Chauffer l'eau (3 min) : portez à frémissement, juste avant l'ébullition.","Infuser (6 min) : versez sur la verveine dans une tasse, couvrez d'une soucoupe pour préserver les arômes volatils.","Filtrer (30 sec) : passez au chinois ou retirez les feuilles à la cuillère.","Servir (30 sec) : en tasse bien chaude, sans sucre — la verveine a naturellement une note douce."],
          alt:"Tisane de menthe poivrée, tout aussi digestive."},
        accord:"Une infusion en écho direct au parfum de la charlotte.",vin:"Cidre brut artisanal, très frais."},
      {id:"p5",numero:5,
        plat:{titre:"Sorbet Rhubarbe-Framboise",tagline:"Un sorbet vif et parfumé, sans lait, pour terminer un repas léger.",temps:"30 min + 4h de froid",kcal:"~140 kcal",
          ing:[["Rhubarbe","300 g","600 g","1,2 kg"],["Framboises","150 g","300 g","600 g"],["Sucre","80 g","160 g","320 g"],["Eau","10 cl","20 cl","40 cl"],["Citron (jus)","1/2","1","2"]],
          steps:[
            "Cuire la rhubarbe (15 min) : lavez les tiges de rhubarbe, coupez-les en tronçons de 2 cm. Mettez-les dans une casserole avec le sucre et l'eau. Cuisez à feu doux, à couvert, 15 minutes en remuant de temps en temps : la rhubarbe doit devenir fondante et se défaire facilement à la cuillère. Elle rend beaucoup d'eau, c'est normal. Laissez tiédir 5 minutes.",
            "Mixer et chinoiser (3 min) : versez la rhubarbe cuite (avec son jus) dans le blender, ajoutez les framboises fraîches (ou décongelées) et le jus de citron. Mixez 1 minute à vitesse maximale. Passez ensuite la purée au chinois fin en pressant avec une spatule : vous retirez ainsi tous les pépins de framboise, qui sont désagréables en bouche. Le sorbet doit être parfaitement lisse.",
            "Refroidir (1 h) : versez la préparation dans un récipient, filmez au contact et placez au réfrigérateur 1 heure minimum. Le mélange doit être parfaitement froid avant de passer en sorbetière — un mélange tiède turbine mal et donne une texture granuleuse.",
            "Turbiner (30 min) : versez dans la sorbetière et turbinez 25 à 30 minutes, jusqu'à ce que le sorbet prenne une texture onctueuse et se détache des parois. Sans sorbetière : versez dans un bac large, placez au congélateur, et fouettez toutes les 30 minutes pendant 3 heures pour casser les cristaux de glace.",
            "Réserver et servir (3 h + 10 min) : transférez dans une boîte hermétique et placez au congélateur au moins 3 heures. Sortez le sorbet 10 minutes avant de servir pour qu'il ramollisse légèrement et se prélève à la cuillère. Servez en boules dans des coupelles froides, avec quelques framboises fraîches et une petite feuille de menthe."
          ],
          bienetre:"Sans lait, sans œuf, sans gluten : le sorbet est le dessert le plus digeste qui soit. La rhubarbe est traditionnellement reconnue pour son action sur la digestion.",secret:"Passer la préparation au chinois : les pépins de framboise, désagréables en bouche, disparaissent, et le sorbet devient soyeux.",allergenes:"Aucun allergène majeur — Vegan",
          veg:"Végétarien & vegan."},
        boisson:{titre:"Eau Pétillante au Citron Vert",kcal:"~0 kcal",
          ing:[["Eau pétillante","150 ml","300 ml","600 ml"],["Citron vert","1/2","1","2"],["Menthe fraîche","quelques feuilles","1 brin","2 brins"]],
          steps:["Refroidir (10 min) : placez la bouteille d'eau pétillante au réfrigérateur — plus elle est froide, plus les bulles tiennent longtemps.","Presser (1 min) : pressez le citron vert au-dessus d'un verre haut, en filtrant les pépins.","Servir (1 min) : versez l'eau pétillante lentement le long du verre pour préserver les bulles. Ajoutez une tranche de citron vert et un brin de menthe froissé entre les paumes pour libérer les arômes."],
          alt:"Eau de coco fraîche, nature."},
        accord:"Une boisson neutre pour laisser toute la place au sorbet.",vin:"Un trait de Champagne brut nature, très frais."},
      {id:"p6",numero:6,
        plat:{titre:"Mousse au Chocolat Blanc et Rose",tagline:"Une mousse aérienne, parfumée à l'eau de rose, d'une élégance rare.",temps:"25 min + 4h de froid",kcal:"~340 kcal",
          ing:[["Chocolat blanc","100 g","200 g","400 g"],["Crème liquide entière","20 cl","40 cl","80 cl"],["Blancs d'œufs","2","4","8"],["Eau de rose","1 c. à c.","2 c. à c.","4 c. à c."],["Sucre glace","20 g","40 g","80 g"]],
          steps:[
            "Fondre le chocolat (5 min) : cassez le chocolat blanc en morceaux et faites-le fondre au bain-marie à feu très doux, en remuant à la spatule. Le chocolat blanc est fragile : ne le laissez pas trop chauffer, il peut durcir d'un coup. Une fois fondu, ajoutez l'eau de rose et mélangez. Retirez du bain-marie et laissez tiédir 10 minutes — le chocolat doit être à environ 35°C, tiède mais pas chaud au toucher.",
            "Monter la crème (5 min) : sortez la crème du réfrigérateur au dernier moment et versez-la dans un saladier bien froid (idéalement passé 15 minutes au congélateur). Fouettez à vitesse moyenne d'abord, puis rapide. Arrêtez quand la crème forme une chantilly souple, qui retombe légèrement quand on lève le fouet. Ne la montez pas trop ferme : elle serait difficile à incorporer. Réservez au frais.",
            "Monter les blancs (5 min) : dans un saladier parfaitement propre et sec (sans aucune trace de gras), montez les blancs en neige. Quand ils commencent à mousser, ajoutez le sucre glace en 3 fois, sans cesser de fouetter. Arrêtez quand les blancs forment un bec d'oiseau : la pointe se courbe légèrement quand on lève le fouet. Trop fermes, ils donneraient une mousse sèche et granuleuse.",
            "Incorporer délicatement (3 min) : versez 1/3 de la crème dans le chocolat tiédi et mélangez à la maryse pour détendre la masse. Ajoutez le reste de crème et mélangez délicatement en soulevant la maryse de bas en haut, en tournant le saladier d'un quart de tour à chaque geste. Incorporez ensuite les blancs en 3 fois, toujours avec le même geste : c'est ce mouvement qui préserve l'air de la mousse.",
            "Réserver au frais (4 h) : répartissez dans des verrines ou de petits ramequins. Filmez au contact (le film doit toucher la mousse) ou couvrez d'un couvercle. Placez au réfrigérateur 4 heures minimum — toute une nuit, c'est encore mieux. Au moment de servir, ajoutez 1 ou 2 pétales de rose comestibles et quelques éclats de framboise fraîche."
          ],
          bienetre:"Le chocolat blanc est plus sucré que le noir, mais l'absence d'œufs entiers et la légèreté de la mousse en font un dessert qui ne pèse pas.",secret:"Incorporer les blancs en trois fois, en soulevant délicatement la maryse du bas vers le haut : c'est ce geste qui garde toute l'air de la mousse.",allergenes:"Lait — Œuf — Soja possible (chocolat blanc) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Thé des Sables",kcal:"~0 kcal/tasse",
          ing:[["Thé vert à la menthe","1 c. à c.","2 c. à c.","4 c. à c."],["Eau à 80°C","150 ml","300 ml","600 ml"]],
          steps:["Chauffer (2 min) : à 80°C — le thé vert supporte mal les hautes températures.","Infuser (3 min) : versez sur le thé dans une théière, couvrez pour préserver les arômes de menthe.","Filtrer (30 sec) : passez au chinois sans presser les feuilles.","Servir (30 sec) : en petite tasse préchauffée. Le thé des sables se boit traditionnellement très chaud, en petites gorgées."],
          alt:"Infusion de pétales de rose : parfum en écho."},
        accord:"Un thé à la menthe, pour la fraîcheur qui répond au rose.",vin:"Rosé doux (Bugey), très frais."},
      {id:"p7",numero:7,
        plat:{titre:"Crème Brûlée à la Lavande",tagline:"La crème brûlée classique, parfumée à la lavande de Provence.",temps:"30 min + 2h de froid",kcal:"~360 kcal",
          ing:[["Jaunes d'œufs","3","6","12"],["Crème liquide","25 cl","50 cl","1 L"],["Sucre","60 g","120 g","240 g"],["Fleurs de lavande séchées","1 pincée","2 pincées","4 pincées"],["Sucre roux (pour caraméliser)","1 c. à s.","2 c. à s.","4 c. à s."]],
          steps:[
            "Infuser la lavande (10 min) : versez la crème dans une casserole et ajoutez les fleurs de lavande. Chauffez à feu doux jusqu'aux premiers frémissements (petites bulles sur les bords). Retirez immédiatement du feu, couvrez et laissez infuser 10 minutes. Filtrez ensuite au chinois fin en pressant légèrement les fleurs pour extraire tout le parfum. La crème doit être parfumée mais pas envahie — trop d'infusion, la lavande devient savonneuse.",
            "Blanchir les jaunes (3 min) : dans un saladier, fouettez les jaunes avec le sucre au fouet manuel pendant 2 à 3 minutes, jusqu'à ce que le mélange devienne pâle, crémeux et forme un léger ruban. Il ne s'agit pas de faire mousser mais de bien dissoudre le sucre dans les jaunes.",
            "Mélanger délicatement (2 min) : versez la crème tiède (pas chaude) en filet sur les jaunes blanchis, en fouettant doucement et constamment. Si la crème est trop chaude, elle cuit les jaunes et crée des grumeaux. Une fois le mélange homogène, passez-le au chinois pour retirer les éventuels filaments d'œuf.",
            "Cuire au bain-marie (35 min) : versez la préparation dans des ramequins à crème brûlée (à bords droits). Disposez-les dans un grand plat creux et versez de l'eau chaude à mi-hauteur. Enfournez à 100°C (chaleur traditionnelle) pour 35 minutes. La crème est prête quand elle tremble légèrement au centre quand on secoue le ramequin : elle doit être prise sur les bords mais encore tremblante au milieu. Laissez refroidir à température ambiante puis placez 2 heures au réfrigérateur.",
            "Caraméliser et servir (2 min) : au moment de servir, saupoudrez chaque ramequin d'une fine couche de sucre roux (environ 1 cuillère à café). Caramélisez au chalumeau de cuisine en effectuant des petits cercles réguliers, jusqu'à obtenir une croûte dorée brillante. Sans chalumeau : passez les ramequins 2 minutes sous le gril du four très chaud, en surveillant attentivement. Servez aussitôt : la croûte doit être craquante et la crème froide."
          ],
          bienetre:"La lavande est traditionnellement reconnue pour son action apaisante sur le système nerveux et digestif.",secret:"Cuire à 100°C au bain-marie : une cuisson plus chaude ferait trancher la crème et apparaître des bulles.",allergenes:"Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Infusion de Lavande",kcal:"~0 kcal/tasse",
          ing:[["Fleurs de lavande séchées","1 pincée","1 pincée","2 pincées"],["Eau frémissante","150 ml","300 ml","600 ml"]],
          steps:["Chauffer (3 min) : à frémissement, pas à ébullition franche.","Infuser (5 min) : versez sur la lavande dans une tasse, couvrez. Attention à la dose : trop de lavande rend l'infusion savonneuse.","Filtrer (30 sec).","Servir (30 sec) : en tasse, bien chaud, sans sucre."],
          alt:"Tisane de fleur d'oranger, tout aussi apaisante."},
        accord:"Une infusion en écho direct au parfum de la crème brûlée.",vin:"Muscat de Rivesaltes, très frais."},
      {id:"p8",numero:8,
        plat:{titre:"Financiers aux Amandes et Eau de Rose",tagline:"De petits gâteaux moelleux, parfumés à l'eau de rose.",temps:"20 min",kcal:"~180 kcal",
          ing:[["Poudre d'amandes","60 g","120 g","240 g"],["Blancs d'œufs","2","4","8"],["Sucre glace","80 g","160 g","320 g"],["Beurre","60 g","120 g","240 g"],["Farine","30 g","60 g","120 g"],["Eau de rose","1 c. à c.","2 c. à c.","4 c. à c."]],
          steps:[
            "Beurre noisette (5 min) : coupez le beurre en morceaux et mettez-les dans une casserole à fond clair (vous devez voir la couleur). Chauffez à feu moyen : le beurre va d'abord fondre, mousser, puis commencer à crépiter. Quand les crépitements s'arrêtent et que le beurre prend une couleur noisette avec une odeur de noisette grillée, retirez immédiatement du feu. Passez au chinois pour retirer les particules brunes (facultatif mais plus fin).",
            "Mélanger les poudres (2 min) : dans un saladier, mélangez la poudre d'amandes, le sucre glace et la farine. Tamisez si vous voulez un résultat parfaitement lisse. Ajoutez l'eau de rose et mélangez.",
            "Incorporer les blancs (2 min) : versez les blancs d'œufs NON montés (juste légèrement battus à la fourchette) sur le mélange sec. Mélangez à la maryse sans trop travailler : il faut juste que la pâte soit homogène. Trop travaillée, elle donne des financiers durs.",
            "Ajouter le beurre (1 min) : versez le beurre noisette tiédi sur la pâte et mélangez jusqu'à incorporation complète. La pâte doit être lisse, brillante, légèrement liquide.",
            "Cuire (12 min) : préchauffez le four à 190°C. Versez la pâte dans des moules à financiers beurrés (ou des petits moules à muffins), en remplissant aux 3/4. Cuisez 12 minutes : les bords doivent être bien dorés et le centre encore moelleux — une lame de couteau plantée doit ressortir avec quelques miettes humides. Laissez tiédir 5 minutes avant de démouler."
          ],
          bienetre:"Les amandes sont riches en magnésium et en bons lipides. Un petit gâteau qui se digère bien, à condition de ne pas en abuser.",secret:"Le beurre noisette est l'ingrédient secret des financiers : c'est lui qui donne ce goût inimitable de noisette grillée.",allergenes:"Œuf — Lait — Fruits à coque (amandes) — Gluten — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Thé Darjeeling",kcal:"~0 kcal/tasse",
          ing:[["Thé noir Darjeeling","1 c. à c.","2 c. à c.","4 c. à c."],["Eau à 90°C","150 ml","300 ml","600 ml"]],
          steps:["Chauffer (2 min) : à 90°C — un Darjeeling supporte une eau presque bouillante.","Infuser (3 min) : versez sur les feuilles, couvrez. Le thé doit être ambré clair, légèrement doré.","Filtrer (30 sec) : passez au chinois sans presser.","Servir (30 sec) : en tasse fine, sans sucre ni lait — le Darjeeling est un thé délicat qui se boit nature."],
          alt:"Café espresso serré, pour les amateurs."},
        accord:"Un thé floral, en écho à l'eau de rose.",vin:"Un trait de Champagne rosé, très frais."},
      {id:"p9",numero:9,
        plat:{titre:"Vacherin aux Fruits Rouges",tagline:"Le grand classique des fêtes de printemps, revisité avec des fruits rouges frais.",temps:"30 min + 2h de froid",kcal:"~340 kcal",
          ing:[["Blancs d'œufs","3","6","12"],["Sucre","150 g","300 g","600 g"],["Crème liquide","20 cl","40 cl","80 cl"],["Fruits rouges mélangés","250 g","500 g","1 kg"],["Sucre glace","au goût","au goût","au goût"]],
          steps:[
            "Monter la meringue (10 min) : dans un saladier parfaitement propre et sec, montez les blancs en neige à vitesse moyenne. Quand ils moussent, ajoutez le sucre en 3 fois, sans cesser de fouetter. Continuez jusqu'à obtenir une meringue brillante, lisse, qui forme un bec d'oiseau ferme : la pointe reste droite quand on lève le fouet. C'est le bon stade — au-delà, elle devient sèche et cassante.",
            "Cuire la meringue (1h30) : préchauffez le four à 100°C (chaleur traditionnelle). Sur une plaque recouverte de papier cuisson, formez 3 disques de meringue d'environ 18 cm de diamètre, en les espaçant. Utilisez une poche à douille ou étalez à la spatule. Enfournez 1h30 : la meringue doit être croustillante et sèche. Éteignez le four et laissez-la refroidir complètement à l'intérieur, porte entrouverte — un choc thermique la craquellerait.",
            "Monter la chantilly (5 min) : sortez la crème du réfrigérateur au dernier moment. Versez-la dans un saladier glacé et fouettez à vitesse moyenne d'abord, puis rapide. Quand elle commence à épaissir, ajoutez le sucre glace (2 cuillères à soupe environ) et continuez jusqu'à obtenir une chantilly ferme qui forme un bec d'oiseau. Réservez au frais.",
            "Monter le vacherin (5 min) : sur un plat de service (ou une assiette retournée), posez un premier disque de meringue. Étalez une couche de chantilly (1 cm), disposez des fruits rouges (fraises coupées, framboises, myrtilles, groseilles). Répétez avec un second disque, une couche de chantilly, des fruits. Terminez par un disque de meringue, une fine couche de chantilly et quelques fruits pour la décoration.",
            "Réserver et servir (2 h) : placez au réfrigérateur 2 heures minimum — c'est ce qui permet à la meringue de s'attendrir légèrement au contact de la crème. Le vacherin se monte au dernier moment pour un croustillant maximal, ou 2 heures avant pour un effet plus fondant. Servez bien frais, en parts généreuses, avec un couteau bien affûté (la meringue est fragile)."
          ],
          bienetre:"La meringue, sans matière grasse, est très légère. La crème et les fruits rouges apportent l'onctuosité et les antioxydants.",secret:"Cuire la meringue à très basse température et longtemps : c'est ce qui la rend croustillante à cœur et non collante.",allergenes:"Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Champagne Rosé",kcal:"~80 kcal/verre",
          ing:[["Champagne rosé","10 cl","20 cl","40 cl"]],
          steps:["Refroidir (2 h) : placez la bouteille au réfrigérateur au moins 2 heures avant de servir — un Champagne trop chaud perd ses bulles, trop froid ses arômes. Idéal : 8-10°C.","Servir (1 min) : ouvrez délicatement la bouteille en tournant la bouteille (pas le bouchon), puis versez dans des flûtes bien froides, en inclinant le verre pour préserver la mousse.","Déguster (—) : servez aussitôt, à petites gorgées, pour savourer toute la finesse des bulles."],
          alt:"Champagne brut nature ou un Crémant rosé de qualité."},
        accord:"Un accord festif, à la hauteur du vacherin.",vin:"Champagne rosé brut."}
    ]
  },
  ete:{
    id:"ete", nom:"Été", tagline:"Pêches & Fruits Givrés", stripe:"#E91E63",
    intro:"L'été est la saison des fruits gorgés de soleil : pêches, abricots, melons, myrtilles et mangues. Des desserts glacés, des tartes fruitées, des pavlovas croustillantes — tout ce qui rafraîchit et réjouit.",
    duos:[
      {id:"e10",numero:10,
        plat:{titre:"Pêche Melba Revisitée à la Verveine",tagline:"Le grand classique d'Escoffier : pêche pochée dans un sirop de verveine, framboises rôties et chantilly à la vanille.",temps:"40 min + 2h",kcal:"~290 kcal",
          ing:[["Pêches blanches ou jaunes bien mûres", "1", "2", "4"], ["Eau (sirop)", "25 cl", "50 cl", "1 l"], ["Sucre (sirop)", "40 g", "80 g", "160 g"], ["Verveine fraîche", "2 branches", "4 branches", "8 branches"], ["Citron (zeste et jus)", "1/4", "1/2", "1"], ["Gousse de vanille", "1/4", "1/2", "1"], ["Framboises", "100 g", "200 g", "400 g"], ["Crème liquide entière très froide", "10 cl", "20 cl", "40 cl"], ["Sucre glace", "1 c. à s.", "2 c. à s.", "4 c. à s."], ["Amandes effilées", "1 c. à s.", "2 c. à s.", "4 c. à s."]],
          steps:[
            "Préparer le sirop de verveine (10 min) : dans une casserole, versez l'eau et le sucre. Prélevez le zeste du citron en larges bandes avec un économe, sans la partie blanche qui est amère, et ajoutez-les avec le jus du citron. Fendez la gousse de vanille en deux dans la longueur et grattez les graines avec la pointe d'un couteau : mettez la moitié des graines et toute la gousse dans la casserole (gardez le reste des graines pour la chantilly). Ajoutez les branches de verveine. Portez à frémissement 3 minutes pour dissoudre le sucre, puis laissez infuser hors du feu, couvert, 10 minutes.",
            "Monder les pêches (8 min) : portez à ébullition une grande casserole d'eau et préparez un saladier d'eau très froide avec des glaçons. Avec la pointe d'un couteau, incisez une petite croix sur le dessous de chaque pêche. Plongez-les 30 secondes (jusqu'à 1 minute si elles sont encore fermes) dans l'eau bouillante, puis directement dans l'eau glacée : la peau se soulève et se retire facilement avec les doigts. Frottez aussitôt les fruits avec un peu de jus de citron pour qu'ils ne noircissent pas.",
            "Pocher les pêches (15 à 20 min) : remettez le sirop sur feu doux et plongez-y les pêches entières. Le sirop doit seulement frémir, avec quelques petites bulles qui remontent : jamais d'ébullition, elle abîmerait les fruits. Couvrez d'un rond de papier cuisson percé d'un petit trou au centre, posé directement sur les pêches pour les maintenir immergées. Comptez 10 minutes pour des pêches bien mûres, jusqu'à 20 minutes si elles sont fermes, en les retournant à mi-cuisson. Elles sont cuites quand la pointe d'un couteau s'enfonce sans résistance. Laissez-les refroidir complètement dans leur sirop (1 heure), puis placez-les au réfrigérateur.",
            "Rôtir les framboises et préparer le coulis (15 min) : préchauffez le four à 180°C. Étalez les framboises sur une plaque tapissée de papier cuisson, saupoudrez-les d'un peu de sucre glace et enfournez 8 minutes : elles doivent rendre leur jus tout en gardant leur forme. Réservez un tiers des framboises entières pour le dressage. Écrasez le reste à travers un tamis avec le dos d'une cuillère pour retirer les pépins. Goûtez ce coulis : ajoutez un peu de sucre glace s'il est trop acide, quelques gouttes de jus de citron s'il est trop sucré.",
            "Torréfier les amandes (3 min) : dans une poêle sèche, à feu moyen, faites dorer les amandes effilées en remuant sans arrêt. Dès qu'elles sentent la noisette et prennent une teinte blonde, versez-les sur une assiette : elles brûlent en quelques secondes.",
            "Monter la chantilly vanillée (5 min) : placez le saladier et le fouet 15 minutes au congélateur. Versez la crème liquide très froide, ajoutez du sucre glace à votre goût (environ 1 cuillère à café pour 5 cl de crème) et le reste des graines de vanille. Fouettez à vitesse moyenne jusqu'à obtenir des pics souples, qui retombent juste à la pointe. Si la crème devient granuleuse (début de beurre), ajoutez une cuillerée de crème froide et fouettez doucement : elle se rattrape.",
            "Dresser (5 min) : égouttez les pêches, coupez-les en deux et retirez le noyau. Dans une coupe ou un verre à pied, déposez une cuillerée de chantilly, posez une demi-pêche côté bombé vers le haut, entourez de framboises rôties, nappez de coulis, parsemez d'amandes et ajoutez une feuille de verveine. Servez frais."
          ],
          bienetre:"La pêche et la framboise apportent eau, fibres douces et vitamine C ; la verveine est traditionnellement digestive et apaisante.",secret:"Pocher sous un rond de papier cuisson : la pêche reste immergée et cuit de façon homogène. Et gardez le sirop : réduit de moitié, il devient un nappage brillant.",allergenes:"Lait — Fruits à coque — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Infusion Glacée Verveine-Citron",kcal:"~25 kcal/verre",
          ing:[["Verveine fraîche", "2 branches", "4 branches", "8 branches"], ["Eau frémissante", "20 cl", "40 cl", "80 cl"], ["Miel ou sucre", "1 c. à c.", "2 c. à c.", "4 c. à c."], ["Citron (jus)", "1/4", "1/2", "1"], ["Glaçons", "PM", "PM", "PM"]],
          steps:["Infuser (8 min) : froissez les branches de verveine entre les paumes pour libérer les arômes, placez-les dans une carafe et versez l'eau frémissante (pas bouillante : elle brûlerait les feuilles). Couvrez et laissez infuser 8 minutes.", "Sucrer et refroidir (45 min) : filtrez, dissolvez le miel ou le sucre dans l'infusion encore tiède, ajoutez le jus de citron, puis placez au réfrigérateur 45 minutes.", "Servir (1 min) : versez sur des glaçons et ajoutez une feuille de verveine fraîche. Astuce : une petite cuillerée de sirop de pochage des pêches dans le verre remplace le miel."],
          alt:"Eau pétillante, sirop de verveine et citron."},
        accord:"Une infusion de verveine glacée, qui prolonge le sirop de pochage.",vin:"Crémant de Limoux brut, très frais."},
      {id:"e11",numero:11,
        plat:{titre:"Pavlova aux Fruits Rouges",tagline:"La pavlova classique : meringue croustillante, chantilly, fruits rouges.",temps:"1h30 + 2h",kcal:"~320 kcal",
          ing:[["Blancs d'œufs","3","6","12"],["Sucre","150 g","300 g","600 g"],["Crème liquide","20 cl","40 cl","80 cl"],["Fruits rouges","250 g","500 g","1 kg"],["Vinaigre blanc","1 c. à c.","2 c. à c.","4 c. à c."]],
          steps:[
            "Monter la meringue (10 min) : dans un saladier parfaitement propre et sec, montez les blancs en neige à vitesse moyenne. Quand ils commencent à mousser, ajoutez le sucre en 3 fois, sans cesser de fouetter. Ajoutez le vinaigre blanc à mi-parcours : c'est lui qui donnera le cœur moelleux. Continuez à fouetter jusqu'à obtenir une meringue brillante et ferme, qui forme un bec d'oiseau.",
            "Former la pavlova (3 min) : sur une plaque recouverte de papier cuisson, formez un grand disque de meringue (20 cm de diamètre) à la spatule ou à la poche à douille. Creusez légèrement le centre avec le dos d'une cuillère pour créer un petit nid qui accueillera la chantilly. Lissez les bords.",
            "Cuire (1h15) : préchauffez le four à 120°C (chaleur traditionnelle). Enfournez la pavlova à mi-hauteur pour 1 heure et quart. Elle doit être croustillante à l'extérieur (craquelée en surface, c'est normal) et moelleuse à l'intérieur. Éteignez le four et laissez-la refroidir complètement dedans, porte entrouverte — un choc thermique la fendrait.",
            "Monter la chantilly (5 min) : sortez la crème glacée du réfrigérateur et versez-la dans un saladier froid. Fouettez à vitesse moyenne d'abord, puis rapide, jusqu'à obtenir une chantilly ferme. Sucrer légèrement (1 c. à s.). Réservez au frais jusqu'au dressage.",
            "Dresser et servir (5 min) : au moment de servir, garnissez le creux de la pavlova avec la chantilly, à la cuillère ou à la poche à douille. Disposez les fruits rouges dessus en les alternant (fraises coupées, framboises, myrtilles, groseilles). Servez immédiatement : la pavlova perd son croustillant en 30 minutes une fois garnie."
          ],
          bienetre:"Sans gluten, sans matière grasse cuite, la pavlova est étonnamment légère malgré sa gourmandise.",secret:"Ajouter une cuillère de vinaigre blanc dans les blancs : il stabilise la meringue et lui donne son cœur moelleux.",allergenes:"Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Champagne Brut",kcal:"~80 kcal/verre",
          ing:[["Champagne brut","10 cl","20 cl","40 cl"]],
          steps:["Refroidir (2 h) : placez la bouteille au réfrigérateur 2 heures minimum. Idéal : 8-10°C.","Servir (1 min) : ouvrez délicatement en tournant la bouteille (pas le bouchon), puis versez dans des flûtes bien froides en inclinant le verre pour préserver la mousse."],
          alt:"Crémant brut nature, ou un kombucha de qualité."},
        accord:"Un accord festif, à la hauteur de la pavlova.",vin:"Champagne brut nature."},
      {id:"e12",numero:12,
        plat:{titre:"Île Flottante au Caramel Beurre Salé et Praliné Rose",tagline:"Une meringue nuage pochée, sur une crème anglaise onctueuse, avec un filet de caramel beurre salé et des pralines roses.",temps:"1h + 2h",kcal:"~330 kcal",
          ing:[["Blancs d'œufs", "1", "2", "4"], ["Sucre (meringue)", "25 g", "50 g", "100 g"], ["Sel", "1 pincée", "1 pincée", "1 pincée"], ["Lait entier (crème anglaise)", "20 cl", "40 cl", "80 cl"], ["Jaunes d'œufs", "1", "2", "4"], ["Sucre (crème anglaise)", "20 g", "40 g", "80 g"], ["Gousse de vanille", "1/4", "1/2", "1"], ["Sucre (caramel)", "30 g", "60 g", "120 g"], ["Crème liquide (caramel)", "3 cl", "6 cl", "12 cl"], ["Beurre demi-sel", "10 g", "20 g", "40 g"], ["Pralines roses", "10 g", "20 g", "40 g"]],
          steps:[
            "Préparer la crème anglaise (20 min + 2 h de froid) : fendez la gousse de vanille, grattez les graines et mettez-les avec la gousse dans le lait. Portez à frémissement. Pendant ce temps, fouettez les jaunes avec le sucre 2 minutes, jusqu'à ce que le mélange blanchisse. Versez le lait chaud sur les jaunes en 3 fois en fouettant, puis remettez le tout dans la casserole. Cuisez sur feu doux en remuant sans arrêt avec une spatule en bois, en dessinant des huit, 5 à 8 minutes, jusqu'à 82-84°C : la crème nappe la spatule, et un trait tracé au doigt reste net. Ne dépassez jamais 85°C : les œufs coagulent. Filtrez aussitôt dans un saladier froid, filmez au contact et placez au réfrigérateur 2 heures minimum. Si la crème commence à grumeler, plongez la casserole dans l'eau froide et mixez 20 secondes au mixeur plongeant.",
            "Monter les blancs (10 min) : dans un saladier propre et sec (essuyez-le avec un peu de citron), fouettez les blancs avec la pincée de sel à vitesse moyenne jusqu'à ce qu'ils soient mousseux. Passez à vitesse rapide et ajoutez le sucre en 3 fois, en laissant 30 secondes entre chaque ajout. Fouettez jusqu'à obtenir une meringue très ferme et brillante, qui forme un bec d'oiseau bien droit au bout du fouet.",
            "Pocher les îles (10 min) : dans une large sauteuse, portez 5 cm d'eau à frémissement, vers 80-85°C, avec de petites bulles au fond et jamais d'ébullition franche (trop chaude, la meringue gonfle puis devient caoutchouteuse). Avec deux grandes cuillères à soupe trempées dans l'eau, façonnez de grosses quenelles de meringue et déposez-les dans l'eau sans les serrer, 2 ou 3 à la fois. Laissez pocher 2 minutes, retournez-les délicatement, puis 2 minutes encore. Elles doivent avoir doublé de volume et être fermes au toucher. Sortez-les à l'écumoire et posez-les sur un linge propre ou du papier absorbant. Elles se gardent 3 heures au réfrigérateur.",
            "Préparer le caramel beurre salé (10 min) : dans une casserole à fond épais, étalez le sucre en couche fine et chauffez à feu moyen sans remuer, en inclinant la casserole pour répartir la chaleur. Quand le caramel prend une couleur ambrée (pas fumant), retirez du feu. Versez la crème chaude, par petites quantités et à bout de bras, car elle fait des éclaboussures. Fouettez, ajoutez le beurre en morceaux et une pincée de fleur de sel. Si des grumeaux se forment, remettez 1 minute sur feu doux en fouettant. Laissez tiédir : il doit rester coulant.",
            "Concasser les pralines (2 min) : placez les pralines roses dans un sac congélation et frappez-les avec un rouleau à pâtisserie, pour obtenir des morceaux irréguliers et non une poudre.",
            "Dresser (5 min) : dans une assiette creuse, versez 2 louches de crème anglaise froide. Déposez une île, nappez-la d'un filet de caramel, parsemez de pralines roses concassées. Servez aussitôt : les pralines fondent et colorent la meringue en quelques minutes."
          ],
          bienetre:"Les blancs en neige sont riches en protéines et sans matière grasse ; la crème anglaise apporte du calcium. Un dessert plus léger qu'il n'y paraît.",secret:"Pocher les îles dans une eau qui frémit à peine : trop chaude, elles gonflent, puis s'effondrent en caoutchouc.",allergenes:"Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Citronnade Vanillée",kcal:"~60 kcal/verre",
          ing:[["Citrons (jus)", "1/2", "1", "2"], ["Sucre", "1 c. à s.", "2 c. à s.", "4 c. à s."], ["Gousse de vanille", "1/8", "1/4", "1/2"], ["Eau pétillante", "15 cl", "30 cl", "60 cl"], ["Glaçons", "PM", "PM", "PM"]],
          steps:["Préparer le sirop vanillé (5 min) : chauffez le sucre avec 2 cuillerées à soupe d'eau et les graines de vanille jusqu'à dissolution complète, puis laissez refroidir.", "Mélanger (2 min) : pressez les citrons, filtrez le jus, mélangez avec le sirop vanillé.", "Servir (1 min) : versez dans un grand verre rempli de glaçons, complétez avec l'eau pétillante, remuez doucement."],
          alt:"Eau pétillante et sirop de vanille."},
        accord:"Une citronnade vanillée, pour réveiller la douceur du caramel.",vin:"Muscat de Rivesaltes bien frais."},
      {id:"e13",numero:13,
        plat:{titre:"Sablé Breton aux Abricots Rôtis et Crème Légère à l'Amande",tagline:"Des sablés bretons au beurre demi-sel, des abricots rôtis au miel et une crème légère à l'amande.",temps:"1h + 3h",kcal:"~370 kcal",
          ing:[["Jaunes d'œufs (sablé)", "1", "2", "4"], ["Sucre (sablé)", "30 g", "60 g", "120 g"], ["Beurre demi-sel mou", "40 g", "80 g", "160 g"], ["Farine", "50 g", "100 g", "200 g"], ["Levure chimique", "1 pincée", "1/2 c. à c.", "1 c. à c."], ["Lait entier (crème)", "10 cl", "20 cl", "40 cl"], ["Jaunes d'œufs (crème)", "1/2", "1", "2"], ["Sucre (crème)", "15 g", "30 g", "60 g"], ["Fécule de maïs", "5 g", "10 g", "20 g"], ["Extrait d'amande amère", "2 gouttes", "4 gouttes", "8 gouttes"], ["Crème liquide entière froide", "5 cl", "10 cl", "20 cl"], ["Abricots mûrs", "2", "4", "8"], ["Miel", "1 c. à c.", "2 c. à c.", "4 c. à c."], ["Amandes effilées", "1 c. à c.", "2 c. à c.", "4 c. à c."]],
          steps:[
            "Préparer la crème pâtissière (15 min + 2 h de froid) : chauffez le lait jusqu'au frémissement. Fouettez les jaunes avec le sucre, puis la fécule, jusqu'à obtenir un mélange lisse et pâle. Versez le lait chaud en filet en fouettant, remettez dans la casserole et cuisez à feu moyen en fouettant sans arrêt. La crème épaissit d'un coup ; continuez 1 minute après les premiers gros bouillons. Hors du feu, ajoutez l'extrait d'amande amère, transférez dans un plat, filmez au contact et placez 2 heures au réfrigérateur.",
            "Préparer la pâte sablée (10 min + 1 h de repos) : dans un saladier, fouettez les jaunes avec le sucre jusqu'à ce que le mélange blanchisse. Incorporez le beurre mou en pommade, puis la farine mélangée à la levure, du bout des doigts, juste jusqu'à ce que la pâte soit homogène : ne la travaillez pas, elle durcirait. Elle est molle et collante, c'est normal. Filmez et laissez 1 heure au réfrigérateur.",
            "Cuire les sablés (25 min) : préchauffez le four à 170°C. Posez des cercles de 7 cm (ou des moules à tartelette sans fond) sur une plaque tapissée de papier cuisson. Étalez la pâte entre deux feuilles de papier cuisson sur 1 cm d'épaisseur, découpez des disques de 7 cm et glissez-les dans les cercles. Dorez au pinceau avec un peu de jaune d'œuf dilué, tracez des croisillons avec une fourchette. Enfournez 18 à 20 minutes, jusqu'à ce qu'ils soient dorés. Laissez refroidir 10 minutes dans les cercles avant de les retirer : ils sont très fragiles tièdes.",
            "Rôtir les abricots (15 min) : montez le four à 200°C. Coupez les abricots en deux, retirez les noyaux et déposez-les face coupée vers le haut sur une plaque tapissée de papier cuisson. Arrosez de miel et enfournez 12 à 15 minutes, jusqu'à ce que les bords caramélisent et que la chair soit tendre. Laissez refroidir avec leur jus.",
            "Torréfier les amandes (3 min) : faites dorer les amandes effilées à sec dans une poêle, à feu moyen, en remuant constamment.",
            "Finir la crème légère (5 min) : fouettez la crème liquide froide en chantilly souple. Détendez la crème pâtissière froide au fouet pour la rendre lisse, puis incorporez délicatement la chantilly avec une spatule, en soulevant la masse, jusqu'à obtenir une crème aérienne.",
            "Dresser (5 min) : sur chaque assiette, posez un sablé, garnissez de crème légère à la poche ou à la cuillère, disposez les moitiés d'abricot rôti, nappez de jus de cuisson et parsemez d'amandes effilées. Pour un dessert plus croustillant, assemblez au dernier moment."
          ],
          bienetre:"L'abricot est riche en bêta-carotène et en fibres ; l'amande apporte de bonnes graisses et du magnésium.",secret:"Utiliser des cercles pour cuire les sablés : la pâte molle garde sa forme et reste fondante à cœur. Et laisser refroidir avant de démouler.",allergenes:"Gluten — Œuf — Lait — Fruits à coque — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Limonade Abricot-Thym",kcal:"~55 kcal/verre",
          ing:[["Abricot mûr", "1/2", "1", "2"], ["Citron (jus)", "1/4", "1/2", "1"], ["Sucre", "1 c. à c.", "2 c. à c.", "1 c. à s."], ["Thym-citron", "1 brin", "2 brins", "4 brins"], ["Eau pétillante", "15 cl", "30 cl", "60 cl"], ["Glaçons", "PM", "PM", "PM"]],
          steps:["Mixer (3 min) : coupez l'abricot en morceaux, mixez-le avec le sucre et le jus de citron jusqu'à obtenir une purée lisse.", "Filtrer (2 min) : passez la purée à travers une passoire fine en pressant avec une cuillère, pour obtenir un nectar sans fibres.", "Servir (1 min) : versez le nectar dans un verre avec des glaçons et un brin de thym froissé, complétez avec l'eau pétillante."],
          alt:"Eau pétillante et jus d'abricot."},
        accord:"Une limonade d'abricot, en écho au fruit rôti.",vin:"Monbazillac, très frais."},
      {id:"e14",numero:14,
        plat:{titre:"Tiramisu aux Pêches et Basilic",tagline:"Le tiramisu revisité, aux pêches fraîches et au basilic.",temps:"30 min + 4h",kcal:"~340 kcal",
          ing:[["Mascarpone","250 g","500 g","1 kg"],["Œufs","2","4","8"],["Sucre","80 g","160 g","320 g"],["Pêches","3","6","12"],["Basilic frais","quelques feuilles","1 poignée","2 poignées"],["Boudoirs","15","30","60"]],
          steps:[
            "Séparer les œufs (1 min) : cassez les œufs en séparant les blancs des jaunes. Mettez les jaunes dans un grand saladier, les blancs dans un autre (que vous garderez au frais pour les monter plus tard).",
            "Monter la crème (5 min) : fouettez les jaunes avec le sucre pendant 2 minutes, jusqu'à ce que le mélange blanchisse et devienne mousseux. Ajoutez le mascarpone (sorti du réfrigérateur 10 minutes avant pour qu'il soit souple) et mélangez à la maryse jusqu'à obtenir une crème lisse et homogène. Ne fouettez pas trop : le mascarpone deviendrait liquide.",
            "Monter les blancs (3 min) : montez les blancs en neige ferme avec une pincée de sel (facultatif). Incorporez-les délicatement à la crème au mascarpone en 3 fois, en soulevant la maryse de bas en haut — c'est ce geste qui garde l'air dans la crème et donne la légèreté au tiramisu.",
            "Préparer les pêches et le basilic (5 min) : coupez les pêches en fines tranches sans les peler. Ciselez finement le basilic frais au couteau. Préparez un sirop léger en faisant chauffer 10 cl d'eau et 20 g de sucre, laissez refroidir. Si vous voulez un tiramisu plus parfumé, ajoutez un trait de jus de pêche ou de vin blanc doux dans le sirop.",
            "Monter et réfrigérer (5 min + 4 h) : dans un plat rectangulaire, alternez : boudoirs trempés rapidement dans le sirop (2 secondes par face), couche de crème au mascarpone, tranches de pêches, basilic ciselé. Répétez l'opération jusqu'à épuisement, en terminant par une couche de crème. Filmez au contact et placez au réfrigérateur 4 heures minimum (idéalement une nuit). Saupoudrez de basilic frais au moment de servir."
          ],
          bienetre:"Les pêches apportent des fibres douces et de l'eau ; le basilic facilite la digestion des laitages.",secret:"Ajouter le basilic uniquement entre les couches, pas sur le dessus : il noircit à l'air.",allergenes:"Œuf — Lait — Gluten — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Café Glacé Léger",kcal:"~10 kcal/verre",
          ing:[["Espresso","1","2","4"],["Eau froide","10 cl","20 cl","40 cl"],["Glaçons","PM","PM","PM"]],
          steps:["Préparer l'espresso (2 min) : préparez 1 espresso serré par personne. Utilisez un café de bonne qualité, moulu finement.","Refroidir (5 min) : laissez refroidir à température ambiante ou plongez le récipient dans de l'eau froide pour accélérer.","Servir (1 min) : remplissez un grand verre de glaçons, versez l'espresso, allongez avec 10 cl d'eau froide. Remuez. Facultatif : un trait de sirop de sucre ou de vanille."],
          alt:"Café décaféiné, ou un thé noir glacé."},
        accord:"Un café glacé, en écho au tiramisu.",vin:"Vin doux naturel (Maury), très frais."},
      {id:"e15",numero:15,
        plat:{titre:"Nougat Glacé au Miel de Lavande, Coulis de Framboises",tagline:"Un parfait glacé à la meringue au miel de lavande, aux amandes, pistaches et oranges confites, avec un coulis de framboises acidulé.",temps:"40 min + 6h",kcal:"~330 kcal",
          ing:[["Blancs d'œufs", "1/2", "1", "2"], ["Miel de lavande", "25 g", "50 g", "100 g"], ["Crème liquide entière très froide", "6 cl", "12 cl", "25 cl"], ["Amandes entières", "10 g", "20 g", "40 g"], ["Pistaches non salées", "8 g", "15 g", "30 g"], ["Oranges confites", "8 g", "15 g", "30 g"], ["Framboises", "50 g", "100 g", "200 g"], ["Sucre glace (coulis)", "1 c. à c.", "1 c. à s.", "2 c. à s."], ["Citron (jus)", "quelques gouttes", "1 c. à c.", "2 c. à c."]],
          steps:[
            "Préparer les fruits secs (15 min) : préchauffez le four à 160°C. Étalez les amandes sur une plaque et faites-les griller 8 à 10 minutes, jusqu'à ce qu'elles soient dorées et parfumées. Laissez-les refroidir, puis concassez-les grossièrement au couteau avec les pistaches (des morceaux de la taille d'un petit pois, pas de la poudre). Coupez les oranges confites en petits dés de 3 mm.",
            "Préparer le moule (5 min) : tapissez un moule à cake de film alimentaire en le laissant largement dépasser sur les bords : il servira à démouler. Placez-le au congélateur.",
            "Fouetter la crème (5 min) : placez le saladier et le fouet 15 minutes au congélateur. Fouettez la crème liquide très froide jusqu'à obtenir une chantilly souple, qui forme des pics mous : elle ne doit pas être trop ferme. Réservez au réfrigérateur.",
            "Préparer la meringue au miel (15 min) : versez le miel dans une casserole plus grande que nécessaire (il mousse en chauffant) et faites-le chauffer à feu moyen avec un thermomètre jusqu'à 120°C. Sans thermomètre, une goutte de miel versée dans de l'eau froide doit former une boule souple. Quand le miel atteint 110°C, commencez à fouetter les blancs à vitesse moyenne jusqu'à ce qu'ils forment des pics souples. Versez le miel en mince filet, au bord du saladier, sans toucher le fouet. Continuez de fouetter 5 à 6 minutes, jusqu'à ce que le saladier soit tiède et la meringue ferme et brillante. Le miel chaud brûle gravement : ne le touchez jamais avec les doigts.",
            "Assembler (5 min) : incorporez d'abord un tiers de la chantilly dans la meringue pour l'assouplir, puis le reste en 2 fois avec une spatule, en soulevant la masse du fond. Ajoutez les fruits secs et les oranges confites, en mélangeant délicatement pour ne pas faire retomber l'appareil.",
            "Congeler (6 h minimum) : versez l'appareil dans le moule et tapotez-le sur le plan de travail pour chasser les bulles d'air. Repliez le film par-dessus et placez au congélateur au moins 6 heures, idéalement une nuit. Le nougat glacé se garde 1 semaine.",
            "Préparer le coulis (5 min) : mixez les framboises avec le sucre glace et le jus de citron, puis passez à travers un tamis. Goûtez et ajustez le sucre.",
            "Démouler et servir (5 min) : sortez le moule du congélateur 10 minutes avant de servir. Soulevez le nougat grâce au film et retournez-le sur une planche. Coupez-le en tranches épaisses avec un couteau trempé dans l'eau chaude et essuyé entre chaque tranche. Servez avec le coulis."
          ],
          bienetre:"Le miel et les fruits à coque apportent de l'énergie ; le coulis de framboises, de la vitamine C et de l'acidité qui allège l'ensemble.",secret:"Verser le miel chaud en filet sur les blancs : il les cuit doucement et les stabilise, comme dans une meringue italienne. Le nougat tient sans sorbetière.",allergenes:"Œuf — Lait — Fruits à coque — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Espresso Serré",kcal:"~2 kcal/tasse",
          ing:[["Café en grains","7 g","14 g","28 g"],["Eau","3 cl","6 cl","12 cl"]],
          steps:["Moudre (30 sec) : moulez le café très finement, juste avant l'extraction. Un café moulu à l'avance perd ses arômes.","Extraire (25 sec) : extrayez un espresso serré. Idéal : 25 secondes, une crème couleur noisette dense en surface.","Servir (30 sec) : versez dans une tasse préchauffée à l'eau chaude, puis essuyée. Se boit en une ou deux gorgées, sans sucre."],
          alt:"Ristretto, encore plus concentré."},
        accord:"Un espresso serré, en contraste chaud-froid.",vin:"Un trait de Marsala, servi frais."},
      {id:"e16",numero:16,
        plat:{titre:"Tartelettes aux Myrtilles et Citron",tagline:"De petites tartelettes acidulées, aux myrtilles sauvages.",temps:"40 min",kcal:"~280 kcal",
          ing:[["Pâte sablée","1 rouleau","1 rouleau","2 rouleaux"],["Myrtilles","200 g","400 g","800 g"],["Citron (jus + zeste)","1","2","4"],["Sucre","50 g","100 g","200 g"],["Fécule","1 c. à s.","2 c. à s.","4 c. à s."]],
          steps:[
            "Foncer les moules (10 min) : beurrez 6 petits moules à tartelettes. Étalez la pâte sablée, découpez des disques légèrement plus grands que les moules, foncez-les en les faisant bien adhérer aux parois. Piquez le fond à la fourchette. Réservez 20 minutes au réfrigérateur.",
            "Cuire à blanc (15 min) : préchauffez le four à 180°C. Recouvrez chaque fond de papier cuisson et de billes de cuisson. Cuisez 15 minutes : les bords doivent être dorés. Retirez les billes, laissez refroidir.",
            "Préparer la garniture (5 min) : dans un saladier, mélangez les myrtilles (fraîches ou surgelées non décongelées) avec le sucre, le jus et le zeste d'un citron, et la fécule. La fécule est essentielle : elle va absorber le jus des myrtilles et éviter que la pâte ne soit détrempée. Mélangez délicatement pour ne pas écraser les fruits.",
            "Garnir (2 min) : répartissez la garniture dans les fonds précuits, sans trop tasser. Les myrtilles doivent arriver au niveau du bord de la pâte.",
            "Cuire (15 min) : enfournez à 180°C pendant 15 minutes. La garniture doit être bouillonnante et les myrtilles fondantes. Laissez tiédir 10 minutes avant de démouler. Servez tiède ou froid, avec un peu de crème fraîche ou une boule de glace vanille."
          ],
          bienetre:"Les myrtilles sont riches en anthocyanes, puissants antioxydants. Le citron stimule la digestion.",secret:"La fécule empêche le jus de myrtille de détremper la pâte.",allergenes:"Gluten — Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Thé Noir Glacé au Citron",kcal:"~0 kcal",
          ing:[["Thé noir","1 c. à c.","2 c. à c.","4 c. à c."],["Citron","1/2","1","2"],["Glaçons","PM","PM","PM"]],
          steps:["Infuser (4 min) : infusez le thé noir dans 30 cl d'eau frémissante, 4 minutes. Retirez les feuilles ou le sachet.","Refroidir (1 h) : filtrez, placez au réfrigérateur au moins 1 heure.","Servir (1 min) : versez sur des glaçons, ajoutez une rondelle de citron frais. Un brin de menthe pour la fraîcheur."],
          alt:"Citronnade fraîche."},
        accord:"Un thé glacé citronné, en écho au citron du dessert.",vin:"Crémant brut rosé."},
      {id:"e17",numero:17,
        plat:{titre:"Panna Cotta Coco-Mangue",tagline:"Une panna cotta sans lait de vache, au lait de coco et à la mangue.",temps:"20 min + 4h",kcal:"~290 kcal",
          ing:[["Lait de coco","20 cl","40 cl","80 cl"],["Crème liquide","10 cl","20 cl","40 cl"],["Gélatine","2 feuilles","4 feuilles","8 feuilles"],["Sucre","40 g","80 g","160 g"],["Mangue bien mûre","1/2","1","2"],["Citron vert","1/2","1","2"]],
          steps:[
            "Hydrater la gélatine (5 min) : plongez les feuilles de gélatine dans un bol d'eau très froide pendant 5 minutes. Elles doivent devenir souples et molles.",
            "Chauffer la base (5 min) : dans une casserole, versez le lait de coco, la crème liquide et le sucre. Chauffez à feu doux jusqu'aux premiers frémissements (petites bulles sur les bords). Ne faites jamais bouillir : une ébullition ferait perdre à la gélatine son pouvoir gélifiant.",
            "Incorporer la gélatine (1 min) : hors du feu, essorez les feuilles entre vos mains pour retirer l'excès d'eau, puis plongez-les dans le mélange chaud. Fouettez doucement 30 secondes : tout doit être dissous, sans filaments.",
            "Couler en verrines (2 min) : versez la préparation dans 4 verrines, à mi-hauteur. Laissez refroidir 15 minutes à température ambiante, puis placez au réfrigérateur 4 heures minimum. Pour vérifier la prise : la panna cotta doit être ferme sur les bords et encore légèrement tremblante au centre.",
            "Préparer le coulis de mangue (5 min) : pelez la mangue bien mûre, prélevez la chair. Mixez-la avec le jus d'un demi-citron vert, jusqu'à obtenir un coulis lisse. Réservez au frais dans un petit bol. Au moment de servir, versez 2 cuillères à soupe de coulis sur chaque panna cotta — ne le faites pas à l'avance, sinon il détrempe la surface."
          ],
          bienetre:"Le lait de coco est une alternative au lait de vache, plus digeste pour les estomacs sensibles.",secret:"Ajouter le coulis de mangue seulement au moment de servir : sinon il détrempe la panna cotta.",allergenes:"Aucun allergène majeur (si chocolat blanc sans soja) — Vegan",
          veg:"Végétarien & vegan (avec gélatine végétale)."},
        boisson:{titre:"Eau de Coco Fraîche",kcal:"~40 kcal/verre",
          ing:[["Eau de coco","15 cl","30 cl","60 cl"],["Glaçons","PM","PM","PM"]],
          steps:["Refroidir (1 h) : placez la brique d'eau de coco au réfrigérateur au moins 1 heure avant de servir. Une eau de coco tiède est bien moins agréable.","Servir (1 min) : versez dans un verre haut sur des glaçons. Une paille en bambou ou en inox complète le tableau."],
          alt:"Lait de coco allégé, battu avec un peu d'eau."},
        accord:"Une eau de coco, en écho direct au dessert.",vin:"Rhum blanc agricole, en digestif."},
      {id:"e18",numero:18,
        plat:{titre:"Baba au Rhum Ambré, Agrumes et Chantilly Vanille",tagline:"Un baba moelleux imbibé d'un sirop d'agrumes au rhum ambré, garni de chantilly vanille et de suprêmes d'orange.",temps:"1h + 4h",kcal:"~380 kcal",
          ing:[["Farine", "30 g", "60 g", "125 g"], ["Levure boulangère sèche", "1 pincée", "1,5 g", "3 g"], ["Lait tiède", "1 c. à s.", "2 c. à s.", "3 c. à s."], ["Œufs", "1/2", "1", "2"], ["Beurre mou", "10 g", "20 g", "40 g"], ["Sucre (pâte)", "3 g", "6 g", "12 g"], ["Eau (sirop)", "8 cl", "15 cl", "30 cl"], ["Sucre (sirop)", "25 g", "50 g", "100 g"], ["Oranges", "1/2", "1", "2"], ["Citron (zeste)", "1/4", "1/2", "1"], ["Gousse de vanille", "1/4", "1/2", "1"], ["Rhum ambré", "1,5 cl", "3 cl", "6 cl"], ["Crème liquide entière froide", "8 cl", "15 cl", "30 cl"], ["Sucre glace", "1 c. à c.", "2 c. à c.", "1 c. à s."]],
          steps:[
            "Préparer la pâte (20 min + 1 h de pousse) : délayez la levure dans le lait tiède (30-35°C : il doit être agréable au doigt, trop chaud il tuerait la levure) et laissez 5 minutes jusqu'à ce qu'il mousse. Dans un saladier, mélangez la farine, le sucre et une pincée de sel, ajoutez les œufs battus et le lait à la levure. Battez vigoureusement 8 à 10 minutes à la spatule (5 minutes au robot avec le crochet) : la pâte, collante, doit devenir élastique et se détacher des parois en filant. Ajoutez le beurre mou en trois fois, battez 3 minutes jusqu'à obtenir une pâte lisse et brillante. Filmez et laissez pousser 1 heure à 25°C, jusqu'à doubler de volume.",
            "Mouler (10 min + 30 min de pousse) : beurrez généreusement des moules à baba ou des moules à muffins. Dégonflez la pâte à la spatule mouillée, répartissez-la dans les moules en les remplissant à moitié seulement. Laissez pousser 30 minutes, jusqu'à ce que la pâte arrive au bord des moules.",
            "Cuire (15 min) : préchauffez le four à 180°C. Enfournez 12 à 15 minutes, jusqu'à ce que les babas soient bien dorés et gonflés. Démoulez aussitôt sur une grille.",
            "Sécher (3 h minimum) : laissez les babas à l'air libre au moins 3 heures, ou toute une nuit. C'est indispensable : une mie sèche absorbe le sirop comme une éponge sans se déliter. Si vous êtes pressé, remettez-les 15 minutes dans un four à 100°C.",
            "Préparer le sirop d'agrumes (15 min) : prélevez le zeste de l'orange et du citron en bandes avec un économe. Dans une casserole, portez à ébullition 2 minutes l'eau, le sucre, les zestes et la moitié des graines de vanille avec la gousse. Laissez infuser 10 minutes, puis laissez tiédir à 50-60°C. Hors du feu, ajoutez le rhum : chauffé, il perdrait son parfum.",
            "Imbiber (10 min) : posez les babas sur une grille au-dessus d'une plaque. Plongez-les un par un dans le sirop tiède, 30 secondes par face, ou arrosez-les à la cuillère jusqu'à ce qu'ils soient gorgés. Pressez doucement : ils doivent rendre un peu de sirop sans s'écraser. Laissez égoutter 10 minutes, puis réservez au frais.",
            "Préparer les suprêmes et la chantilly (10 min) : coupez le haut et le bas de l'orange, retirez la peau et la partie blanche en suivant la courbe du fruit, puis prélevez les segments entre les membranes au-dessus d'un bol. Fouettez la crème très froide avec le sucre glace et le reste des graines de vanille jusqu'à des pics souples.",
            "Dresser (3 min) : posez un baba sur chaque assiette, garnissez le centre de chantilly, disposez les suprêmes d'orange, parsemez de zestes fins. Servez frais."
          ],
          bienetre:"L'orange apporte de la vitamine C. Le rhum est dosé en petite quantité par portion : pour les enfants, on le remplace par du jus d'orange.",secret:"Imbiber des babas bien secs avec un sirop tiède, jamais bouillant : la mie boit lentement et reste moelleuse.",allergenes:"Gluten — Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Thé Glacé Orange-Vanille",kcal:"~35 kcal/verre",
          ing:[["Thé noir", "1 sachet", "2 sachets", "4 sachets"], ["Eau", "20 cl", "40 cl", "80 cl"], ["Orange (jus)", "1/4", "1/2", "1"], ["Gousse de vanille", "1/8", "1/4", "1/2"], ["Glaçons", "PM", "PM", "PM"]],
          steps:["Infuser (4 min) : versez l'eau frémissante sur le thé noir avec les graines et la gousse de vanille, laissez infuser 4 minutes (au-delà, il devient âpre).", "Refroidir (1 h) : filtrez, ajoutez le jus d'orange et placez au réfrigérateur 1 heure.", "Servir (1 min) : versez sur des glaçons avec une rondelle d'orange."],
          alt:"Eau pétillante, jus d'orange et vanille."},
        accord:"Un thé glacé orange-vanille, en écho aux agrumes du sirop.",vin:"Rivesaltes ambré, bien frais."}
    ]
  },
    automne:{
    id:"automne", nom:"Automne", tagline:"Pommes & Épices Douces", stripe:"#7B9B5E",
    intro:"L'automne est la saison des vergers et des épices douces : pommes, poires, figues, noix de pécan, marrons, cannelle et muscade. Des desserts généreux, réconfortants, qui réchauffent les premiers froids.",
    duos:[
      {id:"a19",numero:19,
        plat:{titre:"Gâteau Basque à la Cerise Noire",tagline:"La pâte dorée du pays basque, fourrée de crème pâtissière vanillée et de cerises noires.",temps:"1h + 3h",kcal:"~380 kcal",
          ing:[["Farine", "50 g", "100 g", "200 g"], ["Sucre (pâte)", "25 g", "50 g", "100 g"], ["Beurre demi-sel mou", "25 g", "50 g", "100 g"], ["Œufs (1 pour la pâte, 1 jaune pour dorer)", "1/2", "1", "2"], ["Levure chimique", "1 pincée", "1/2 c. à c.", "1 c. à c."], ["Rhum ambré (facultatif)", "1 c. à c.", "2 c. à c.", "1 c. à s."], ["Citron (zeste)", "1/8", "1/4", "1/2"], ["Lait entier (crème)", "6 cl", "12 cl", "25 cl"], ["Jaunes d'œufs (crème)", "1/2", "1", "2"], ["Sucre (crème)", "12 g", "25 g", "50 g"], ["Fécule de maïs", "5 g", "10 g", "20 g"], ["Gousse de vanille", "1/8", "1/4", "1/2"], ["Confiture de cerises noires", "25 g", "50 g", "100 g"]],
          steps:[
            "Préparer la crème pâtissière (15 min + 2 h de froid) : fendez la gousse de vanille, grattez les graines et chauffez-les avec le lait jusqu'au frémissement. Fouettez les jaunes avec le sucre, puis ajoutez la fécule. Versez le lait chaud en filet en fouettant, remettez dans la casserole et cuisez à feu moyen en fouettant sans arrêt. La crème épaissit d'un coup : continuez 1 minute après les premiers bouillons. Transférez dans un plat, filmez au contact et placez 2 heures au réfrigérateur (ou 30 minutes dans un bain d'eau glacée).",
            "Préparer la pâte (10 min + 1 h de repos) : mélangez le beurre mou avec le sucre jusqu'à obtenir un mélange crémeux et clair. Ajoutez l'œuf entier, le zeste de citron, le rhum et une pincée de sel. Incorporez la farine mélangée à la levure en 2 fois, du bout des doigts, jusqu'à ce que la pâte forme une masse souple. Elle est molle et un peu collante : ne la travaillez pas. Placez-la entre deux feuilles de papier cuisson, aplatissez en disque et laissez 1 heure au réfrigérateur.",
            "Foncer le moule (10 min) : beurrez et farinez un moule à tarte de 20 cm à bords hauts. Divisez la pâte en deux portions, une plus grande (60 %) et une plus petite. Étalez la grande entre deux feuilles de papier cuisson sur 5 mm d'épaisseur, en un disque de 26 cm environ. Glissez-la dans le moule en la faisant remonter sur les bords, en la rapiécant avec les doigts si elle se fend. Étalez de la même façon la plus petite en un disque de 20 cm et réservez au frais.",
