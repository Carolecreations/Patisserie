            "Garnir (5 min) : étalez la confiture de cerises noires en couche fine au fond. Lissez la crème pâtissière à la spatule, versez-la par-dessus et étalez-la jusqu'à 1 cm des bords. Mouillez le bord de pâte au pinceau, posez le disque de pâte du dessus, appuyez sur le tour pour souder et rabattez l'excédent de pâte vers l'intérieur.",
            "Dorer et décorer (5 min) : battez 1 jaune d'œuf avec 1 cuillère à café de lait et dorez toute la surface au pinceau. Avec les dents d'une fourchette, dessinez des croisillons en traçant des lignes parallèles distantes de 1 cm, puis dans l'autre sens. Placez 15 minutes au réfrigérateur : la dorure sèche et le gâteau gardera mieux sa forme.",
            "Cuire (40 min) : préchauffez le four à 170°C. Enfournez sur la grille du bas pendant 35 à 40 minutes, jusqu'à ce que le gâteau soit profondément doré et que les bords soient fermes. Si le dessus brunit trop vite, couvrez-le de papier aluminium après 25 minutes. Laissez refroidir 30 minutes dans le moule avant de démouler, puis complètement avant de couper : la crème doit finir de prendre. Le gâteau basque est encore meilleur le lendemain."
          ],
          bienetre:"La cerise noire est riche en antioxydants ; la crème pâtissière apporte du calcium. Un dessert de partage, à déguster en petite part.",secret:"Étaler la pâte entre deux feuilles de papier cuisson : elle est très molle, et c'est la seule façon de la manipuler sans y ajouter de farine, qui la durcirait.",allergenes:"Gluten — Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Chocolat Chaud de Bayonne",kcal:"~170 kcal/tasse",
          ing:[["Lait entier", "15 cl", "30 cl", "60 cl"], ["Chocolat noir 70 %", "25 g", "50 g", "100 g"], ["Bâton de cannelle", "1/2", "1", "2"], ["Piment d'Espelette", "1 pincée", "1 pincée", "2 pincées"]],
          steps:["Infuser (5 min) : chauffez le lait avec le bâton de cannelle jusqu'aux premiers frémissements, retirez du feu et laissez infuser 5 minutes.", "Fondre (3 min) : hachez le chocolat. Retirez la cannelle, remettez le lait à chauffer sans bouillir, versez-le sur le chocolat et fouettez jusqu'à obtenir une boisson lisse et brillante.", "Servir (1 min) : versez dans des tasses, saupoudrez d'une toute petite pincée de piment d'Espelette : il réchauffe sans piquer."],
          alt:"Lait chaud vanillé et cacao."},
        accord:"Un chocolat chaud de Bayonne, dont la pointe de piment répond à la cerise.",vin:"Irouléguy rouge, souple et fruité."},
            {id:"a20",numero:20,
        plat:{titre:"Flan Parisien à la Vanille Bourbon",tagline:"Le flan des boulangeries parisiennes : une texture fondante, un appareil généreux à la vanille, une surface légèrement caramélisée.",temps:"1h + 4h de froid",kcal:"~380 kcal",
          ing:[["Lait entier","50 cl","1 L","2 L"],["Œufs entiers","2","4","8"],["Jaunes d'œufs","2","4","8"],["Sucre","100 g","200 g","400 g"],["Maïzena (fécule de maïs)","60 g","120 g","240 g"],["Gousse de vanille Bourbon","1","2","4"],["Pâte brisée","1 rouleau","1 rouleau","2 rouleaux"]],
          steps:[
            "Infuser la vanille dans le lait (15 min) : fendez la gousse de vanille Bourbon en deux dans la longueur, grattez les graines avec la pointe d'un couteau. Versez le lait dans une casserole à fond épais, ajoutez la gousse et les graines. Chauffez à feu doux jusqu'aux premiers frémissements — de petites bulles apparaissent sur les bords. Retirez immédiatement du feu, couvrez et laissez infuser 15 minutes. Retirez la gousse avant de continuer. Le lait doit être profondément parfumé, presque ambré.",
            "Préparer l'appareil (10 min) : dans un saladier, fouettez les œufs entiers, les jaunes, le sucre et la Maïzena pendant 2 minutes, jusqu'à obtenir un mélange parfaitement lisse et légèrement blanchi. Ne cherchez pas à faire mousser : il ne s'agit pas d'incorporer de l'air, mais de bien homogénéiser la Maïzena dans les œufs. Versez le lait infusé tiède (pas chaud) en filet sur le mélange, en fouettant constamment. Passez l'appareil au chinois fin pour retirer les éventuels grumeaux et les filaments d'œuf.",
            "Cuire l'appareil (5 min) : reversez l'appareil dans la casserole propre, rincée. Faites cuire à feu moyen-doux, en remuant constamment au fouet, pendant 5 à 7 minutes. L'appareil va épaissir progressivement. Il est prêt quand il nappe la cuillère et qu'il forme un ruban épais quand on le fait couler. Retirez immédiatement du feu — au-delà, l'appareil peut trancher. Versez dans un récipient froid, filmez au contact (le film doit toucher la surface), laissez refroidir à température ambiante puis 1 heure au frais.",
            "Foncer le moule et garnir (10 min) : préchauffez le four à 180°C (chaleur traditionnelle). Beurrez et farinez un moule à manqué de 20 cm (ou utilisez un cercle à pâtisserie posé sur une plaque chemisée). Étalez la pâte brisée sur 3 mm d'épaisseur, foncez-la dans le moule en faisant bien adhérer les bords sans tirer, puis passez le rouleau sur le bord pour couper l'excédent. Versez l'appareil refroidi dans le moule, en le lissant à la spatule coudée. Tapotez légèrement le moule sur le plan de travail pour égaliser la surface.",
            "Cuire et laisser refroidir (40 min + 4 h) : enfournez le flan à mi-hauteur pour 40 minutes. Le flan est prêt quand il est pris sur les bords et légèrement doré sur le dessus, mais qu'il tremble encore au centre quand on secoue doucement le moule — c'est ce qui garantit un cœur fondant. Retirez du four et laissez complètement refroidir à température ambiante. Placez au réfrigérateur 4 heures minimum (idéalement toute une nuit) : le flan se raffermit et développe tous ses parfums. Découpez en parts généreuses avec un couteau bien affûté, passé sous l'eau chaude et essuyé entre chaque coupe. Servez bien froid."
          ],
          bienetre:"Riche en calcium et en protéines (œufs, lait), le flan est un dessert rassasiant qui se digère en douceur. La vanille est traditionnellement apaisante pour le système digestif.",secret:"La Maïzena (fécule de maïs) est la clé : elle donne au flan cette texture onctueuse et ferme à la fois, sans avoir besoin de trop d'œufs. Ne la remplacez jamais par de la farine — vous obtiendriez une texture pâteuse et lourde.",allergenes:"Gluten — Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Café Filtre de Spécialité",kcal:"~2 kcal/tasse",
          ing:[["Café de spécialité (Éthiopie, Kenya)","15 g","30 g","60 g"],["Eau filtrée","25 cl","50 cl","1 L"]],
          steps:[
            "Moudre (30 sec) : moulez le café en grains juste avant l'extraction, en mouture moyenne (comme du sable fin). Le café doit être frais — un café moulu à l'avance perd 60% de ses arômes en 30 minutes.",
            "Chauffer l'eau (2 min) : portez l'eau filtrée à 92-94°C. Un thermomètre est idéal — un café trop chaud devient amer, trop froid sous-extrait.",
            "Extraire (4 min) : versez l'eau en plusieurs fois sur le café, dans un filtre en papier. Le café doit couler lentement, en 3 à 4 minutes au total. Cette lenteur garantit une extraction complète et équilibrée.",
            "Servir (30 sec) : versez dans une petite tasse préchauffée. Le café filtre se boit sans sucre — ses notes fruitées prolongent merveilleusement la vanille du flan."
          ],
          alt:"Espresso serré, si vous préférez l'intensité."},
        accord:"Un café filtre fruité, en contraste avec le fondant sucré du flan. C'est l'accord des boulangeries parisiennes modernes.",vin:"Champagne extra-brut ou Banyuls jeune, légèrement frais."},
      {id:"a21",numero:21,
        plat:{titre:"Fondant au Chocolat et Poire",tagline:"Un fondant au chocolat noir, avec un cœur de poire fondant.",temps:"30 min",kcal:"~420 kcal",
          ing:[["Chocolat noir 70%","150 g","300 g","600 g"],["Beurre","100 g","200 g","400 g"],["Œufs","3","6","12"],["Sucre","80 g","160 g","320 g"],["Farine","40 g","80 g","160 g"],["Poires","1","2","4"]],
          steps:[
            "Fondre le chocolat (5 min) : cassez le chocolat en morceaux, ajoutez le beurre coupé en dés. Faites fondre au bain-marie à feu doux, en remuant à la spatule, jusqu'à obtenir un mélange lisse et brillant. Retirez du bain-marie et laissez tiédir 5 minutes — le chocolat doit être tiède au toucher, pas brûlant, sinon il cuirait les œufs.",
            "Blanchir les œufs (3 min) : dans un grand saladier, fouettez les œufs avec le sucre pendant 2 à 3 minutes, jusqu'à ce que le mélange blanchisse et double de volume. Utilisez un batteur électrique pour aller plus vite : la texture doit être mousseuse.",
            "Incorporer le chocolat et la farine (2 min) : versez le chocolat fondu tiédi sur les œufs blanchis en 3 fois, en mélangeant à la maryse entre chaque ajout. Ajoutez ensuite la farine tamisée et mélangez sans trop travailler : juste pour incorporer, la pâte doit rester lisse et brillante.",
            "Préparer les moules et les poires (3 min) : beurrez généreusement 6 petits moules à fondant (ou des ramequins), puis farinez-les légèrement en tapotant pour retirer l'excédent. Pelez les poires, coupez-les en petits dés de 1 cm. Répartissez les dés de poire au fond des moules.",
            "Cuire (10 min) : préchauffez le four à 200°C (chaleur traditionnelle, pas tournante). Versez la pâte dans les moules, en remplissant aux 3/4. Enfournez pour 10 minutes précises : le dessus doit être pris et légèrement craquelé, mais le centre doit trembler quand on secoue doucement le moule. Démoulez immédiatement en retournant sur une assiette, ou servez dans le ramequin. Le cœur doit être coulant."
          ],
          bienetre:"Le chocolat noir à 70% est riche en flavonoïdes antioxydants. La poire apporte des fibres douces qui équilibrent.",secret:"Sortir le fondant du four dès que le centre tremble encore : c'est ce qui garantit un cœur coulant.",allergenes:"Œuf — Lait — Gluten — Soja possible — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Espresso Serré",kcal:"~2 kcal/tasse",
          ing:[["Café en grains","7 g","14 g","28 g"],["Eau","3 cl","6 cl","12 cl"]],
          steps:["Moudre (30 sec) : moulez le café très finement, juste avant l'extraction — un café moulu à l'avance perd ses arômes.","Extraire (25 sec) : extrayez un espresso serré (25 secondes environ). La crème doit être couleur noisette et dense.","Servir (30 sec) : versez dans une petite tasse préchauffée à l'eau chaude puis essuyée. Se boit en une ou deux gorgées, sans sucre, juste après avoir cassé la coque du fondant."],
          alt:"Ristretto, encore plus concentré."},
        accord:"Un espresso serré, en contraste avec le fondant.",vin:"Banyuls jeune, très légèrement frais."},
      {id:"a22",numero:22,
        plat:{titre:"Charlotte Brioche aux Pommes Reinettes et Caramel",tagline:"Une coque de brioche dorée au beurre, un cœur de pommes reinettes fondantes et un caramel à la vanille.",temps:"55 min",kcal:"~390 kcal",
          ing:[["Pain brioché tranché", "3 tranches", "6 tranches", "12 tranches"], ["Beurre (brioche et pommes)", "25 g", "50 g", "100 g"], ["Pommes reinettes (ou boskoop)", "1 grosse", "2 grosses", "4 grosses"], ["Sucre roux", "15 g", "30 g", "60 g"], ["Cannelle en poudre", "1 pincée", "1/2 c. à c.", "1 c. à c."], ["Citron (jus)", "quelques gouttes", "1 c. à c.", "2 c. à c."], ["Sucre (caramel)", "30 g", "60 g", "120 g"], ["Crème liquide (caramel)", "3 cl", "6 cl", "12 cl"], ["Gousse de vanille", "1/8", "1/4", "1/2"], ["Crème fraîche épaisse", "1 c. à s.", "2 c. à s.", "4 c. à s."]],
          steps:[
            "Cuire les pommes (20 min) : épluchez les pommes, retirez le cœur et coupez-les en dés de 1,5 cm. Dans une grande poêle, faites fondre la moitié du beurre à feu moyen-vif, ajoutez les pommes, le sucre roux, la cannelle et le jus de citron. Faites cuire 12 à 15 minutes en remuant de temps en temps, jusqu'à ce qu'elles soient dorées et tendres tout en gardant un peu de tenue. Toute l'eau doit s'être évaporée : des pommes trop humides feraient s'effondrer la charlotte. Laissez refroidir.",
            "Préparer la brioche (10 min) : faites fondre le reste du beurre. Beurrez les ramequins au pinceau, côté intérieur. Retirez la croûte des tranches de brioche. Découpez, pour chaque ramequin, un disque au fond (avec un emporte-pièce un peu plus petit que le moule) et des bandes de 3 cm de large pour les parois. Trempez un côté de chaque morceau dans le beurre fondu.",
            "Chemiser les moules (5 min) : posez le disque au fond, côté beurré contre le moule. Disposez les bandes tout autour, côté beurré contre la paroi, en les faisant se chevaucher légèrement, sans laisser de trou.",
            "Garnir et fermer (5 min) : remplissez de pommes en tassant bien, en formant un petit dôme. Recouvrez d'un disque de brioche coupé à la taille du moule, ou repliez les bandes vers l'intérieur. Badigeonnez le dessus de beurre fondu.",
            "Cuire (25 min) : préchauffez le four à 180°C. Posez les ramequins sur une plaque et enfournez 20 à 25 minutes, jusqu'à ce que la brioche soit croustillante et dorée. Laissez reposer 10 minutes avant de démouler : le beurre se fige et la coque devient plus ferme.",
            "Préparer le caramel à la vanille (10 min) : dans une casserole à fond épais, étalez le sucre en couche fine et chauffez à feu moyen sans remuer, en inclinant la casserole. Quand il devient ambré, retirez du feu. Versez la crème chaude en filet (elle éclabousse), ajoutez les graines de vanille et fouettez. Gardez au chaud.",
            "Démouler et servir (3 min) : passez la lame d'un petit couteau entre la brioche et le moule, retournez sur une assiette, nappez de caramel tiède. Servez tiède avec une cuillère de crème fraîche épaisse."
          ],
          bienetre:"La pomme est riche en fibres et en pectine, douce pour la digestion. Le caramel est la touche gourmande, à doser selon l'envie.",secret:"Chemiser les moules avec la brioche beurrée côté moule : elle frit légèrement au four, et la coque reste croustillante tout en tenant à la découpe.",allergenes:"Gluten — Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Jus de Pomme Chaud aux Épices",kcal:"~90 kcal/verre",
          ing:[["Jus de pomme trouble", "20 cl", "40 cl", "80 cl"], ["Bâton de cannelle", "1/2", "1", "2"], ["Clous de girofle", "1", "2", "4"], ["Orange (rondelles)", "1", "2", "4"]],
          steps:["Chauffer (8 min) : versez le jus de pomme dans une casserole avec la cannelle, les clous de girofle et les rondelles d'orange. Chauffez à feu doux, sans bouillir, 8 minutes.", "Infuser (5 min) : retirez du feu, couvrez et laissez infuser 5 minutes.", "Servir (1 min) : filtrez et versez dans des verres résistants à la chaleur, avec une rondelle d'orange."],
          alt:"Tisane pomme-cannelle."},
        accord:"Un jus de pomme chaud aux épices, en écho au parfum des pommes cuites.",vin:"Jurançon moelleux, en digestif."},
      {id:"a23",numero:23,
        plat:{titre:"Cheesecake Potiron-Épices",tagline:"Un cheesecake d'automne, au potiron rôti et aux épices douces.",temps:"1h + 4h",kcal:"~380 kcal",
          ing:[["Biscuits spéculoos","150 g","300 g","600 g"],["Beurre fondu","60 g","120 g","240 g"],["Cream cheese","300 g","600 g","1,2 kg"],["Potiron cuit","200 g","400 g","800 g"],["Sucre","80 g","160 g","320 g"],["Œufs","2","4","8"],["Épices (cannelle, muscade, gingembre)","1 c. à c.","2 c. à c.","4 c. à c."]],
          steps:[
            "Préparer la base (5 min) : mixez les spéculoos au robot ou écrasez-les au rouleau dans un sac congélation, jusqu'à obtenir une poudre fine. Versez dans un saladier, ajoutez le beurre fondu et mélangez. Tassez cette préparation au fond d'un moule à charnière beurré (20 cm), en appuyant bien avec le dos d'une cuillère pour former une croûte compacte. Réservez au frais pendant que vous préparez la garniture.",
            "Préparer l'appareil (5 min) : dans un grand saladier, fouettez le cream cheese (sorti 30 minutes avant) pour le détendre. Ajoutez le sucre, les œufs un à un, la purée de potiron et les épices. Mélangez jusqu'à obtenir une texture parfaitement lisse. Ne fouettez pas trop longtemps : l'appareil ne doit pas incorporer d'air, sinon le cheesecake craquelle à la cuisson.",
            "Cuire (50 min) : préchauffez le four à 160°C (chaleur traditionnelle). Versez l'appareil sur la base de biscuits. Enfournez pour 50 minutes : le cheesecake doit être pris sur les bords mais encore légèrement tremblant au centre. Une lame de couteau plantée à 3 cm du bord doit ressortir propre, tandis qu'au centre elle sera encore humide.",
            "Refroidir progressivement (1 h) : éteignez le four et laissez le cheesecake refroidir dedans, porte entrouverte, pendant 1 heure. Cette descente en température progressive évite qu'il ne craquelle en surface. Sortez du four, laissez complètement refroidir à température ambiante.",
            "Réserver au froid (4 h) : filmez au contact ou couvrez d'un couvercle, puis placez au réfrigérateur 4 heures minimum (idéalement une nuit). Démoulez en passant un torchon chaud autour du moule, puis en ouvrant la charnière. Servez avec une chantilly légère saupoudrée de cannelle."
          ],
          bienetre:"Le potiron est riche en fibres douces et en bêtacarotène. Les épices douces facilitent la digestion.",secret:"Laisser refroidir le cheesecake dans le four éteint : cela évite qu'il ne craquelle en surface.",allergenes:"Gluten — Lait — Œuf — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Chai Latte",kcal:"~90 kcal/verre",
          ing:[["Thé noir","1 sachet","2 sachets","4 sachets"],["Cardamome","1 gousse","2 gousses","4 gousses"],["Gingembre","petit morceau","morceau","grand morceau"],["Cannelle","1 pincée","2 pincées","4 pincées"],["Lait","5 cl","10 cl","20 cl"]],
          steps:["Infuser (5 min) : dans une petite casserole, portez 20 cl d'eau à frémissement avec le thé noir, les gousses de cardamome écrasées, le gingembre frais râpé et la cannelle. Laissez infuser 5 minutes à couvert.","Filtrer (30 sec) : passez au chinois pour retirer les épices.","Ajouter le lait (1 min) : versez le lait (entier ou végétal) et faites chauffer sans bouillir. Fouettez ou utilisez un mousseur à lait pour créer une mousse en surface.","Servir (30 sec) : versez dans une grande tasse, en gardant la mousse sur le dessus. Saupoudrez d'une pincée de cannelle."],
          alt:"Chai latte au lait végétal (avoine, amande)."},
        accord:"Un chai latte, en écho direct aux épices du cheesecake.",vin:"Muscat de Beaumes-de-Venise, très frais."},
      {id:"a24",numero:24,
        plat:{titre:"Tarte aux Noix de Pécan",tagline:"La tarte américaine par excellence, au sirop d'érable.",temps:"1h",kcal:"~420 kcal",
          ing:[["Pâte sablée","1 rouleau","1 rouleau","2 rouleaux"],["Noix de pécan","150 g","300 g","600 g"],["Sirop d'érable","100 ml","200 ml","400 ml"],["Œufs","2","4","8"],["Sucre roux","60 g","120 g","240 g"],["Beurre fondu","50 g","100 g","200 g"]],
          steps:[
            "Cuire la pâte à blanc (20 min) : foncez la pâte sablée dans un moule à tarte beurré, piquez le fond à la fourchette. Couvrez de papier cuisson et de billes de cuisson. Enfournez 20 minutes à 180°C jusqu'à ce que les bords soient dorés. Retirez les billes et le papier, laissez refroidir.",
            "Préparer la garniture (5 min) : dans un saladier, fouettez les œufs avec le sucre roux pendant 1 minute. Ajoutez le sirop d'érable et le beurre fondu, mélangez jusqu'à obtenir un appareil homogène et brillant. Si vous aimez, ajoutez 1 cuillère à soupe de whisky ou de rhum brun — c'est un accord classique aux États-Unis.",
            "Disposer les noix (2 min) : rangez les noix de pécan en rosace serrée au fond de la tarte précuite. Commencez par l'extérieur, côté bombé vers le haut, en les chevauchant légèrement. Elles ne doivent pas flotter — c'est leur disposition qui donnera la belle couche dorée en surface.",
            "Verser la garniture (1 min) : versez l'appareil liquide sur les noix en le répartissant uniformément. Les noix vont légèrement remonter : c'est normal et c'est ce qu'on veut.",
            "Cuire (40 min) : enfournez à 170°C pour 40 minutes. La garniture doit être prise et légèrement tremblante au centre. Si les bords dorent trop vite, protégez-les avec une bande d'aluminium. Sortez la tarte du four, laissez complètement refroidir (au moins 2 heures) avant de la démouler : la garniture durcit en refroidissant. Servez à température ambiante, avec une chantilly légère ou une boule de glace vanille."
          ],
          bienetre:"Les noix de pécan sont riches en bons lipides et en magnésium. Un dessert gourmand, à déguster avec modération.",secret:"Disposer les noix de pécan sur le fond avant de verser la garniture : elles remontent naturellement et forment une belle couche dorée.",allergenes:"Gluten — Œuf — Lait — Fruits à coque (pécan) — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Bourbon on the Rocks",kcal:"~90 kcal/verre",ing:[["Bourbon","4 cl","8 cl","16 cl"],["Glaçon","1","2","4"]],
          steps:["Tailler le glaçon (1 min) : idéalement, utilisez un grand glaçon taillé au couteau (un cube de 5 cm) — il fond lentement et dilue le bourbon progressivement. Sinon, un gros glaçon du commerce fait l'affaire.","Verser (30 sec) : versez le bourbon sur le glaçon, dans un verre tumbler à fond épais sorti du congélateur.","Servir (30 sec) : sans eau, sans glace pilée. Le bourbon se déguste à petites gorgées, en laissant le glaçon fondre pour libérer les arômes."],
          alt:"Café filtre serré."},
        accord:"Un bourbon, en écho aux États-Unis et au sirop d'érable.",vin:"Maury ou Banyuls, en digestif."},
      {id:"a25",numero:25,
        plat:{titre:"Clafoutis aux Figues et Miel",tagline:"Un clafoutis d'automne, aux figues fraîches et au miel de châtaignier.",temps:"40 min",kcal:"~320 kcal",
          ing:[["Figues fraîches","6","12","24"],["Œufs","2","4","8"],["Lait entier","15 cl","30 cl","60 cl"],["Farine","60 g","120 g","240 g"],["Sucre","50 g","100 g","200 g"],["Miel de châtaignier","1 c. à s.","2 c. à s.","4 c. à s."]],
          steps:[
            "Préparer les figues (5 min) : lavez les figues et coupez-les en quatre dans la hauteur, sans les peler. Choisissez des figues bien mûres : elles doivent être souples sous le doigt, presque tendues, avec une peau fine. Une figue trop ferme restera fade à la cuisson.",
            "Préparer la pâte (5 min) : fouettez les œufs avec le sucre jusqu'à ce que le mélange blanchisse. Ajoutez la farine tamisée et mélangez, puis versez le lait en 3 fois en fouettant entre chaque ajout. La pâte doit être lisse et fluide.",
            "Beurrer et garnir (2 min) : beurrez un plat à gratin, disposez les quartiers de figues en une couche régulière, face coupée vers le haut. Versez la pâte par-dessus — les figues doivent être presque recouvertes.",
            "Cuire (30 min) : préchauffez le four à 180°C. Enfournez pour 30 minutes. Le clafoutis est prêt quand le dessus est doré, gonflé, et que le centre tremble à peine quand on secoue le plat. Si le dessus colore trop vite, couvrez d'aluminium.",
            "Finir au miel (1 min) : à la sortie du four, arrosez immédiatement le clafoutis d'un filet de miel de châtaignier — sa chaleur va faire pénétrer le miel et créer un glaçage naturel. Laissez tiédir 15 minutes avant de servir. Se déguste tiède ou froid, avec une cuillère de yaourt grec pour équilibrer."
          ],
          bienetre:"La figue est riche en fibres et en minéraux. Le miel de châtaignier est traditionnellement réputé pour son action tonique.",secret:"Choisir des figues bien mûres : elles doivent être souples sous le doigt.",allergenes:"Œuf — Lait — Gluten — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Infusion de Thym",kcal:"~0 kcal/tasse",
          ing:[["Thym séché","1 c. à c.","2 c. à c.","4 c. à c."],["Eau frémissante","150 ml","300 ml","600 ml"]],
          steps:["Chauffer (3 min) : portez l'eau à frémissement.","Infuser (5 min) : versez sur le thym dans une tasse, couvrez pour préserver les arômes. Le thym est puissant : 5 minutes suffisent.","Filtrer (30 sec) : passez au chinois.","Servir (30 sec) : en tasse bien chaude, sans sucre. Un filet de miel si vous aimez."],
          alt:"Infusion de romarin."},
        accord:"Une infusion de thym, en écho aux notes méditerranéennes.",vin:"Muscat de Rivesaltes, très frais."},
      {id:"a26",numero:26,
        plat:{titre:"Mousse au Chocolat Noir et Fleur de Sel",tagline:"Une mousse au chocolat noir intense, relevée d'une pointe de fleur de sel.",temps:"20 min + 4h",kcal:"~340 kcal",
          ing:[["Chocolat noir 70%","200 g","400 g","800 g"],["Œufs","4","8","16"],["Sucre","40 g","80 g","160 g"],["Fleur de sel","1 pincée","2 pincées","4 pincées"]],
          steps:[
            "Fondre le chocolat (5 min) : cassez le chocolat en morceaux et faites-le fondre au bain-marie à feu doux, en remuant à la spatule. Retirez du bain-marie et laissez tiédir : le chocolat doit être à environ 30-35°C (tiède, pas chaud). S'il est trop chaud, il cuira les jaunes et la mousse aura une texture granuleuse.",
            "Séparer les œufs (1 min) : séparez les blancs des jaunes, en prenant soin qu'aucune trace de jaune ne tombe dans les blancs (sinon ils ne monteront pas). Placez les blancs dans un grand saladier parfaitement propre et sec, les jaunes dans un bol.",
            "Incorporer les jaunes (2 min) : ajoutez les jaunes au chocolat fondu tiédi, un à un, en mélangeant à la maryse entre chaque. La texture doit être lisse et brillante. Si le mélange semble se figer, c'est que le chocolat était trop froid : réchauffez-le 5 secondes au bain-marie et mélangez de nouveau.",
            "Monter les blancs (5 min) : montez les blancs en neige à vitesse moyenne. Quand ils moussent, ajoutez le sucre en 3 fois sans cesser de fouetter. Arrêtez quand les blancs forment un bec d'oiseau ferme : la pointe reste droite quand on lève le fouet. Ne les montez pas trop : trop fermes, ils donneraient une mousse sèche.",
            "Incorporer les blancs (3 min) : incorporez les blancs au chocolat en 3 fois. Pour chaque ajout, utilisez la maryse et soulevez délicatement la masse du bas vers le haut, en tournant le saladier d'un quart de tour à chaque geste. C'est ce mouvement qui garde l'air dans la mousse. Ne mélangez pas en cercles — vous casseriez les bulles. Ajoutez la fleur de sel en fin d'incorporation.",
            "Réserver au froid (4 h) : répartissez dans des verrines ou de petits ramequins. Couvrez d'un film au contact (le film doit toucher la mousse) ou d'un couvercle. Placez au réfrigérateur 4 heures minimum. Au moment de servir, ajoutez une dernière pincée de fleur de sel sur le dessus : elle éclate en bouche et révèle toute la profondeur du chocolat."
          ],
          bienetre:"Le chocolat noir à 70% est riche en flavonoïdes antioxydants et en magnésium. Une mousse légère, sans crème.",secret:"Une pincée de fleur de sel sur le dessus, au moment de servir : elle révèle le goût du chocolat.",allergenes:"Œuf — Soja possible — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Espresso Ristretto",kcal:"~2 kcal/tasse",
          ing:[["Café en grains","7 g","14 g","28 g"],["Eau","3 cl","6 cl","12 cl"]],
          steps:["Moudre fin (30 sec) : moulez le café encore plus fin que pour un espresso classique, juste avant l'extraction.","Extraire (20 sec) : extrayez un ristretto : moins d'eau, extraction plus courte (20 secondes au lieu de 25). Le café est plus concentré, plus sirupeux, avec une crème dense.","Servir (30 sec) : versez dans une petite tasse préchauffée. Se déguste pur, en une seule gorgée, pour contraster avec la douceur de la mousse."],
          alt:"Café décaféiné."},
        accord:"Un ristretto, en contraste avec la mousse.",vin:"Banyuls jeune, légèrement frais."},
      {id:"a27",numero:27,
        plat:{titre:"Opéra Café-Noisette",tagline:"Le grand classique de la pâtisserie parisienne : biscuit moelleux à la noisette, crème mousseline au café, ganache chocolat noir et glaçage brillant.",temps:"1h30 + 3h",kcal:"~410 kcal",
          ing:[["Poudre de noisettes (joconde)", "15 g", "30 g", "60 g"], ["Sucre glace (joconde)", "15 g", "30 g", "60 g"], ["Farine", "5 g", "10 g", "20 g"], ["Œufs entiers", "1/2", "1", "2"], ["Blancs d'œufs", "1/2", "1", "2"], ["Sucre (blancs)", "5 g", "10 g", "20 g"], ["Beurre fondu (joconde)", "4 g", "8 g", "15 g"], ["Eau (sirop)", "3 cl", "5 cl", "10 cl"], ["Sucre (sirop)", "5 g", "10 g", "20 g"], ["Café fort", "1 cl", "2,5 cl", "5 cl"], ["Lait entier (crème au café)", "4 cl", "8 cl", "15 cl"], ["Jaune d'œuf", "1/4", "1/2", "1"], ["Sucre (crème au café)", "6 g", "12 g", "25 g"], ["Maïzena", "3 g", "6 g", "12 g"], ["Extrait de café", "1/4 c. à c.", "1/2 c. à c.", "1 c. à c."], ["Beurre mou (crème au café)", "20 g", "40 g", "80 g"], ["Chocolat noir 70 % (ganache)", "18 g", "35 g", "70 g"], ["Crème liquide (ganache)", "2 cl", "4 cl", "7 cl"], ["Chocolat noir (glaçage)", "15 g", "30 g", "60 g"], ["Huile neutre (glaçage)", "1 c. à c.", "2 c. à c.", "1 c. à s."]],
          steps:[
            "Préparer le biscuit joconde (30 min) : préchauffez le four à 220°C. Tapissez une plaque de 24 × 20 cm de papier cuisson. Fouettez au batteur les œufs entiers avec la poudre de noisettes et le sucre glace pendant 4 minutes, jusqu'à ce que le mélange double de volume et forme un ruban épais. Montez les blancs en neige ferme en ajoutant le sucre en 2 fois. Incorporez un tiers des blancs au mélange aux noisettes, puis la farine tamisée, puis le reste des blancs, en soulevant la masse à la spatule. Ajoutez le beurre fondu tiède en dernier, en mélangeant très peu. Étalez en couche de 5 mm sur la plaque et enfournez 6 à 8 minutes, jusqu'à ce que le biscuit soit à peine doré et qu'il revienne quand on appuie dessus. Faites glisser sur une grille avec le papier et laissez refroidir avant de décoller le papier.",
            "Préparer le sirop de café (5 min) : portez à frémissement l'eau et le sucre, ajoutez le café fort, laissez refroidir complètement. Le sirop tiède ramollirait trop le biscuit.",
            "Préparer la crème mousseline au café (25 min + 1 h) : fouettez le jaune avec le sucre, puis la maïzena. Portez le lait à ébullition, versez-le en filet sur le mélange en fouettant, remettez dans la casserole et cuisez à feu moyen sans cesser de fouetter, 1 minute après les premiers bouillons. Hors du feu, ajoutez l'extrait de café. Filmez au contact et laissez refroidir à environ 20°C (1 heure, ou 15 minutes sur un bain d'eau glacée). Fouettez ensuite le beurre mou en pommade, jusqu'à ce qu'il soit clair et crémeux, puis incorporez la crème froide en 3 fois, en fouettant 1 minute entre chaque ajout. La crème doit être lisse et aérienne.",
            "Préparer la ganache (10 min + 30 min) : hachez le chocolat. Portez la crème à ébullition, versez-la en 2 fois sur le chocolat, laissez reposer 30 secondes, puis mélangez à la maryse en petits cercles jusqu'à obtenir une ganache lisse et brillante. Laissez-la tiédir à 28-30°C : elle doit se tartiner sans couler.",
            "Monter l'opéra (20 min) : découpez le biscuit en 3 rectangles de 20 × 8 cm. Posez le premier sur une planche, imbibez-le généreusement de sirop au pinceau, et étalez la moitié de la crème au café en couche régulière. Posez le deuxième biscuit, imbibez-le, étalez toute la ganache. Posez le troisième biscuit, imbibez-le et étalez le reste de crème au café. Lissez avec une spatule coudée. Placez au congélateur 30 minutes pour que le dessus durcisse.",
            "Glacer et finir (15 min + 30 min) : faites fondre le chocolat noir avec l'huile au bain-marie, jusqu'à 30°C environ. Versez-le sur le dessus de l'opéra bien froid et étalez-le très finement d'un seul geste à la spatule. Placez 30 minutes au réfrigérateur. Parez les bords avec un couteau trempé dans l'eau chaude puis essuyé, pour des tranches nettes, et coupez 4 parts. Servez frais."
          ],
          bienetre:"Le chocolat noir et la noisette apportent magnésium et bons acides gras. Un dessert riche, à déguster en petite part avec un café.",secret:"Imbiber chaque biscuit au pinceau et non à la cuillère : le sirop se répartit de façon régulière, sans détremper le gâteau.",allergenes:"Gluten — Œuf — Lait — Fruits à coque — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Vin Chaud aux Épices",kcal:"~140 kcal/verre",
          ing:[["Vin rouge","10 cl","20 cl","40 cl"],["Sucre","1 c. à s.","2 c. à s.","4 c. à s."],["Cannelle","1 bâton","2 bâtons","4 bâtons"],["Orange","1/2","1","2"]],
          steps:["Chauffer (5 min) : dans une casserole, versez le vin rouge, le sucre, les bâtons de cannelle et les rondelles d'orange. Chauffez à feu doux en remuant pour dissoudre le sucre. Le vin ne doit jamais bouillir : l'alcool s'évaporerait et le vin deviendrait âpre.","Ajouter l'orange (2 min) : pressez un demi-juste au-dessus de la casserole, ajoutez aussi les zestes. Laissez infuser 2 minutes à couvert.","Filtrer (30 sec) : passez au chinois ou retirez les épices à l'écumoire.","Servir (30 sec) : versez dans des tasses épaisses préchauffées. Servez bien chaud, avec un bâton de cannelle en décor."],
          alt:"Jus de raisin épicé chaud (sans alcool)."},
        accord:"Un vin chaud, en écho automnal.",vin:"Banyuls, en digestif."}
    ]
  },
  hiver:{
    id:"hiver", nom:"Hiver", tagline:"Chocolat & Agrumes", stripe:"#5C3A1E",
    intro:"L'hiver est la saison du chocolat, de la vanille, du caramel et des agrumes. Bûches, crèmes brûlées, mont-blanc, truffes et galettes — des desserts réconfortants, généreux, qui célèbrent la fin d'année.",
    duos:[
      {id:"h28",numero:28,
        plat:{titre:"Bûche Chocolat-Praliné",tagline:"La bûche de Noël par excellence : chocolat noir et praliné croustillant.",temps:"1h30 + 2h",kcal:"~440 kcal",
          ing:[["Génoise chocolat","1 plaque","1 plaque","2 plaques"],["Chocolat noir","200 g","400 g","800 g"],["Crème liquide","30 cl","60 cl","1,2 L"],["Praliné","150 g","300 g","600 g"],["Beurre","50 g","100 g","200 g"]],
          steps:[
            "Préparer la génoise (15 min) : préchauffez le four à 200°C. Fouettez 4 œufs entiers avec 120 g de sucre au bain-marie jusqu'à ce que le mélange atteigne 40°C et blanchisse. Retirez du bain-marie et continuez à fouetter 5-8 minutes au batteur jusqu'à obtenir un ruban bien marqué. Incorporez délicatement 100 g de farine tamisée et 20 g de cacao en poudre, en 3 fois, à la maryse. Étalez sur une plaque chemisée (30×40 cm) et enfournez 10 minutes. La génoise doit être souple et se détacher facilement du papier.",
            "Préparer la ganache (10 min) : chauffez 30 cl de crème liquide entière à frémissement. Versez-la en 3 fois sur 200 g de chocolat noir haché finement, en mélangeant à la maryse au centre, en petits cercles concentriques, à chaque ajout. Quand la ganache est lisse, ajoutez 50 g de beurre en morceaux et mélangez. Filmez au contact et placez au réfrigérateur 2 heures minimum : elle doit être ferme mais encore souple.",
            "Monter la bûche (5 min) : étalez la génoise sur un torchon propre légèrement humide. Répartissez une couche de ganache refroidie (gardez-en la moitié pour l'extérieur), puis parsemez de praliné. Roulez la génoise en serrant bien, en vous aidant du torchon. Le roulage doit se faire quand la génoise est encore légèrement tiède : elle craquelle moins.",
            "Glacer la bûche (10 min) : coupez les extrémités du rouleau pour avoir des bords nets. Posez la bûche sur un plat de service. Réchauffez légèrement la ganache restante au bain-marie pour la rendre nappante (elle doit être à environ 30°C). Versez-la sur la bûche en la lissant à la spatule coudée d'un geste continu. Pour un effet « écorce », passez les dents d'une fourchette sur la surface de la ganache avant qu'elle ne fige.",
            "Décorer et servir (5 min) : décorez la bûche de copeaux de chocolat, de brisures de praliné croustillant, de quelques noisettes caramélisées. Placez au frais jusqu'au moment de servir. Sortez la bûche 15 minutes avant : elle sera plus fondante et plus parfumée. Découpez des tranches d'environ 2 cm à l'aide d'un couteau passé sous l'eau chaude et essuyé entre chaque coupe."
          ],
          bienetre:"Un dessert de fête, généreux — à déguster avec modération, mais avec un vrai plaisir.",secret:"Rouler la génoise encore tiède : elle se craquelle moins.",allergenes:"Gluten — Œuf — Lait — Fruits à coque — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Champagne Brut",kcal:"~80 kcal/verre",ing:[["Champagne brut","10 cl","20 cl","40 cl"]],
          steps:["Refroidir (2 h) : placez la bouteille au réfrigérateur au moins 2 heures. Idéal : 8-10°C.","Servir (1 min) : ouvrez la bouteille en tournant la bouteille (pas le bouchon) pour éviter les projections. Versez dans des flûtes bien froides, en inclinant le verre pour préserver la mousse."],
          alt:"Crémant brut nature."},
        accord:"Un accord de fête, en contraste avec la richesse de la bûche.",vin:"Champagne brut."},
      {id:"h29",numero:29,
        plat:{titre:"Crêpes Suzette au Beurre d'Orange",tagline:"Des crêpes très fines nappées d'un beurre d'orange caramélisé au Grand Marnier, flambées à table ou simplement fondantes.",temps:"50 min + 1h",kcal:"~380 kcal",
          ing:[["Farine", "30 g", "60 g", "125 g"], ["Œufs", "1/2", "1", "2"], ["Lait entier", "6 cl", "12 cl", "25 cl"], ["Beurre fondu (pâte)", "5 g", "10 g", "20 g"], ["Sucre (pâte)", "1 c. à c.", "2 c. à c.", "1 c. à s."], ["Sel", "1 pincée", "1 pincée", "1 pincée"], ["Oranges bio non traitées (zeste et jus)", "1", "2", "3"], ["Beurre doux mou (beurre d'orange)", "20 g", "40 g", "80 g"], ["Sucre (beurre d'orange)", "15 g", "30 g", "60 g"], ["Grand Marnier", "1 cl", "2 cl", "4 cl"], ["Beurre (poêle)", "PM", "PM", "PM"]],
          steps:[
            "Préparer la pâte à crêpes (10 min + 1 h de repos) : dans un saladier, mélangez la farine, le sucre et le sel. Creusez un puits au centre, cassez-y les œufs et commencez à fouetter en incorporant la farine par petits bouts. Versez ensuite le lait peu à peu, en continuant de fouetter du centre vers l'extérieur : c'est la clé pour une pâte sans grumeaux. Ajoutez le beurre fondu tiède. La pâte doit être fluide, qui nappe à peine la cuillère, comme une crème liquide. Laissez-la reposer 1 heure à température ambiante : l'amidon se détend, les crêpes seront plus fines et ne se déchireront pas. Si elle a épaissi, détendez-la avec un peu de lait.",
            "Cuire les crêpes (25 min) : chauffez à feu moyen-vif une poêle antiadhésive de 24 cm et beurrez-la très légèrement avec un papier absorbant. Versez une petite louche de pâte (environ 6 cl), inclinez la poêle en tous sens pour l'étaler en couche très fine. Laissez cuire environ 1 minute, jusqu'à ce que les bords se décollent et que le dessous soit doré. Retournez d'un geste vif avec une spatule large, cuisez 20 secondes et déposez sur une assiette. Empilez les crêpes en les couvrant d'une feuille d'aluminium pour les garder souples. Si la première est épaisse, ajoutez un peu de lait à la pâte ; si elle se déchire, c'est que vous l'avez retournée trop tôt.",
            "Préparer le beurre d'orange (10 min) : brossez les oranges sous l'eau chaude, râpez finement le zeste avec une râpe fine, en évitant la partie blanche amère. Écrasez le beurre mou à la fourchette avec le sucre et le zeste, jusqu'à obtenir une pommade lisse. Pressez le jus des oranges et filtrez-le.",
            "Napper les crêpes (10 min) : dans une grande poêle, faites fondre le beurre d'orange à feu moyen. Quand il mousse, versez la moitié du jus d'orange et laissez frémir 3 à 4 minutes, jusqu'à ce que la sauce épaississe légèrement et prenne une teinte ambrée. Pliez chaque crêpe en deux, puis encore en deux, pour former un triangle. Disposez-les dans la sauce, retournez-les une fois, 30 secondes par face, pour qu'elles s'imprègnent bien. Ajoutez le reste du jus si la sauce réduit trop.",
            "Flamber (facultatif, 2 min) : retirez la poêle du feu et éloignez-la de la hotte et des rideaux. Chauffez le Grand Marnier dans une petite louche, versez-le dans la poêle à bout de bras et enflammez-le avec un long briquet, en vous tenant légèrement en retrait. Laissez les flammes s'éteindre d'elles-mêmes (20 à 30 secondes) en balançant doucement la poêle. Pour un dessert sans flamme, laissez simplement frémir 1 minute sur le feu pour évaporer l'alcool.",
            "Servir (2 min) : déposez 2 crêpes par assiette, nappez de sauce, parsemez de zestes d'orange frais. Servez aussitôt, bien chaud."
          ],
          bienetre:"L'orange apporte de la vitamine C, et la crêpe est un dessert relativement léger lorsqu'on dose bien le beurre. L'alcool s'évapore en grande partie à la cuisson.",secret:"Laisser reposer la pâte 1 heure : elle devient plus souple, les crêpes sont plus fines et ne se déchirent pas. Et goûter la sauce avant d'ajouter l'alcool : trop sucrée, elle masque l'orange.",allergenes:"Gluten — Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Rhum Ambré",kcal:"~90 kcal/verre",ing:[["Rhum ambré","4 cl","8 cl","16 cl"]],
          steps:["Servir (30 sec) : versez le rhum ambré dans un verre tulipe (verre à cognac), à température ambiante (18-20°C). Le verre tulipe concentre les arômes vers le nez.","Déguster (—) : humez d'abord sans remuer, puis faites tourner légèrement le verre. Buvez à petites gorgées : le rhum ambré développe ses notes de vanille, de caramel et de fruits secs."],
          alt:"Café serré."},
        accord:"Un rhum ambré, en écho à l'orange.",vin:"Maury ou Banyuls, en digestif."},
      {id:"h30",numero:30,
        plat:{titre:"Mont-Blanc aux Marrons",tagline:"Le mont-blanc classique : meringue, chantilly, vermicelles de marrons.",temps:"1h30 + 2h",kcal:"~380 kcal",
          ing:[["Blancs d'œufs","3","6","12"],["Sucre","150 g","300 g","600 g"],["Crème liquide","20 cl","40 cl","80 cl"],["Purée de marrons","250 g","500 g","1 kg"],["Sucre glace","au goût","au goût","au goût"]],
          steps:[
            "Cuire la meringue (1h15) : montez 3 blancs en neige ferme, ajoutez progressivement 150 g de sucre sans cesser de fouetter jusqu'à obtenir une meringue brillante et ferme. Sur une plaque recouverte de papier cuisson, formez 3 disques de meringue d'environ 10 cm de diamètre, à la poche à douille ou à la cuillère. Enfournez à 100°C (chaleur traditionnelle) pour 1h15. La meringue doit être croustillante et sèche. Éteignez le four et laissez-la refroidir complètement dedans, porte entrouverte.",
            "Préparer la purée de marrons (5 min) : passez la purée de marrons au tamis pour la rendre plus fine et plus soyeuse (facultatif mais recommandé). Si elle est trop ferme, ajoutez 2 cuillères à soupe de crème liquide pour l'assouplir. Versez-la dans une poche à douille munie d'une douille fine (type vermicelles ou spaghetti).",
            "Monter la chantilly (5 min) : sortez la crème du réfrigérateur au dernier moment, versez-la dans un saladier glacé et fouettez à vitesse moyenne puis rapide jusqu'à obtenir une chantilly ferme qui forme un bec d'oiseau. Sucrez légèrement (1 c. à s. de sucre glace). Réservez au frais.",
            "Monter les Mont-Blanc (5 min) : sur chaque assiette ou dans une verrine, posez un disque de meringue croustillante au fond. Recouvrez d'une généreuse couche de chantilly. Ensuite, à l'aide de la poche à douille, laissez tomber les vermicelles de purée de marrons sur la chantilly, en tournant régulièrement — les vermicelles doivent recouvrir entièrement la chantilly et retomber sur les bords, comme une petite montagne enneigée.",
            "Réserver et servir (2 h) : placez au réfrigérateur 2 heures minimum avant de servir — le froid va figer la purée et permettre au Mont-Blanc de bien tenir. Sortez 10 minutes avant de servir. Au moment de servir, saupoudrez d'un voile de sucre glace tamisé, comme une neige légère. Se déguste à la petite cuillère, en traversant les couches."
          ],
          bienetre:"La purée de marrons est naturellement sucrée et riche en glucides complexes.",secret:"Utiliser une purée de marrons de qualité : c'est elle qui fait tout le dessert.",allergenes:"Œuf — Lait — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Thé Noir aux Agrumes",kcal:"~0 kcal/tasse",
          ing:[["Thé noir","1 c. à c.","2 c. à c.","4 c. à c."],["Orange","1/2","1","2"],["Citron","1/4","1/2","1"]],
          steps:["Infuser (4 min) : infusez le thé noir dans 30 cl d'eau frémissante pendant 4 minutes.","Ajouter les zestes (1 min) : ajoutez quelques lanières de zeste d'orange et de citron prélevées au couteau économe. Laissez infuser 1 minute supplémentaire.","Filtrer (30 sec) : passez au chinois pour retirer les feuilles et les zestes.","Servir (30 sec) : versez dans une tasse bien chaude. Les agrumes apportent une fraîcheur qui équilibre la richesse du Mont-Blanc."],
          alt:"Infusion d'orange et cannelle."},
        accord:"Un thé aux agrumes, en contraste avec le mont-blanc.",vin:"Muscat de Rivesaltes, très frais."},
      {id:"h31",numero:31,
        plat:{titre:"Tarte au Chocolat et à l'Orange",tagline:"Une tarte intense, où le chocolat noir rencontre l'orange.",temps:"50 min + 2h",kcal:"~420 kcal",
          ing:[["Pâte sablée","1 rouleau","1 rouleau","2 rouleaux"],["Chocolat noir 70%","200 g","400 g","800 g"],["Crème liquide","20 cl","40 cl","80 cl"],["Orange","2","4","8"],["Beurre","30 g","60 g","120 g"]],
          steps:[
            "Cuire la pâte à blanc (20 min) : foncez la pâte sablée dans un moule à tarte beurré, piquez le fond à la fourchette. Couvrez de papier cuisson et de billes de cuisson. Enfournez 20 minutes à 180°C jusqu'à ce que les bords soient bien dorés. Retirez les billes et le papier, laissez refroidir sur une grille.",
            "Infuser l'orange dans la crème (10 min) : prélevez les zestes de 2 oranges au couteau économe, en évitant la partie blanche qui est amère. Dans une casserole, portez la crème liquide à frémissement avec les zestes. Retirez du feu, couvrez et laissez infuser 10 minutes. Filtrez ensuite au chinois fin en pressant les zestes pour extraire tous les arômes. Cette infusion est la clé du parfum : elle est bien plus fine que des zestes ajoutés directement.",
            "Préparer la ganache (5 min) : hachez finement le chocolat noir et mettez-le dans un saladier. Réchauffez la crème infusée à l'orange jusqu'à frémissement. Versez-la en 3 fois sur le chocolat, en mélangeant à la maryse au centre en petits cercles concentriques à chaque ajout. Quand la ganache est lisse, ajoutez le beurre en morceaux et mélangez jusqu'à incorporation complète — le beurre donne de la brillance et une texture soyeuse.",
            "Garnir (2 min) : versez la ganache encore tiède (mais pas chaude, à environ 35°C) sur le fond de tarte refroidi. Étalez à la spatule coudée d'un geste régulier, en partant du centre vers les bords. Tapotez légèrement le moule sur le plan de travail pour faire remonter les éventuelles bulles d'air.",
            "Réserver et servir (2 h) : placez la tarte au réfrigérateur 2 heures minimum — la ganache doit être ferme mais encore fondante. Sortez-la 20 minutes avant de servir. Décorez au moment du service de suprêmes d'orange fraîche : pelez une orange à vif, prélevez les quartiers entre les membranes, disposez-les en rosace sur la tarte. Quelques zestes confits ou des copeaux de chocolat ajoutent une touche raffinée."
          ],
          bienetre:"Le chocolat noir et l'orange : un accord classique, riche en antioxydants.",secret:"Infuser les zestes dans la crème, puis filtrer : le parfum d'orange est plus fin que des zestes ajoutés directement.",allergenes:"Gluten — Œuf — Lait — Soja possible — Végétarien",
          veg:"Végétarien."},
        boisson:{titre:"Grand Marnier",kcal:"~90 kcal/verre",ing:[["Grand Marnier","4 cl","8 cl","16 cl"]],
          steps:["Servir (30 sec) : versez le Grand Marnier dans un verre tulipe à température ambiante (18-20°C). Le verre tulipe concentre les arômes.","Déguster (—) : humez d'abord l'orange confite et les notes boisées, puis buvez à petites gorgées. Un trait de Grand Marnier dans un carré de chocolat noir, c'est aussi un accord à tester."],
          alt:"Cointreau, ou un jus d'orange pressé."},
        accord:"Un Grand Marnier, en écho à l'orange.",vin:"Banyuls, en digestif."},
      {id:"h32",numero:32,
        plat:{titre:"Kouign-Amann au Beurre Demi-Sel et Pommes Rôties",tagline:"La pâtisserie bretonne feuilletée, caramélisée au sucre et au beurre demi-sel, servie avec des pommes rôties à la cannelle.",temps:"1h + 3h",kcal:"~330 kcal",
          ing:[["Farine T45", "50 g", "100 g", "200 g"], ["Eau tiède", "25 g", "50 g", "100 g"], ["Levure boulangère sèche", "1/4 c. à c.", "1/2 c. à c.", "1 c. à c."], ["Sel fin", "1 pincée", "1 pincée", "1/2 c. à c."], ["Beurre demi-sel froid (feuilletage)", "35 g", "65 g", "130 g"], ["Sucre (feuilletage)", "35 g", "65 g", "130 g"], ["Beurre (moules)", "PM", "PM", "PM"], ["Pommes", "1/2", "1", "2"], ["Beurre (pommes)", "5 g", "10 g", "20 g"], ["Sucre roux (pommes)", "5 g", "10 g", "20 g"], ["Cannelle en poudre", "1 pincée", "1 pincée", "1/2 c. à c."]],
          steps:[
            "Préparer la détrempe (10 min + 1 h de pousse) : mélangez l'eau tiède (30°C) et la levure, puis ajoutez la farine et le sel. Pétrissez 5 à 8 minutes à la main (ou 4 minutes au robot) jusqu'à obtenir une pâte lisse, souple et légèrement collante. Formez une boule, filmez et laissez pousser 1 heure à température ambiante, jusqu'à ce qu'elle ait bien gonflé.",
            "Préparer le beurre (5 min) : le beurre doit être froid mais souple. Placez-le entre deux feuilles de papier cuisson et frappez-le avec un rouleau pour former une plaque de 12 × 12 cm environ, de 1 cm d'épaisseur. Gardez-le au frais.",
            "Premier tour (15 min + 20 min au frais) : étalez la pâte en rectangle de 30 × 15 cm. Posez la plaque de beurre sur les deux tiers de la pâte, laissez le dernier tiers libre. Saupoudrez le beurre d'un tiers du sucre. Repliez le tiers libre sur le beurre, puis l'autre tiers par-dessus, comme une lettre. Filmez et placez 20 minutes au réfrigérateur.",
            "Deuxième et troisième tours (2 × 25 min) : saupoudrez le plan de travail de sucre, étalez la pâte en rectangle de 30 × 15 cm (le sucre colle un peu, c'est normal), repliez en trois comme une lettre. Remettez 20 minutes au frais. Recommencez une dernière fois avec le sucre restant. Si la pâte devient molle ou si le beurre s'échappe, remettez-la 15 minutes au frais avant de continuer.",
            "Façonner (15 min + 45 min de pousse) : beurrez et sucrez des moules à muffins ou des cercles de 7 cm. Étalez la pâte sur 1 cm d'épaisseur, découpez des carrés de 8 cm. Ramenez les quatre coins vers le centre et pincez bien, puis posez chaque pièce dans un moule. Laissez gonfler 45 minutes à température ambiante, sans excès de chaleur pour que le beurre ne coule pas.",
            "Rôtir les pommes (15 min) : coupez les pommes en dés de 1,5 cm. Faites fondre le beurre dans une poêle, ajoutez les pommes, le sucre roux et la cannelle. Faites caraméliser 8 à 10 minutes à feu moyen-vif en remuant, jusqu'à ce qu'elles soient dorées.",
            "Cuire (30 min) : préchauffez le four à 190°C. Enfournez 25 à 30 minutes, jusqu'à ce que les kouign-amann soient d'un ambre profond. Démoulez-les immédiatement sur une grille, après 2 minutes seulement : le caramel durcit en refroidissant et colle au moule. Servez tièdes, avec les pommes rôties déposées au centre."
          ],

const $ = s => document.querySelector(s);

const fmtDate = d => new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const norm = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/œ/g, "oe").toLowerCase();

const store = {

let db = store.read();
function save(){ store.write(db); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function go(id){ $$('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+id)); window.scrollTo(0,0); }
function allDuos(){ return Object.values(SEASONS).flatMap(s=>s.duos.map(d=>({d,s}))); }
function findDuo(id){ for(const s of Object.values(SEASONS)){ const d = s.duos.find(x=>x.id===id); if(d) return {duo:d,saison:s}; } return null; }

    go('season'); return;
  }
  $('#screen-season').innerHTML = '<button class="btn back" data-back="home">← Saisons</button><div class="season-header"><div class="sh-stripe" style="background:'+s.stripe+'"></div><div class="sh-name">'+esc(s.nom)+'</div><div class="sh-tag">'+esc(s.tagline)+'</div>'+(s.intro?'<div class="sh-intro">'+esc(s.intro)+'</div>':'')+'</div><div class="duo-list">' + s.duos.map(d=>'<button class="duo-item" data-duo="'+d.id+'"><span class="di-num">'+String(d.numero).padStart(2,'0')+'</span><span class="di-body"><span class="di-title">'+esc(d.plat.titre)+'</span><span class="di-boisson">'+esc(d.boisson.titre)+'</span></span><span class="di-arrow">→</span></button>').join('') + '</div>';

function openRecipe(d, saison, type){
  const r = type==='plat' ? d.plat : d.boisson;
  const isPlat = type==='plat';
  let html = '<button class="btn back" data-back="duo">← Dessert '+String(d.numero).padStart(2,'0')+'</button>' +
    '<div class="detail-hero"><div class="dth-tag">'+(isPlat?'Sweet · Le Dessert':'Sip · L\'Accord')+'</div><div class="dth-title">'+esc(r.titre)+'</div>' +
    (r.tagline?'<div class="dth-tagline">'+esc(r.tagline)+'</div>':'') +
    '<div class="dth-meta">'+(r.temps?'<span>⏱ '+esc(r.temps)+'</span>':'')+'<span>'+esc(r.kcal)+'</span></div></div>' +
    '<div class="block"><div class="block-title">Ingrédients</div><div class="ing-head"><span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600">Pour</span><div class="serv-toggle"><button class="serv-btn" data-serv="0">1</button><button class="serv-btn active" data-serv="1">2</button><button class="serv-btn" data-serv="2">4</button></div></div><ul class="ing" id="ing-list"></ul></div>' +
    '<div class="block"><div class="block-title">Préparation</div><ol class="steps">'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div>';
  if(isPlat){
    if(r.bienetre) html += '<div class="block"><div class="block-title">Bilan Bien-être</div><div class="callout">'+esc(r.bienetre)+'</div></div>';
    if(r.secret) html += '<div class="block"><div class="block-title">Secret du Chef</div><div class="callout">'+esc(r.secret)+'</div></div>';
    if(r.allergenes) html += '<div class="block"><div class="block-title">Allergènes</div><div class="alc-note">'+esc(r.allergenes)+'</div></div>';
  } else {
    if(r.alt) html += '<div class="block"><div class="block-title">Version sans alcool</div><div class="alc-note">'+esc(r.alt)+'</div></div>';
  }
  $('#screen-recipe').innerHTML = html;
  window.__recipeIngredients = r.ing;
  window.__recipeServ = 1;
  updateServ();
  go('recipe');
}

function updateServ(){
  const ing = window.__recipeIngredients; if(!ing) return;
  const i = window.__recipeServ || 1;
  $('#ing-list').innerHTML = ing.map(function(row){
    const q = i===0?row[1]:(i===1?row[2]:row[3]);
    return '<li><b>'+esc(row[0])+'</b><span class="ing-q">'+esc(q)+'</span></li>';
  }).join('');
  $$('.serv-btn').forEach(function(b){ b.classList.toggle('active', +b.dataset.serv===(window.__recipeServ||1)); });
}

function renderCart(){
  var col = db.cartServ === undefined ? 1 : db.cartServ;
  var total = db.cart.length;
  var screen = document.getElementById('screen-cart');
  if(!screen) return;

  if(!total){
    screen.innerHTML =
      '<button class="btn back" data-back="home">← Retour</button>' +
      '<h1 class="hero" style="margin-bottom:24px">Ma liste de <em>courses</em></h1>' +
      '<div class="empty"><p>Ta liste est vide.<br>Touche « 🛒 Aux courses » sur un dessert pour l\'ajouter.</p></div>';
    return;
  }

  function normKey(name){ return norm(name).replace(/s$/,'').replace(/\s+/g,' ').trim(); }
  var RAYONS = ['Fruits & légumes','Herbes fraîches','Crémerie & œufs','Épicerie','Boissons','Autres'];
  var RULES = [
    [4, /\b(vin|champagne|cremant|cidre|rhum|bourbon|whisky|gin|vodka|tequila|mezcal|sake|pastis|limoncello|grand marnier|cointreau|muscat|banyuls|maury|porto|biere|the|matcha|cafe|espresso|jus)\b/],
    [3, /\b(sel|poivre|sucre|farine|levure|chocolat|cacao|amandes?|noix|pecan|noisettes?|pistaches?|pignons?|miel|vanille|cannelle|muscade|gingembre|cardamome|badiane|anis|girofle|curcuma|safran|epices?|gelatine|fecule|speculoos|boudoirs?|praline|marron|puree)\b/],
    [2, /\b(lait|creme|beurre|fromage|mascarpone|ricotta|yaourt|oeufs?|blancs?|jaunes?)\b/],
    [1, /basilic|menthe|coriandre|persil|verveine|lavande|thym|romarin|sauge|estragon|fleur d'oranger|eau de rose/],
    [0, /fraise|framboise|myrtille|cerise|peche|abricot|melon|mangue|rhubarbe|pomme|poire|figue|orange|citron|banane|ananas|fruit/]
  ];
  function categorize(name){
    var t = norm(name);
    for(var i=0;i<RULES.length;i++) if(RULES[i][1].test(t)) return RULES[i][0];
    return 5;
  }

  var map = {};
  db.cart.forEach(function(id){
    var f = findDuo(id); if(!f) return;
    [f.duo.plat, f.duo.boisson].forEach(function(r){
      if(!r || !r.ing) return;
      r.ing.forEach(function(it){
        var name = it[0];
        var q = String(it[1 + col] || '').trim();
        var key = normKey(name);
        var e = map[key] = map[key] || {key:key,name:name,qs:[],cat:categorize(name)};
        if(q && q !== 'au goût' && q !== 'PM' && q !== 'allongée' && q !== 'à compléter' && q !== 'généreux' && q !== 'double') e.qs.push(q);
      });
    });
  });

  var groups = RAYONS.map(function(n, i){
    return [n, Object.values(map).filter(function(e){ return e.cat === i; }).sort(function(a,b){ return a.name.localeCompare(b.name,'fr'); })];
  }).filter(function(g){ return g[1].length > 0; });

  var label = col === 0 ? '1 personne' : (col === 1 ? '2 personnes' : '4 personnes');
  var html = '<button class="btn back" data-back="home">← Retour</button>' +
    '<h1 class="hero" style="margin-bottom:24px">Ma liste de <em>courses</em></h1>' +
    '<div class="ing-head"><span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600">Pour</span>' +
    '<div class="serv-toggle">' +
      '<button class="serv-btn' + (col===0?' active':'') + '" data-cserv="0">1</button>' +
      '<button class="serv-btn' + (col===1?' active':'') + '" data-cserv="1">2</button>' +
      '<button class="serv-btn' + (col===2?' active':'') + '" data-cserv="2">4</button>' +
    '</div></div>';

  html += '<p style="text-align:center;font-family:var(--serif);font-style:italic;color:var(--ink-soft);margin-bottom:22px">' +
    total + ' dessert' + (total>1?'s':'') + ' sélectionné' + (total>1?'s':'') + ' · ' + label + '</p>';

  html += '<div class="block"><div class="block-title">Desserts choisis</div>';
  db.cart.forEach(function(id){
    var f = findDuo(id); if(!f) return;
    var d = f.duo, s = f.saison;
    html += '<div class="log-item"><span class="lg-info"><span class="lg-title">'+esc(d.plat.titre)+'</span><span class="lg-date">Dessert '+String(d.numero).padStart(2,'0')+' · '+esc(s.nom)+'</span></span><button class="lg-del" data-rm="'+id+'" title="Retirer">✕</button></div>';
  });
  html += '</div>';

  groups.forEach(function(g){
    html += '<div class="block"><div class="block-title">'+esc(g[0])+'</div><ul class="ing">';
    g[1].forEach(function(e){
      var done = db.checked && db.checked[e.key];
      var qDisp = e.qs.length ? e.qs.join(' + ') : 'au goût';
      html += '<li data-check="'+esc(e.key)+'"'+(done?' class="done"':'')+'><b>'+esc(e.name)+'</b><span class="ing-q">'+esc(qDisp)+'</span></li>';
    });
    html += '</ul></div>';
  });

  html += '<div class="btn-row"><button class="btn" id="cart-clear">Tout vider</button></div>';
  screen.innerHTML = html;
}

document.addEventListener('click', function(e){
  function el(sel){ return e.target.closest(sel); }
  if(el('#menu-btn')){ openDrawer(); return; }
  if(e.target.id === 'drawer-overlay'){ closeDrawer(); return; }
  var mi = el('[data-menu]');
  if(mi){
    var a = mi.dataset.menu; closeDrawer();
    if(a==='home'){ renderHome(); go('home'); }
    else if(a==='favorites'){ renderFavorites(); go('favorites'); }
    else if(a==='log'){ renderLog(); go('log'); }
    else if(a==='cart'){ renderCart(); go('cart'); }
    else if(a==='about'){ renderAbout(); go('about'); }
    return;
  }
  var sc = el('[data-season]');
  if(sc){ openSeason(sc.dataset.season); return; }
  var dc = el('[data-duo]');
  if(dc){ var f = findDuo(dc.dataset.duo); if(f) renderDuo(f.duo, f.saison); return; }
  var rc = el('[data-recipe]');
  if(rc && currentDuo){ openRecipe(currentDuo, currentSaison, rc.dataset.recipe); return; }
  var sv = el('[data-serv]');
  if(sv){ window.__recipeServ = +sv.dataset.serv; updateServ(); return; }
  var bk = el('[data-back]');
  if(bk){
    var t = bk.dataset.back;
    if(t==='duo' && currentDuo) renderDuo(currentDuo, currentSaison);
    else if(t==='season' && currentSaison) openSeason(currentSaison.id);
    else { renderHome(); go('home'); }
    return;
  }
  var del = el('[data-del]');
  if(del){ e.stopPropagation(); db.log = db.log.filter(function(l){ return l.id!==del.dataset.del; }); save(); renderLog(); toast('Retiré du carnet'); return; }
  if(el('#btn-fav') && currentDuo){
    var id = currentDuo.id, i = db.favs.indexOf(id);
    if(i>=0){ db.favs.splice(i,1); toast('Retiré des favoris'); } else { db.favs.push(id); toast('Ajouté aux favoris'); }
    save(); document.getElementById('btn-fav').textContent = db.favs.includes(id)?'♥ Retirer':'♡ Favori';
    return;
  }
  if(el('#btn-cooked') && currentDuo){
    var idc = currentDuo.id;
    if(db.log.some(function(l){ return l.duoId===idc; })){ toast('Déjà dans le carnet'); return; }
    db.log.push({id:'l'+Date.now(), duoId:idc, date:new Date().toISOString()});
    save(); document.getElementById('btn-cooked').textContent='✓ Réalisé';
    toast('Noté dans le carnet ✓');
    return;
  }
  if(el('#btn-cart') && currentDuo){
    var idk = currentDuo.id, k = db.cart.indexOf(idk);
    if(k>=0){ db.cart.splice(k,1); toast('Retiré de la liste'); } else { db.cart.push(idk); toast('Ajouté aux courses'); }
    save(); document.getElementById('btn-cart').textContent = db.cart.includes(idk) ? '🛒 Dans la liste' : '🛒 Aux courses';
    return;
  }
  // Courses
  var ck = el('[data-check]');
  if(ck && ck.closest('#screen-cart')){
    e.preventDefault(); e.stopPropagation();
    var k2 = ck.dataset.check;
    if(!db.checked) db.checked = {};
    if(db.checked[k2]) delete db.checked[k2]; else db.checked[k2] = 1;
    save(); ck.classList.toggle('done'); return;
  }
  var cs = el('[data-cserv]');
  if(cs && cs.closest('#screen-cart')){
    e.preventDefault(); e.stopPropagation();
    db.cartServ = +cs.dataset.cserv; save(); renderCart(); return;
  }
  var rm = el('[data-rm]');
  if(rm && rm.closest('#screen-cart')){
    e.preventDefault(); e.stopPropagation();
    db.cart = db.cart.filter(function(x){ return x !== rm.dataset.rm; });
    save(); renderCart(); toast('Retiré de la liste'); return;
  }
  if(el('#cart-clear')){
    e.preventDefault(); e.stopPropagation();
    db.cart = []; if(db.checked) db.checked = {};
    save(); renderCart(); toast('Liste vidée'); return;
  }
});

/* ═══════════════════════════════════════════════════════════════
   RECHERCHE
   ═══════════════════════════════════════════════════════════════ */
(function(){
  var _idx = null;
  function buildIdx(){
    if(_idx) return _idx;
    _idx = allDuos().map(function(x){
      var d = x.d;
      var text = [d.plat.titre, d.boisson.titre, d.vin, d.accord]
        .concat(d.plat.ing.map(function(i){ return i[0]; }))
        .concat(d.boisson.ing.map(function(i){ return i[0]; }))
        .join(' | ');
      var allerg = norm((d.plat.allergenes||'') + ' ' + (d.plat.veg||'') + ' ' + (d.boisson.alt||''));
      var boissonAll = norm(d.boisson.titre + ' ' + d.boisson.ing.map(function(i){return i[0];}).join(' '));
      return {
        d: d, s: x.s, t: norm(text),
        veg: /vegetarien|vegan/.test(allerg),
        noalc: !/\b(vin|champagne|cremant|cidre|rhum|bourbon|whisky|gin|vodka|tequila|mezcal|sake|pastis|limoncello|grand marnier|cointreau|muscat|banyuls|maury|porto|biere)\b/.test(boissonAll),
        nogluten: !/gluten/.test(allerg),
        nofish: true,
        nolactose: !/lait|creme|beurre|fromage|mascarpone|yaourt/.test(allerg)
      };
    });
    return _idx;
  }
  window.doSearch = function(q){
    var list = buildIdx();
    var terms = norm(q).split(/\s+/).filter(Boolean).map(function(t){
      return t.length > 3 ? t.replace(/s$/, '') : t;
    });
    var activeF = Object.keys(db.filters || {}).filter(function(k){ return db.filters[k]; });
    var on = terms.length > 0 || activeF.length > 0;

    var seasonsEl = document.querySelector('#screen-home .seasons');
    var footEl = document.getElementById('home-foot');
    if(seasonsEl) seasonsEl.style.display = on ? 'none' : '';
    if(footEl) footEl.style.display = on ? 'none' : '';

    var resultsEl = document.getElementById('results');
    if(!resultsEl) return;
    if(!on){ resultsEl.innerHTML = ''; return; }

    var hits = list.filter(function(x){
      var okT = terms.every(function(t){ return x.t.indexOf(t) !== -1; });
      var okF = activeF.every(function(f){ return x[f]; });
      return okT && okF;
    });

    if(!hits.length){
      resultsEl.innerHTML = '<div class="empty"><p>Aucun dessert ne correspond.</p></div>';
      return;
    }
    var html = '<div class="duo-list">';
    hits.forEach(function(h){
      var n = String(h.d.numero).padStart(2,'0');
      html += '<button class="duo-item" data-duo="'+h.d.id+'">';
      html += '<span class="di-num">'+n+'</span>';
      html += '<span class="di-body"><span class="di-title">'+esc(h.d.plat.titre)+'</span>';
      html += '<span class="di-boisson">'+esc(h.d.boisson.titre)+' · '+esc(h.s.nom)+'</span></span>';
      html += '<span class="di-arrow">→</span></button>';
    });
    resultsEl.innerHTML = html + '</div>';
  };

  function injectFilters(){
    var home = document.getElementById('screen-home');
    if(!home) return;
    if(home.querySelector('#filters')) return;
    var search = home.querySelector('.search');
    if(!search) return;
    var div = document.createElement('div');
    div.className = 'filters'; div.id = 'filters';
    var F = db.filters || {};
    div.innerHTML =
      '<button class="filter'+(F.veg?' active':'')+'" data-filter="veg">Végétarien</button>' +
      '<button class="filter'+(F.noalc?' active':'')+'" data-filter="noalc">Sans alcool</button>' +
      '<button class="filter'+(F.nogluten?' active':'')+'" data-filter="nogluten">Sans gluten</button>' +
      '<button class="filter'+(F.nolactose?' active':'')+'" data-filter="nolactose">Sans lactose</button>';
    search.parentNode.insertBefore(div, search.nextSibling);
  }
  document.addEventListener('click', function(e){
    var f = e.target.closest('[data-filter]');
    if(!f) return;
    e.preventDefault(); e.stopPropagation();
    var k = f.dataset.filter;
    if(!db.filters) db.filters = {};
    db.filters[k] = !db.filters[k];
    f.classList.toggle('active');
    save();
    var input = document.getElementById('q');
    window.doSearch(input ? input.value : '');
  });
  document.addEventListener('input', function(e){
    if(e.target && e.target.id === 'q'){ window.doSearch(e.target.value); }
  });
  setInterval(injectFilters, 800);
  injectFilters();
})();

/* ═══════════════════════════════════════════════════════════════
   MULTI-TIMER
   ═══════════════════════════════════════════════════════════════ */
(function(){
  var bar = document.createElement('div');
  bar.id = 'multi-timer';
  document.body.appendChild(bar);

  var timers = {}; var interval = null;

  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function render(){
    var ids = Object.keys(timers);
    if(!ids.length){ bar.classList.remove('visible'); bar.innerHTML=''; if(interval){ clearInterval(interval); interval=null; } return; }
    bar.classList.add('visible');
    var html = '';
    for(var i=0;i<ids.length;i++){
      var id = ids[i], t = timers[id];
      var left = Math.max(0, Math.ceil((t.end - Date.now())/1000));
      var mm = Math.floor(left/60), ss = left%60;
      var disp = mm + ':' + (ss<10?'0':'') + ss;
      var cls = t.notified ? ' done' : '';
      var ico = t.notified ? '⏰' : '⏳';
      html += '<button type="button" class="mt-item'+cls+'" data-timer-id="'+id+'" title="Cliquer pour annuler">';
      html += '<b>'+ico+'</b><span>'+escapeHtml(t.label)+'</span><span>'+disp+'</span>';
      html += '</button>';
    }
    bar.innerHTML = html;
    if(!interval) interval = setInterval(tick, 500);
  }
  function beep(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      var a = new AC();
      for(var i=0;i<3;i++){
        var o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.25, a.currentTime + i*0.4);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + i*0.4 + 0.3);
        o.start(a.currentTime + i*0.4); o.stop(a.currentTime + i*0.4 + 0.3);
      }
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }
  function addTimer(seconds, label){
    if(!seconds || seconds <= 0) return;
    var id = 'mt' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
    timers[id] = { end: Date.now() + seconds*1000, seconds: seconds, label: label||'Minuteur', notified: false };
    if('Notification' in window && Notification.permission === 'default'){ try{ Notification.requestPermission(); }catch(e){} }
    render();
  }
  function tick(){
    var now = Date.now(); var trigger = false;
    Object.keys(timers).forEach(function(id){
      var t = timers[id];
      if(!t.notified && now >= t.end){
        t.notified = true; trigger = true;
        if('Notification' in window && Notification.permission === 'granted'){
          try{ new Notification('⏰ Minuteur terminé', { body: t.label }); }catch(e){}
        }
      }
      if(t.notified && now - t.end > 30000) delete timers[id];
    });
    if(trigger) beep();
    render();
  }
  function buildLabel(btn){
    var label = 'Minuteur';
    var duoEl = document.querySelector('#screen-duo .dh-num');
    if(duoEl) label = duoEl.textContent.replace(/\s+/g,' ').trim();
    var li = btn.closest('li'), ol = btn.closest('ol.steps');
    if(li && ol){
      var idx = Array.prototype.indexOf.call(ol.children, li) + 1;
      label = label + ' · étape ' + idx;
    }
    return label;
  }
  function getSeconds(btn){
    if(btn.dataset.timer){ var s = parseInt(btn.dataset.timer, 10); if(!isNaN(s)&&s>0) return s; }
    var oc = btn.getAttribute('onclick') || '';
    var m1 = oc.match(/startT\(([\d.]+)\)/);
    if(m1){ var min = parseFloat(m1[1]); if(!isNaN(min)&&min>0) return Math.round(min*60); }
    var txt = btn.textContent || '';
    var m2 = txt.match(/(\d+)\s*min/i); if(m2) return parseInt(m2[1],10)*60;
    var m3 = txt.match(/(\d+)\s*sec/i); if(m3) return parseInt(m3[1],10);
    return 0;
  }
  function isTimerButton(el){
    if(!el || el.tagName !== 'BUTTON') return false;
    if(el.dataset.timer) return true;
    if(el.classList && el.classList.contains('timer-inline')) return true;
    var txt = el.textContent || '';
    if(/[⏱⏰]/.test(txt)) return true;
    return false;
  }
  document.addEventListener('click', function(e){
    var el = e.target;
    while(el && el !== document.body){
      if(isTimerButton(el)){
        e.preventDefault(); e.stopPropagation();
        var secs = getSeconds(el);
        if(secs > 0) addTimer(secs, buildLabel(el));
        return;
      }
      el = el.parentNode;
    }
  }, true);
  document.addEventListener('click', function(e){
    var item = e.target.closest('[data-timer-id]');
    if(!item) return;
    e.preventDefault(); e.stopPropagation();
    var id = item.dataset.timerId;
    if(timers[id]){ delete timers[id]; render(); }
  });
  // Injecter les boutons minuteur dans les étapes
  function injectTimers(){
    var lis = document.querySelectorAll('#screen-recipe ol.steps li');
    Array.prototype.forEach.call(lis, function(li){
      if(li.dataset.timerDone) return;
      li.dataset.timerDone = '1';
      var html = li.innerHTML;
      li.innerHTML = html.replace(/\((\d+)\s*min(?:utes?)?\)/gi, function(m, num){
        return '(' + num + ' min) <button type="button" class="timer-inline" data-timer="'+(parseInt(num,10)*60)+'">⏱ '+num+' min</button>';
      }).replace(/\((\d+)\s*sec(?:ondes?)?\)/gi, function(m, num){
        return '(' + num + ' sec) <button type="button" class="timer-inline" data-timer="'+num+'">⏱ '+num+' sec</button>';
      });
    });
  }
  var _openRecipe = window.openRecipe;
  if(typeof _openRecipe === 'function'){
    window.openRecipe = function(d, s, t){
      _openRecipe(d, s, t);
      setTimeout(injectTimers, 40);
    };
  }
})();

(function(){
  var SIZES = [0.88, 1, 1.12, 1.24, 1.38];
  var idx = 1;
  try{ var s = parseInt(localStorage.getItem('sw_fs') || '1', 10); if(!isNaN(s) && s >= 0 && s < SIZES.length) idx = s; }catch(e){}
  function apply(){
    var scale = SIZES[idx];
    document.documentElement.style.zoom = scale;
    try{ localStorage.setItem('sw_fs', String(idx)); }catch(e){}
    var lbl = document.getElementById('fs-label');
    if(lbl) lbl.textContent = ['A−','A','A+','A++','A+++'][idx];
  }
  function inject(){
    if(document.getElementById('fs-controls')) return;
    var head = document.querySelector('header');
    if(!head) return;
    var wrap = document.createElement('div');
    wrap.id = 'fs-controls';
    wrap.style.cssText = 'position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:4px;align-items:center;z-index:22';
    var bm = document.createElement('button'); bm.type = 'button'; bm.textContent = 'A−';
    bm.style.cssText = 'font:600 11px var(--sans);padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--brown);cursor:pointer';
    var lbl = document.createElement('span'); lbl.id = 'fs-label';
    lbl.style.cssText = 'font:600 10px var(--sans);letter-spacing:.14em;color:var(--ink-soft);min-width:34px;text-align:center';
    var bp = document.createElement('button'); bp.type = 'button'; bp.textContent = 'A+';
    bp.style.cssText = bm.style.cssText;
    bm.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); idx = Math.max(0, idx-1); apply(); });
    bp.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); idx = Math.min(SIZES.length-1, idx+1); apply(); });
    wrap.appendChild(bm); wrap.appendChild(lbl); wrap.appendChild(bp);
    head.appendChild(wrap);
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', function(){ inject(); apply(); }); }
  else { inject(); apply(); }
})();

(function(){
  function shareText(title, text, url){
    if(navigator.share){
      return navigator.share({ title:title, text:text, url:url }).catch(function(){});
    }
    if(navigator.clipboard){
      return navigator.clipboard.writeText(text + (url ? '\n' + url : '')).then(function(){
        if(typeof toast === 'function') toast('Copié ✓');
      }).catch(function(){ if(typeof toast === 'function') toast('Partage indisponible'); });
    }
    if(typeof toast === 'function') toast('Partage indisponible');
  }
  function injectDuoShare(){
    var scr = document.getElementById('screen-duo');
    if(!scr || !scr.classList.contains('active')) return;
    if(!scr.querySelector('.duo-hero')) return;
    if(scr.querySelector('.btn-share-duo')) return;

      var t = (num ? num.textContent + ' — ' : '') + plat + ' · ' + boisson;
      shareText('Sweet & Sip', t, location.origin + location.pathname);
    });
    row.appendChild(b);
  }
  function injectRecipeShare(){
    var scr = document.getElementById('screen-recipe');
    if(!scr || !scr.classList.contains('active')) return;
    if(!scr.querySelector('.detail-hero')) return;
    if(scr.querySelector('.btn-share-recipe')) return;
    var row = scr.querySelector('.btn-print') ? scr.querySelector('.btn-print').parentNode : null;
    if(!row) return;
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn btn-share-recipe'; b.textContent = '↗ Partager';
    b.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      var titre = scr.querySelector('.dth-title');
      var steps = scr.querySelectorAll('ol.steps li');
      var txt = (titre ? titre.textContent : '') + '\n\n';
      Array.prototype.forEach.call(steps, function(li, i){
        txt += (i+1) + '. ' + li.textContent.replace(/\s+/g,' ').trim() + '\n';
      });
      shareText(titre ? titre.textContent : 'Sweet & Sip', txt);
    });
    row.appendChild(b);
  }
  function init(){
    ['screen-duo','screen-recipe'].forEach(function(id){
      var scr = document.getElementById(id);
      if(!scr) return;
      var obs = new MutationObserver(function(){ injectDuoShare(); injectRecipeShare(); });
      obs.observe(scr, { attributes:true, attributeFilter:['class'], childList:true, subtree:true });
    });
    injectDuoShare(); injectRecipeShare();
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();
