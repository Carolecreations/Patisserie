(function(){
  function renderGastro(d, type){
    var data = (window.GASTRO && window.GASTRO[d.id]) || {};
    var g = data[type];
    if(!g) return null;
    var html = '';
    if(g.concept) html += '<div class="gastro-intro">'+esc(g.concept)+'</div>';
    if(g.touches && g.touches.length){
      html += '<div class="block"><div class="block-title">Touches du chef</div><ul class="gastro-touches">';
      g.touches.forEach(function(t){ html += '<li>'+esc(t)+'</li>'; });
      html += '</ul></div>';
    }
    if(g.steps && g.steps.length){
      html += '<div class="block"><div class="block-title">Préparation raffinée</div><ol class="steps">';
      g.steps.forEach(function(s){ html += '<li>'+esc(s)+'</li>'; });
      html += '</ol></div>';
    }
    if(g.dressage) html += '<div class="block"><div class="block-title">Dressage</div><div class="gastro-dressage">'+esc(g.dressage)+'</div></div>';
    if(g.accord) html += '<div class="block"><div class="block-title">Accord sommelier</div><div class="gastro-accord"><span class="gacc-label">Vin conseillé</span>'+esc(g.accord)+'</div></div>';
    if(g.diet) html += '<p class="gastro-note">'+esc(g.diet)+'</p>';
    return html || null;
  }

  var _openRecipe = window.openRecipe;
  if(typeof _openRecipe !== 'function') return;

  window.openRecipe = function(d, saison, type){
    _openRecipe(d, saison, type);
    setTimeout(function(){
      var scr = document.getElementById('screen-recipe');
      if(!scr) return;
      var gastroHTML = renderGastro(d, type);
      if(!gastroHTML) return;
      var children = Array.prototype.slice.call(scr.children);
      var standard = document.createElement('div');
      standard.className = 'recipe-content standard active';
      children.forEach(function(c){ standard.appendChild(c); });
      scr.appendChild(standard);
      var gastro = document.createElement('div');
      gastro.className = 'recipe-content gastro';
      gastro.innerHTML = gastroHTML;
      scr.appendChild(gastro);
      var tabs = document.createElement('div');
      tabs.className = 'recipe-tabs';
      tabs.innerHTML = '<button type="button" class="tab-btn active" data-tab="standard">Recette</button><button type="button" class="tab-btn" data-tab="gastro">Gastronomique</button>';
      scr.insertBefore(tabs, scr.firstChild);
      tabs.addEventListener('click', function(e){
        var b = e.target.closest('[data-tab]'); if(!b) return;
        e.preventDefault(); e.stopPropagation();
        var tab = b.dataset.tab;
        tabs.querySelectorAll('.tab-btn').forEach(function(x){ x.classList.toggle('active', x === b); });
        scr.querySelectorAll('.recipe-content').forEach(function(c){ c.classList.toggle('active', c.classList.contains(tab)); });
        window.scrollTo(0,0);
      });
    }, 40);
  };
})();

window.renderTechniques = function(){
  var scr = document.getElementById('screen-techniques');
  if(!scr) return;

  // Calculer les totaux
  var totalItems = TECHNIQUES.reduce(function(acc, c){ return acc + c.items.length; }, 0);

  var html = '<button class="btn back" data-back="home">← Retour</button>' +
    '<div class="tech-hero">' +
      '<div class="th-eyebrow">Le carnet technique</div>' +
      '<h1 class="th-title">Les <em>gestes</em> du pâtissier</h1>' +
      '<div class="th-sub">' + totalItems + ' techniques classées en ' + TECHNIQUES.length + ' familles</div>' +
    '</div>' +
    '<div class="tech-search"><input id="tech-q" type="search" placeholder="Rechercher une technique…" autocomplete="off"></div>' +
    '<div id="tech-results"></div>' +
    '<div id="tech-cats">';

  TECHNIQUES.forEach(function(cat){
    html += '<div class="tech-cat" data-cat="' + cat.id + '">';
    html += '<button class="tech-cat-head" data-tech-cat="' + cat.id + '">';
    html += '<span class="tech-cat-ico">' + cat.icone + '</span>';
    html += '<span class="tech-cat-txt">';
    html += '<span class="tech-cat-nom">' + esc(cat.nom) + '</span>';
    html += '<span class="tech-cat-intro">' + esc(cat.intro) + '</span>';
    html += '</span>';
    html += '<span class="tech-cat-count">' + cat.items.length + '</span>';
    html += '<span class="tech-cat-arrow">›</span>';
    html += '</button>';
    html += '<div class="tech-cat-body">';
    cat.items.forEach(function(item){
      html += '<button class="tech-item" data-tech="' + item.id + '">';
      html += '<span class="ti-bullet">✦</span>';
      html += '<span class="ti-body">';
      html += '<span class="ti-titre">' + esc(item.titre) + '</span>';
      html += '<span class="ti-meta">' + esc(item.temps) + ' · ' + esc(item.diff) + '</span>';
      html += '</span>';
      html += '<span class="ti-arrow">→</span>';
      html += '</button>';
    });
    html += '</div></div>';
  });
  html += '</div>';

  scr.innerHTML = html;
};

/* ═══════════════════════════════════════════════════════
   4. RENDU — fiche technique détaillée
   ═══════════════════════════════════════════════════════ */
function findTech(id){
  for(var i=0;i<TECHNIQUES.length;i++){
    var cat = TECHNIQUES[i];
    for(var j=0;j<cat.items.length;j++){
      if(cat.items[j].id === id) return { item: cat.items[j], cat: cat };
    }
  }
  return null;
}

window.openTechnique = function(id){
  var f = findTech(id);
  if(!f) return;
  var item = f.item, cat = f.cat;
  var diffClass = item.diff === 'Facile' ? 'tf-diff-facile' : (item.diff === 'Moyen' ? 'tf-diff-moyen' : 'tf-diff-difficile');

  var html = '<button class="btn back" data-back="techniques">← Techniques</button>';
  html += '<div class="tech-fiche-hero">';
  html += '<div class="tf-cat">' + esc(cat.nom) + '</div>';
  html += '<div class="tf-titre">' + esc(item.titre) + '</div>';
  html += '<div class="tf-desc">' + esc(item.desc) + '</div>';
  html += '<div class="tf-meta"><span>⏱ ' + esc(item.temps) + '</span><span class="' + diffClass + '">' + esc(item.diff) + '</span></div>';
  html += '</div>';

  if(item.ing && item.ing.length){
    html += '<div class="block"><div class="block-title">Ingrédients / Matériel</div><ul class="ing">';
    item.ing.forEach(function(i){
      var parts = i.split(' — ');
      if(parts.length === 2){
        html += '<li><b>' + esc(parts[0]) + '</b><span class="ing-q">' + esc(parts[1]) + '</span></li>';
      } else {
        html += '<li><b>' + esc(i) + '</b><span class="ing-q"></span></li>';
      }
    });
    html += '</ul></div>';
  }

  if(item.steps && item.steps.length){
    html += '<div class="block"><div class="block-title">Étapes</div><ol class="steps">';
    item.steps.forEach(function(s){ html += '<li>' + esc(s) + '</li>'; });
    html += '</ol></div>';
  }

  if(item.astuce){
    html += '<div class="tech-note-astuce"><span class="tna-label">Secret du chef</span>' + esc(item.astuce) + '</div>';
  }

  var scr = document.getElementById('screen-techniques');
  if(scr) scr.innerHTML = html;
  window.scrollTo(0, 0);
};

/* ═══════════════════════════════════════════════════════
   5. RECHERCHE interne techniques
   ═══════════════════════════════════════════════════════ */
window.searchTechniques = function(q){
  var results = document.getElementById('tech-results');
  var cats = document.getElementById('tech-cats');
  if(!results || !cats) return;

  var nq = norm(q).trim();
  if(!nq){
    results.innerHTML = '';
    cats.style.display = '';
    return;
  }
  var terms = nq.split(/\s+/).filter(Boolean);
  var hits = [];
  TECHNIQUES.forEach(function(cat){
    cat.items.forEach(function(item){
      var txt = norm(item.titre + ' ' + item.desc + ' ' + (item.ing||[]).join(' ') + ' ' + (item.astuce||''));
      var ok = terms.every(function(t){ return txt.indexOf(t) !== -1; });
      if(ok) hits.push({ item: item, cat: cat });
    });
  });

  cats.style.display = 'none';

  if(!hits.length){
    results.innerHTML = '<div class="empty"><p>Aucune technique ne correspond.</p></div>';
    return;
  }
  var html = '<div class="duo-list">';
  hits.forEach(function(h){
    html += '<button class="tech-item" data-tech="' + h.item.id + '" style="border-bottom:1px solid var(--line)">';
    html += '<span class="ti-bullet">✦</span>';
    html += '<span class="ti-body">';
    html += '<span class="ti-titre">' + esc(h.item.titre) + '</span>';
    html += '<span class="ti-meta">' + esc(h.cat.nom) + ' · ' + esc(h.item.temps) + ' · ' + esc(h.item.diff) + '</span>';
    html += '</span>';
    html += '<span class="ti-arrow">→</span>';
    html += '</button>';
  });
  html += '</div>';
  results.innerHTML = html;
};

/* ═══════════════════════════════════════════════════════
   6. ÉCOUTEURS — menu, accordéon, fiches, recherche
   ═══════════════════════════════════════════════════════ */

// 6a. Clic sur le menu drawer « Techniques » (capture pour priorité)
document.addEventListener('click', function(e){
  var mi = e.target.closest('[data-menu="techniques"]');
  if(mi){
    e.preventDefault(); e.stopPropagation();
    if(typeof closeDrawer === 'function') closeDrawer();
    window.renderTechniques();
    if(typeof go === 'function') go('techniques');
    return;
  }
}, true);

// 6b. Accordéon des catégories
document.addEventListener('click', function(e){
  var head = e.target.closest('[data-tech-cat]');
  if(head){
    e.preventDefault(); e.stopPropagation();
    var cat = head.closest('.tech-cat');
    if(cat) cat.classList.toggle('open');
    return;
  }
}, true);

// 6c. Ouverture d'une fiche technique
document.addEventListener('click', function(e){
  var item = e.target.closest('[data-tech]');
  if(item){
    e.preventDefault(); e.stopPropagation();
    window.openTechnique(item.dataset.tech);
    return;
  }
}, true);

// 6d. Bouton retour depuis la fiche vers la liste des techniques
document.addEventListener('click', function(e){
  var bk = e.target.closest('[data-back="techniques"]');
  if(bk){
    e.preventDefault(); e.stopPropagation();
    window.renderTechniques();
    if(typeof go === 'function') go('techniques');
    return;
  }
}, true);

// 6e. Recherche dans les techniques
document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'tech-q'){
    window.searchTechniques(e.target.value);
  }
});

/* ═══════════════════════════════════════════════════════
   7. PATCH go() — s'assurer que renderTechniques est appelé
   ═══════════════════════════════════════════════════════ */
var _go = window.go;
if(typeof _go === 'function'){
  window.go = function(id){
    if(id === 'techniques'){
      var scr = document.getElementById('screen-techniques');
      if(scr && !scr.innerHTML.trim()){
        window.renderTechniques();
      }
    }
    return _go.apply(this, arguments);
  };
}

console.log('✅ Patch Techniques armé — ' + TECHNIQUES.length + ' catégories, ' + TECHNIQUES.reduce(function(a,c){return a+c.items.length;},0) + ' techniques');
})();
</script>

    transformation:"Le vacherin se transforme en pavlova : une seule meringue, un cœur moelleux, garnie de chantilly et de fruits du Pacifique. Plus rustique, plus généreux.",
    etapes:[
      "Monter 3 blancs en neige. Ajouter 180 g de sucre en 3 fois. Ajouter 1 c. à c. de vinaigre blanc pour un cœur moelleux.",
      "Former un grand disque de meringue sur papier cuisson, en creusant légèrement le centre.",
      "Cuire 1h15 à 120°C, puis laisser refroidir dans le four éteint.",
      "Garnir de chantilly ferme. Disposer les kiwis en rondelles et les fruits de la passion coupés en deux.",
      "Servir aussitôt pour préserver le croustillant de la meringue."
    ],
    astuce:"Le vinaigre blanc (ou le jus de citron) est indispensable à la pavlova : il transforme la meringue en cœur moelleux, comme une guimauve, tout en gardant la croûte croustillante."
  },
  boisson:{
    nom:"Lemon & Paeroa (L&P) maison",
    ajouts:["Citron","Eau pétillante","Sirop de gingembre"],
    transformation:"Le Champagne devient une L&P maison, soda néo-zélandais culte au citron et gingembre.",
    etapes:[
      "Presser 1 citron.",
      "Mélanger 2 cl de sirop de gingembre, le jus de citron et 15 cl d'eau pétillante.",
      "Servir sur glaçons avec une rondelle de citron."
    ]
  }
},

e10:{
  pays:"Liban", drapeau:"🇱🇧",
  intro:"Au Liban, les fruits d'été se parfument à la fleur d'oranger et se servent avec une crème de lait légère, le mouhalabieh, et des pistaches concassées.",
  plat:{
    nom:"Pêches pochées, mouhalabieh & pistaches",
    ajouts:["2 c. à s. d'eau de fleur d'oranger", "3 gousses de cardamome", "40 cl de lait entier + 40 g de fécule de maïs", "50 g de pistaches non salées"],
    transformation:"Le sirop de verveine devient un sirop à la fleur d'oranger et à la cardamome. La chantilly est remplacée par une crème de lait cuite, le mouhalabieh, et les framboises par des pistaches.",
    etapes:[
      "Pocher les pêches comme dans la recette de base, mais remplacer la verveine et la vanille par 3 gousses de cardamome écrasées et 1 c. à s. d'eau de fleur d'oranger dans le sirop.",
      "Préparer le mouhalabieh : délayer 40 g de fécule de maïs dans 5 cl de lait froid. Chauffer le reste du lait (35 cl) avec 40 g de sucre.",
      "Verser la fécule délayée dans le lait chaud en fouettant. Cuire à feu doux 4 à 5 minutes en remuant, jusqu'à ce que la crème épaississe et nappe la cuillère. Ajouter 1 c. à s. de fleur d'oranger.",
      "Verser dans des verrines, laisser refroidir puis réserver 2 heures au frais.",
      "Dresser : une demi-pêche pochée sur la crème, un filet de sirop, pistaches concassées."
    ],
    astuce:"Ajoutez la fleur d'oranger hors du feu : cuite, elle perd son parfum."
  },
  boisson:{
    nom:"Limonana",
    ajouts:["Citrons", "Menthe fraîche", "Sucre", "Eau"],
    transformation:"L'infusion de verveine devient la limonade à la menthe libanaise, mixée avec ses feuilles.",
    etapes:[
      "Mixer 1 citron entier coupé en morceaux (sans les pépins) avec 15 feuilles de menthe, 2 c. à s. de sucre et 25 cl d'eau, par à-coups de 10 secondes (pas plus, la peau devient amère).",
      "Filtrer au chinois, ajouter 25 cl d'eau froide.",
      "Servir très frais sur de la glace pilée."
    ]
  }
},
e11:{
  pays:"Australie", drapeau:"🇦🇺",
  intro:"En Australie, le Lamington est le gâteau national, né d'un accident de cuisine à Brisbane en 1900. Génoise au chocolat roulée dans la noix de coco — le contraire absolu de la pavlova, mais tout aussi emblématique.",
  plat:{
    nom:"Lamingtons au chocolat et coco",
    ajouts:["150 g de chocolat noir","15 cl de crème liquide","150 g de noix de coco râpée","1 génoise (4 œufs + 120 g de sucre + 120 g de farine)"],
    transformation:"La pavlova aérienne devient un gâteau moelleux et dense, cuit au four : la génoise remplace la meringue, le chocolat fondant remplace la chantilly, et la noix de coco râpée remplace les fruits tropicaux. On passe d'un dessert frais et croustillant à un dessert de salon de thé réconfortant.",
    etapes:[
      "Génoise : fouetter 4 œufs avec 120 g de sucre au bain-marie à 40°C. Monter au batteur 5-8 min jusqu'à obtenir un ruban bien marqué. Incorporer 120 g de farine tamisée à la maryse. Étaler dans un moule rectangulaire (20×30 cm) et cuire 12 min à 200°C. Laisser refroidir complètement.",
      "Découpe : démouler la génoise refroidie et couper en 12 carrés réguliers d'environ 5×5 cm. Un couteau bien affûté, essuyé entre chaque coupe, évite d'écraser la mie.",
      "Glaçage chocolat : fondre 150 g de chocolat noir avec 15 cl de crème chaude. Mélanger jusqu'à obtenir une ganache lisse et nappante (température : environ 32°C). Trop chaude, elle détrempe la génoise ; trop froide, elle ne nappe pas.",
      "Enrobage : à l'aide de deux fourchettes, plonger chaque carré de génoise dans la ganache pour l'enrober entièrement. Laisser égoutter 2 secondes au-dessus du bol.",
      "Noix de coco : rouler aussitôt chaque carré enrobé dans la noix de coco râpée, en le faisant tourner pour que la coco adhère sur toutes les faces. Poser sur une grille et réserver 1 h au frais avant de servir. Les Lamingtons se conservent 3 jours dans une boîte hermétique."
    ],
    astuce:"La génoise doit être rassise d'un jour (ou légèrement séchée 10 min au four tiède) avant d'être enrobée : une génoise trop fraîche s'écrase au contact du chocolat chaud et le glaçage devient granuleux."
  },
  boisson:{
    nom:"Flat white australien",
    ajouts:["1 espresso serré","15 cl de lait entier micro-moussé"],
    transformation:"Le Champagne devient un flat white, café australien par excellence — plus court qu'un latte, plus doux qu'un cappuccino.",
    etapes:[
      "Préparer un espresso serré (25 secondes).",
      "Chauffer 15 cl de lait entier à 60-65°C — pas plus, sinon il brûle et perd sa douceur. Utiliser un mousseur ou la buse vapeur.",
      "Verser le lait chaud sur l'espresso en maintenant une fine couche de mousse soyeuse en surface (environ 5 mm, pas plus).",
      "Servir en tasse préchauffée, sans sucre — le flat white se boit nature."
       ]
  }
},
e12:{
  pays:"Espagne", drapeau:"🇪🇸",
  intro:"En Espagne, la crème anglaise devient les natillas, une crème parfumée au citron et à la cannelle, couronnée de meringue : un goûter de famille.",
  plat:{
    nom:"Natillas con merengue",
    ajouts:["1 bâton de cannelle", "Zeste d'1/2 citron", "1 c. à s. de fécule de maïs pour 50 cl de lait"],
    transformation:"La crème anglaise est remplacée par des natillas : lait infusé à la cannelle et au citron, épaissi à la fécule pour une texture plus dense. Le caramel est remplacé par un peu de cannelle en poudre.",
    etapes:[
      "Chauffer 50 cl de lait avec le bâton de cannelle et le zeste de citron. Laisser infuser 10 minutes hors du feu, puis filtrer.",
      "Fouetter 4 jaunes avec 80 g de sucre et 1 c. à s. de fécule. Verser le lait chaud en filet en fouettant.",
      "Cuire à feu doux en remuant 5 à 8 minutes, jusqu'à ce que la crème nappe la cuillère. Ne jamais bouillir.",
      "Verser dans des coupelles, laisser refroidir puis réserver 2 heures au frais.",
      "Déposer une île meringuée sur chaque coupelle, saupoudrer de cannelle en poudre."
    ],
    astuce:"La fécule rend les natillas plus stables que la crème anglaise : elles ne tournent presque jamais."
  },
  boisson:{
    nom:"Granizado de limón",
    ajouts:["Citrons", "Sucre", "Glace pilée"],
    transformation:"La citronnade devient un granizado, granité de citron servi dans les cafés espagnols en été.",
    etapes:[
      "Mixer le jus de 3 citrons avec 80 g de sucre et 30 cl d'eau froide jusqu'à dissolution.",
      "Verser dans un plat large et placer au congélateur 3 h, en grattant à la fourchette toutes les 45 minutes.",
      "Servir en verres givrés."
    ]
  }
},
e13:{
  pays:"Autriche", drapeau:"🇦🇹",
  intro:"En Autriche, la vallée de la Wachau est célèbre pour ses abricots, les Marillen. Ils s'enveloppent de pâte pour donner les Marillenknödel, servis nappés de beurre et de chapelure dorés.",
  plat:{
    nom:"Marillenknödel",
    ajouts:["250 g de fromage blanc égoutté", "100 g de farine + 1 œuf", "50 g de beurre + 40 g de chapelure", "4 sucres en morceaux"],
    transformation:"Le sablé disparaît : les abricots, entiers, sont enveloppés dans une pâte au fromage blanc, pochés puis roulés dans du beurre doré à la chapelure.",
    etapes:[
      "Mélanger 250 g de fromage blanc égoutté, 100 g de farine, 1 œuf, une pincée de sel. Pétrir rapidement, filmer et laisser 30 minutes au frais.",
      "Dénoyauter 4 abricots en les ouvrant d'un côté, glisser 1 sucre dans chaque.",
      "Étaler la pâte sur 5 mm, envelopper chaque abricot, rouler en boule en refermant bien la pâte.",
      "Pocher 12 minutes dans une eau frémissante salée.",
      "Faire dorer 40 g de chapelure dans 50 g de beurre. Rouler les knödel dedans, saupoudrer de sucre glace."
    ],
    astuce:"L'eau doit seulement frémir : trop agitée, elle ouvre la pâte."
  },
  boisson:{
    nom:"Marillen-Spritzer",
    ajouts:["Nectar d'abricot", "Eau gazeuse", "Citron"],
    transformation:"La limonade devient un spritzer autrichien, nectar d'abricot allongé d'eau gazeuse.",
    etapes:[
      "Remplir un verre de glaçons.",
      "Verser 8 cl de nectar d'abricot et 12 cl d'eau gazeuse.",
      "Presser un quartier de citron, remuer."
    ]
  }
},
e14:{
  pays:"Japon", drapeau:"🇯🇵",
  intro:"Au Japon, le tiramisu est revisité au matcha : une génoise légère, une crème au mascarpone et une poudre de matcha verte. Raffiné et végétal.",
  plat:{
    nom:"Tiramisu matcha-pêche",
    ajouts:["1 c. à s. de matcha (dans l'imbibage)","1 c. à c. de matcha (pour saupoudrer)"],
    transformation:"Le café disparaît au profit d'un sirop au matcha. Les pêches restent, mais le basilic devient matcha pour un accord vert et pêche.",
    etapes:[
      "Préparer l'imbibage : délayer 1 c. à s. de matcha dans 15 cl d'eau à 80°C. Ajouter 1 c. à s. de sucre. Refroidir.",
      "Monter la crème : 2 jaunes + 80 g de sucre + 250 g de mascarpone. Incorporer 2 blancs en neige.",
      "Tremper les boudoirs dans le matcha. Alterner avec la crème et les pêches en fines tranches.",
      "Réserver 4 h au frais.",
      "Saupoudrer de 1 c. à c. de matcha tamisé au moment de servir."
    ],
    astuce:"Le matcha s'oxyde vite : ne le tamiser qu'au moment de servir, sinon il brunit et perd son éclat vert."
  },
  boisson:{
    nom:"Hōjicha glacé",
    ajouts:["Thé hōjicha (thé vert grillé)"],
    transformation:"Le café glacé devient un hōjicha glacé, thé vert grillé aux notes torréfiées.",
    etapes:[
      "Infuser 2 c. à c. de hōjicha dans 30 cl d'eau à 90°C, 3 min.",
      "Filtrer, refroidir 1 h.",
      "Servir sur glaçons."
    ]
  }
},
e15:{
  pays:"Grèce", drapeau:"🇬🇷",
  intro:"En Grèce, on termine le repas d'été avec du yaourt épais, nappé de miel de thym et de noix : simple, frais, et délicieusement glacé quand il fait très chaud.",
  plat:{
    nom:"Yaourt grec glacé au miel et aux noix",
    ajouts:["50 cl de yaourt grec entier", "100 g de miel de thym", "60 g de noix concassées", "1 pincée de cannelle"],
    transformation:"Le nougat glacé devient un yaourt glacé : plus acidulé, sans meringue ni cuisson du miel.",
    etapes:[
      "Fouetter 50 cl de yaourt grec avec 80 g de miel et la cannelle.",
      "Verser dans un plat large et congeler 3 heures, en remuant énergiquement à la fourchette toutes les 45 minutes pour casser les cristaux.",
      "Torréfier 60 g de noix dans une poêle sèche, 3 minutes.",
      "Servir en boules, arrosé de miel liquide, parsemé de noix."
    ],
    astuce:"Le yaourt entier donne la texture crémeuse ; le yaourt allégé durcit trop."
  },
  boisson:{
    nom:"Frappé grec",
    ajouts:["Café soluble", "Sucre", "Eau froide", "Glaçons"],
    transformation:"L'espresso devient un frappé, café glacé et mousseux, boisson des terrasses grecques.",
    etapes:[
      "Dans un shaker ou un bocal fermé, mettre 2 c. à c. de café soluble, 2 c. à c. de sucre, 5 cl d'eau froide.",
      "Secouer 20 secondes jusqu'à ce que la mousse épaisse se forme.",
      "Verser sur des glaçons, compléter d'eau froide."
    ]
  }
},
e16:{
  pays:"États-Unis", drapeau:"🇺🇸",
  intro:"Le 'blueberry pie' est un classique américain : myrtilles cuites, pâte dorée, sirop épais. On le sert tiède, avec une boule de glace vanille.",
  plat:{

    ajouts:["1 disque de pâte brisée supplémentaire (pour le dessus)","1 c. à s. de fécule","1 boule de glace vanille"],

    etapes:[
      "Foncer un moule à tarte avec la pâte brisée. Garnir de 600 g de myrtilles mélangées avec 100 g de sucre, 1 c. à s. de fécule et le jus d'1 citron.",
      "Poser le second disque de pâte sur le dessus. Souder les bords, faire quelques entailles pour laisser s'échapper la vapeur.",
      "Dorer au jaune d'œuf dilué dans un peu d'eau.",
      "Cuire 40 min à 180°C. Laisser tiédir 30 min.",
      "Servir chaque part tiède avec une boule de glace vanille."

    astuce:"La tarte doit tiédir 30 min avant d'être coupée : les myrtilles continuent de figer à la sortie du four, sinon le jus coule et détrempe la pâte."

    ajouts:["Root beer (soda américain)","1 boule de glace vanille"],
    transformation:"Le thé noir glacé au citron devient un root beer float, dessert-boisson culte des diners américains.",
    etapes:[
      "Déposer une boule de glace vanille dans un grand verre.",
      "Verser 20 cl de root beer (soda) très froide.",
      "Servir aussitôt avec une paille et une cuillère."
    ]
  }
},
e17:{
  pays:"Thaïlande", drapeau:"🇹🇭",
  intro:"En Thaïlande, le parfum de pandan (feuille de pandanus) est partout : riz gluant, desserts, glaces. Un parfum végétal, doux et vanillé.",

    etapes:[
      "Infuser 2 feuilles de pandan nouées dans 40 cl de lait de coco chauffé, 10 min.",
      "Filtrer. Réchauffer avec 1 c. à s. de sucre de palme.",
      "Ajouter 4 feuilles de gélatine essorées. Mélanger hors du feu.",
      "Verser en verrines. Réserver 4 h au frais.",
      "Servir avec un coulis de mangue et quelques éclats de cacahuète torréfiée."

    astuce:"Le pandan frais se trouve en épicerie asiatique (rayon surgelés). L'extrait fonctionne bien, mais 2 fois moins puissant que les feuilles fraîches."
  },
  boisson:{
    nom:"Cha yen glacé (thé thaï)",
    ajouts:["Thé thaï (cha yen)","Lait concentré sucré","Lait évaporé"],
    transformation:"L'eau de coco devient un cha yen glacé, thé thaï sucré et crémeux.",
    etapes:[
      "Infuser 2 c. à s. de thé thaï dans 20 cl d'eau frémissante, 5 min.",
      "Filtrer. Ajouter 2 c. à s. de lait concentré sucré.",
      "Verser sur glaçons, ajouter un nuage de lait évaporé."
    ]
  }
},
e18:{
  pays:"Italie", drapeau:"🇮🇹",
  intro:"À Naples, le babà est une institution : un petit gâteau moelleux, imbibé d'un sirop au rhum ou au limoncello, qui se mange en un clin d'œil à la sortie de la pasticceria.",
  plat:{
    nom:"Babà napolitain au limoncello",
    ajouts:["4 cl de limoncello", "Zestes de citron de Sorrente (ou citron bio)", "Crème pâtissière légère"],
    transformation:"Le rhum cède la place au limoncello dans le sirop, et le baba est garni d'une crème pâtissière au citron plutôt que d'une chantilly.",
    etapes:[
      "Préparer la pâte et cuire les babas comme dans la recette de base (même pousse, même cuisson, mêmes 3 h de séchage).",
      "Préparer le sirop : 30 cl d'eau, 100 g de sucre, zestes de 2 citrons. Faire bouillir 2 minutes, laisser infuser 10 minutes, filtrer et laisser tiédir.",
      "Ajouter 4 cl de limoncello hors du feu.",
      "Imbiber les babas 30 secondes par face, égoutter.",
      "Garnir d'une crème pâtissière parfumée au zeste de citron, décorer d'un zeste frais."
    ],
    astuce:"À Naples, on fend le babà en deux avant de le garnir : il boit encore mieux le sirop."
  },
  boisson:{
    nom:"Spritz au limoncello",
    ajouts:["Limoncello", "Prosecco", "Eau gazeuse", "Menthe"],
    transformation:"Le thé glacé devient un spritz napolitain au limoncello et au prosecco.",
    etapes:[
      "Remplir un verre à vin de glaçons.",
      "Verser 4 cl de limoncello, 8 cl de prosecco bien frais.",
      "Compléter d'un trait d'eau gazeuse, décorer d'une feuille de menthe."
    ]
  }
},

a19:{
  pays:"Argentine", drapeau:"🇦🇷",
  intro:"En Argentine, la pasta frola est la tarte du goûter : une pâte sablée très tendre, garnie d'une épaisse couche de confiture et décorée de lanières croisées.",
  plat:{
    nom:"Pasta frola à la confiture de cerises",
    ajouts:["300 g de confiture épaisse (cerise, coing)", "Zeste d'1 citron", "1 pincée de bicarbonate"],
    transformation:"Le gâteau basque devient une tarte ouverte : pas de crème pâtissière, une généreuse couche de confiture et un quadrillage de lanières de pâte.",
    etapes:[
      "Préparer la pâte : 250 g de farine, 100 g de sucre, 125 g de beurre mou, 2 jaunes, zeste de citron. Mélanger du bout des doigts, filmer, 1 h au frais.",
      "Étaler les 2/3 de la pâte et foncer un moule de 22 cm.",
      "Étaler 300 g de confiture épaisse sur le fond.",
      "Étaler le reste de pâte, découper des bandes de 1 cm et les poser en croisillons sur la confiture, en soudant les bords.",
      "Cuire 35 minutes à 180°C. Laisser refroidir avant de démouler."
    ],
    astuce:"Choisir une confiture bien épaisse : trop liquide, elle déborde et fait brunir les bords."
  },
  boisson:{
    nom:"Submarino",
    ajouts:["Lait entier", "Tablette de chocolat noir"],
    transformation:"Le chocolat chaud devient un submarino, boisson argentine : on plonge une barre de chocolat dans un verre de lait chaud.",
    etapes:[
      "Chauffer 25 cl de lait sans bouillir.",
      "Verser dans un grand verre.",
      "Plonger une barre de 30 g de chocolat noir et la laisser fondre en remuant."
    ]
  }
},
a20:{
  pays:"Italie", drapeau:"🇮🇹",
  intro:"En Italie, le flan rencontre le mascarpone et le café — c'est le tiramisu qui inspire les pâtissiers. Le flan garde sa texture, on remplace juste le café filtre par un espresso italien servi à côté.",
  plat:{
    ajouts:["1 c. à s. de cacao amer pour saupoudrer","1 c. à c. de café espresso (facultatif, dans l'appareil)"],
    transformation:"Le flan garde sa structure française : pâte brisée, appareil vanille, texture fondante. On ajoute juste une pointe d'espresso dans l'appareil avant cuisson, et au moment de servir, un voile de cacao amer tamisé sur le dessus — un clin d'œil au tiramisu italien.",
    etapes:[
      "Appareil : préparez le flan comme d'habitude. Juste avant de verser dans le moule, ajoutez 1 c. à c. de café espresso fort (refroidi) dans l'appareil. Mélangez délicatement — la note café doit être subtile, en arrière-plan.",
      "Cuisson : cuisez le flan comme d'habitude (40 min à 180°C). Le café va s'intégrer à l'appareil et lui donner une légère teinte ambrée.",
      "Refroidissement et repos : laissez refroidir, puis réservez 4 h au frais comme d'habitude.",
      "Service : au moment de servir, saupoudrez chaque part d'un voile de cacao amer tamisé, comme pour un tiramisu.",
      "Dégustation : l'accord café-cacao-vanille transforme le flan parisien en dessert franco-italien. Servez avec un espresso serré à côté pour prolonger l'expérience."
    ],
    astuce:"Le cacao amer doit être saupoudré juste avant de servir — sinon il s'humidifie et noircit la surface du flan. Un cacao à 100% est idéal pour cet usage."
  },
  boisson:{
    ajouts:["Espresso serré","1 zeste d'orange (facultatif)"],
    transformation:"Le café filtre devient un espresso serré italien, servi à l'italienne — petit, intense, dans une tasse préchauffée.",
    etapes:[
      "Préparez un espresso serré (25 secondes d'extraction).",
      "Versez dans une petite tasse préchauffée à l'eau chaude puis essuyée.",
      "Ajoutez un zeste d'orange fin sur le bord (facultatif) — l'orange prolonge le cacao.",
      "Servez aussitôt, en une ou deux gorgées."
    ]
  }
},
a21:{
  pays:"Autriche", drapeau:"🇦🇹",
  intro:"En Autriche, la Sachertorte est la reine des gâteaux au chocolat : génoise, confiture d'abricot, glaçage chocolat. Ici, la poire remplace l'abricot.",
  plat:{
    nom:"Sachertorte à la poire",
    ajouts:["4 œufs + 100 g de chocolat noir + 100 g de beurre (pour la génoise)","Confiture de poire","150 g de chocolat noir + 10 cl de crème (glaçage)"],
    transformation:"Le fondant devient une génoise au chocolat, fourrée de confiture de poire et glaçée au chocolat noir. Plus aérienne, plus élégante.",
    etapes:[
      "Génoise : fondre 100 g de chocolat avec 100 g de beurre. Fouetter 4 jaunes avec 80 g de sucre. Monter 4 blancs en neige. Mélanger délicatement.",
      "Incorporer 100 g de farine. Cuire dans un moule beurré 30 min à 180°C.",
      "Couper la génoise en 2. Garnir de confiture de poire.",
      "Glaçage : fondre 150 g de chocolat avec 10 cl de crème. Napper la Sachertorte.",
      "Réserver 2 h au frais. Servir avec une chantilly légère."
    ],
    astuce:"Le glaçage miroir doit être lisse et brillant. Pour cela, passer une spatule chaude sur la surface après avoir nappé : elle lisse parfaitement."
  },
  boisson:{
    nom:"Melange viennois (café)",
    ajouts:["Espresso","Lait mousseux","Crème fouettée"],
    transformation:"Le café espresso devient un Melange viennois, café traditionnel autrichien servi avec une crème fouettée.",
    etapes:[
      "Préparer un espresso.",
      "Ajouter 10 cl de lait mousseux.",
      "Couronner d'une cuillère de crème fouettée."
    ]
  }
},
a22:{
  pays:"Danemark", drapeau:"🇩🇰",
  intro:"Au Danemark, l'æblekage, littéralement « gâteau de pommes », est un dessert en verrine : compote de pommes, chapelure caramélisée au beurre et crème fouettée.",
  plat:{
    nom:"Æblekage",
    ajouts:["100 g de chapelure ou de biscuits émiettés", "40 g de beurre + 30 g de sucre roux", "20 cl de crème fouettée"],
    transformation:"La charlotte devient une verrine en couches : la brioche est remplacée par une chapelure caramélisée, les pommes sont en compote.",
    etapes:[
      "Cuire 6 pommes en morceaux avec 2 c. à s. de sucre et 2 c. à s. d'eau, 15 minutes, jusqu'à obtenir une compote épaisse.",
      "Faire fondre 40 g de beurre dans une poêle, ajouter 100 g de chapelure et 30 g de sucre roux.",
      "Dorer 5 minutes en remuant, jusqu'à ce que la chapelure soit croustillante. Laisser refroidir.",
      "Monter 20 cl de crème liquide en chantilly.",
      "Dresser en verrines : chapelure, compote, crème, et ainsi de suite, en terminant par la chapelure."
    ],
    astuce:"Ajouter la chapelure au dernier moment : elle ramollit au contact de la compote."
  },
  boisson:{
    nom:"Gløgg sans alcool",
    ajouts:["Jus de raisin ou de cerise", "Cannelle", "Girofle", "Raisins secs", "Amandes"],
    transformation:"Le jus de pomme chaud devient un gløgg, vin chaud scandinave, ici sans alcool.",
    etapes:[
      "Chauffer 40 cl de jus de raisin avec 1 bâton de cannelle, 2 clous de girofle et 1 rondelle d'orange.",
      "Laisser frémir 10 minutes sans bouillir.",
      "Servir avec quelques raisins secs et des amandes effilées dans chaque verre."
    ]
  }
},
a23:{
  pays:"États-Unis", drapeau:"🇺🇸",
  intro:"Aux États-Unis, la 'pumpkin pie' est LE dessert de Thanksgiving : potiron rôti, épices douces, crème. Sans elle, pas de fête.",
  plat:{
    nom:"Pumpkin pie épicée",
    ajouts:["1 boîte de purée de potiron (400 g)","2 œufs","1 boîte de lait concentré sucré (400 g)","Épices (cannelle, muscade, gingembre, girofle)"],
    transformation:"Le cheesecake devient une pumpkin pie : pas de cream cheese, pas de gélatine. Une crème de potiron prise à la cuisson, sur une base de biscuits.",
    etapes:[
      "Base : mixer 200 g de spéculoos avec 80 g de beurre fondu. Tasser dans un moule à tarte. Cuire 10 min à 180°C.",
      "Garniture : fouetter 400 g de purée de potiron avec 2 œufs, 1 boîte de lait concentré sucré, 1 c. à c. de cannelle, 1/2 c. à c. de gingembre, 1/4 c. à c. de muscade et 1 pincée de girofle.",
      "Verser sur la base.",
      "Cuire 50 min à 175°C. Le centre doit être légèrement tremblant.",
      "Refroidir 2 h, puis réserver 4 h au frais avant de servir avec une chantilly légère."
    ],
    astuce:"La purée de potiron en boîte est plus concentrée et plus régulière que la purée maison. Ne pas la remplacer par du potiron frais mixé : le dessert serait trop liquide."
  },
  boisson:{
    nom:"Pumpkin spice latte",
    ajouts:["Espresso","Lait","Épices pumpkin spice","Sirop de vanille"],
    transformation:"Le chai latte devient un pumpkin spice latte, boisson culte d'automne.",
    etapes:[
      "Préparer un espresso.",
      "Chauffer 15 cl de lait avec 1 c. à s. de sirop de vanille et 1/2 c. à c. d'épices pumpkin spice.",
      "Verser l'espresso dans une tasse, ajouter le lait épicé mousseux.",
      "Saupoudrer d'une pincée d'épices."
    ]
  }
},
a24:{
  pays:"Canada", drapeau:"🇨🇦",
  intro:"Les Nanaimo bars sont nées à Nanaimo, en Colombie-Britannique, dans les années 1950. Trois couches sans cuisson : une base chocolat-coco-noix, une crème custard jaune pâle, et un glaçage chocolat brillant. Le dessert le plus emblématique du Canada, mais aussi le plus discret — on ne le voit jamais venir.",
  plat:{
    nom:"Nanaimo bars",
    ajouts:["100 g de biscuits Graham (ou spéculoos)","50 g de noix de coco râpée","50 g de noix concassées","40 g de cacao amer","2 c. à s. de custard powder (ou 2 jaunes d'œufs + 1 c. à s. de fécule)","250 g de sucre glace","200 g de chocolat noir"],
    transformation:"La tarte cuite au four devient un carré sans cuisson : trois couches superposées dans un moule, prises au réfrigérateur. La pâte sablée est remplacée par un fond biscuit-coco-noix lié au beurre fondu. La garniture coulante au sirop d'érable devient une crème custard épaisse au sucre glace. Le glaçage chocolat vient coiffer le tout. Aucune cuisson — uniquement du froid.",
    etapes:[
      "Base (couche 1) : mixer 100 g de biscuits Graham (ou spéculoos) en poudre fine. Mélanger avec 50 g de noix de coco râpée, 50 g de noix concassées, 40 g de cacao amer et 100 g de beurre fondu. Tasser fermement au fond d'un moule carré (20×20 cm) chemisé de papier cuisson. Réserver 20 min au frais.",
      "Crème custard (couche 2) : battre 100 g de beurre pommade avec 2 c. à s. de custard powder (ou 2 jaunes + 1 c. à s. de fécule), 3 c. à s. de crème et 1 c. à c. de vanille. Ajouter 250 g de sucre glace en 3 fois, en battant jusqu'à obtenir une crème lisse et épaisse. Étaler sur la base chocolatée, en lissant à la spatule. Réserver 30 min au frais — la crème doit être ferme avant d'ajouter le glaçage.",
      "Glaçage (couche 3) : faire fondre 200 g de chocolat noir avec 2 c. à s. de beurre au bain-marie. Laisser tiédir 5 min : le chocolat doit être à environ 32°C, nappant mais pas brûlant (au-delà, il fait fondre la couche custard).",
      "Couler : verser le chocolat sur la crème custard froide, en inclinant le moule pour répartir uniformément. Tapoter légèrement le moule sur le plan de travail pour éliminer les bulles d'air.",
      "Réserver 4 h : placer au réfrigérateur au moins 4 h (idéalement une nuit). Découper en carrés de 5×5 cm avec un couteau passé sous l'eau chaude puis essuyé entre chaque coupe. Les Nanaimo bars se conservent 1 semaine au frais, 3 mois au congélateur."
    ],
    astuce:"La crème custard doit être FERME avant de couler le chocolat. Si elle est encore molle, le chocolat chaud la fait fondre et les couches se mélangent. En cas de doute, placez 30 min de plus au frais — la patience est la clé de la netteté des trois couches."
  },
  boisson:{
    nom:"Caesar canadien",
    ajouts:["Vodka","Jus de clamato","Sauce Worcestershire","Tabasco","Céleri","Citron","Rim de sel et poivre"],
    transformation:"Le bourbon on the rocks devient un Caesar — le cocktail national canadien, cousin du Bloody Mary mais au jus de palourde (clamato). Servi avec un rim de sel et poivre, un brin de céleri et une tranche de citron.",
    etapes:[
      "Rim : humectez le bord d'un grand verre avec un quartier de citron, puis trempez-le dans un mélange de sel et de poivre concassé.",
      "Glace : remplissez le verre de glaçons.",
      "Mélange : dans un shaker, combinez 4 cl de vodka, 12 cl de jus de clamato, 2 traits de sauce Worcestershire, 2 traits de Tabasco et le jus d'un quart de citron.",
      "Servir : secouez énergiquement, filtrez dans le verre. Garnissez d'un brin de céleri et d'une tranche de citron. Un trait de jus de cornichon (facultatif) rend le cocktail encore plus authentiquement canadien."
    ]
  }
},
a25:{
  pays:"Grèce", drapeau:"🇬🇷",
  intro:"En Grèce, les figues fraîches se marient au yaourt grec épais et au miel de thym. Un dessert d'une simplicité biblique.",
  plat:{
    nom:"Clafoutis aux figues et yaourt grec",
    ajouts:["200 g de yaourt grec","Miel de thym","1 c. à s. de farine supplémentaire"],
    transformation:"Le clafoutis reste, mais on le sert avec une cuillère de yaourt grec et un filet de miel de thym — au lieu d'être servi nature.",
    etapes:[
      "Préparer le clafoutis aux figues selon la recette.",
      "Laisser tiédir 15 min.",
      "Déposer une généreuse cuillère de yaourt grec sur chaque part.",
      "Arroser d'un filet de miel de thym.",
      "Parsemer de quelques noix concassées et d'une feuille de menthe."
    ],
    astuce:"Le miel de thym grec est plus intense et plus aromatique que les miels classiques. Il transforme complètement le dessert."
  },
  boisson:{
    nom:"Café grec",
    ajouts:["Café grec finement moulu","Sucre (facultatif)","Un verre d'eau fraîche"],
    transformation:"L'infusion de thym devient un café grec, préparé au briki et servi avec un verre d'eau froide.",
    etapes:[
      "Dans un briki, verser 1 c. à c. de café grec finement moulu, 1 c. à c. de sucre et 10 cl d'eau froide.",
      "Chauffer à feu doux, sans remuer, jusqu'à ce que la mousse monte.",
      "Verser aussitôt dans une petite tasse.",
      "Servir avec un verre d'eau fraîche à côté."
    ]
  }
},
a26:{
  pays:"Brésil", drapeau:"🇧🇷",
  intro:"Au Brésil, le 'brigadeiro' est LE dessert national : chocolat, lait concentré, beurre, roulé dans des paillettes de chocolat. Ici, version mousse.",
  plat:{
    nom:"Mousse brigadeiro",
    ajouts:["1 boîte de lait concentré sucré (400 g)","2 c. à s. de cacao amer","Paillettes de chocolat"],
    transformation:"La mousse au chocolat noir devient une mousse brigadeiro : lait concentré, cacao, texture plus dense, saveur brésilienne.",
    etapes:[
      "Chauffer 1 boîte de lait concentré sucré avec 2 c. à s. de cacao amer et 1 c. à s. de beurre, à feu doux, 8 min en remuant.",
      "Laisser tiédir 15 min.",
      "Monter 20 cl de crème très froide en chantilly ferme.",
      "Incorporer délicatement la crème au mélange brigadeiro tiède.",
      "Répartir en verrines. Réserver 4 h au frais. Parsemer de paillettes de chocolat au moment de servir."
    ],
    astuce:"Le brigadeiro doit tiédir AVANT d'incorporer la crème : trop chaud, la crème fond ; trop froid, elle fait des grumeaux."
  },
  boisson:{
    nom:"Cafezinho brésilien",
    ajouts:["Café fort","Sucre","Un trait de lait (facultatif)"],
    transformation:"Le ristretto devient un cafezinho, petit café brésilien très sucré.",
    etapes:[
      "Préparer un café très fort (type espresso allongé).",
      "Ajouter 1 c. à c. de sucre.",
      "Servir en petite tasse brûlante."
    ]
  }
},
a27:{
  pays:"Vietnam", drapeau:"🇻🇳",
  intro:"Au Vietnam, le café est une institution. Il se retrouve dans le bánh flan, un flan au caramel servi avec un filet de café fort et de la glace pilée.",
  plat:{
    nom:"Bánh flan au café",
    ajouts:["1 boîte de lait concentré sucré", "40 cl de lait", "4 œufs", "6 cl de café fort"],
    transformation:"L'Opéra devient un flan au café : caramel au fond du moule, crème au lait concentré, servi avec un trait de café et de la glace pilée.",
    etapes:[
      "Préparer un caramel avec 80 g de sucre et le verser au fond de 6 ramequins.",
      "Fouetter 4 œufs avec 4 c. à s. de lait concentré et 40 cl de lait tiède, filtrer.",
      "Verser dans les ramequins, cuire 40 minutes au bain-marie à 150°C.",
      "Laisser refroidir, réserver 4 heures au frais.",
      "Démouler, servir avec 1 c. à s. de café fort et de la glace pilée."
    ],
    astuce:"Passer l'appareil au chinois : le flan reste parfaitement lisse."
  },
  boisson:{
    nom:"Trà gừng",
    ajouts:["Gingembre frais", "Miel", "Citron"],
    transformation:"Le vin chaud devient un thé au gingembre chaud, boisson vietnamienne réconfortante, sans alcool.",
    etapes:[
      "Éplucher et trancher 3 cm de gingembre, faire bouillir 10 minutes dans 40 cl d'eau.",
      "Ajouter 1 c. à s. de miel et le jus d'1/2 citron.",
      "Filtrer et servir chaud."
    ]
  }
},

h28:{
  pays:"Italie", drapeau:"🇮🇹",
  intro:"En Italie, le 'tronchetto di Natale' est la version italienne de la bûche : génoise roulée, mascarpone, chocolat. Plus légère que la bûche française.",
  plat:{
    nom:"Tronchetto di Natale",
    ajouts:["250 g de mascarpone (au lieu de ganache pour la garniture)","Sucre glace","Cacao amer"],
    transformation:"La ganache au beurre devient une crème au mascarpone. Plus légère, plus fraîche. La génoise roulée reste.",
    etapes:[
      "Préparer une génoise roulée : 4 œufs + 120 g de sucre + 120 g de farine + 30 g de cacao. Étaler sur plaque, cuire 10 min à 200°C.",
      "Préparer la crème : fouetter 250 g de mascarpone avec 100 g de sucre glace et 1 c. à c. de vanille.",
      "Étaler la crème sur la génoise. Rouler serré.",
      "Napper de crème au mascarpone restante. Réserver 2 h au frais.",
      "Saupoudrer de cacao amer tamisé. Décorer de copeaux de chocolat."
    ],
    astuce:"Le mascarpone doit être bien froid avant d'être fouetté. À température ambiante, il devient liquide et la crème ne tient pas."
  },
  boisson:{
    nom:"Spumante rosé",
    ajouts:["Spumante rosé italien"],
    transformation:"Le Champagne devient un Spumante rosé, mousseux italien festif.",
    etapes:[
      "Refroidir le Spumante 2 h au frais.",
      "Servir en flûte bien froide."
    ]
  }
},
h29:{
  pays:"Russie", drapeau:"🇷🇺",
  intro:"En Russie, les blinis annoncent les fêtes : de petites crêpes épaisses et levées, servies chaudes avec de la smetana, une crème aigre épaisse, et de la confiture.",
  plat:{
    nom:"Blinis à la smetana et confiture de cerises",
    ajouts:["1 c. à c. de levure boulangère sèche", "250 g de farine (ou 150 g de farine de blé + 100 g de sarrasin)", "30 cl de lait tiède", "Smetana ou crème fraîche épaisse", "Confiture de cerises"],
    transformation:"Les crêpes Suzette deviennent des blinis : petites crêpes épaisses à la levure, servies avec de la smetana et de la confiture au lieu du beurre d'orange.",
    etapes:[
      "Délayer 1 c. à c. de levure dans 30 cl de lait tiède, laisser mousser 5 minutes.",
      "Mélanger avec 250 g de farine, 1 œuf, 1 pincée de sel et 1 c. à c. de sucre. Fouetter jusqu'à obtenir une pâte lisse.",
      "Laisser lever 1 heure à couvert, jusqu'à ce que la pâte double et se couvre de bulles.",
      "Cuire des petites crêpes de 8 cm dans une poêle beurrée, 1 à 2 minutes par face.",
      "Servir chaud avec une cuillère de smetana et de la confiture de cerises."
    ],
    astuce:"Ne remuez pas la pâte une fois levée : vous perdriez les bulles qui donnent des blinis aérés."
  },
  boisson:{
    nom:"Thé noir au citron et à la confiture",
    ajouts:["Thé noir", "Citron", "Confiture de cerises ou de framboises"],
    transformation:"Le rhum ambré devient un thé noir à la russe, servi avec une cuillère de confiture.",
    etapes:[
      "Infuser un thé noir fort dans une théière, 5 minutes.",
      "Servir chaud, avec une rondelle de citron.",
      "Poser une petite coupelle de confiture à côté, pour la déguster à la cuillère entre deux gorgées."
    ]
  }
},
h30:{
  pays:"Japon", drapeau:"🇯🇵",
  intro:"Au Japon, le 'mont-blanc' est devenu une pâtisserie à part entière, souvent parfumée au matcha. Une montagne verte et soyeuse.",
  plat:{
    nom:"Mont-Blanc au matcha",
    ajouts:["1 c. à s. de matcha (dans la purée de marrons)","1 c. à c. de matcha (pour saupoudrer)"],
    transformation:"La purée de marrons se teinte de matcha. Le vert végétal du thé s'accorde avec la douceur sucrée des marrons.",
    etapes:[
      "Préparer la meringue : 3 blancs + 180 g de sucre. Cuire 1h15 à 100°C.",
      "Préparer la purée : 500 g de purée de marrons + 1 c. à s. de matcha tamisé + 2 c. à s. de crème. Passer au tamis.",
      "Monter 20 cl de crème en chantilly.",
      "Dressage : meringue, chantilly, vermicelles de marrons au matcha à la poche fine.",
      "Tamiser 1 c. à c. de matcha sur le dessus. Servir frais."
    ],
    astuce:"Le matcha dans la purée de marrons doit être tamisé et incorporé progressivement. Trop de matcha rend le dessert amer."
  },
  boisson:{
    nom:"Thé matcha usucha",
    ajouts:["1 c. à c. de matcha","Chasen (fouet à matcha)"],
    transformation:"Le thé noir aux agrumes devient un matcha usucha, thé cérémonial japonais.",
    etapes:[
      "Tamiser 1 c. à c. de matcha dans un bol.",
      "Verser 7 cl d'eau à 80°C.",
      "Fouetter au chasen en zigzag rapide, 15 secondes, jusqu'à obtenir une mousse fine.",
      "Boire aussitôt, sans sucre."
    ]
  }
},
h31:{
  pays:"Espagne", drapeau:"🇪🇸",
  intro:"En Espagne, la 'tarta de chocolate y naranja' est un classique des fêtes. Le chocolat noir rencontre l'orange amère de Séville.",
  plat:{
    nom:"Tarta de chocolate y naranja",
    ajouts:["2 oranges de Séville (ou 2 oranges + 1 c. à s. de marmelade d'orange)","1 c. à s. de Grand Marnier (facultatif)"],
    transformation:"La tarte reste, mais avec de la marmelade d'orange amère entre la pâte et la ganache. Le parfum d'orange est plus profond.",
    etapes:[
      "Cuire la pâte à blanc 20 min à 180°C.",
      "Étaler 3 c. à s. de marmelade d'orange amère sur le fond de tarte.",
      "Préparer la ganache : 200 g de chocolat noir + 20 cl de crème + 30 g de beurre + 1 c. à s. de Grand Marnier.",
      "Verser sur la marmelade.",
      "Réserver 4 h au frais. Servir avec des suprêmes d'orange fraîche."
    ],
    astuce:"La marmelade d'orange amère (type Oxford) est indispensable : une confiture d'orange sucrée ne donne pas le même équilibre avec le chocolat."
  },
  boisson:{
    nom:"Agua de Valencia",
    ajouts:["Cava (ou Champagne)","Jus d'orange frais","Vodka (facultatif)"],
    transformation:"Le Grand Marnier devient une Agua de Valencia, cocktail espagnol à base de cava et d'orange.",
    etapes:[
      "Presser 2 oranges fraîches.",
      "Mélanger 10 cl de jus d'orange avec 10 cl de cava.",
      "Ajouter 2 cl de vodka (facultatif).",
      "Servir sur glaçons avec une rondelle d'orange."
    ]
  }
},
h32:{
  pays:"Suède", drapeau:"🇸🇪",
  intro:"En Suède, la pause du fika est sacrée : un café, une brioche à la cannelle et à la cardamome, les kanelbullar, partagés en milieu d'après-midi.",
  plat:{
    nom:"Kanelbullar à la cardamome",
    ajouts:["1 c. à c. de cardamome moulue", "2 c. à s. de cannelle", "Sucre perlé"],
    transformation:"Le feuilletage devient une pâte levée enroulée avec un beurre mou, de la cannelle et de la cardamome. Les pommes rôties sont servies à côté.",
    etapes:[
      "Préparer la détrempe de la recette de base avec 250 g de farine, 1 c. à c. de cardamome et 40 g de beurre mou.",
      "Laisser pousser 1 heure, puis étaler en rectangle de 40 × 25 cm.",
      "Étaler 50 g de beurre mou, saupoudrer de 50 g de sucre et de 2 c. à s. de cannelle.",
      "Rouler en boudin serré, découper des tranches de 3 cm. Laisser gonfler 30 minutes.",
      "Dorer au lait, parsemer de sucre perlé. Cuire 15 minutes à 200°C."
    ],
    astuce:"Rouler la pâte bien serrée : les bullar gardent leur spirale à la cuisson."
  },
  boisson:{
    nom:"Fika : café et lait chaud à la cardamome",
    ajouts:["Café filtre", "Lait", "Cardamome"],
    transformation:"Le cidre est remplacé par le café suédois, doux et long, servi avec un lait chaud à la cardamome.",
    etapes:[
      "Préparer un café filtre doux et long.",
      "Chauffer 10 cl de lait avec 2 gousses de cardamome écrasées.",
      "Servir ensemble, dans de grandes tasses."
    ]
  }
},
h33:{
  pays:"Inde", drapeau:"🇮🇳",
  intro:"En Inde, le 'kheer' est le riz au lait traditionnel, parfumé à la cardamome, au safran et aux amandes. On le sert lors des grandes fêtes.",
  plat:{
    nom:"Kheer à la cardamome et safran",
    ajouts:["4 gousses de cardamome écrasées","1 pincée de safran","30 g d'amandes effilées","30 g de pistaches concassées"],
    transformation:"Le riz au lait devient un kheer : cuit plus longtemps, plus crémeux, parfumé à la cardamome et au safran, garni de fruits à coque.",
    etapes:[
      "Chauffer 1 L de lait entier avec 4 gousses de cardamome écrasées et 1 pincée de safran, à frémissement.",
      "Ajouter 100 g de riz basmati (rincé) et cuire 45 min à feu très doux, en remuant souvent.",
      "Ajouter 80 g de sucre en fin de cuisson.",
      "Servir chaud ou froid, parsemé d'amandes et de pistaches torréfiées."
    ],
    astuce:"Le kheer traditionnel se cuit très longtemps (jusqu'à 1 heure) pour que le riz se délite complètement et que le lait épaississe. La patience est la clé."
  },
  boisson:{
    nom:"Masala chai",
    ajouts:["Thé noir","Cardamome","Gingembre","Cannelle","Clous de girofle","Lait","Sucre"],
    transformation:"L'infusion de cannelle devient un masala chai, thé épicé indien complet.",
    etapes:[
      "Chauffer 20 cl d'eau avec 2 gousses de cardamome, 1 morceau de gingembre, 1 bâton de cannelle et 2 clous de girofle.",
      "Ajouter 2 c. à s. de thé noir. Infuser 5 min.",
      "Ajouter 10 cl de lait et 2 c. à s. de sucre. Chauffer sans bouillir.",
      "Filtrer. Servir chaud."
    ]
  }
},
h34:{
  pays:"Mexique", drapeau:"🇲🇽",
  intro:"Au Mexique, le chocolat se parfume depuis toujours à la cannelle et au piment. Un soufflé qui garde cet esprit chaud et épicé, sans excès.",

function renderMondeHTML(monde, m, type){
  var isPlat = type === 'plat';
  var html = '';

  html += '<div class="monde-hero">';
  html += '<span class="mh-drapeau">' + monde.drapeau + '</span>';
  html += '<div class="mh-pays">' + esc(monde.pays) + '</div>';
  html += '<div class="mh-nom">' + esc(m.nom) + '</div>';
  html += '<div class="mh-intro">' + esc(monde.intro) + '</div>';
  html += '</div>';

  if(m.ajouts && m.ajouts.length){
    html += '<div class="block"><div class="block-title">Ajouts nécessaires</div><ul class="monde-ajouts">';
    m.ajouts.forEach(function(a){ html += '<li>' + esc(a) + '</li>'; });
    html += '</ul></div>';
  }

  if(m.transformation){
    html += '<div class="block"><div class="block-title">La transformation</div><div class="monde-transfo">' + esc(m.transformation) + '</div></div>';
  }

  if(m.etapes && m.etapes.length){
    html += '<div class="block"><div class="block-title">' + (isPlat ? 'Préparation à la manière de' : 'Service à la manière de') + ' ' + esc(monde.pays) + '</div><ol class="steps">';
    m.etapes.forEach(function(s){ html += '<li>' + esc(s) + '</li>'; });
    html += '</ol></div>';
  }

  if(m.astuce){
    html += '<div class="monde-astuce"><span class="ma-label">Secret du chef</span>' + esc(m.astuce) + '</div>';
  }

  return html;
}

/* ═══════════════════════════════════════════════════════
   INJECTION : patch openRecipe
   ═══════════════════════════════════════════════════════ */
(function(){
  var _openRecipe = window.openRecipe;
  if(typeof _openRecipe !== 'function'){
    console.warn('⚠️ openRecipe introuvable — patch Monde non armé');
    return;
  }

  window.openRecipe = function(d, saison, type){
    _openRecipe(d, saison, type);

    setTimeout(function(){
      var scr = document.getElementById('screen-recipe');
      if(!scr) return;

      var monde = window.MONDE[d.id];
      if(!monde) return;             // pas de transformation pour ce duo
      var m = monde[type];
      if(!m) return;                  // pas de transformation pour ce type

      var mondeHTML = renderMondeHTML(monde, m, type);

      /* Cas 1 : les onglets existent déjà (patch Gastro présent) */
      var existingTabs = scr.querySelector('.recipe-tabs');
      if(existingTabs){
        // Ajouter l'onglet s'il n'existe pas
        if(!existingTabs.querySelector('[data-tab="monde"]')){
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tab-btn';
          btn.dataset.tab = 'monde';
          btn.textContent = 'Monde';
          existingTabs.appendChild(btn);

          // Ajouter le contenu
          var content = document.createElement('div');
          content.className = 'recipe-content monde';
          content.innerHTML = mondeHTML;
          scr.appendChild(content);
        }
        return;
      }

      /* Cas 2 : pas d'onglets — on les crée (Recette + Monde) */
      var children = Array.prototype.slice.call(scr.children);
      var standard = document.createElement('div');
      standard.className = 'recipe-content standard active';
      children.forEach(function(c){ standard.appendChild(c); });
      scr.appendChild(standard);

      var content = document.createElement('div');
      content.className = 'recipe-content monde';
      content.innerHTML = mondeHTML;
      scr.appendChild(content);

      var tabs = document.createElement('div');
      tabs.className = 'recipe-tabs';
      tabs.innerHTML =
        '<button type="button" class="tab-btn active" data-tab="standard">Recette</button>' +
        '<button type="button" class="tab-btn" data-tab="monde">Monde</button>';
      scr.insertBefore(tabs, scr.firstChild);

      // Handler pour les onglets
      tabs.addEventListener('click', function(e){
        var b = e.target.closest('[data-tab]');
        if(!b) return;
        e.preventDefault();
        e.stopPropagation();
        var tab = b.dataset.tab;
        tabs.querySelectorAll('.tab-btn').forEach(function(x){
          x.classList.toggle('active', x === b);
        });
        scr.querySelectorAll('.recipe-content').forEach(function(c){
          c.classList.toggle('active', c.classList.contains(tab));
        });
        window.scrollTo(0, 0);
      });
    }, 80); // après le patch Gastro (40ms)
  };

  console.log('✅ Patch Autour du Monde armé — 36 transformations');
})();

/* ═══════════════════════════════════════════════════════
   IndexedDB — bien plus grand que localStorage
   ═══════════════════════════════════════════════════════ */
const DB_NAME = 'sweet_photos_v1';
const STORE = 'photos';
const DB_VERSION = 1;

let _dbPromise = null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise(function(resolve, reject){
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB non supporté')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e){
      const dbx = e.target.result;
      if(!dbx.objectStoreNames.contains(STORE)){
        const store = dbx.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('logId', 'logId', { unique: false });
        store.createIndex('duoId', 'duoId', { unique: false });
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return _dbPromise;
}

function photoGetById(id){
  return openDB().then(function(dbx){
    return new Promise(function(resolve, reject){
      const tx = dbx.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}

function photoListByLog(logId){
  return openDB().then(function(dbx){
    return new Promise(function(resolve, reject){
      const tx = dbx.transaction(STORE, 'readonly');
      const idx = tx.objectStore(STORE).index('logId');
      const req = idx.getAll(logId);
      req.onsuccess = function(){
        const list = req.result || [];
        list.sort(function(a,b){ return new Date(a.date) - new Date(b.date); });
        resolve(list);
      };
      req.onerror = function(){ reject(req.error); };
    });
  });
}

function photoAdd(logId, duoId, blob){
  const id = 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const rec = {
    id: id, logId: logId, duoId: duoId, blob: blob,
    date: new Date().toISOString(), caption: ''
  };
  return openDB().then(function(dbx){
    return new Promise(function(resolve, reject){
      const tx = dbx.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(rec);
      tx.oncomplete = function(){ resolve(rec); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

function photoUpdateCaption(id, caption){
  return openDB().then(function(dbx){
    return new Promise(function(resolve, reject){
      const tx = dbx.transaction(STORE, 'readwrite');
      const store = tx.objectStore(STORE);
      const req = store.get(id);
      req.onsuccess = function(){
        const rec = req.result;
        if(rec){ rec.caption = caption; store.put(rec); }
      };
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

function photoDelete(id){

/* ═══════════════════════════════════════════════════════
   Compression — réduit à 1200px max, JPEG qualité 0.78
   ═══════════════════════════════════════════════════════ */
function compressImage(file, maxSize, quality){
  return new Promise(function(resolve, reject){
    if(!file || !file.type || file.type.indexOf('image/') !== 0){
      reject(new Error('Fichier non-image')); return;
    }
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(e){
      const img = new Image();
      img.onerror = function(){ reject(new Error('Image illisible')); };
      img.onload = function(){
        let w = img.naturalWidth, h = img.naturalHeight;
        if(w > maxSize || h > maxSize){
          if(w > h){ h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob){
          if(blob) resolve(blob);
          else reject(new Error('Compression échouée'));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderPhotoStrip(container, logId, photos){
  // Révoque les anciens blob URLs de ce conteneur
  container.querySelectorAll('img[data-blob-url]').forEach(function(img){
    try { URL.revokeObjectURL(img.dataset.blobUrl); } catch(e){}
  });

  let html = '';
  photos.forEach(function(p){
    let url = '';
    try { url = URL.createObjectURL(p.blob); } catch(e){ return; }
    const cap = p.caption ? ' title="' + esc(p.caption) + '"' : '';
    html += '<button class="log-photo" data-photo-id="' + p.id +
      '" data-photo-log="' + logId + '"' + cap + ' type="button">' +
      '<img src="' + url + '" data-blob-url="' + url + '" alt="">' +
      '</button>';
  });

  html += '<label class="log-photo-add" title="Ajouter une photo">' +
    '<input type="file" accept="image/*" style="display:none" data-photo-input="' + logId + '">' +
    '<span>+</span>' +
    '</label>';

  container.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════
   HANDLER — Ajout d'une photo
   ═══════════════════════════════════════════════════════ */
document.addEventListener('change', function(e){
  const inp = e.target.closest('[data-photo-input]');
  if(!inp) return;
  const logId = inp.dataset.photoInput;
  const file = inp.files && inp.files[0];
  if(!file) return;

  const entry = db.log.find(function(l){ return l.id === logId; });
  if(!entry){ if(typeof toast === 'function') toast('Entrée introuvable'); return; }

  const container = document.querySelector('[data-photos-for="' + logId + '"]');
  if(container){
    const addBtn = container.querySelector('.log-photo-add');
    if(addBtn) addBtn.style.opacity = '0.4';
  }
  if(typeof toast === 'function') toast('Traitement de la photo…');

  compressImage(file, 1200, 0.78)
    .then(function(blob){ return photoAdd(logId, entry.duoId, blob); })
    .then(function(){ return photoListByLog(logId); })
    .then(function(photos){
      if(container) renderPhotoStrip(container, logId, photos);
      if(typeof toast === 'function') toast('Photo ajoutée ✓');
      updateJournalStats();
    })
    .catch(function(err){
      console.error(err);
      if(typeof toast === 'function') toast('Impossible d\'ajouter la photo');
      if(container){
        const addBtn = container.querySelector('.log-photo-add');
        if(addBtn) addBtn.style.opacity = '1';
      }
    })
    .then(function(){ inp.value = ''; });
});

/* ═══════════════════════════════════════════════════════
   HANDLER — Clic sur une vignette → lightbox
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click', function(e){
  const thumb = e.target.closest('.log-photo');
  if(!thumb) return;
  e.preventDefault();
  e.stopPropagation();
  openLightbox(thumb.dataset.photoId);
}, true);

/* ═══════════════════════════════════════════════════════
   LIGHTBOX
   ═══════════════════════════════════════════════════════ */
let _lightboxCurrent = null;

function openLightbox(photoId){
  photoGetById(photoId).then(function(rec){
    if(!rec) return;
    _lightboxCurrent = rec;

    const lb = document.getElementById('photo-lightbox');
    if(!lb) return;

    const img = lb.querySelector('.photo-lightbox-img');
    const cap = lb.querySelector('.photo-lightbox-caption');

    if(img.dataset.blobUrl){
      try { URL.revokeObjectURL(img.dataset.blobUrl); } catch(e){}
    }
    const url = URL.createObjectURL(rec.blob);
    img.src = url;
    img.dataset.blobUrl = url;
    img.alt = rec.caption || 'Photo du dessert';

    cap.value = rec.caption || '';
    cap.dataset.photoId = rec.id;

    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  });
}

function closeLightbox(){
  const lb = document.getElementById('photo-lightbox');
  if(!lb) return;
  lb.classList.remove('open');
  const img = lb.querySelector('.photo-lightbox-img');
  if(img && img.dataset.blobUrl){
    try { URL.revokeObjectURL(img.dataset.blobUrl); } catch(e){}
    img.removeAttribute('src');
    delete img.dataset.blobUrl;
  }
  document.body.style.overflow = '';
  _lightboxCurrent = null;
}

document.addEventListener('click', function(e){
  if(e.target.closest('.photo-lightbox-close')){ closeLightbox(); return; }
  if(e.target.classList && e.target.classList.contains('photo-lightbox')){ closeLightbox(); return; }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    const lb = document.getElementById('photo-lightbox');
    if(lb && lb.classList.contains('open')){ e.preventDefault(); closeLightbox(); }
  }
});

/* ═══════════════════════════════════════════════════════
   LIGHTBOX — Édition de la légende (debounced)
   ═══════════════════════════════════════════════════════ */
document.addEventListener('input', function(e){
  const cap = e.target.closest('.photo-lightbox-caption');
  if(!cap) return;
  const id = cap.dataset.photoId;
  if(!id) return;
  clearTimeout(cap._saveTimer);
  cap._saveTimer = setTimeout(function(){
    photoUpdateCaption(id, cap.value).catch(function(){});
  }, 450);
});

/* ═══════════════════════════════════════════════════════
   LIGHTBOX — Suppression
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click', function(e){
  const btn = e.target.closest('.photo-lightbox-delete');
  if(!btn) return;
  e.preventDefault();
  e.stopPropagation();
  if(!_lightboxCurrent) return;
  if(!confirm('Supprimer cette photo ? Cette action est définitive.')) return;

  const id = _lightboxCurrent.id;
  const logId = _lightboxCurrent.logId;
  photoDelete(id).then(function(){
    closeLightbox();
    loadPhotosInto(logId);
    updateJournalStats();
    if(typeof toast === 'function') toast('Photo supprimée');
  }).catch(function(){
    if(typeof toast === 'function') toast('Erreur de suppression');
  });
});

/* ═══════════════════════════════════════════════════════
   NETTOYAGE — Suppression en cascade des photos
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click', function(e){
  const del = e.target.closest('#screen-log [data-del]');
  if(!del) return;
  const logId = del.dataset.del;
  if(!logId) return;
  photoDeleteAllForLog(logId).catch(function(){});
}, true);

/* ═══════════════════════════════════════════════════════
   STATS — Compteur de photos total
   ═══════════════════════════════════════════════════════ */
function updateJournalStats(){
  const hint = document.getElementById('log-stats');
  if(!hint) return;
  const nb = db.log.length;
  photoCountAll().then(function(count){
    let txt = nb + ' dessert' + (nb > 1 ? 's' : '');
    if(count > 0){
      txt += ' · ' + count + ' photo' + (count > 1 ? 's' : '');
    }
    hint.textContent = txt;
  }).catch(function(){
    hint.textContent = nb + ' dessert' + (nb > 1 ? 's' : '');
  });
}

console.log('✅ Patch Journal Photo armé');
})();
</script>
<!-- ═══════════════════════════════════════════════════════
     LISTE DE COURSES EXPORTABLE — Copier / Partager / PDF
     À coller juste avant </body>

<style>
/* ═══ Boutons d'export ═══ */
.btn-export-group{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;

@media print{

}
