<script>
(function(){
'use strict';
console.log('🟢 Patch Export Courses : démarrage');

/* ═══════════════════════════════════════════════════════
   Lecture du contenu de la liste depuis le DOM
   ═══════════════════════════════════════════════════════ */
function readCartFromDOM(){
  const screen = document.getElementById('screen-cart');
  if(!screen) return [];
  const blocks = screen.querySelectorAll('.block');
  const sections = [];
  blocks.forEach(function(block){
    const titleEl = block.querySelector('.block-title');
    const ul = block.querySelector('ul.ing');
    if(!titleEl || !ul) return;
    // Ignore "Desserts choisis" (n'a pas d'ul.ing)
    const items = [];
    ul.querySelectorAll('li').forEach(function(li){
      const nameEl = li.querySelector('b');
      const qtyEl = li.querySelector('.ing-q');
      const name = nameEl ? nameEl.textContent.trim() : '';
      const qty = qtyEl ? qtyEl.textContent.trim() : '';
      if(name) items.push({ name: name, qty: qty });
    });
    if(items.length){
      sections.push({ title: titleEl.textContent.trim(), items: items });
    }
  });
  return sections;
}

function getCartMeta(){
  const col = (typeof db !== 'undefined' && db.cartServ != null) ? db.cartServ : 1;
  const label = col === 0 ? '1 personne' : (col === 1 ? '2 personnes' : '4 personnes');
  const total = (typeof db !== 'undefined' && db.cart) ? db.cart.length : 0;
  const date = new Date().toLocaleDateString('fr-FR', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
  return { label: label, total: total, date: date };
}

/* ═══════════════════════════════════════════════════════
   Construction des formats d'export
   ═══════════════════════════════════════════════════════ */
function buildCartText(){
  const sections = readCartFromDOM();
  if(!sections.length) return '';
  const meta = getCartMeta();

  let t = 'MA LISTE DE COURSES — Sweet & Sip\n';
  t += '═════════════════════════════════════\n';
  t += meta.date + ' · ' + meta.label + ' · ' + meta.total +
       ' dessert' + (meta.total > 1 ? 's' : '') + '\n\n';

  sections.forEach(function(s){
    t += s.title.toUpperCase() + '\n';
    t += '─────────────────────────────────\n';
    s.items.forEach(function(it){
      t += '  ☐ ' + it.name;
      if(it.qty) t += '  —  ' + it.qty;
      t += '\n';
    });
    t += '\n';
  });

  t += '═════════════════════════════════════\n';
  t += 'Sweet & Sip — Les 4 Saisons Sucrées\n';
  return t;
}

function buildCartCSV(){
  const sections = readCartFromDOM();
  if(!sections.length) return '';
  const rows = [['Rayon', 'Ingrédient', 'Quantité']];
  sections.forEach(function(s){
    s.items.forEach(function(it){
      rows.push([s.title, it.name, it.qty || '']);
    });
  });
  return rows.map(function(row){
    return row.map(function(cell){
      let v = String(cell).replace(/"/g, '""');
      if(/[",;\n\r]/.test(v)) v = '"' + v + '"';
      return v;
    }).join(';');
  }).join('\r\n');
}

function buildPrintHTML(){
  const sections = readCartFromDOM();
  if(!sections.length) return '';
  const meta = getCartMeta();

  let html = '<!DOCTYPE html><html lang="fr"><head>';
  html += '<meta charset="utf-8">';
  html += '<meta name="viewport" content="width=device-width,initial-scale=1">';
  html += '<title>Ma liste de courses — Sweet &amp; Sip</title>';
  html += '<style>';
  html += '*{box-sizing:border-box;margin:0;padding:0}';
  html += 'body{font-family:Georgia,"Cormorant Garamond",serif;color:#2A1F15;background:#fff;padding:36px 32px;max-width:720px;margin:0 auto;line-height:1.5;font-size:15px}';
  html += 'header{border-bottom:2px solid #C2185B;padding-bottom:20px;margin-bottom:26px}';
  html += 'h1{font-size:26px;font-weight:600;margin-bottom:8px;letter-spacing:.02em}';
  html += 'header p{font-style:italic;color:#6B5A4A;font-size:14px}';
  html += 'section{margin-bottom:24px;page-break-inside:avoid}';
  html += 'h2{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#C2185B;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #EADCC8}';
  html += 'ul{list-style:none}';
  html += 'li{padding:9px 0;border-bottom:1px dotted #EADCC8;font-size:15px;display:flex;gap:11px;align-items:baseline}';
  html += 'li:last-child{border-bottom:none}';
  html += 'input[type=checkbox]{width:15px;height:15px;flex-shrink:0;accent-color:#C2185B;margin-top:3px}';
  html += 'li strong{font-weight:400;flex:1}';
  html += 'li em{font-style:italic;color:#C2185B;font-weight:600;text-align:right;white-space:nowrap;font-size:14.5px}';
  html += 'footer{margin-top:40px;padding-top:20px;border-top:1px solid #EADCC8;text-align:center;font-style:italic;color:#6B5A4A;font-size:12.5px}';
  html += '@media print{body{padding:0}@page{margin:16mm 14mm}}';
  html += '</style></head><body>';

  html += '<header>';
  html += '<h1>Ma liste de courses</h1>';
  html += '<p>' + meta.date + ' · ' + meta.label + ' · ' + meta.total +
          ' dessert' + (meta.total > 1 ? 's' : '') + '</p>';
  html += '</header>';

  sections.forEach(function(s){
    html += '<section><h2>' + escapeHtml(s.title) + '</h2><ul>';
    s.items.forEach(function(it){
      html += '<li><input type="checkbox">';
      html += '<strong>' + escapeHtml(it.name) + '</strong>';
      if(it.qty) html += '<em>' + escapeHtml(it.qty) + '</em>';
      html += '</li>';
    });
    html += '</ul></section>';
  });

  html += '<footer>Sweet &amp; Sip — Les 4 Saisons Sucrées</footer>';
  html += '</body></html>';
  return html;
}

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"]/g, function(c){
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* ═══════════════════════════════════════════════════════
   Utilitaires : copie, téléchargement, partage
   ═══════════════════════════════════════════════════════ */
function copyText(text){
  if(!text) return Promise.reject(new Error('Vide'));
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    try {
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand refusé'));
    } catch(e){
      document.body.removeChild(ta);
      reject(e);
    }
  });
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

function toastMsg(msg){
  if(typeof toast === 'function') toast(msg);
  else console.log(msg);
}

/* ═══════════════════════════════════════════════════════
   Actions
   ═══════════════════════════════════════════════════════ */
function actionCopy(){
  const text = buildCartText();
  if(!text){ toastMsg('Rien à copier'); return; }
  copyText(text)
    .then(function(){ toastMsg('Liste copiée ✓'); })
    .catch(function(){ toastMsg('Copie impossible'); });
}

function actionShare(){
  const text = buildCartText();
  if(!text){ toastMsg('Rien à partager'); return; }
  if(navigator.share){
    navigator.share({
      title: 'Ma liste de courses — Sweet & Sip',
      text: text
    }).then(function(){
      toastMsg('Partagé ✓');
    }).catch(function(err){
      if(err && err.name !== 'AbortError'){
        // Fallback silencieux : copie
        copyText(text).then(function(){ toastMsg('Copié ✓'); }).catch(function(){});
      }
    });
  } else {
    copyText(text)
      .then(function(){ toastMsg('Copié ✓ (partage non supporté)'); })
      .catch(function(){ toastMsg('Partage indisponible'); });
  }
}

function actionTxt(){
  const text = buildCartText();
  if(!text){ toastMsg('Rien à exporter'); return; }
  downloadFile('courses-sweet-sip.txt', text, 'text/plain');
  toastMsg('Fichier .txt téléchargé ✓');
}

function actionCsv(){
  const csv = buildCartCSV();
  if(!csv){ toastMsg('Rien à exporter'); return; }
  // BOM UTF-8 pour Excel
  downloadFile('courses-sweet-sip.csv', '\ufeff' + csv, 'text/csv');
  toastMsg('Fichier .csv téléchargé ✓');
}

function actionMail(){
  const text = buildCartText();
  if(!text){ toastMsg('Rien à envoyer'); return; }
  const subject = 'Ma liste de courses — Sweet & Sip';
  // mailto supporte ~2000 caractères selon les clients
  const body = text.length > 1800 ? text.slice(0, 1800) + '\n\n[…liste tronquée]' : text;
  const url = 'mailto:?subject=' + encodeURIComponent(subject) +
              '&body=' + encodeURIComponent(body);
  window.location.href = url;
}

function actionPrint(){
  const html = buildPrintHTML();
  if(!html){ toastMsg('Rien à imprimer'); return; }
  const w = window.open('', '_blank', 'width=800,height=900,noopener');
  if(!w){
    toastMsg('Autorise les pop-ups pour imprimer');
    return;
  }
  w.document.open();
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(function(){
    try { w.print(); } catch(e){}
  }, 400);
}

/* ═══════════════════════════════════════════════════════
   Injection dans l'écran Courses
   ═══════════════════════════════════════════════════════ */
function injectExportButtons(){
  const screen = document.getElementById('screen-cart');
  if(!screen) return;
  if(screen.querySelector('.btn-export-group')) return;
  // N'affiche rien si la liste est vide
  if(!screen.querySelector('ul.ing')) return;

  const group = document.createElement('div');
  group.className = 'btn-export-group';

  const meta = getCartMeta();
  group.innerHTML =
    '<div class="btn-export-info">' +
      'Exporter pour ' + escapeHtml(meta.label) +
    '</div>' +
    '<button type="button" class="btn primary" data-export="copy">📋 Copier</button>' +
    '<button type="button" class="btn" data-export="share">↗ Partager</button>' +
    '<button type="button" class="btn" data-export="txt">📥 .txt</button>' +
    '<button type="button" class="btn" data-export="csv">📊 .csv</button>' +
    '<button type="button" class="btn" data-export="mail">✉️ Mail</button>' +
    '<button type="button" class="btn" data-export="print">🖨 PDF</button>';

  // Insère juste avant la ligne "Tout vider"
  const row = screen.querySelector('.btn-row');
  if(row && row.parentNode){
    row.parentNode.insertBefore(group, row);
  } else {
    screen.appendChild(group);
  }
}

/* ═══════════════════════════════════════════════════════
   Clics sur les boutons d'export
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click', function(e){
  const b = e.target.closest('[data-export]');
  if(!b) return;
  e.preventDefault();
  e.stopPropagation();
  const t = b.dataset.export;
  if(t === 'copy')       actionCopy();
  else if(t === 'share') actionShare();
  else if(t === 'txt')   actionTxt();
  else if(t === 'csv')   actionCsv();
  else if(t === 'mail')  actionMail();
  else if(t === 'print') actionPrint();
});

/* ═══════════════════════════════════════════════════════
   Hook sur renderCart : injecte après chaque rendu
   ═══════════════════════════════════════════════════════ */
(function hookRenderCart(){
  if(typeof window.renderCart !== 'function') return;
  const _renderCart = window.renderCart;
  window.renderCart = function(){
    _renderCart.apply(this, arguments);
    // Petit délai pour laisser le DOM se construire
    setTimeout(injectExportButtons, 20);
  };
})();

/* Fallback : si l'utilisateur navigue depuis le menu sans repasser par renderCart,
   on injecte au cas où. */
document.addEventListener('click', function(e){
  const mi = e.target.closest('[data-menu="cart"]');
  if(!mi) return;
  setTimeout(injectExportButtons, 80);
});

console.log('✅ Patch Export Courses armé — 6 formats');
})();
</script>

/* ═══════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════ */
function findMenu(id){
  return MENUS_DATA.find(function(m){ return m.id === id; }) || null;
}
function duosForMenu(menu){
  return menu.duos
    .map(function(id){ return findDuo(id); })
    .filter(function(x){ return !!x; });
}
function countInCart(menu){
  let n = 0;
  menu.duos.forEach(function(id){
    if(db.cart && db.cart.indexOf(id) !== -1) n++;
  });
  return n;
}

/* ═══════════════════════════════════════════════════════
   Injection : menu drawer + screen
   ═══════════════════════════════════════════════════════ */

// Menu dans le drawer, après "Saisons"
(function injectDrawer(){
  const drawer = document.getElementById('drawer');
  if(!drawer) return;
  if(drawer.querySelector('[data-menu="menus"]')) return;

  const btn = document.createElement('button');
  btn.className = 'drawer-item';
  btn.dataset.menu = 'menus';
  btn.innerHTML =
    '<span class="di-icon">🍽</span>' +
    '<span>Menus</span>' +
    '<span class="di-arrow">→</span>';

  const homeBtn = drawer.querySelector('[data-menu="home"]');
  if(homeBtn && homeBtn.parentNode){
    homeBtn.parentNode.insertBefore(btn, homeBtn.nextSibling);
  } else {
    drawer.appendChild(btn);
  }
})();

// Screen dédié
(function injectScreen(){
  const main = document.querySelector('main');
  if(!main) return;
  if(document.getElementById('screen-menus')) return;

  const section = document.createElement('section');
  section.id = 'screen-menus';
  section.className = 'screen';
  main.appendChild(section);
})();

/* ═══════════════════════════════════════════════════════
   Rendu — liste des menus
   ═══════════════════════════════════════════════════════ */
window.renderMenus = function(){

  let html = '<button class="btn back" data-back="home">← Retour</button>';

  html += '<div class="mh-eyebrow">Occasions à célébrer</div>';
  html += '<h1 class="mh-title">Menus <em>prêts</em> à offrir</h1>';
  html += '<div class="mh-sub">' + MENUS_DATA.length +
          ' menus composés pour vous</div>';
  html += '</div>';

  MENUS_DATA.forEach(function(menu){
    const inCart = countInCart(menu);
    html += '<button class="menu-card" data-menu-id="' + menu.id + '" type="button">';
    html += '<span class="menu-card-stripe" style="background:' + menu.stripe + '"></span>';
    html += '<span class="menu-card-body">';
    html += '<span class="menu-card-head">';
    html += '<span class="menu-card-emoji">' + menu.emoji + '</span>';
    html += '<span class="menu-card-nom">' + esc(menu.nom) + '</span>';
    html += '<span class="menu-card-count">' + menu.duos.length + '</span>';
    html += '</span>';
    html += '<span class="menu-card-tag">' + esc(menu.tag) + '</span>';
    html += '<span class="menu-card-meta">';
    html += '<span class="menu-card-badge">🕐 ' + esc(menu.temps) + '</span>';
    html += '<span class="menu-card-badge ' + (menu.alcool ? 'badge-warn' : 'badge-ok') + '">' +
            (menu.alcool ? '🍷 Alcool' : '🍵 Sans alcool') + '</span>';
    html += '<span class="menu-card-badge ' + (menu.enfants ? 'badge-ok' : '') + '">' +
            (menu.enfants ? '👶 Enfants' : '💑 Adultes') + '</span>';
    html += '<span class="menu-card-badge">👥 ' + esc(menu.convives) + '</span>';
    if(inCart > 0){
      html += '<span class="menu-card-badge badge-ok">🛒 ' + inCart + ' aux courses</span>';

    html += '</span>';
    html += '</span>';
    html += '</button>';
  });

  screen.innerHTML = html;
  if(typeof go === 'function') go('menus');
};

/* ═══════════════════════════════════════════════════════
   Rendu — détail d'un menu
   ═══════════════════════════════════════════════════════ */
window.openMenu = function(id){
  const menu = findMenu(id);
  if(!menu) return;

  const screen = document.getElementById('screen-menus');
  if(!screen) return;

  const items = duosForMenu(menu);
  const inCart = countInCart(menu);
  const allInCart = inCart === menu.duos.length;

  let html = '<button class="btn back" data-back="menus-list">← Menus</button>';

  // Hero
  html += '<div class="menu-detail-hero">';
  html += '<span class="mdh-emoji">' + menu.emoji + '</span>';
  html += '<div class="mdh-cat">Menu ' + esc(menu.nom) + '</div>';
  html += '<div class="mdh-nom">' + esc(menu.tag) + '</div>';
  html += '<div class="mdh-meta">';
  html += '<span class="menu-card-badge">🕐 ' + esc(menu.temps) + '</span>';
  html += '<span class="menu-card-badge ' + (menu.alcool ? 'badge-warn' : 'badge-ok') + '">' +
          (menu.alcool ? '🍷 Alcool' : '🍵 Sans alcool') + '</span>';
  html += '<span class="menu-card-badge ' + (menu.enfants ? 'badge-ok' : '') + '">' +
          (menu.enfants ? '👶 Enfants' : '💑 Adultes') + '</span>';
  html += '<span class="menu-card-badge">👥 ' + esc(menu.convives) + '</span>';
  html += '</div>';
  html += '</div>';

  // Intro
  html += '<div class="menu-intro">' + esc(menu.intro) + '</div>';

  // Timeline
  if(menu.timeline && menu.timeline.length){
    html += '<div class="block"><div class="block-title">Ordre de préparation</div>';
    html += '<ul class="menu-timeline">';
    menu.timeline.forEach(function(t){
      html += '<li><b>' + esc(t.quand) + '</b>' + esc(t.quoi) + '</li>';
    });
    html += '</ul></div>';
  }

  // Liste des desserts
  html += '<div class="block"><div class="block-title">Les desserts du menu</div>';
  html += '<ul class="menu-duo-list">';
  items.forEach(function(x){
    const d = x.duo, s = x.saison;
    const isInCart = db.cart && db.cart.indexOf(d.id) !== -1;
    html += '<li>';
    html += '<button class="menu-duo-item" data-duo="' + d.id + '" type="button">';
    html += '<span class="menu-duo-num">' + String(d.numero).padStart(2, '0') + '</span>';
    html += '<span class="menu-duo-body">';
    html += '<span class="menu-duo-title">' + esc(d.plat.titre) + '</span>';
    html += '<span class="menu-duo-sub">' + esc(d.boisson.titre) + ' · ' + esc(s.nom) + '</span>';
    html += '</span>';
    if(isInCart){
      html += '<span class="menu-duo-tag">🛒 Dans la liste</span>';
    } else {
      html += '<span class="menu-duo-tag">' + esc(s.nom) + '</span>';
    }
    html += '<span class="menu-duo-arrow">→</span>';
    html += '</button>';
    html += '</li>';
  });
  html += '</ul></div>';

  // Astuce
  if(menu.astuce){
    html += '<div class="block"><div class="block-title">Conseil de table</div>';
    html += '<div class="callout">' + esc(menu.astuce) + '</div></div>';
  }

  // Actions
  html += '<div class="menu-actions">';
  html += '<button type="button" class="btn primary" data-menu-add="' + menu.id + '">' +
          (allInCart ? '🛒 Tout est déjà dans la liste' : '🛒 Ajouter les ' + menu.duos.length + ' aux courses') +
          '</button>';
  html += '<button type="button" class="btn" data-menu-share="' + menu.id + '">↗ Partager ce menu</button>';
  html += '</div>';

  screen.innerHTML = html;
  if(typeof go === 'function') go('menus');
  window.scrollTo(0, 0);

/* ═══════════════════════════════════════════════════════
   Ajout aux courses
   ═══════════════════════════════════════════════════════ */
function addMenuToCart(menuId){
  const menu = findMenu(menuId);
  if(!menu) return;
  if(!db.cart) db.cart = [];

  let added = 0;
  menu.duos.forEach(function(id){
    // Vérifie que le duo existe vraiment
    if(!findDuo(id)) return;
    if(db.cart.indexOf(id) === -1){
      db.cart.push(id);
      added++;
    }
  });

  if(typeof save === 'function') save();

  if(added === 0){
    if(typeof toast === 'function') toast('Tout est déjà dans la liste');
  } else {
    if(typeof toast === 'function'){
      toast(added + ' dessert' + (added > 1 ? 's' : '') +
            ' ajouté' + (added > 1 ? 's' : '') + ' aux courses ✓');
    }
  }

  // Rafraîchit le détail du menu pour mettre à jour les badges
  setTimeout(function(){ window.openMenu(menuId); }, 300);
}

/* ═══════════════════════════════════════════════════════
   Partage d'un menu
   ═══════════════════════════════════════════════════════ */
function shareMenu(menuId){
  const menu = findMenu(menuId);
  if(!menu) return;

  let txt = menu.emoji + ' ' + menu.nom + '\n';
  txt += '── ' + menu.tag + ' ──\n';
  txt += menu.temps + ' · ' + menu.convives + ' personnes\n';
  txt += (menu.alcool ? '🍷 Avec alcool' : '🍵 Sans alcool');
  txt += ' · ' + (menu.enfants ? '👶 Enfants' : '💑 Adultes');
  txt += '\n\n';

  menu.duos.forEach(function(id, i){
    const f = findDuo(id);
    if(!f) return;
    txt += (i + 1) + '. ' + f.duo.plat.titre +
           '  ·  ' + f.duo.boisson.titre + '\n';
  });

  txt += '\nSweet & Sip — Les 4 Saisons Sucrées';

  if(navigator.share){
    navigator.share({
      title: menu.emoji + ' ' + menu.nom + ' — Sweet & Sip',
      text: txt

<script>
(function(){

/* ═══════════════════════════════════════════════════════
   IndexedDB dédié — store séparé du journal photo
   ═══════════════════════════════════════════════════════ */
const DB_NAME = 'sweet_recipe_photos_v1';
const STORE = 'photos';
const DB_VERSION = 1;

let _dbPromise = null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise(function(resolve, reject){
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB non supporté')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e){
      const dbx = e.target.result;
      if(!dbx.objectStoreNames.contains(STORE)){
        dbx.createObjectStore(STORE, { keyPath: 'key' });
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return _dbPromise;
}

function photoGet(key){
  return openDB().then(function(dbx){
    return new Promise(function(resolve, reject){
      const tx = dbx.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}

function photoPut(key, blob, meta){
  const rec = {
    key: key,
    blob: blob,
    date: new Date().toISOString(),
    meta: meta || {}
  };
  return openDB().then(function(dbx){
    return new Promise(function(resolve, reject){
      const tx = dbx.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(rec);
      tx.oncomplete = function(){ resolve(rec); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

function photoDelete(key){
  return openDB().then(function(dbx){
    return new Promise(function(resolve, reject){
      const tx = dbx.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

/* ═══════════════════════════════════════════════════════
   Compression — 1600px max, qualité 0.82
   ═══════════════════════════════════════════════════════ */
function compressImage(file, maxSize, quality){
  return new Promise(function(resolve, reject){
    if(!file || !file.type || file.type.indexOf('image/') !== 0){
      reject(new Error('Fichier non-image')); return;
    }
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(e){
      const img = new Image();
      img.onerror = function(){ reject(new Error('Image illisible')); };
      img.onload = function(){
        let w = img.naturalWidth, h = img.naturalHeight;
        if(w > maxSize || h > maxSize){
          if(w > h){ h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob){
          if(blob) resolve(blob);
          else reject(new Error('Compression échouée'));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ═══════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════ */
function toastMsg(msg){
  if(typeof toast === 'function') toast(msg);
  else console.log(msg);
}
function photoKey(duoId, type){
  return duoId + ':' + type;  // ex: "p1:plat"
}

/* ═══════════════════════════════════════════════════════
   Rendu — hero photo sur la fiche recette
   ═══════════════════════════════════════════════════════ */
function renderHeroPhoto(duo, type){
  const scr = document.getElementById('screen-recipe');
  if(!scr) return;
  // Évite le double rendu
  if(scr.querySelector('.recipe-photo-hero:not([data-photo-monde])')) return;

  const detailHero = scr.querySelector('.detail-hero');
  if(!detailHero) return;

  const key = photoKey(duo.id, type);

  photoGet(key).then(function(rec){
    const wrapper = document.createElement('div');
    wrapper.className = 'recipe-photo-hero';
    wrapper.setAttribute('data-photo-key', key);

    if(rec && rec.blob){
      const url = URL.createObjectURL(rec.blob);
      wrapper.innerHTML =
        '<img src="' + url + '" data-blob-url="' + url + '" alt="">' +
        '<div class="recipe-photo-actions">' +
          '<button type="button" data-photo-replace="' + key + '" title="Remplacer">↻</button>' +
          '<button type="button" data-photo-delete="' + key + '" title="Supprimer">✕</button>' +
        '</div>';
    } else {
      wrapper.classList.add('empty');
      wrapper.innerHTML =
        '<input type="file" accept="image/*" data-photo-input="' + key + '">' +
        '<span><b>+</b>Ajouter une photo</span>';
    }

    // Insère avant le .detail-hero
    detailHero.parentNode.insertBefore(wrapper, detailHero);

    // Handler clic sur la zone vide
    if(wrapper.classList.contains('empty')){
      wrapper.addEventListener('click', function(e){
        if(e.target.closest('input')) return;
        const inp = wrapper.querySelector('input[type="file"]');
        if(inp) inp.click();
      });
    }
  }).catch(function(){ /* silencieux */ });
}

/* ═══════════════════════════════════════════════════════
   Rendu — vignettes sur les cartes du duo
   ═══════════════════════════════════════════════════════ */
function renderDuoThumbs(){

  if(!scr) return;

  const cards = scr.querySelectorAll('.recipe-card');
  cards.forEach(function(card){

    if(!type) return;
    const key = photoKey(currentDuo.id, type);

    // Nettoie les anciens blob URLs
    const oldThumb = card.querySelector('.rc-photo-thumb');
    if(oldThumb){
      const oldImg = oldThumb.querySelector('img[data-blob-url]');
      if(oldImg) try { URL.revokeObjectURL(oldImg.dataset.blobUrl); } catch(e){}
      oldThumb.remove();
    }

    photoGet(key).then(function(rec){
      if(!rec || !rec.blob) return;
      let url = '';
      try { url = URL.createObjectURL(rec.blob); } catch(e){ return; }
      const thumb = document.createElement('span');
      thumb.className = 'rc-photo-thumb';
      thumb.innerHTML = '<img src="' + url + '" data-blob-url="' + url + '" alt="">';
      card.appendChild(thumb);
    }).catch(function(){});
  });
}

/* ═══════════════════════════════════════════════════════
   Hooks sur openRecipe et renderDuo
   ═══════════════════════════════════════════════════════ */
var _openRecipe = window.openRecipe;
if(typeof _openRecipe === 'function'){
  window.openRecipe = function(d, saison, type){
    _openRecipe(d, saison, type);
    setTimeout(function(){ renderHeroPhoto(d, type); }, 120);

}

var _renderDuo = window.renderDuo;
if(typeof _renderDuo === 'function'){

  };
}

/* ═══════════════════════════════════════════════════════
   Handler — Upload d'une photo
   ═══════════════════════════════════════════════════════ */
document.addEventListener('change', function(e){
  const inp = e.target.closest('[data-photo-input]');
  if(!inp) return;
  const key = inp.dataset.photoInput;
  const file = inp.files && inp.files[0];
  if(!file) return;

  toastMsg('Traitement de la photo…');

  compressImage(file, 1600, 0.82)
    .then(function(blob){ return photoPut(key, blob); })
    .then(function(){
      toastMsg('Photo ajoutée ✓');
      // Rafraîchit le hero
      const wrapper = document.querySelector('.recipe-photo-hero');
      if(wrapper){
        const oldImg = wrapper.querySelector('img[data-blob-url]');
        if(oldImg) try { URL.revokeObjectURL(oldImg.dataset.blobUrl); } catch(e){}
        wrapper.remove();
      }
      if(currentDuo && currentSaison){
        // Récupère le type depuis l'état courant
        const parts = key.split(':');
        const type = parts[1] || 'plat';
        renderHeroPhoto(currentDuo, type);
      }
    })
    .catch(function(err){
      console.error(err);
      toastMsg('Impossible d\'ajouter la photo');
    })
    .then(function(){ inp.value = ''; });
});

/* ═══════════════════════════════════════════════════════
   Handler — Remplacer une photo
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-photo-replace]');
  if(!btn) return;
  e.preventDefault(); e.stopPropagation();
  const key = btn.dataset.photoReplace;
  // Crée un input temporaire
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.display = 'none';
  inp.setAttribute('data-photo-input', key);
  document.body.appendChild(inp);
  inp.addEventListener('change', function(){
    // Déclenche l'événement 'change' natif → géré par le listener ci-dessus
    const evt = new Event('change', { bubbles: true });
    inp.dispatchEvent(evt);
    setTimeout(function(){ inp.remove(); }, 3000);
  });
  inp.click();

/* ═══════════════════════════════════════════════════════
   Handler — Supprimer une photo
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-photo-delete]');
  if(!btn) return;

  photoDelete(key).then(function(){

    const wrapper = document.querySelector('.recipe-photo-hero');

      const oldImg = wrapper.querySelector('img[data-blob-url]');
      if(oldImg) try { URL.revokeObjectURL(oldImg.dataset.blobUrl); } catch(e){}
      wrapper.remove();
    }
    if(currentDuo){
      const parts = key.split(':');
      const type = parts[1] || 'plat';

console.log('✅ Patch Photos de recettes armé');

<script>
(function(){
'use strict';
console.log('🟢 Patch Photos par défaut : démarrage');

const PHOTO_DIR = 'photos/';
const EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG'];

/* Cache des tests d'existence (évite de retester 100 fois la même URL) */
const urlCache = {};

function testImage(url){
  if(urlCache[url] !== undefined) return Promise.resolve(urlCache[url]);
  return new Promise(function(resolve){
    const img = new Image();
    let done = false;
    function finish(ok){
      if(done) return;
      done = true;
      urlCache[url] = ok;
      resolve(ok);
    }
    img.onload = function(){ finish(true); };
    img.onerror = function(){ finish(false); };
    img.src = url;
    setTimeout(function(){ finish(false); }, 4000);
  });
}

/* Cherche la première extension qui existe :
   photos/p1-plat.jpg → photos/p1-plat.jpeg → ... */
function findDefaultPhoto(key){
  // key = "p1:plat" → "photos/p1-plat"
  const base = PHOTO_DIR + key.replace(':', '-');
  return EXTENSIONS.reduce(function(chain, ext){
    return chain.then(function(found){
      if(found) return found;
      return testImage(base + '.' + ext).then(function(ok){
        return ok ? (base + '.' + ext) : false;
      });
    });
  }, Promise.resolve(false));
}

/* Vérifie si l'utilisateur a déjà uploadé une photo perso pour cette clé */
function hasUploadedPhoto(key){
  return new Promise(function(resolve){
    if(!('indexedDB' in window)) return resolve(false);
    const req = indexedDB.open('sweet_recipe_photos_v1', 1);
    req.onerror = function(){ resolve(false); };
    req.onsuccess = function(){
      const dbx = req.result;
      if(!dbx.objectStoreNames.contains('photos')) return resolve(false);
      try {
        const tx = dbx.transaction('photos', 'readonly');
        const get = tx.objectStore('photos').get(key);
        get.onsuccess = function(){ resolve(!!get.result); };
        get.onerror = function(){ resolve(false); };
      } catch(e){ resolve(false); }
    };
  });
}

/* ─────────────────────────────────────────────
   FICHE RECETTE — charge la photo par défaut
   ───────────────────────────────────────────── */
function applyDefaultToHero(){
  const scr = document.getElementById('screen-recipe');
  if(!scr) return;
  const hero = scr.querySelector('.recipe-photo-hero.empty');
  if(!hero) return;
  const key = hero.dataset.photoKey;
  if(!key) return;

  Promise.all([findDefaultPhoto(key), hasUploadedPhoto(key)])
    .then(function(results){
      const url = results[0];
      const uploaded = results[1];
      if(!url) return;            // pas de photo par défaut
      if(uploaded) return;        // l'utilisateur a sa propre photo, on respecte

      // On remplace le contenu
      hero.classList.remove('empty');
      hero.innerHTML =
        '<img src="' + url + '" alt="">' +
        '<div class="recipe-photo-actions">' +
          '<button type="button" data-photo-replace="' + key + '" title="Remplacer">↻</button>' +
          '<button type="button" data-photo-delete="' + key + '" title="Supprimer">✕</button>' +
        '</div>';

      // Retire l'input file qui n'est plus nécessaire
      const inp = hero.querySelector('input[type="file"]');
      if(inp) inp.remove();
    })
    .catch(function(){ /* silencieux */ });
}

/* ─────────────────────────────────────────────
   ÉCRAN DUO — ajoute les vignettes par défaut
   ───────────────────────────────────────────── */
function applyDefaultToThumbs(){
  const scr = document.getElementById('screen-duo');
  if(!scr) return;
  if(typeof currentDuo === 'undefined' || !currentDuo) return;

  const cards = scr.querySelectorAll('.recipe-card');
  cards.forEach(function(card){
    const type = card.dataset.recipe;
    if(!type) return;
    if(card.querySelector('.rc-photo-thumb')) return;  // déjà présente

    const key = currentDuo.id + ':' + type;
    Promise.all([findDefaultPhoto(key), hasUploadedPhoto(key)])
      .then(function(results){
        const url = results[0];
        const uploaded = results[1];
        if(!url || uploaded) return;
        if(card.querySelector('.rc-photo-thumb')) return; // double-check

        const thumb = document.createElement('span');
        thumb.className = 'rc-photo-thumb';
        thumb.innerHTML = '<img src="' + url + '" alt="">';
        card.appendChild(thumb);
      })
      .catch(function(){});
  });
}

/* ─────────────────────────────────────────────
   Wrappers sur openRecipe et renderDuo
   ───────────────────────────────────────────── */
const _openRecipe = window.openRecipe;
if(typeof _openRecipe === 'function'){
  window.openRecipe = function(d, saison, type){
    _openRecipe(d, saison, type);
    setTimeout(applyDefaultToHero, 300);  // après le patch Photos (120ms)
  };
}

const _renderDuo = window.renderDuo;
if(typeof _renderDuo === 'function'){
  window.renderDuo = function(d, saison){
    _renderDuo(d, saison);
    setTimeout(applyDefaultToThumbs, 300);
  };
}

/* ─────────────────────────────────────────────
   MutationObserver — détecte les transitions
   (ex : quand tu supprimes ta photo perso, retour à la photo du dossier)
   ───────────────────────────────────────────── */
function initObserver(){
  const scrRecipe = document.getElementById('screen-recipe');
  if(scrRecipe && !scrRecipe.dataset.obsInit){
    scrRecipe.dataset.obsInit = '1';
    new MutationObserver(function(){
      setTimeout(applyDefaultToHero, 80);
    }).observe(scrRecipe, { childList: true, subtree: true });
  }

  const scrDuo = document.getElementById('screen-duo');
  if(scrDuo && !scrDuo.dataset.obsInit){
    scrDuo.dataset.obsInit = '1';
    new MutationObserver(function(){
      setTimeout(applyDefaultToThumbs, 80);
    }).observe(scrDuo, { childList: true, subtree: true });
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initObserver);
} else {
  initObserver();
}

console.log('✅ Patch Photos par défaut armé — dossier ' + PHOTO_DIR);
console.log('   Convention : photos/[id-duo]-[plat|boisson].jpg');
console.log('   Ex : photos/p1-plat.jpg → Tarte aux Fraises');
console.log('        photos/p1-boisson.jpg → Thé Vert au Jasmin');
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════
   FIX ZONE PHOTO — crée la zone SYNC puis charge en async
   ═══════════════════════════════════════════════════════ */
(function(){
'use strict';
console.log('🔧 Fix zone photo : démarrage');

var DB_NAME = 'sweet_recipe_photos_v1';
var STORE   = 'photos';
var _dbp = null;

function openDB(){
  if(_dbp) return _dbp;
  _dbp = new Promise(function(resolve, reject){
    if(!('indexedDB' in window)) return reject(new Error('IDB absent'));
    var req;
    try { req = indexedDB.open(DB_NAME, 1); }
    catch(e){ return reject(e); }
    req.onupgradeneeded = function(e){
      var d = e.target.result;
      if(!d.objectStoreNames.contains(STORE))
        d.createObjectStore(STORE, { keyPath: 'key' });
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror   = function(){ reject(req.error); };
    setTimeout(function(){ reject(new Error('IDB timeout')); }, 2500);
  });
  return _dbp;
}

function photoGet(key){
  return openDB().then(function(d){
    return new Promise(function(res, rej){
      var tx = d.transaction(STORE, 'readonly');
      var r  = tx.objectStore(STORE).get(key);
      r.onsuccess = function(){ res(r.result || null); };
      r.onerror   = function(){ rej(r.error); };
    });
  });
}

function photoPut(key, blob){
  return openDB().then(function(d){
    return new Promise(function(res, rej){
      var tx = d.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put({ key:key, blob:blob, date:new Date().toISOString() });
      tx.oncomplete = function(){ res(); };
      tx.onerror    = function(){ rej(tx.error); };
    });
  });
}

function photoDel(key){
  return openDB().then(function(d){
    return new Promise(function(res, rej){
      var tx = d.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = function(){ res(); };
      tx.onerror    = function(){ rej(tx.error); };
    });
  });
}

function compressImage(file, max, q){
  return new Promise(function(res, rej){
    if(!file || !file.type || file.type.indexOf('image/') !== 0)
      return rej(new Error('pas une image'));
    var r = new FileReader();
    r.onerror = rej;
    r.onload = function(e){
      var img = new Image();
      img.onerror = function(){ rej(new Error('image illisible')); };
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        if(w > max || h > max){
          if(w > h){ h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#FFF'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        c.toBlob(function(b){
          b ? res(b) : rej(new Error('compression échouée'));
        }, 'image/jpeg', q);
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

function toastMsg(m){ if(typeof toast === 'function') toast(m); }

/* ─── Test d'image (avec cache + timeout) ─── */
var _imgCache = {};
function testImg(url){
  if(_imgCache[url] !== undefined) return Promise.resolve(_imgCache[url]);
  return new Promise(function(res){
    var im = new Image(), done = false;
    function fin(ok){
      if(done) return; done = true;
      _imgCache[url] = ok; res(ok);
    }
    im.onload  = function(){ fin(true); };
    im.onerror = function(){ fin(false); };
    im.src = url;
    setTimeout(function(){ fin(false); }, 3000);
  });
}

function tryFolder(key){
  var base = 'photos/' + key.replace(':', '-');
  var exts = ['jpg','jpeg','png','webp','JPG','JPEG','PNG'];
  return exts.reduce(function(chain, ext){
    return chain.then(function(found){
      if(found) return found;
      return testImg(base + '.' + ext).then(function(ok){
        return ok ? (base + '.' + ext) : false;
      });
    });
  }, Promise.resolve(false));
}

/* ─── Construction de la zone ─── */
function buildEmptyZone(key){
  var z = document.createElement('div');
  z.className = 'recipe-photo-hero empty';
  z.setAttribute('data-photo-key', key);
  z.innerHTML =
    '<input type="file" accept="image/*" data-photo-input="'+key+'" style="display:none">' +
    '<span><b>+</b>Ajouter une photo</span>';
  z.addEventListener('click', function(e){
    if(e.target.tagName === 'INPUT') return;
    var i = z.querySelector('input[type=file]');
    if(i) i.click();
  });
  return z;
}

function showImage(z, key, url){
  z.classList.remove('empty');
  z.innerHTML =
    '<img src="'+url+'" alt="">' +
    '<div class="recipe-photo-actions">' +
      '<button type="button" data-photo-replace="'+key+'" title="Remplacer">↻</button>' +
      '<button type="button" data-photo-delete="'+key+'"  title="Supprimer">✕</button>' +
    '</div>';
}

function loadImage(z, key){
  // 1) Upload user en priorité
  photoGet(key)
    .then(function(rec){
      if(rec && rec.blob){
        showImage(z, key, URL.createObjectURL(rec.blob));
        return;
      }
      // 2) Sinon dossier photos/
      return tryFolder(key).then(function(url){
        if(url) showImage(z, key, url);
      });
    })
    .catch(function(){
      // IDB KO → on tente le dossier uniquement
      tryFolder(key).then(function(url){
        if(url) showImage(z, key, url);
      });
    });
}

/* ─── Injection dans l'écran recette ─── */
function ensureZone(){
  var scr = document.getElementById('screen-recipe');
  if(!scr || !scr.classList.contains('active')) return;
  if(scr.querySelector('.recipe-photo-hero:not([data-photo-monde])')) return;   // déjà présente
  var detail = scr.querySelector('.detail-hero');
  if(!detail) return;

  var key = window.__photoKey;
  if(!key && typeof currentDuo !== 'undefined' && currentDuo){
    key = currentDuo.id + ':' + (window.__photoType || 'plat');
  }
  if(!key) return;

  var z = buildEmptyZone(key);
  detail.parentNode.insertBefore(z, detail);
  console.log('✅ Zone photo créée (fix) :', key);
  loadImage(z, key);
}

/* ─── Hook openRecipe ─── */
var _or = window.openRecipe;
if(typeof _or === 'function'){
  window.openRecipe = function(d, s, t){
    window.__photoKey  = d.id + ':' + t;
    window.__photoType = t;
    _or(d, s, t);
    setTimeout(ensureZone, 350);
    setTimeout(ensureZone, 900);   // filet de sécurité
  };
}

/* ─── Upload (listener de secours, prioritaire en capture) ─── */
document.addEventListener('change', function(e){
  var inp = e.target.closest('[data-photo-input]');
  if(!inp) return;
  var f = inp.files && inp.files[0];
  if(!f) return;

  var key = inp.dataset.photoInput;
  var z   = inp.closest('.recipe-photo-hero');
  if(!z) return;
  if(z.dataset.busy === '1'){ e.stopPropagation(); return; }
  z.dataset.busy = '1';

  e.stopPropagation();

  compressImage(f, 1600, 0.82)
    .then(function(blob){ return photoPut(key, blob); })
    .then(function(){
      showImage(z, key, URL.createObjectURL(f));
      toastMsg('Photo ajoutée ✓');
    })
    .catch(function(err){
      console.error('Upload KO :', err);
      toastMsg('Upload impossible (IndexedDB bloqué ?)');
    })
    .then(function(){ z.dataset.busy = ''; inp.value = ''; });
}, true);

/* ─── Suppression / Remplacement ─── */
document.addEventListener('click', function(e){
  var del = e.target.closest('[data-photo-delete]');
  if(del){
    e.preventDefault(); e.stopPropagation();
    if(!confirm('Supprimer la photo ?')) return;
    var key = del.dataset.photoDelete;
    photoDel(key).catch(function(){}).then(function(){
      var z = del.closest('.recipe-photo-hero');
      if(!z) return;
      var nz = buildEmptyZone(key);
      z.parentNode.replaceChild(nz, z);
      loadImage(nz, key);
      toastMsg('Photo supprimée');
    });
    return;
  }
  var rep = e.target.closest('[data-photo-replace]');
  if(rep){
    e.preventDefault(); e.stopPropagation();
    var key = rep.dataset.photoReplace;
    var z   = rep.closest('.recipe-photo-hero');
    if(!z) return;
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.setAttribute('data-photo-input', key);
    inp.style.display = 'none';
    z.appendChild(inp);
    inp.addEventListener('change', function(){
      setTimeout(function(){ inp.remove(); }, 800);
    });
    inp.click();
  }
}, true);

console.log('✅ Fix zone photo armé');
})();
</script>

    '<span class="s-spade">♠</span>' +
    '<span class="s-diamond">♦</span>' +
    '<span class="s-club">♣</span>';
  hero.parentNode.insertBefore(d, hero.nextSibling);
}
setInterval(injectCardDivider, 700);

/* ── 2. Montre qui tourne à l'envers à côté du titre ── */
function injectWatch(){
  var home = document.getElementById('screen-home');
  if(!home) return;
  var hero = home.querySelector('.hero');
  if(!hero || hero.querySelector('.wc-watch')) return;
  var w = document.createElement('span');
  w.className = 'wc-watch';
  w.textContent = '⌚';
  hero.appendChild(w);
}
setInterval(injectWatch, 900);

/* ── 3. Chat du Cheshire qui passe ── */
function injectCheshire(){
  if(document.querySelector('.wc-cheshire')) return;
  var spots = [
    {t:'16%', l:'5%',  delay:0},
    {t:'34%', r:'6%',  delay:6},
    {t:'66%', l:'8%',  delay:12},
    {t:'80%', r:'9%',  delay:18}
  ];
  spots.forEach(function(s){
    var e = document.createElement('span');
    e.className = 'wc-cheshire';
    e.textContent = '😺';
    if(s.t) e.style.top = s.t;
    if(s.l) e.style.left = s.l;
    if(s.r) e.style.right = s.r;
    e.style.animationDelay = s.delay + 's';
    document.body.appendChild(e);
  });
}
injectCheshire();

/* ── 4. Scintillement rare du brand (comme le Cheshire) ── */
function brandFlicker(){
  var b = document.querySelector('.brand');
  if(!b) return;
  setInterval(function(){
    if(Math.random() < .12){
      b.classList.add('wc-flicker');
      setTimeout(function(){ b.classList.remove('wc-flicker'); }, 90);
      setTimeout(function(){
        b.classList.add('wc-flicker');
        setTimeout(function(){ b.classList.remove('wc-flicker'); }, 70);
      }, 180);
    }
  }, 5000);
}
brandFlicker();

var _renderAbout = window.renderAbout;
if(typeof _renderAbout === 'function'){

    p.innerHTML =

    if(at && at.parentNode) at.parentNode.insertBefore(p, at.nextSibling);

}

/* ── 6. Microcopy carrollien ── */
var WC_MICROCOPY = [
  // [recherche, remplacement]
  ['Choisis ta saison,',     'De quel côté du miroir ?'],
  ['Ma liste de courses',    'Ce que dit le Lapin Blanc'],
  ['Mon carnet',             'Carnet de la Chenille'],
  ['Favoris',                'Roses préférées'],
  ['Réalisés',               'Déjà goûtés'],
  ['À propos',               'À propos de ce rêve'],
  ['Aucun favori encore.',   'Nous sommes tous fous ici. ♠'],
  ['Aucun dessert ne correspond.','Aucun sentier ne mène là.'],
  ['Ta liste est vide.',     'Le chapeau est vide.'],
  ['Tout vider',             'Renverser la théière']
];
function replaceMicrocopy(root){
  var w = document.createTreeWalker(root || document.body,
    NodeFilter.SHOW_TEXT, null);
  var n;
  while((n = w.nextNode())){
    var t = n.nodeValue;
    if(!t) continue;
    var changed = false;
    for(var i = 0; i < WC_MICROCOPY.length; i++){
      var from = WC_MICROCOPY[i][0];
      if(t.indexOf(from) !== -1){
        t = t.replace(from, WC_MICROCOPY[i][1]);
        changed = true;
      }
    }
    if(changed) n.nodeValue = t;
  }
}
var _go = window.go;
if(typeof _go === 'function'){
  window.go = function(){
    var r = _go.apply(this, arguments);
    setTimeout(function(){ replaceMicrocopy(); }, 40);
    return r;
  };
}
// premier passage au chargement
setTimeout(replaceMicrocopy, 600);

console.log('✅ Patch Lewis Carroll armé');
})();
